      "key": "6_2",
      "name": "否",
      "gua": "这是一个失去协调、许多事情都难以顺利实现的时期。\n\n表面上看起来每个人都在各自的位置上努力，但彼此之间缺乏配合，容易形成各顾各的局面。\n\n即使方向看起来没有错，现实却迟迟没有变化。\n\n如果因为焦急而贸然行动，反而容易遭受较大的损失，甚至很难把原本投入的成本收回来。付出的努力与实际得到的成果也可能不成比例。\n\n现在整体处于停滞和闭塞之中，很难找到立刻扭转局面的办法。\n\n即使勉强推进，也不容易取得理想的结果。与其强行突破，不如先把自己该做的事情做好，安静等待时机变化。\n\n人际关系、工作和财运，都容易让人感觉暂时离自己有些远。",
      "yao": [
        "现在需要果断整理那些已经没有必要继续保留的人、事或问题。\n\n如果能够把周围的环境重新整理清楚，原本纠缠的问题也会逐渐开始松动。\n\n但如果迟迟不做决定，只是拖延时间，反而容易让自己陷入更深的困境。",
        "如果能够以宽容的态度对待周围的人，同时保持必要的警觉，情况会逐渐有所改善。\n\n即使自己做的是正确的事情，也可能暂时得不到认可，反而是不太正当的人更容易受到肯定。\n\n这种不合理的状况会让人感到委屈和不舒服。\n\n与其执着于眼前的不公平，不如安静地守好自己的本分，继续做该做的事情。",
        "对方可能并没有带着真正诚实或善意的态度与你相处。\n\n在彼此关系已经偏离正常轨道的情况下，很难顺利得到自己想要的结果。\n\n现在比起强行维持关系，更需要冷静看清对方真正的态度和意图。",
        "即使得到了一些成果，也可能付出过大的代价，成为一种“只有伤痕的荣耀”。\n\n在自身准备还不充分的情况下，勉强想要得到更多，只会让整个局面变得更加危险。\n\n就像风中的灯火一样，看似还在燃烧，却随时可能熄灭。\n\n现在需要先稳住基础，而不是继续冒险向前。",
        "彼此之间几乎完全无法沟通，心里想的和实际做的也难以一致。\n\n每个人都只坚持自己的意见，没有人愿意退让，因此事情很难真正向前推进。\n\n现在强行说服别人并没有太大意义。\n\n比起继续争执，更重要的是先让情绪和立场冷静下来，等待沟通的条件重新形成。",
        "久旱之后终于开始有雨落下，但雨量还不算充足。\n\n虽然还不足以彻底解决所有问题，但原本完全堵塞的局面已经开始慢慢出现变化。\n\n现在不需要急着马上取得结果。\n\n先重新整理自己的状态和计划，耐心观察局势的变化，会比仓促行动更加有利。"
      ]
    },
    "6_3": {
      "key": "6_3",
      "name": "无妄",
      "gua": "该发生的事情自然会发生，不该发生的事情也无法强求。\n\n这是一个万事顺着自身规律发展、整体流动较为自然的时期。\n\n与其勉强想要实现什么，不如放下不切实际的欲望，顺势而行。遵循当下的节奏，反而更容易接近自己真正想要的结果。\n\n如果夹杂太多私心，或者硬要人为设计、强行推动事情，反而容易让原本正常的局面出现偏差。\n\n有时候声势很大，并不代表真正有实力和成果。\n\n与其期待侥幸，不如认真准备，以真诚、踏实的态度面对眼前的事情，这才是现在最重要的。",
      "yao": [
        "不贪心，也不急着追求额外的东西，只是安静地做好自己该做的事。\n\n保持这样的态度，最终有机会得到自己真正想要的结果。",
        "没有付出应有的努力，却只想着依靠运气得到成果，自然很难如愿。\n\n现在不适合走捷径，也不要期待不劳而获。\n\n先把自己该做的准备和努力做好，才有可能让事情逐渐进入正轨。",
        "这是一个容易因为自己的选择，而主动招来麻烦的时期。\n\n明明是自己一步步把局面变得复杂，却可能只有自己没有意识到问题出在哪里。\n\n如果还想强行推进某件事情，很可能反而走上失败的捷径。\n\n现在最重要的是先停下来，重新检查自己的判断和行动方式。",
        "如果自己真正想做的事情已经明确，而且内心也足够坚定，那么坚持自己的方向继续前进并不是坏事。\n\n不必因为周围的一点变化就轻易动摇。\n\n只要保持清醒，不夹杂不必要的私心，就可以稳稳地走自己的路。",
        "因为一时疏忽，可能会出现一些意料之外的问题。\n\n不过，只要冷静下来找到真正的原因，事情并没有想象中那么难处理。\n\n不需要过度用力，也不必急着控制一切。\n\n顺着事情本来的规律，用正确的方法处理，问题自然会逐渐得到解决。",
        "现在比任何时候都更需要保持正确的心态和行为方式。\n\n如果用不合理的方法急着推进事情，很容易引发问题。\n\n越是心急，越不适合勉强行动。\n\n守住原则，避免过度推进，反而更有利于保护自己和现有的成果。"
      ]
    },
    "6_8": {
      "key": "6_8",
      "name": "遁",
      "gua": "前方已经像走到尽头一样，现在更适合暂时停下来。\n\n巨大的山横在天空之下，挡住了继续前进的道路。山势太高，与其强行正面突破，不如先退一步，安静下来思考究竟该用什么方法越过去。\n\n眼前的阻碍，就像一个不讲道理的人牢牢挡在前方一样。\n\n现在与其勉强正面对抗，不如暂时避开锋芒，保存实力，为下一次机会做好准备。",
      "yao": [
        "如果现在有想要开始的新事情，暂时不开始反而更加有利。\n\n像湿透的落叶紧贴地面一样，尽量保持安静，不要轻易行动。\n\n这个时期只要不贸然出手，就能避免很多不必要的问题。",
        "现在需要尽快放下那些已经不适合继续坚持的事情。\n\n不要把精力浪费在无意义的纠结上，轻松一点，把注意力放到下一次机会会更好。\n\n越是不适合行动的时候，反而越容易产生“再试一次”的冲动。\n\n因此更需要放下执念，稳定自己的情绪。",
        "虽然想安静地退下来，但周围的情况并不会轻易让你完全置身事外。\n\n自己心里也可能因为还有留恋而不断动摇。\n\n即使如此，与其因为舍不得而继续强行推进，不如暂时忍耐，保持安静。\n\n现在克制自己，反而更容易避开不必要的麻烦。",
        "真正有判断力的人，懂得在该退的时候退，并且愿意把等待的时间用来整理自己。\n\n相反，如果明明知道应该停下来，却始终无法真正做到，只会让自己更加辛苦。\n\n现在不需要勉强表现自己，也没有必要急着向别人证明什么。\n\n能够安心退一步，本身就是一种智慧。",
        "安静地退下来，重新整理自己的目标，同时充实自身实力，是非常好的状态。\n\n不急着向外证明成果，而是先把方向和基础稳稳建立起来。\n\n这样做会让之后的道路更加清晰，也更有利于下一次行动。",
        "能够以平静的心态暂时退下来，安静积累实力，同时保持对自己的坚定信任，是很理想的状态。\n\n现在所积累的经验、能力和信心，都会成为未来重新出发时的重要力量。\n\n等到真正适合行动的时机到来，再去展开自己想做的事情，就不会有太大的阻碍。"
      ]
    },
    "6_1": {
      "key": "6_1",
      "name": "讼",
      "gua": "有时候，退一步反而才是真正的胜利。\n\n即使对自己有坚定的信心，如果对某件事情过于执着，坚持到底、强行推进，反而容易招来麻烦。\n\n这是一个彼此意见不合、容易发生争执和冲突的时期。\n\n如果持续与对方争论、纠缠是非，甚至可能因为误解而背上不属于自己的责任，因此尤其需要谨慎。\n\n天水讼象征口舌、争议与冲突，如果问题不断扩大，也有可能发展到法律纠纷。\n\n现在整体的流动并不顺畅，不适合贸然出头。\n\n无论是强行打官司，还是执意争个输赢，都容易带来损失。\n\n在适当的时候选择妥协，或者寻求专业人士、第三方的调解，是避免更大损失的明智做法。",
      "yao": [
        "可能会出现一些小争执、流言或口舌是非。\n\n只要保持诚实和正直的态度，就不容易发展成严重的问题。\n\n不过，现在并不是适合追求巨大成果或快速突破的时期。\n\n避免无谓争执，稳稳守住自己的立场会更好。",
        "在争斗或纠纷中胜算并不大。\n\n与其勉强正面对抗，不如暂时离开冲突的现场。\n\n这不是软弱，而是为了避免损失进一步扩大。\n\n现在懂得退让和保持距离，反而更有利于保护自己。",
        "应该坚持正当、稳妥的方法，一步一步向前走。\n\n同时也不要过度高估自己的能力和处境。\n\n诚实地处理事情，眼前也许会让人觉得自己吃了亏。\n\n但时间过去以后，很可能会发现，这反而是当时最正确、最值得的选择。",
        "即使心里很想争个明白，现在真正发生冲突也很难占到优势。\n\n如果执意争斗，往往只会让自己更加疲惫。\n\n稳住情绪，尽量避开争端本身，适时退一步，反而能够在没有明显损失的情况下度过这个阶段。",
        "这是一个条件已经相当成熟，对自己非常有利的时期。\n\n如果准备充分、判断明确，现在可以果断行动。\n\n已经具备取得胜利所需要的重要条件，只要把握好时机，就有机会获得很大的成果。",
        "即使在争斗中取得了表面上的胜利，也未必是真正意义上的胜利。\n\n如果强行赢到底，最后可能连后续的责任、损失和收拾残局都要由自己承担。\n\n与其执着于眼前的输赢，不如在适当的时候干净地退下来，为下一次机会保留余地。\n\n从现实角度来看，这反而是更稳妥的选择。"
      ]
    },
    "6_4": {
      "key": "6_4",
      "name": "姤",
      "gua": "这是一个可能遇见“扰乱自己人生的人或事”的时期。\n\n“姤”有相遇、偶然邂逅的意思。\n\n现在容易出现意想不到的相遇、新的人际关系或新的机会，但与此同时，也更容易受到强烈诱惑的影响。\n\n如果因为眼前的一点利益，或者一时的情绪而失去判断，很可能让自己陷入更复杂、更难摆脱的困境。\n\n越是看起来突然又有吸引力的人或机会，越需要保持警惕。",
      "yao": [
        "容易因为一种微妙的新鲜感，而误以为新的感情或新的局面正在真正开始。\n\n但现在更重要的是控制好自己，不要让关系或事情轻易发展得更深。\n\n贸然卷入其中，对自己并没有什么好处。\n\n与其追逐突然出现的新缘分，不如好好珍惜并稳固身边原本可靠的人际关系。",
        "现在应该先学会珍惜和满足于自己已经拥有的东西。\n\n如果因为贪心而急着追求更多，反而容易暴露自己的弱点，甚至影响外界对自己的评价。\n\n现在更适合充实自身，同时认真整理和维护身边的人际关系。",
        "对方的想法和自己的期待并不一致，因此容易感到压抑和不顺。\n\n现在应该少说冲动的话，也要仔细观察自己的行为。\n\n即使主动靠近、努力拉近距离，感情或关系也不容易顺利发展。\n\n保持适当的距离，反而更有利。",
        "这是一个很多事情都难以按照自己期待发展的时期。\n\n可能出现经济上的损失，也容易卷入口舌是非，甚至遭到误解或无端指责。\n\n现在不适合急着策划新的事情。\n\n先停下来，冷静检查自己的处境和选择，才是更稳妥的做法。",
        "为了得到眼前一点小小的利益，反而可能失去更珍贵、更重要的东西。\n\n如果过度执着于某个人，或者沉迷于没有实际基础的感情，只会损害自己的形象和评价。\n\n现在最重要的是不要被外界轻易动摇。\n\n守住自己的位置，以正直、稳重的方式行动，才能保护真正重要的东西。",
        "如果有些事情确实无法避免，就需要以平静的态度接受现实。\n\n如果硬要控制整个局面，反而可能让自己陷入更大的麻烦，因此必须格外谨慎。\n\n与其勉强维系或制造某段关系，不如把更多精力放在提升自己、整理自己的生活上。\n\n这样至少能够避免情况继续恶化。\n\n如果已经有计划中的事情，现在也不容易立刻实现，更适合暂时等待时机。"
      ]
    },
    "6_9": {
      "key": "6_9",
      "name": "同人",
      "gua": "这是一个与志同道合的人组成团队，共同实现目标的时期。\n\n上为天，下为火，如同明亮的太阳升上天空。\n\n只要保持正直坦荡的心态，与周围的人真诚交流、彼此合作，想做的事情就很容易朝有利的方向发展。\n\n与其一个人独断独行，不如和理念相近、目标一致的人一起发挥力量。\n\n不过，如果因为同学关系、地域关系、亲缘关系等私人情感，只照顾自己熟悉的小圈子和局部利益，就容易形成派系，甚至把原本已经接近成功的事情弄坏。\n\n现在更需要保持开放、公平而坦荡的态度，与不同的人建立健康的合作关系。",
      "yao": [
        "敞开心扉，与理念相近的人广泛交流，并一起展开自己想做的事情，是非常顺利的状态。\n\n只要保持坦诚和开放，就不会出现太大的问题。\n\n现在也是开始新计划、新合作或新事业的好时机。",
        "如果视野过于狭窄，只和自己熟悉的小圈子往来，勉强凑在一起合作，事情反而很难真正推进。\n\n过度排外或只顾内部关系，也容易造成让自己尴尬或后悔的结果。\n\n现在需要跳出小团体的局限，以更开放的态度看待合作。",
        "没有真正执行计划，却一直观察周围人的反应，反复试探，因此很难取得实际成果。\n\n现在并不是依靠小聪明就能解决问题的时期。\n\n如果因为贪心而不断算计，反而可能遭受较大的损失，而且一时之间很难恢复。\n\n与其反复观望，不如先端正自己的目标和行动方式。",
        "这是一个能够正确判断什么时候该前进、什么时候该停下来的时期。\n\n即使眼前遇到困难，只要不是彻底放弃，之后仍有可能把不利的局面转化为新的机会。\n\n现在最重要的是不要轻易失去耐心。\n\n即使过程辛苦，也要保持韧性，坚持到适合再次行动的时机。",
        "一开始会遇到不少困难和阻碍，甚至让人觉得有些力不从心。\n\n但只要越过最艰难的阶段，之后事情就会逐渐变得顺畅。\n\n现在身边有值得信任的人一起合作，这种关系会在整个过程中带来很大的帮助。\n\n彼此支持、共同前进，会比一个人承担所有事情更加有利。",
        "经过之前的波折，终于进入相对平和、稳定的阶段。\n\n即使自己已经不再处于事情的最中心，也能够以轻松的心态与不同的人自由交流，不必被复杂的关系束缚。\n\n现在可以放下不必要的竞争和执着，以更加自在、开放的方式与周围的人相处。\n\n这是一个能够享受人与人之间自然交流的很好时期。"
      ]
    },
    "6_7": {
      "key": "6_7",
      "name": "履",
      "gua": "这是一个上位者要有上位者的分寸，下位者也要守好自己位置的时期。\n\n即使遇到危险，眼下也未必会造成严重损失，因此不必过度恐慌。\n\n但如果因此掉以轻心、轻举妄动，反而可能招来更大的损失和麻烦。\n\n只要凡事谨慎，以正直的心态行动，大多能够平稳度过。\n\n有时候，守住最基本的原则、礼貌和分寸，本身就是避开危机最有效的方法。",
      "yao": [
        "按照平时的方式稳稳行动就好，不需要为了表现得更好而过度用力。\n\n如果太想证明自己，反而容易失去原本的节奏。\n\n有时候，不加修饰的诚实和朴素，反而会成为自己最大的优势。",
        "因为自己拥有的条件不少，周围也容易出现各种诱惑。\n\n即使产生欲望，只要能够守住正确的判断，不轻易被外界动摇，就不会有太大的问题。\n\n如果已经发现哪里存在错误或不足，不要一直拖延，及时调整和改善会更有利。",
        "自身实力还不够成熟，却容易把目标定得过高，因此很可能做出轻率的判断。\n\n有时候，懂得及时退下来才是真正的勇气。\n\n如果不顾现实条件，硬要继续推进，很容易遭受较大的挫折。\n\n现在不适合勉强把事情往前推。",
        "能够清楚认识自己的位置，也知道哪些事情真正需要谨慎和警惕。\n\n因为能够正确判断风险，并按照情况妥善应对，最终想做的事情会有一个比较好的结果。",
        "有时候，能力太强、行动太果断，也可能成为问题。\n\n即使处理事情的原则本身没有错，如果态度过于强硬，仍然可能让局面变得危险。\n\n因此越是有能力，越需要保持警觉和克制。\n\n目前整体情况仍有一定风险，不适合勉强开启新的事情。",
        "回头认真检视自己一路走来的过程，并把该结束的事情妥善收尾，是非常好的状态。\n\n过去积累的努力会逐渐转化为成果。\n\n想实现的目标更容易达成，也可能迎来职位提升、评价提高或其他令人满意的结果。"
      ]
    },
    "2_6": {
      "key": "2_6",
      "name": "泰",
      "gua": "仿佛天地之间的力量都在支持自己，是一个非常顺畅的时期。\n\n很多事情容易按照自己的想法推进，想做的事也更容易实现。\n\n容易遇到不错的人，原本停滞或堵塞的问题也会逐渐变得顺畅。\n\n不过，越是在运势良好的时候，越不能因为顺利而自满或放松警惕。\n\n如果因为一切进行得太顺而掉以轻心，反而可能把已经接近成功的事情弄坏。\n\n既然遇到了难得的好时期，更应该认真努力，把眼前的机会真正转化为自己的成果。",
      "yao": [
        "经过一段辛苦之后，终于开始迎来轻松和收获。\n\n身边逐渐聚集起不错的人，想做的事情也容易顺利推进。\n\n过去卡住的问题开始松动，是一个可以感受到明显变化的好时期。",
        "投入不多，却可能得到相对丰厚的回报，努力也容易换来比预期更好的结果。\n\n不过，既然自己正处于有利的阶段，就更不应该排斥能力不足或处境较弱的人。\n\n保持宽容，不要只和熟悉的人抱团，也不要形成狭小的小圈子。\n\n以公平、正直的态度待人，才能真正把这份好运稳定地留下来。",
        "如果只想着轻松舒服地过日子，反而可能让自己慢慢失去原有的优势。\n\n越是在顺利的时候，越需要充实自身、学习新的东西，并持续提升自己。\n\n如果能够保持成长，不沉迷于眼前的安逸，想做的事情会继续平稳发展。",
        "不要炫耀财富，也不要炫耀权力。\n\n不刻意表现自己拥有多少，而是真诚地对待别人，身边的人自然会愿意靠近。\n\n如果不总是计算得失，也不夹杂太多私心，而是坦诚地与人交往，就更容易避免嫉妒和竞争，与周围建立稳定的合作关系。\n\n真诚的态度，最终会被人感受到。",
        "现在尤其需要谦逊，而且越有成果，越要保持谦逊。\n\n自身能力、外部条件和好的时机能够彼此配合，因此想做的事情容易取得很大的成果。\n\n这也是非常适合与人合作、建立和谐关系的时期。\n\n只要积极行动，同时保持谦和的态度，就更容易实现自己真正想要的目标。",
        "原本一味坚持还能撑住局面，但现在连继续坚持本身都可能变得困难。\n\n整体的高峰已经开始过去，就像太阳逐渐西斜一样。\n\n这个时候更需要放低姿态，不要执着于原来的位置或成果，先平稳度过眼前较为混乱的阶段。\n\n如果正准备开始新的事情，现在暂时停下来会更合适。"
      ]
    },
    "2_2": {
      "key": "2_2",
      "name": "坤",
      "gua": "这是一个需要以宽广的心胸去包容和接纳一切的时期。\n\n如果想实现更大的目标，也需要积累与之相匹配的经验。因此，与其急着站到最前面主动带领一切，不如跟随有经验的专业人士或前辈，在学习中成长。\n\n只要保持稳定，不轻易动摇，并且以耐心和踏实的态度一步步前进，最终会得到丰厚的成果。",
      "yao": [
        "困难之后，往往会迎来新的机会。\n\n如果能够提前察觉即将发生的变化，并冷静地做好准备，就有机会实现自己想做的事情。\n\n现在最重要的是观察征兆，不要等到变化真正到来以后才开始行动。",
        "即使不过度用力，事情也会按照自然的节奏顺利展开。\n\n就算是自己不太熟悉的事情，也能比预想中更加轻松地进行。\n\n如果能够好好把握这段时期，稳稳地顺势而为，就有机会获得不错的成果。",
        "只要不贸然扩大事情，也不过度出头，想做的事情最终有机会实现。\n\n现在并不是马上就能看到快速成果的时期。\n\n与其急着表现自己，不如安静地提升实力、充实基础。\n\n把现在的时间用来积累，之后会得到更好的结果。",
        "这是一个不会得到特别多，也不至于失去太多的时期。\n\n不过，如果随意向周围的人透露自己的处境、计划或想法，并不会带来什么好处。\n\n现在更需要谨慎说话，不必什么都向外表达。\n\n只要守住分寸，减少不必要的言语，就能够比较平稳地度过这个阶段。",
        "这是一个容易得到丰厚成果的好时期，仿佛走在路上意外发现了珍贵的宝物。\n\n因为能够保持正直的心态，同时放低姿态、谦逊待人，所以想做的事情也更容易得到实际的收获。\n\n越是顺利的时候，越要保持谦和，这样才能让成果更加稳定。",
        "现在容易失去自己的方向，甚至连自己究竟在做什么都变得模糊。\n\n在没有明确目标的情况下，不断与自己或周围的人发生无意义的冲突，自然很难让事情顺利发展。\n\n不要继续强行推进。\n\n现在最好的选择是暂时停下来，重新看看自己的状态和真正的目标。\n\n如果正在考虑开始新的事情，目前暂时不要行动会更加稳妥。"
      ]
    },
    "2_3": {
      "key": "2_3",
      "name": "复",
      "gua": "漫长的冬天终于过去，春天开始到来了。\n\n虽然春意已经出现，但空气中仍然残留着一丝寒意，还没有完全进入温暖稳定的阶段。\n\n原本停滞的事情正在一点点恢复，因此现在更适合端正自己的心态，重新找回最初的目标和初心。\n\n这就像刚刚冒出新芽一样，只要不急着求成，也不过度行动，很快就会迎来能够充分发挥自己实力的时期。\n\n财运也有逐渐回升、慢慢变好的趋势。",
      "yao": [
        "身边开始出现不少愿意帮助自己的人，他们能够弥补自己的不足，也会在关键的时候给予支持。\n\n如果一开始就发现了错误，现在正适合及时调整和改正。\n\n周围能够提供的帮助也可以坦然接受，不必什么事情都一个人承担。\n\n在这样的基础上推进，想做的事情有机会取得很好的成果。",
        "真正的春天终于到来了。\n\n经过之前的辛苦和等待，现在开始进入能够得到回报的时期，想做的事情也很有机会顺利实现。\n\n不过，比自己更优秀的人或真正有经验的专业人士所提出的建议尤其值得重视。\n\n保持开放的心态去学习、接受并借鉴他们的经验，会成为这个阶段非常重要的力量。",
        "事情可能会出现一些阻碍，自己的心情也容易反复动摇。\n\n不过，因为能够及时提醒自己并保持谨慎，所以不至于造成太大的损失。\n\n过程中可能会感到不舒服，也可能需要暂时放弃或让出一些东西。\n\n即使眼下觉得辛苦，只要稳稳处理，最终仍然能够把事情平安收尾。",
        "周围的情况比较复杂，仿佛一座山之后还有另一座山。\n\n与其勉强融入并不适合自己的环境，或者强迫自己和并不合拍的人相处，不如安静地走自己的路，反而会更加轻松。\n\n现在需要准确了解自己所处的位置，认真回顾自己的状态。\n\n只要坚持正确的方向，不因为周围的声音轻易改变自己，就会更加稳妥。",
        "现在需要以正直的心态观察周围，并以负责人的态度，把明显不合适或错误的部分果断整理好。\n\n与其急着展开新的事情，不如先把现有的问题处理清楚。\n\n对周围保持善意和宽容，同时顺着合理的规律行动，会比强行推进更加有利。",
        "这是一个容易失去方向，不清楚自己真正想做什么，从而感到十分迷茫的时期。\n\n可能已经错过了回到原本道路上的最佳时机，因此判断也容易受到干扰。\n\n如果现在还想强行推进某件事情，失败的可能性会比较高。\n\n比起继续往前冲，先停下来重新确认方向、重新找到自己的路，才是最优先需要做的事情。"
      ]
    },
    "2_8": {
      "key": "2_8",
      "name": "谦",
      "gua": "谦逊，再谦逊一些。\n\n这是一个“谦逊本身就是力量”的时期。\n\n想做的事情整体上比较容易顺利推进，但越是顺利，越需要保持低调和分寸。\n\n如果希望得到周围人的尊重与帮助，就要懂得适当放低姿态，也愿意在必要的时候做出让步。\n\n这样即使遇到困难，也更容易得到他人的支持，把事情顺利处理好。\n\n不急着表现自己，而是安静地把自己的角色和责任做好，最终会得到很好的结果。",
      "yao": [
        "即使遇到困难，也能够以谦逊、平静的态度处理事情。\n\n正因为不急躁、不逞强，所以大多能够避开严重的问题。\n\n只要保持这种稳重的方式，最终可以得到一个不错的收尾。",
        "不走偏路，也不因为外界的声音轻易改变方向，只是安静地朝着自己真正想走的路前进。\n\n这种踏实和稳定，会逐渐让自己的能力自然显现出来。\n\n想做的事情也更容易得到好的结果。",
        "即使已经取得了不错的成果，也没有因此自满，依然保持一贯谦逊的态度。\n\n正因为如此，周围的人会自然愿意靠近并信任你。\n\n过去积累的努力也更容易得到认可，是一个成果非常不错的时期。",
        "不需要刻意装出谦虚的样子，也能够根据不同的情况自然地调整自己的姿态。\n\n既不会过度表现自己，也不会把自己压得太低。\n\n这种恰到好处的分寸感，会让你很难被人挑出明显的问题，整体也会比较平稳。",
        "以良好的品格为基础，谦逊地与周围不同的人相处，并愿意分享自己拥有的东西，因此容易获得很好的声望和信任。\n\n如果出现自己并不愿意承担的事情，也不需要勉强接受。\n\n只要有合理而正当的理由，就可以明确地拒绝，不必把所有责任都揽在自己身上。",
        "周围对自己的评价逐渐提高，好的名声也容易传播得更远。\n\n眼下也许还没有出现自己期待中的巨大突破，但现在更重要的是把目光放得长远一些。\n\n安静地做好自己该做的事，并在现有的位置上稳稳发挥实力，会为未来积累非常扎实的基础。"
      ]
    },
    "2_1": {
      "key": "2_1",
      "name": "师",
      "gua": "带着明确的目标，以正直的心态向前推进。\n\n这是一个容易面对激烈竞争、冲突，或者即使自己并不主动想要，也不得不承担带领他人责任的时期。\n\n因此，比平时更加需要清晰的规则、秩序和纪律。\n\n能否得到好的结果，很大程度上取决于负责带领整个局面的人是否正直、是否真正具备能力。\n\n应该让诚实而有实力的人站在核心位置。\n\n如果由准备不足、能力不够的人贸然领导，即使条件看起来不错，事情也很难顺利推进。",
      "yao": [
        "如果要带领一个团队或组织，就必须先建立与之相配的规则和秩序。\n\n在真正开始行动之前，小到自己的日常习惯和工作节奏，大到整个团队的制度和原则，都最好提前整理清楚。\n\n基础越明确，之后越不容易因为混乱而出现问题。",
        "有能力的人正在带领组织，或者有人能够在正确的方向上引导自己，因此很容易得到实际成果。\n\n在这样的环境中，自己的努力也更容易得到认可和好的评价。\n\n这是一个整体条件非常不错、适合稳步推进事情的时期。",
        "现在的状况就像坐在一艘正在下沉的船上。\n\n如果由缺乏能力的人带领整个团队，继续跟随下去，只会让风险越来越大。\n\n领导者的判断和实力本身存在问题时，仅仅靠下面的人努力，很难真正扭转局面。\n\n现在需要重新判断究竟应该由谁来负责和带领。",
        "目前很多外部条件都对自己不利。\n\n这种时候，暂时退后一步并不是坏事。\n\n为了保存实力而选择战略性撤退，并不等于逃避。\n\n先离开明显不利的位置，重新整理计划和力量，反而能够避免更大的损失。",
        "如果已经有明确想做的事情，可以积极行动。\n\n不过，团队成员的选择非常重要。\n\n一定要与真正有能力、有经验的人合作，才能让计划稳定推进。\n\n如果因为关系或其他原因，与经验不足、能力明显不够的人组成核心团队，就容易在推进过程中不断遭受损失。",
        "一直推进的事情终于迎来丰厚成果。\n\n如果取得了很大的成功，也应该大方回报那些曾经真正帮助过自己的人，与他们分享成果。\n\n不过，对品行不正或无法信任的人，即使表面关系不错，也不要交出重要的信息、资源或权力。\n\n成果越大，越需要谨慎决定应该把什么交给谁。"
      ]
    },
    "2_4": {
      "key": "2_4",
      "name": "升",
      "gua": "现在正是自己该站出来、一步步向上发展的时期。\n\n原本停滞的事情开始逐渐松动，整体进入向上提升的阶段。\n\n过去付出的努力，也更容易得到应有的回报。\n\n不过，越是在这种时候，越不能因为看到机会就急着往前冲。\n\n只要一步一个脚印，稳稳地向前推进，就有机会实现更大的目标。\n\n如果身边有能够真正指导自己的专业人士或前辈，积极听取他们的建议，会让整个过程更加顺利，也更容易达成想要的结果。",
      "yao": [
        "如果身边有值得信任、能够带领自己的前辈或专业人士，现在很适合跟随他们学习。\n\n刚刚发芽的新苗虽然拥有无限可能，但目前还没有足够的力量独自突破所有阻碍。\n\n先借助经验丰富之人的帮助成长，会比一个人勉强往前冲更加有利。",
        "即使自己现在拥有的资源或条件还不算充足，也不需要因此失去信心。\n\n只要保持正直而真诚的态度，认真对待眼前的事情，就依然有机会实现自己想要的目标。\n\n现在真正重要的，不是表面上拥有多少，而是自己的态度是否稳定、诚实。",
        "事情进行得非常顺利，几乎没有明显的阻碍。\n\n就像前方没有人阻挡一样，可以比较轻松地继续向前推进。\n\n这是一个自己的能力、评价或价值可能快速提升的阶段。\n\n把握好眼前的机会，就容易取得明显的进展。",
        "以正确的态度面对事情，并且持续认真投入努力，因此整体发展非常顺畅。\n\n只要继续保持现在的诚意和稳定，不需要使用复杂的技巧，也能够让事情自然朝好的方向推进。\n\n想做的事情比较容易顺利实现。",
        "依靠持续的努力和踏实的态度，像一步一步走上台阶一样稳定成长。\n\n每一个阶段积累起来的成果，最终都会带来与之相匹配的回报。\n\n现在最重要的是不要因为上升得顺利就轻易改变自己的原则。\n\n保持正直和稳定，才能让这份成长真正持续下去。",
        "虽然已经不断向上成长，但现在就像走进没有光的深夜一样，前方开始变得不够清楚。\n\n如果只因为过去一直在上升，就认为自己必须继续前进，反而容易进入危险的状态。\n\n现在需要客观判断自己所处的位置。\n\n懂得在必要的时候暂时停下来，而不是勉强继续往上冲，才能避免不必要的损失和问题。"
      ]
    },
    "2_9": {
      "key": "2_9",
      "name": "明夷",
      "gua": "像是没有月光的漆黑夜晚，只能暂时放慢脚步，安静等待天亮。\n\n这是一个即使付出很多努力，也不容易被别人看见或认可的时期。\n\n现在不适合一味逃避眼前的问题。对外需要保持灵活，适当放低自己的姿态，不必急着证明什么。\n\n先安静地充实自己，守住内心正确的方向，并且坚定地熬过这段低谷。\n\n只要不因为焦虑而乱了节奏，最终仍然能够得到与努力相匹配的成果。\n\n现在最重要的是不要着急，耐心等待真正适合自己的时机。",
      "yao": [
        "现在不适合贸然出头，更应该先维持现有状态。\n\n整体的运势开始转弱，因此比起积极扩张，更需要放低自己，安静观察周围的变化。\n\n少做不必要的动作，反而更容易保护好现在拥有的东西。",
        "事情正处于逐渐走下坡的危险阶段。\n\n不过幸运的是，身边可能会出现愿意帮助自己的人，因此即使遇到问题，也有机会比较平稳地度过去。\n\n现在最重要的是不要固执己见。\n\n愿意听取别人的意见，并接受适当的帮助，会让情况轻松很多。",
        "这是一个容易失去方向，连自己到底该往哪里走都变得模糊的时期。\n\n眼前的困难，很多时候需要靠自己一步一步走出来。\n\n现在不适合再开始新的事情。\n\n先停下来，减少行动，重新整理自己的方向，会比盲目向前更好。",
        "可能会感觉身边几乎没有人真正相信自己，反而是不合适的人得到了更多信任。\n\n整体已经接近一个非常狭窄、难以继续推进的局面。\n\n这种时候更需要保持警觉。\n\n尤其要注意自己的言语和行为，不要因为一时情绪而留下新的问题。",
        "漫长的黑夜终于开始过去，远处的太阳也逐渐升起。\n\n原本停滞的事情会一点一点重新出现转机。\n\n因为已经默默坚持着走过了最困难的阶段，所以过去的努力终于开始有机会转化为实际成果。\n\n现在可以慢慢期待更好的变化。",
        "这是一个即使拼命努力，也很难立刻改变局面的时期。\n\n现在尤其不能轻举妄动。\n\n就像湿透的落叶紧贴在地面一样，暂时安静地守住自己的位置，反而是更安全的选择。\n\n如果硬要强行改变现状，可能会造成难以控制的巨大损失。"
      ]
    },
    "2_7": {
      "key": "2_7",
      "name": "临",
      "gua": "这是一个需要像深潭一样，以宽广的心胸包容他人的时期。\n\n你已经具备站在众人之上、承担更大责任的能力，因此可以对自己更有信心。\n\n不过，现在尤其需要兼顾上位者与下位者的立场，不偏向任何一方，以包容和协调维持整体平衡。\n\n目前是一个适合积极行动、相信自己能力的旺盛时期。\n\n但就像太阳升起之后终究会西落一样，眼前的有利局面也不会永远持续。\n\n因此，在条件好的时候要把握机会，尽量把重要的事情落实下来，不要错过真正能够取得成果的时机。\n\n可以大胆向前，但同时也需要保持成熟、灵活的处世方式。",
      "yao": [
        "现在适合听取前辈或上位者的建议，并积极投入自己想做的事情。\n\n如果过程中出现问题，不要使用小聪明或投机的方法。\n\n正面面对问题，以真诚、合理的方式去沟通和说服，会更加有效。\n\n只要不过于急躁，事情整体能够比较顺利地得到不错的结果。",
        "现在需要特别注意自己与周围人的相处方式。\n\n个人的评价、形象以及他人对自己的信任，会直接影响事情能否顺利推进。\n\n目前可能有掌握较大权力的上位者对你的计划并不完全认同。\n\n如果不能提前观察周围的气氛，并通过真诚沟通取得理解和支持，想做的事情就容易遇到阻碍。",
        "即使现在主动权已经掌握在自己手中，也不能因此随意使用权力。\n\n如果只想依靠力量压制别人，或者因为处事不当而让周围的人感到不满，他们很容易逐渐离开自己。\n\n这样一来，想推进的事情也会变得困难。\n\n现在最重要的是以宽容的态度对待身边的人，并通过实际行动建立真正的信任。",
        "如果只是把事情轻易交给别人，或者因为过度保守而不愿意亲自行动，整体发展并不会理想。\n\n现在反而适合自己主动开始新的事情，并积极承担领导和推进的责任。\n\n只要亲自掌握方向、稳步带领，通常不会出现太大的问题。",
        "现在最重要的是对自己保持适当的信心。\n\n只要能够根据实际情况，把握正确的时机推进自己想做的事情，就会比较有利。\n\n同时，也需要理解下属、合作伙伴以及实际执行者的想法。\n\n如果能够得到一起做事的人真正的支持，就有机会取得非常好的成果。",
        "以温和而真诚的态度，与充满年轻活力和新想法的人一起合作，会带来不错的发展。\n\n现在不应该只从个人立场出发，而要更多考虑整个团队或组织的利益。\n\n尊重不同人的意见，并以整体的稳定与发展为中心推进事情，就能够减少摩擦，让事情顺利展开。"
      ]
    },
    "3_6": {
      "key": "3_6",
      "name": "大壮",
      "gua": "终于到了能够充分发挥自己力量的时期。\n\n这是一个非常适合实现目标、取得明显成果的好阶段。与其只做一些零碎的小事，现在更适合推动规模较大的计划，或者扩展事业与业务范围。\n\n不过，正因为自身气势和行动力都很强，更需要保持警觉。\n\n如果因为掌握优势就忽视周围的人，独断地推进事情，反而可能突然遭遇意料之外的问题。\n\n有些机会看起来非常华丽，但实际内容未必像表面那样充实。\n\n因此，在正式开始之前，认真了解情况并做好检查，是非常重要的。",
      "yao": [
        "现在还只是刚刚开始的阶段。\n\n虽然已经逐渐掌握主动权，但真正适合大规模行动的时机还没有完全成熟。\n\n不要急着表现自己，先观察整体情况，并尽量让值得信任、能力不错的人留在身边。\n\n稳住基础，会比过早出手更有利。",
        "现在最重要的是端正自己的心态，并谨慎处理自己的言行。\n\n这是一个自身力量非常充足的时期，也正因为如此，更不能随意行动。\n\n越有实力，越需要懂得节制和分寸。\n\n只要保持冷静和正直，就不容易出现大的问题。",
        "问题一旦出现，可能会迅速扩大到难以控制的程度。\n\n因此，现在需要提前检查可能存在的风险和隐患。\n\n如果只是觉得问题不大，暂时放着不管，之后反而可能发展成更严重的麻烦。\n\n及时发现、及时处理，才是最重要的。",
        "因为已经提前把出现的问题妥善处理好，所以之后的道路会明显顺畅许多。\n\n能够准确判断情况，并及时把判断落实到行动上，是这个阶段最大的优势。\n\n原本的阻碍逐渐消失，想做的事情也会进入非常好的发展状态。",
        "有时候，主动放弃一点东西，反而能够避免更大的损失。\n\n现在需要适当放低自己的姿态，也可能需要接受一定程度的让步或牺牲。\n\n暂时不要过度强调自己的力量和立场。\n\n把注意力放在人际关系上，与周围的人保持良好互动，会比硬撑着争取每一分利益更加有利。",
        "这是一个进也不是、退也不是，容易陷入两难的时期。\n\n如果想靠小聪明绕开问题，反而可能让自己吃更大的亏。\n\n与其继续逃避，不如正面面对真正的问题，并认真寻找解决办法。\n\n只要愿意承担责任、直接处理眼前的困难，原本不利的局面反而有机会转化成新的机会。"
      ]
    },
    "3_2": {
      "key": "3_2",
      "name": "豫",
      "gua": "新的开始。\n\n这是一个适合为未来制定计划，并积极行动的时期。\n\n只要判断正确、反应灵活，就能够像鱼儿进入水中一样，顺势发挥自己的能力，也有机会带领周围的人一起前进。\n\n如果能够与值得信任、能力不错的人合作，整体发展会更加顺利。\n\n不过，现在也很容易因为对自己过度自信而变得骄傲。\n\n如果忽视周围的人，或者因为一时得意而轻率行动，反而可能让自己陷入尴尬的局面。\n\n越是在气势不错的时候，越需要保持谦逊和分寸。",
      "yao": [
        "现在容易因为借助了别人的能力或成果，而产生过度表现自己的冲动。\n\n如果把别人的功劳当成自己的实力，并因此变得贪心或自满，反而可能给自己带来严重的损失。\n\n现在尤其需要看清自己真正拥有的能力和条件。\n\n如果正准备开始新的事情，目前并不是很适合贸然行动。",
        "周围虽然有不少诱惑，但自己能够很好地忍耐和控制。\n\n不做超出自身能力和位置的事情，也不因为眼前的利益偏离正确的方向，因此整体不会遇到太大的问题。\n\n只要继续保持这样的稳定和克制，就能平稳地向前走。",
        "这是一个容易沉浸在轻松和享乐中，直到某个时刻才突然意识到“再这样下去真的不行”的时期。\n\n现在需要根据现实情况及时调整自己的行为和生活方式。\n\n如果目前所处的环境已经无法帮助自己成长，就不要因为留恋而继续停留。\n\n及时离开不适合的位置，反而是更好的选择。",
        "能够相信自己并积极行动，同时又与周围的人保持良好的协调，是非常理想的状态。\n\n现在适合以谦逊的态度促进合作，而不是一个人独自承担所有事情。\n\n只要能够与周围的人建立真正的信任和配合，想做的事情就有机会取得很大的成果。",
        "因为过度享受生活或放松自己，可能已经开始遇到一些实际问题。\n\n现在不应该逃避眼前的危机。\n\n只要愿意耐心而持续地处理问题，就有机会避免更大的损失。\n\n不要过度受到周围人的影响，相信自己的判断，并坚持把该解决的事情处理到底。",
        "自己可能觉得只是在享受人生，但如果长期缺乏节制，过去积累起来的评价、信任或位置都可能开始动摇。\n\n不过，现在还来得及调整。\n\n只要愿意及时停下来，把这段经历当作一次教训，重新认真生活和努力，就有机会逐渐整理过去留下的问题。\n\n真正重要的，是不要继续重复同样的错误。"
      ]
    },
    "3_3": {
      "key": "3_3",
      "name": "震",
      "gua": "这是一个充满活力和行动力的时期，但越是气势旺盛，越要记得把真正的成果掌握在手中。\n\n现在如果能够明确目标并持续努力，实现目标的可能性很高。\n\n不过，也容易出现外表看起来声势很大，实际内容却不够扎实的情况。\n\n有时欲望会跑在努力前面，产生“付出一点就想得到很多”的心态，因此需要特别警惕。\n\n把目标和计划整理清楚，不必过度在意周围的杂音和评价。\n\n如果遇到困难，也不要急着一个人冲上去解决。适当地向值得信任的人寻求帮助，反而会更加稳妥。",
      "yao": [
        "周围对自己的评价或称赞，可能比实际做出的成果更大，因此反而会让人感到一些压力。\n\n不过，只要保持冷静，最终还是有机会取得不错的结果。\n\n经常回头检查自己的状态，并客观看清现实情况，提前做好准备。\n\n即使中途出现问题，也不会造成太大的影响。",
        "这是一个比较容易遭受损失的时期。\n\n即使需要承受一点小损失，也最好及时做出取舍，不要因为舍不得而继续拖下去。\n\n如果始终无法放下已经失去的东西，反而可能让自己陷入更危险的局面。\n\n适时止损，才能保护剩下的部分，也更有机会在之后重新找回失去的东西。",
        "周围的环境比较嘈杂，容易让人感到紧张或不安。\n\n不过，不需要因为这些声音过度害怕。\n\n只要继续安静地做自己该做的事情，不被外界轻易扰乱，就能够比较平稳地向前推进。",
        "周围发生的问题可能暂时波及到自己，让人感到有些烦闷和不舒服。\n\n不过幸运的是，这种影响并不足以造成真正严重的伤害。\n\n虽然情况看起来不太顺心，但实际损失并不大。\n\n稳住自己，不必因为一时的混乱做出过度反应。",
        "眼前的情况看起来复杂，容易让人担心是不是会发生严重的问题。\n\n但实际上，事情大多能够平稳地度过去，并不会出现想象中的巨大损失。\n\n现在不需要因为表面的混乱过度紧张。\n\n保持冷静，按照原来的节奏处理问题，就能够比较顺利地度过这个阶段。",
        "这一次的问题主要落在别人身上，并没有真正直接伤害到自己。\n\n不要因为看见周围发生混乱，就主动卷进去承担不属于自己的问题。\n\n如果勉强出头，反而可能给自己制造新的麻烦。\n\n安静守住自己的位置，冷静观察事情的发展，会是更加合适的选择。"
      ]
    },
    "3_8": {
      "key": "3_8",
      "name": "小过",
      "gua": "现在适合享受一些小而确定的成果，不宜把事情做得过大。\n\n与其不断扩大规模，不如适当收缩，把注意力放在自己真正能够承担的事情上。\n\n如果做出超出自身能力和条件的选择，就容易出现损失。因此，先看清现实，再决定自己能够做到什么，会更加稳妥。\n\n即使目前的事情进行得还不错，一旦遇到明显困难，回到自己原本熟悉的工作或核心领域，反而是更安全的选择。\n\n现在并不是整体运势特别强的时期，也存在一定的损失风险。\n\n与其勉强突破，不如好好检视自己，保持耐心，稳稳度过这段不太轻松的时期。",
      "yao": [
        "现在容易成为问题或风险直接指向的对象，因此需要格外谨慎。\n\n如果因为贪心而做出越界或过度的行为，可能带来比较严重的损失。\n\n现在绝对不适合逞强或冒进。\n\n如果正准备开始新的事情，暂时不做会更加稳妥。",
        "现在最重要的是先弄清楚自己真正想要什么，以及眼前这件事情的核心到底在哪里。\n\n如果忽略必要的程序，只想着赶快得到结果，又没有认真确认细节，很难真正得到自己想要的东西。\n\n先把重点和顺序理清，再行动会更加有效。",
        "不能继续放任自己的缺点或错误不管。\n\n如果已经知道哪里出了问题，就需要像及时处理伤口一样，尽快认真改善。\n\n否则，小问题也可能逐渐积累，最后反过来给自己带来更大的困难。\n\n现在也不适合只相信自己的力量，独断地推进事情。\n\n过于强硬，反而容易让周围出现更多对立和反感。",
        "不要因为问题看起来只是一个小漏洞，就轻易忽略它。\n\n如果没有及时检查和处理，之后可能发展成更大的损失。\n\n现在需要仔细观察情况，并保持适当的警觉。\n\n只要清楚自己的能力和界限，以正确、稳妥的方式行动，想做的事情整体上不会遇到太大的困难。",
        "自己可能觉得时机已经成熟，但眼下仍然看不到真正的成果。\n\n就像云已经聚集，却还没有真正下雨一样，现在还需要继续等待。\n\n不要急着出头，也不要因为迟迟没有结果而失去耐心。\n\n保持谦逊，并与真正有实力的专业人士合作，近期内就有机会逐渐看到不错的成果。",
        "因为欲望过强，容易让自己陷入比较严重的危机。\n\n原本以为只是一个小小的错误，却可能迅速扩大到难以控制的程度。\n\n到了这个阶段，想完全依靠自己的力量收拾局面，也会变得非常困难。\n\n现在尤其需要停止继续冒进，并尽快正视已经出现的问题。"
      ]
    },
    "3_1": {
      "key": "3_1",
      "name": "解",
      "gua": "这是人生逐渐迎来春天的时期。\n\n无论是朝着新的目标前进，还是解决过去一直停滞、困难的事情，现在都比较容易出现明显的突破。\n\n也容易遇到能够帮助自己的人，非常适合展开新的活动和计划。\n\n不过，如果没有明确目标，只是抱着随便试试的态度行动，反而可能造成损失。\n\n如果已经有真正想做的事情，就不要犹豫太久，及时行动会更加有利。\n\n如果暂时还没有明确目标，那么先充实自己、提升实力，也是很好的选择。",
      "yao": [
        "现在容易遇到能够帮助自己的人，因此想做的事情会比较顺利地推进。\n\n不过，比外部帮助更重要的是先准确了解自己目前所处的位置。\n\n根据现实情况做出正确、适合自己的选择，才能真正把这份帮助转化为好的结果。",
        "如果失去自己的中心，就很难让事情顺利发展。\n\n现在需要放下焦虑，不要急着一步到位。\n\n按照顺序，一件一件把该做的事情稳稳推进，就有机会实现目标。\n\n随着整体局势逐渐改善，财务方面也容易出现比较不错的发展。",
        "现在容易出现一些人，利用你内心的不满或焦虑，试图为自己谋取利益。\n\n因此，需要重新检查自己与人相处的方式，并且牢牢守住自己的判断。\n\n不要因为有人迎合自己的情绪，就轻易相信对方。\n\n如果正准备开始新的事情，现在推进起来并不会特别轻松，需要更加谨慎。",
        "不要总是停留在熟悉的小圈子里。\n\n现在反而适合主动离开原本的环境，去接触新的人和新的机会。\n\n容易与新的伙伴建立不错的合作关系。\n\n如果愿意打开自己的范围，想做的事情也有机会取得很好的成果。",
        "如果过去一直有让自己感到压抑或难以解决的问题，现在终于开始出现真正的解决机会。\n\n即使是过去与自己意见不合、甚至反对自己的人，也不必一味排斥。\n\n如果愿意由自己先伸出手，对方反而可能成为意想不到的帮助。\n\n如果始终坚持排斥和对立，局面也可能再次陷入停滞。",
        "现在需要果断放下不必要的自尊，以及过去一直紧握不放的位置和既得利益。\n\n原本长期堵塞的事情开始彻底松动，整个局面也会迅速变得顺畅。\n\n只要不再被过去的执着束缚，就有机会很快得到自己真正想要的结果。\n\n这是一个对自己非常有利，也很适合完成重要目标的好时期。"
      ]
    },
    "3_4": {
      "key": "3_4",
      "name": "恒",
      "gua": "以始终如一的心态，稳稳地走自己的路。\n\n只要继续维持现在的节奏，事情整体会比较顺利地发展。\n\n如果因为厌倦平静，反而不断开始新的事情，容易让自己变得急躁，并带来不必要的损失。\n\n现在最重要的是守住自己的中心，持续而稳定地努力。\n\n不要期待侥幸，也不要因为一时没有明显变化就轻易改变方向。",
      "yao": [
        "因为欲望过多，很难真正看到成果。\n\n内心虽然有坚定的想法，却总是无法让自己安静下来，不断想要行动或改变。\n\n如果一直这样急着推进，想做的事情自然很难得到理想的结果。\n\n现在需要先控制自己的冲动，减少不必要的动作。",
        "目前可能处在一个并不适合自己的环境里，因此各种麻烦也容易接连出现。\n\n不过，只要不失去自己的中心，以稳定的态度一个一个解决问题，事情最终会逐渐整理好。\n\n坚持自己的原则，同时耐心处理眼前的问题，会带来实际的成果。\n\n之后回头来看，也不会后悔自己的选择。",
        "过度相信自己的能力，不分场合地介入各种事情，反而容易让局面失去控制。\n\n现在越想依靠自己的力量解决一切，越可能发现事情并不按照预期发展。\n\n需要保持克制，把注意力重新放回自身的基础和实力上。\n\n想做的事情暂时容易陷入停滞，不适合强行推进。",
        "因为心意不断变化，今天想做这个，明天又追求那个，最终很难真正得到什么。\n\n如果总是把注意力放在外部，却没有认真面对自己真正需要做的事情，就很难积累成果。\n\n现在需要减少变化，重新专注于一个明确的方向。",
        "心思容易浮动，很难真正集中下来，因此事情不容易顺利完成。\n\n如果处在较低的位置，这种随和也许不会造成太大问题。\n\n但如果承担领导或管理责任，就容易让别人觉得缺乏稳定性，难以真正信任。\n\n现在想推进重要的事情并不太有利，首先需要重新建立自己的稳定感。",
        "已经逐渐失去自己的中心，甚至与原本真正值得信任的人疏远。\n\n因为过去积累的信任已经受到很大影响，所以很多事情都不容易顺利推进。\n\n现在继续勉强行动，只会让关系更加疏远。\n\n比起急着挽回成果，更需要先重新整理自己的态度，并慢慢恢复与重要之人的信任。"
      ]
    },
    "3_9": {
      "key": "3_9",
      "name": "丰",
      "gua": "外在气势旺盛，但内在力量却容易逐渐减弱。\n\n目前整体看起来比较充足，也容易拥有不错的资源和机会，但越是这种时候，越需要认真管理内部状态。\n\n如果有已经拖了很久的事情，最好发挥判断力和行动力，尽快把它妥善收尾。\n\n与其贸然展开新的事业或计划，现在更重要的是守好已经拥有的东西，把正在进行的事情稳定经营下去。",
      "yao": [
        "如果只相信自己的能力而轻视别人，之后很容易为这种态度付出代价。\n\n即使自己确实有实力，也不要因此忽略周围人的价值。\n\n现在尊重别人、保持谦逊，会比一味强调自己的能力更加有利。",
        "现在需要认真做好自己负责的事情，同时把精力放在提升自身能力上。\n\n与其急着向别人展示自己，不如用实际成果证明实力。\n\n如果为了得到认可而过度表现，反而可能引起周围人的反感。",
        "虽然自己具备能力，也有不错的品格，却暂时没有遇到真正理解和认可自己的人，因此容易感到孤独。\n\n如果因为这种不满而变得消极、尖锐，反而会让原本的问题更加严重，甚至连支持自己的人也逐渐离开。\n\n现在想要实现重要目标并不容易。\n\n比起抱怨外界，更需要先稳住自己。",
        "即使身处比较困难的时期，也有机会遇到愿意帮助自己的合作伙伴。\n\n在对方的帮助下，自己能够逐渐走向更适合发挥能力的位置或环境。\n\n只要珍惜这样的合作关系，想做的事情整体会朝好的方向发展。",
        "即使自己还有不足，也能够得到周围有智慧、有能力之人的帮助。\n\n借助这些人的经验和支持，自己的评价会逐渐提高，也更容易完成真正想做的事情。\n\n现在适合接受好的建议，与值得信任的人合作。\n\n整体是一个结果不错的时期。",
        "就像月亮圆满之后会逐渐亏缺一样，整体的气势开始慢慢下降。\n\n这个阶段可能出现经济上的损失，也可能因此重新整理一些人际关系。\n\n现在越是觉得局势不稳定，越需要放低姿态，减少不必要的动作，耐心等待下一次机会。\n\n目前并不适合强行推进新的事情。"
      ]
    },
    "3_7": {
      "key": "3_7",
      "name": "归妹",
      "gua": "越是着急，越需要绕一步、慢下来。\n\n这是一个如果过于受情绪影响，急着推动事情，就容易遭受损失的时期。\n\n如果忽视必要的程序，只想着走捷径，反而可能遇到更大的风险。\n\n与其现在贸然开始新的事业，或者强行推动大幅度的变化，不如先客观观察整体情况，让自己稍微放慢节奏。\n\n不要期待侥幸，也不要依赖不正规的办法。\n\n按照合理的顺序和正确的方法一步一步走，才是现在最安全的选择。",
      "yao": [
        "只要在自己目前的位置上安静地做好该做的事情，好的机会就会逐渐出现。\n\n不勉强、不急躁，按照自然合理的方式推进自己想做的事情，就有机会得到不错的成果。\n\n现在最重要的是稳住自己的节奏。",
        "这是一个自己的能力容易得到充分认可的好时期。\n\n不过，与其因为机会出现就急着做决定，不如继续保持耐心。\n\n等到对自己最有利、条件真正成熟的时候再行动，会得到更好的结果。",
        "如果忽视原则和正确的方法，只凭情绪强行推进事情，就容易产生损失。\n\n想靠小聪明解决问题，或者在准备不足的情况下贸然行动，都会让事情受到很大的阻碍。\n\n现在越是想快，越需要回到基本原则上。",
        "自己的目标和期待可能比较高，但现实中很难让所有条件都完全符合自己的理想。\n\n如果只坚持自己的立场，就容易错过真正适合行动的时机。\n\n适当地与周围协调、做出合理的妥协，并及时把握机会，反而更容易得到自己想要的结果。",
        "放下外在的虚饰和不必要的自尊，保持朴素而谦逊的态度，会更加有利。\n\n尊重对方，并根据实际的时间和情况灵活调整自己的方式，能够让彼此都得到好处。\n\n只要保持这种态度，想做的事情会比较顺利。",
        "表面上看起来似乎很不错，但实际却缺乏真正的内容和成果。\n\n即使勉强推动事情，也很难得到周围人的真正响应，最后只会浪费自己的时间和精力。\n\n现在不适合为了维持表面的样子而继续强撑。\n\n减少不必要的行动，重新检查实际基础，会更加稳妥。"
      ]
    },
    "8_6": {
      "key": "8_6",
      "name": "大畜",
      "gua": "这是一个把长期积累的实力真正带到更广阔世界中的好时期。\n\n过去不断磨炼和积累的能力、经验与底蕴，现在终于有机会充分发挥出来。\n\n不要只停留在眼前的小利益里，也不要被狭窄的视野限制自己。\n\n现在更适合把目光放远，带着更大的目标走出去，主动拓展自己的空间。\n\n与其停留在熟悉的环境中安于现状，不如积极行动，寻找更广阔的发展机会。\n\n即使途中遇到困难，只要能够运用过去积累的经验，正面面对并一步步突破，虽然过程可能辛苦、耗时较长，但最终也更容易得到非常丰厚而有价值的成果。",
      "yao": [
        "目前的情况还有一定风险，并不是适合贸然行动的时候。\n\n即使自己已经大致看清了周围的局势，也仍然需要保持耐心，安静等待真正适合行动的时机。\n\n如果正准备开始新的事情，现在暂时停下来，反而对自己更有利。",
        "就像高速行驶的跑车突然爆胎一样，现在很难继续顺利向前。\n\n如果勉强推进，不仅容易偏离原本的方向，也可能让整个局面变得更加危险。\n\n现在不要急着出手。\n\n保持谨慎，先处理好阻碍，再等待重新出发的时机，会更加稳妥。",
        "时机终于到了。\n\n现在可以大胆加速向前，很多原本困难的事情也有机会顺利突破。\n\n即使面对比较大的挑战，只要充分发挥自己的能力，也能够找到解决办法。\n\n财务方面也容易出现明显提升，同时能够比较稳妥地守住属于自己的成果。\n\n这是一个非常适合积极发展、扩大成果的好时期。",
        "现在需要提前观察未来可能出现的问题，并做好细致的准备。\n\n越早发现风险，越能够避免之后受到真正的伤害。\n\n同时，也要多留意身边那些刚刚开始、容易动摇的人。\n\n如果能够帮助他们稳定下来，在支持他人的过程中，自己也会得到很大的成就感和满足感。",
        "能够提前看清局势，并及时采取合适的措施，是这个阶段非常重要的优势。\n\n即使自己拥有很强的实力，也不要试图用力量强行压制别人。\n\n与其硬推，不如以真诚的态度，顺着合理的规律去引导事情。\n\n这样处理，想做的事情会更加顺利，也更容易为自己带来实际利益。",
        "现在已经把需要的实力、经验和底蕴积累到了非常成熟的状态。\n\n过去的准备终于能够充分发挥作用。\n\n正在推进的事业有机会出现很大的发展，想做的事情也更容易顺利实现。\n\n这是一个能够充分展现自己能力，并取得丰厚成果的非常好的时期。"
      ]
    },
    "8_2": {
      "key": "8_2",
      "name": "剥",
      "gua": "这是一个需要不断放下、不断清空的时期。\n\n现在最重要的，是为未来保住属于自己的那颗“种子”。\n\n就像高山被风雨一点点侵蚀一样，可能会经历失去一些东西、感受到自身能力极限的艰难阶段。\n\n即使出现争执、流言或误解，也尽量不要正面冲突，避开争端反而是更好的选择。\n\n现在即使勉强展开新的事情，或者急着展示自己的能力，也很难得到真正的认可，反而容易带来更多损失。\n\n对于已经明显无法继续的事情，要懂得及时放下，果断止损。\n\n与其执着于已经失去的东西，不如留下未来重新开始所需要的最后一颗“种子”，暂时安静下来，耐心等待下一次机会。",
      "yao": [
        "从一开始，事情就容易偏离原本期待的方向。\n\n过去好不容易建立起来的形象或评价，也可能突然受到影响。\n\n还有可能被迫承担自己并不愿意负责的事情。\n\n如果现在准备开始新的计划，结果容易非常不理想，因此暂时不要贸然行动会更安全。",
        "身心都容易受到消耗，也可能因为环境变化而被迫离开原本的位置，承担较大的牺牲。\n\n即使觉得委屈，或者面对自己并不愿意接受的情况，现在也需要尽量忍耐。\n\n如果因为情绪而贸然反抗，反而可能带来更大的损失。\n\n先保护好自己，避免问题进一步扩大更重要。",
        "现在需要果断离开已经看不到希望的群体或环境。\n\n如果一段关系或一个环境已经像腐烂的绳索一样无法支撑自己，就不要继续因为留恋而抓住不放。\n\n彻底切断不再适合自己的部分，把力量集中起来寻找新的出口。\n\n只要敢于离开错误的地方，就能够继续向前走。",
        "这是整个局面最容易走向低谷的阶段。\n\n对于已经明显无法继续的事情，需要彻底放下，不要再留下无意义的牵挂。\n\n如果只是表面上维持，勉强拖延，却没有真正解决问题，最终也得不到任何实际成果。\n\n现在不适合强行推进新的事情，更重要的是彻底整理已经失去作用的部分。",
        "不再急着证明自己有多优秀，而是放低姿态、保持谦逊，反而容易得到周围更加积极的评价和信任。\n\n过去不断消耗自己的局面也开始逐渐停止。\n\n重新找回自己的本分和正确方向之后，原本失去的东西会慢慢得到补充，也更容易重新获得实际成果。",
        "经过漫长而严酷的考验，剩下的力量终于重新集中到了一起。\n\n就像掉落在地上的果实埋入泥土后，再次孕育出新的生命一样，过去的低谷并不是彻底的结束。\n\n因为没有急着索取回报，而是安静地坚持到了最后，所以现在开始有机会得到真正而明确的回报。\n\n这是一个从最低处重新恢复，并逐渐迎来好结果的时期。"
      ]
    },
    "8_3": {
      "key": "8_3",
      "name": "颐",
      "gua": "一句话可以化解很大的问题，也可能因为一句话失去许多东西。\n\n现在尤其需要谨慎说话，也要注意自己的态度和表达方式。\n\n这个时期很容易因为言语上的失误而遭受损失，因此比平时更需要保持正直的心态，同时充实自己的实力和基础。\n\n现在适合规划新的事情，也适合寻找新的工作或发展方向。\n\n不过，如果欲望过强，或者制定超出自身能力和现实条件的计划，就容易带来较大的损失。\n\n最好借助周围值得信任之人的帮助，按照顺序一步一步推进。\n\n如果现有的制度、方式或做法存在明显问题，即使调整过程中会产生一些摩擦，也应该及时而明确地纠正。",
      "yao": [
        "容易忽略自己已经拥有的东西，却觉得别人拥有的一切都更加令人羡慕。\n\n即使看起来别人的东西更好，也不要因此产生不切实际的欲望。\n\n如果因为羡慕或贪心而急着开始新的事情，结果往往不会理想。\n\n现在更适合先守好自己已有的基础。",
        "这是一个需要靠自己的力量，在并不轻松的环境中开辟道路并创造成果的时期。\n\n在这个过程中，如果想靠小聪明或不正当的方法走捷径，很可能失去身边真正值得信任的人，也会影响自己的评价。\n\n如果出现问题，一定要用诚实、正当的方式处理。\n\n这样才能避免之后留下更大的麻烦。",
        "现在容易产生想靠小聪明快速获得利益的念头。\n\n但超出自身能力和条件的欲望，最终可能带来严重的问题和难堪，也会让事情在很长一段时间内难以恢复。\n\n目前并不适合强行推进自己想做的事情。\n\n越是想急着得到结果，越需要先停下来控制自己的欲望。",
        "竞争对手或对自己不利的人，可能正在寻找机会夺走自己的成果。\n\n因此需要保持警觉，并提前做好必要的准备。\n\n不过，只要能够冷静观察情况并认真防范，就有能力保护好自己的成果。\n\n不需要过度恐慌。\n\n整体来看，想做的事情并不会遇到特别严重的阻碍。",
        "现在不适合急着到处行动，更适合先稳定在一个地方，把自己的实力真正培养起来。\n\n如果只是因为面子或自尊受到影响，就一时冲动地展开新的事情，反而容易造成损失。\n\n现在无需急着证明自己。\n\n安静地积累实力、充实内部基础，之后想做的事情会更容易朝好的方向发展。",
        "现在需要通过正确的方法获取利益，并处理眼前的问题。\n\n如果过度相信自己的能力，或者因为欲望而偏离正确的原则，就容易出现损失。\n\n放下不必要的贪心，弄清事情应该按照什么顺序进行，并保持正直的心态。\n\n即使过程中会出现一些风险和困难，只要方法正确，最终仍然能够平稳度过，并得到不错的结果。"
      ]
    },
    "8_8": {
      "key": "8_8",
      "name": "艮",
      "gua": "有时候，暂时停下来休息一下，也是继续前进的一部分。\n\n现在就像一座山后面还有另一座山，前方阻碍重重，并不适合勉强向前突破。\n\n与其急着改变现状，不如先停在原来的位置，冷静观察周围的情况。\n\n如果因为欲望太强，硬要推进某件事情，反而容易遇到更多困难，甚至造成较大的损失。\n\n现在也不适合同时展开两件重要的事情。\n\n把注意力集中在目前正在做的事情上，会更加稳妥。\n\n如果能够不被外界的诱惑轻易动摇，守住自己的中心，同时把时间用在学习和提升实力上，这段停下来的时期，之后会成为很有价值的积累。",
      "yao": [
        "现在比起开始新的事情，更重要的是把基础打牢。\n\n不要急着行动。\n\n在目前的位置上稳定下来，把现有的事情维护好，对自己反而最有利。",
        "现在还不是适合积极出头的时期。\n\n如果硬要向前推进，很容易在各种细节上不断碰壁，让自己更加疲惫。\n\n即使周围出现看起来很诱人的机会，也不要轻易离开自己的位置。\n\n安静守住现在的基础，才是避免损失的最好方法。",
        "可能因为得到了并不符合自己期待的结果，而感到压抑、烦躁，心理压力也比较大。\n\n这种时候不要因为心情不好，就主动介入别人的事情或替别人承担问题。\n\n把注意力放回自己真正应该做的事情上。\n\n只要守好自己的范围，就能够避免进一步的混乱和麻烦。",
        "现在不适合轻易介入别人的事情，也不要急着给别人提出意见或建议。\n\n先退后一步，认真观察周围的情况。\n\n只要保持谨慎，不因为一时冲动采取行动，就能够比较平稳地度过这个阶段，不至于产生明显损失。",
        "现在尤其需要谨慎说话。\n\n一句没有经过充分考虑的话，也可能引发不必要的问题。\n\n在表达意见之前，先看清事情的前因后果，并注意自己的言辞和态度。\n\n只要能够控制好表达方式，就能够避免之后的后悔，也不容易因此造成经济上的损失。",
        "现在需要仔细检查自己是否还有遗漏或没有注意到的问题。\n\n不要因为急着取得成果而过度行动。\n\n如果能够根据实际情况，在该停的时候真正停下来，并且懂得控制自己的欲望，这种判断本身就会成为重要的智慧。\n\n把握好停止的时机，反而能够让想做的事情最终得到不错的结果。"
      ]
    },
    "8_1": {
      "key": "8_1",
      "name": "蒙",
      "gua": "现在需要放低自己，以谦逊的态度学习和成长。\n\n就像身处浓雾之中一样，目前很难看清前方，经验和信息也还不够充分。\n\n与其只靠自己判断并贸然行动，不如主动向值得信任的前辈、专业人士或导师寻求建议，并认真学习。\n\n既然已经决定听取导师的意见，就不要反复怀疑、不断动摇。\n\n在充分理解之后，稳住自己的方向，坚持一步一步走下去更加重要。\n\n眼下也许还看不到明显成果，甚至会觉得有些停滞和压抑。\n\n不过，你未来的发展空间仍然很大。\n\n只要不急着求成，耐心积累实力和经验，之后就会逐渐看到好的结果。",
      "yao": [
        "因为经验不足，容易遇到一些原本没有预料到的困难，事情也不太容易按照自己的想法发展。\n\n与其为了赶快摆脱这种压抑感而勉强行动，不如先冷静下来充实自己。\n\n现在耐心等待、加强基础，反而是避免损失的最好方法。",
        "这是一个能够以宽广的包容力照顾并带领周围人的很好时期。\n\n愿意相信并跟随自己的人会逐渐增加。\n\n也容易出现值得庆祝的好消息，甚至接连迎来令人开心的事情。\n\n整体来看，正在推进的事情比较容易顺利发展。",
        "现在容易缺乏真正改变现状的决心，也没有足够的学习意愿，因此不断受到外界影响而摇摆。\n\n如果因为眼前一点诱惑，或者错误的判断而贸然做出选择，之后可能长期承受较大的损失和困难。\n\n现在尤其需要谨慎。\n\n不要为了快速摆脱不安，就轻易选择看起来简单的道路。",
        "目前没有完全看清实际情况，因此容易陷入混乱和困境。\n\n如果继续用狭窄的视角坚持自己的想法，判断力会越来越弱，损失也可能进一步扩大。\n\n原本想独自强行推进的事情，最好暂时停下来重新检查。\n\n目前想做的事情推进起来会比较困难。",
        "即使目前自己的能力和经验还明显不足，只要能够遇到优秀的导师或值得信任的帮助者，并认真接受他们的指导，就有机会实现目标。\n\n不要因为一时的不安而反复怀疑正确的教导。\n\n保持谦逊，认真吸收经验并付诸实践，想做的事情会得到很好的成果。",
        "长期以来令人压抑和辛苦的局面，终于开始出现出口。\n\n只要不依靠投机取巧或不正当的方法，而是继续坚持正确的原则向前走，事情就会逐渐朝对自己有利的方向发展。\n\n过去积累的学习和经验，也会开始真正发挥作用。"
      ]
    },
    "8_4": {
      "key": "8_4",
      "name": "蛊",
      "gua": "这是一个需要离开停滞的环境，并认真反省自己的时期。\n\n就像长期不流动的水会逐渐腐败一样，现在无论是所在的组织，还是自己目前的处境，都可能正在从内部开始出现问题。\n\n这些问题并不会因为暂时掩盖起来就自动消失。\n\n现在需要彻底检视自己，同时把长期以来错误的习惯、制度或积累下来的问题真正找出来并加以改善。\n\n如果只是为了眼前轻松而继续维持舒适的现状，之后反而可能付出更大的代价。\n\n现在不适合急着进行新的交易或展开新的计划。\n\n先把内部的问题彻底整理清楚，正面解决真正的核心问题，才有机会让整个局面重新转向好的方向。",
      "yao": [
        "这是一个需要收拾前任、上位者或之前负责人留下的问题的时期。\n\n即使觉得不公平、烦躁，也很难完全避开这份责任。\n\n与其抱怨，不如先准确找到问题的核心，并耐心地一个一个解决。\n\n只要能够真正把遗留下来的问题处理好，最后反而有机会得到不错的成果和评价。",
        "现在甚至可能需要承担并纠正身边的人或上位者留下的错误。\n\n可以主动处理问题，但不要因为想彻底改变现状，就贸然把整个局面全部推翻。\n\n现在也不适合急着展开新的事情。\n\n先把已有的问题整理好，会比同时进行新的改革更加安全。",
        "现在可能会采用与过去惯例或上位者想法不同的方式，比较强硬地推进改革。\n\n过程中难免会出现一些摩擦和风险。\n\n不过，只要目标明确，也确实知道自己为什么需要这样改变，就可以坚定地继续推进。\n\n虽然过程不一定轻松，但最终有机会在没有严重损失的情况下把问题解决好。",
        "因为太想把事情做好，反而容易过度介入，结果让原本的问题变得更加复杂。\n\n现在需要适当与负责人或上位者保持距离，先观察整体局势。\n\n如果在情况还没有看清之前就急着推动改变，很可能让事情变得更加混乱，甚至让自己陷入更大的困难。",
        "过去长期困扰自己的问题终于能够得到真正的解决。\n\n与此同时，也有机会顺利接手原本就具有价值的资源、成果或新的机会。\n\n这是一个能够完成重要目标，并获得周围良好评价和认可的非常好的时期。\n\n过去处理问题时付出的努力，也更容易转化为实际成果。",
        "现在需要冷静判断整体情况，并懂得顺着已经形成的趋势适时收尾。\n\n已经得到的东西其实已经足够，不需要再继续追求更多。\n\n比起因为舍不得而不断延长战线，更重要的是有分寸地结束，并把已经取得的成果好好保留下来。\n\n如果到了这个阶段还因为欲望继续强行推进，反而容易造成较大的损失。"
      ]
    },
    "8_9": {
      "key": "8_9",
      "name": "贲",
      "gua": "比起华丽的外表，现在更重要的是把内在真正充实起来。\n\n与其追逐流行，或者为了让别人看到而勉强包装自己，不如踏实地整理实力和基础。\n\n如果过度在意外在形象，容易让自己变得疲惫，也可能带来不必要的经济损失。\n\n现在不适合贸然扩大事情，也不适合追逐过于浮夸的目标。\n\n从眼前的小事开始，一件一件认真处理，反而更有利。\n\n如果从事学术、教育、艺术等文化相关领域的事情，则比较容易取得不错的成果。",
      "yao": [
        "这是为了新的开始，先把自己整理好，再踏出第一步的阶段。\n\n放下虚荣，不做超出自身条件的选择，按照自己的节奏一步一步准备。\n\n只要稳稳前进，之后容易不断迎来好的变化。\n\n想做的事情也会比较顺利地展开。",
        "现在适合与周围的人分享喜悦，一起向前推进。\n\n如果能够与上位者、同事或伙伴保持适当的分寸和尊重，并彼此合作，就会产生更好的效果。\n\n这种合作也容易带来更大的满足感和成果。\n\n正在推进的事情整体上会有比较积极的发展。",
        "为了目标认真付出，并不断提升和磨炼自己，是非常好的状态。\n\n没有把精力浪费在不必要的地方，而是在正确的位置上踏实努力。\n\n正因为付出的努力扎实而持续，所以成果也更容易长久维持。\n\n这样的积累会逐渐转化为稳定的利益和好的结果。",
        "现在适合与理念相近、值得信任的人一起合作，朝着共同目标前进。\n\n周围的环境和整体气氛也比较容易支持自己。\n\n如果能够善用这样的关系和条件，想做的事情会顺利推进，并取得不错的成果。",
        "因为外在条件看起来不够华丽，或者实际拥有的资源暂时不足，事情可能会一时变得不顺，让自己感到压力。\n\n不过，不需要因此过度包装自己。\n\n放下虚荣和形式，以朴素、真诚的态度面对问题。\n\n即使中途出现一些摩擦或误解，最后也有机会逐渐化解，并得到好的结果。",
        "这是一个真正理解“装饰”本质，并愿意放下不必要包装的成熟阶段。\n\n不再依赖外表，而是回到最真实、最适合自己的本质。\n\n当外在的虚饰减少之后，内在的真诚和实力反而更容易显现出来。\n\n只要保持这种状态，无论处理什么事情，都比较容易避免不必要的问题和损失，让整个过程干净而顺畅。"
      ]
    },
    "8_7": {
      "key": "8_7",
      "name": "损",
      "gua": "现在需要放下个人的欲望，用更长远、更宽广的视角来看待事情。\n\n眼前看起来也许像是在吃亏，但从长远来看，这种适当的让步和付出，反而可能为自己和周围的人带来更大的利益。\n\n如果能够暂时放下个人得失，为整体考虑，主动帮助他人或在必要的时候做出让步，这份善意最终也会以其他形式回到自己身上。\n\n开始新的事情或进行投资时，初期可能会出现一些零碎的支出和困难。\n\n不过，只要不过于焦急，坚持按照计划稳步推进，最终有机会获得很好的成果。\n\n与其执着于眼前的一点利益，不如把时间、精力和资源投入到未来真正有价值的事情上。",
      "yao": [
        "现在具备足够的能力，可以解决眼前的问题。\n\n如果明明看到周围有人或某个环节需要帮助，却选择视而不见，反而可能让整体局面受到影响。\n\n即使自己暂时看起来会承担一点损失，也可以主动伸出手提供帮助。\n\n这种付出有助于让整个事情重新稳定下来。",
        "现在更重要的是守好自己的位置，把自己负责的事情认真做好。\n\n即使发现上位者或组织内部存在问题，也不要急着出面纠正或直接指出。\n\n目前过度介入反而可能给自己带来不必要的麻烦。\n\n先安静做好自己的本分，会更加有利。",
        "刚开始新的事情时，如果一开始就聚集太多人一起行动，反而容易因为意见不同而产生内部矛盾，并造成损失。\n\n放下想要营造声势的念头。\n\n先从自己能够做到的部分安静开始，反而更加稳妥。\n\n随着方向逐渐清晰，真正理念相近、适合合作的人自然会慢慢聚集过来。",
        "现在需要先减少并改掉自己身上的坏习惯，以及已经不适合的工作方式。\n\n与其一直寻找外部问题，不如先客观整理自己内部存在的不足。\n\n只要把这些问题逐渐清理好，眼前那些令人烦恼的事情也会比预想中更加顺利地得到解决。",
        "不要只因为眼前出现暂时的困难，就过早认定事情不会成功。\n\n也不要因为自尊心而坚持什么事情都一个人承担。\n\n如果确实需要帮助，就坦然向周围值得信任的人求助，并愿意接受他们的支持。\n\n这样做之后，整体局势会明显变得更加有利，也更容易出现好的转机。",
        "如果自己实际上并没有相应的责任或权限，就不要随意介入别人的事情，也不要过度指点他人应该怎么做。\n\n现在尤其需要守好人与人之间的界限。\n\n只要不过界，安静做好自己的事情，并冷静观察局势的发展，想做的事情整体能够比较平稳、顺利地推进。"
      ]
    },
    "1_6": {
      "key": "1_6",
      "name": "需",
      "gua": "放下焦躁，以主动而坚定的耐心等待真正的时机。\n\n就像甘霖降下之前，乌云还停留在天空中一样，现在即使觉得停滞和压抑，也需要保持信心，耐心等待局势成熟。\n\n如果因为焦虑而贸然开始新的事情，或者勉强进行高风险的尝试，反而容易给自己带来较大的损失。\n\n现在更重要的是冷静分析周围的环境，保持观察，同时先稳住自己的基础和日常生活。\n\n与他人进行交易、合作或谈判时，也不要急着做决定。\n\n需要留一点时间重新确认，对方真正的目的是否和表面上看到的一样。",
      "yao": [
        "现在就像刚刚进入等待阶段一样。\n\n如果因为焦虑而急着行动，很容易做出错误的选择，并因此产生损失。\n\n即使眼下觉得压抑或辛苦，也不要轻易改变方向。\n\n保持稳定的心态，耐心等待，正在推进的事情整体不会出现太大的问题。",
        "在等待的过程中，可能会出现一些小的流言、误会或不太顺心的事情。\n\n不过，只要自己的目标明确，内心也足够稳定，就没有必要因为周围几句闲话而动摇。\n\n继续安静地坚持下去，局势最终会逐渐朝对自己有利的方向发展。",
        "即使处在困难的环境中，现在仍然是在一步一步向前推进。\n\n如果因为疲惫或烦闷而突然放弃，或者急着改变原来的路线，反而可能引发更大的风险和损失。\n\n现在尤其需要避免冲动的决定。\n\n只要继续保持稳定，就有机会穿过眼前的困难。",
        "可能会突然面对意料之外的艰难局面，甚至觉得自己已经很难继续忍耐下去。\n\n这时候最重要的是不要失去平静。\n\n如果能够继续守住日常的节奏和原本的生活规律，不因为压力而轻易动摇，就有机会平稳地度过这次危机。",
        "眼前可能出现一个看起来非常华丽、条件也十分优越的位置或提议。\n\n但在漂亮的表面之下，也可能隐藏着嫉妒、挑拨或不利的算计。\n\n因此，不要只看外在条件，需要冷静判断整个局势。\n\n只要守住自己的中心，不被表面的诱惑轻易影响，最终仍然能够取得好的成果。",
        "漫长的等待终于开始走向结束。\n\n在这个过程中，自己也会逐渐整理掉过去不切实际的欲望和执念，并获得内在的成长。\n\n即使最后阶段出现意料之外的重要变数或问题，也不要因此慌乱行动。\n\n只要谨慎判断并妥善处理，最终事情仍然有机会朝对自己有利的方向收尾。"
      ]
    },
    "1_2": {
      "key": "1_2",
      "name": "比",
      "gua": "比起一个人行动，现在与他人组成团队会更加有利。\n\n就像与志同道合的人一起完成共同目标一样，只要与身边值得信任的人互相帮助、保持紧密合作，就有机会取得很好的成果，也容易带来明显的经济收益。\n\n竞争越激烈，越不能因为自信过度而独断行动。\n\n主动寻找真正能够帮助自己的优秀伙伴，并与他们一起前进，是现在突破局面的最好方式。\n\n不过，也不要只是盲目服从组织规则或多数人的意见。\n\n如果完全跟随外界，很容易逐渐失去自己的特点和灵活性，变得过于被动。\n\n合作很重要，但同时也要保留自己的判断。",
      "yao": [
        "目前自己的力量和实际权限还不够充分。\n\n如果太早争取主导权，或者过于强硬地坚持自己的意见，可能会遇到意想不到的风险和损失。\n\n现在更适合先跟随值得信任的领导者，或者顺着可靠团队的方向稳步前进。",
        "不要只是表面上勉强配合，而要真正以诚意与周围的人合作。\n\n现在不适合急着强调自己的功劳，也不要过早争取位置和头衔。\n\n先安静地提升自己的实力。\n\n等到能力自然得到认可，并真正有人主动邀请自己承担更重要的角色时再行动，会更加有利。",
        "目前身边的人，并不一定是真正值得信任和跟随的领导者或伙伴。\n\n如果看错了人，又因为盲目信任而跟随对方，很可能陷入较大的困难，甚至让过去辛苦积累的成果受到影响。\n\n现在尤其需要谨慎选择合作对象。\n\n不要因为一时的好感或信任，就放弃自己的判断。",
        "现在容易受到周围不必要的误解或怀疑。\n\n即使觉得委屈，也不要急着在表面上强烈反抗。\n\n与其不断解释自己，不如通过实际行动表现出自己的信任、诚意和合作意愿。\n\n只要能够耐心度过这个阶段，就有机会避免被边缘化，并逐渐走向更重要的位置。",
        "现在需要准确判断局势，并以成熟的方式带领整个团队。\n\n如果过度控制身边的人，什么事情都要求按照自己的方式进行，反而容易引发反感，让事情变得更加困难。\n\n适当给予每个人一些自主空间和喘息的余地，会让整个团队运作得更加顺畅。\n\n有时候，稍微放松一点，反而更容易让人愿意主动合作。",
        "现在需要彻底放下不必要的自尊和固执。\n\n如果始终坚持只有自己才是正确的，不愿意听取任何人的意见，最终很可能被周围的人彻底排斥。\n\n严重时，可能导致职场上的位置受到影响，或者重要的人际关系断裂。\n\n现在最不适合继续强硬坚持自己的立场。\n\n如果想推进新的事情，也很难得到好的结果。"
      ]
    },
    "1_3": {
      "key": "1_3",
      "name": "屯",
      "gua": "现在就像被困在风雨之中，外面的环境并不适合贸然行动。\n\n无论想开始什么，都容易遇到阻碍，事情也可能反复纠缠，让人感到压抑和停滞。\n\n如果试图强行突破，反而容易让损失不断扩大。\n\n现在更需要客观看清现实，先稳固自己的基础，并采取相对保守、防御的方式应对。\n\n不要试图一个人解决所有问题。找到能够真正帮助并引导自己的优秀伙伴或协助者，是这个时期非常重要的关键。\n\n即使眼下看不到明显成果，也会觉得辛苦，只要不失去希望，继续耐心坚持，之后仍有机会把不利的局面转化为更加稳固的成果。\n\n如果有人向自己寻求合理的帮助，也可以在能力范围内真诚伸出手，这份善意之后很可能会以更大的帮助回到自己身上。",
      "yao": [
        "现在还不是适合积极向前推进的时候。\n\n即使勉强前进，也容易不断原地打转，只会消耗自己的体力、时间和资金。\n\n不要过度执着于眼前马上出现成果。\n\n先采取相对保守的方式守住现状，同时充实实力、整理基础，这些准备会成为之后行动的重要支撑。",
        "目前容易陷入进也不是、退也不是的尴尬状态。\n\n虽然让人感到十分压抑，但现在不需要因此急着做出决定。\n\n如果愿意再耐心等待一段时间，有机会遇到真正适合自己的贵人、伙伴或协助者。\n\n借助这样的合作关系，过去长期困扰自己的问题也可能逐渐得到解决。",
        "现在可能处于几乎没有人能够真正帮助自己的孤立状态。\n\n这种时候，最明智的做法就是停止过度追求，也不要勉强把事情继续拖着往前走。\n\n既缺乏足够的条件，也没有能够正确引导自己的人，如果仍然强行推进，只会增加困难和损失。\n\n先停下来，重新寻找方向和支持会更加安全。",
        "即使目前无法完全按照自己的想法主导局面，也不要因此过度犹豫或彻底放弃。\n\n外部可能已经有理念相近、愿意与自己合作的好伙伴在等待机会。\n\n放下一些没有必要的固执，主动与这些人建立合作关系。\n\n只要愿意借助彼此的力量，原本停滞的事情就有机会逐渐顺畅起来，并取得不错的成果。",
        "现在需要客观认识自己的能力和现实中的限制。\n\n还不是急着掌握主导权，或者强烈表现自己存在感的时候。\n\n如果追逐超出自身能力的目标，或者进行过度投资，很容易造成较大的经济损失。\n\n按照自己目前真正能够承担的范围谨慎行动，会更加稳妥。",
        "如果只盯着眼前的一点利益或成果，急着采取行动，很容易遭受令人后悔的损失。\n\n即使已经忍耐了很长时间，现在也未必能够马上得到期待中的结果。\n\n不要因为“已经等了这么久”就强迫自己一定要行动。\n\n停止不必要的冒险，先守住目前的位置、成果和评价，才是现在最安全的选择。"
      ]
    },
    "1_8": {
      "key": "1_8",
      "name": "蹇",
      "gua": "这是一个需要暂时停下来，寻找真正能够帮助自己的人的时期。\n\n刚刚以为可以松一口气，却又再次遇到新的阻碍。眼前容易不断出现各种问题，让事情迟迟无法顺利推进。\n\n如果为了突破困境而贸然冒险，或者在判断不充分的情况下急着投资，反而可能带来更大的经济损失。\n\n现在不需要一个人苦撑。\n\n主动寻找能够真正引导自己的专业人士、经验丰富的前辈或可靠伙伴，并寻求合作，是把危机转化为机会的重要关键。\n\n同时，也要认真检查资金流动和内部管理，以更加保守、防御的方式稳住自己的基础。\n\n对于缺乏实际价值、只会消耗精力的人际关系，也可以适当整理和减少。",
      "yao": [
        "这是第一次真正撞上阻碍，开始感到前路困难的阶段。\n\n现在不要勉强推进事情。\n\n先停下来，冷静检查自己的计划、资源和现实条件，会更加有利。\n\n刚开始可能会觉得十分压抑，但只要能够耐心准备，之后仍然有机会比较平稳地完成想做的事情。",
        "可能因为并非由自己造成的问题，而无辜卷入麻烦或承担责任。\n\n即使觉得委屈，现在也不适合急着证明自己，或者拼命想马上把真相说清楚。\n\n有时候先安静忍耐，让局势自然过去，会比强行解释更安全。\n\n想做的事情目前会遇到一些困难，需要保持耐心。",
        "如果只是为了逃避眼前令人头疼的问题而离开，情况反而可能进一步恶化，并遇到更大的困难。\n\n现在不适合逃避。\n\n重新回到自己原本应该处理的位置，并主动寻求周围人的合作和帮助，会更加有利。\n\n虽然开始时依然会觉得困难，但只要愿意一起解决问题，最终反而有机会得到非常好的成果。",
        "仅靠自己的能力或资金，很难独立解决目前的局面。\n\n因此不要固执地一个人决定，也不要贸然扩大事情。\n\n放下不必要的自尊，主动向周围值得信任的人或专业人士寻求帮助。\n\n一旦找到正确的合作方式，原本堵塞的事情就会逐渐变得顺畅。",
        "这是一个靠自己一个人的力量很难解决问题，因此容易感到十分无力的阶段。\n\n不过，幸运的是，身边会出现能够理解自己困境的好同事、伙伴或协助者，并主动伸出援手。\n\n不要拒绝这些真诚的帮助。\n\n借助周围可靠的支持，就有机会安全度过危机，并得到不错的结果。",
        "漫长的考验和困难终于开始看到尽头。\n\n不过，不要因为觉得一切快结束了，就马上放松警惕。\n\n继续保持到目前为止的谨慎和稳定，直到真正走出困境。\n\n这个阶段也有机会遇到能够让自己更进一步的重要人物。\n\n借助这样的缘分，过去一直堵塞的新道路会逐渐打开。"
      ]
    },
    "1_1": {
      "key": "1_1",
      "name": "坎",
      "gua": "这是一个危机不断出现，需要靠稳定的内心坚持下去的时期。\n\n就像前方一层又一层都是深而危险的水坑，整体环境十分艰难。\n\n如果因为陷入危机而慌乱，拼命挣扎，反而可能让自己陷得更深。\n\n现在最重要的是守住自己的中心，保持冷静，并学会顺着复杂的局势灵活应对。\n\n不要因为与别人争执而让自己卷入口舌是非，安静守好自己的位置更加重要。\n\n尤其是在文件、合同和交易方面，需要像过桥前反复确认一样仔细检查。\n\n也不要轻易为他人提供担保，否则容易造成较大的经济损失。\n\n放下情绪上的执着，稳稳整理自己的生活和基础，才有机会安全度过危机。\n\n这种时候，把精力放在学习、研究或能够让自己内在成长的事情上，也会非常有帮助。",
      "yao": [
        "现在容易出现一波未平、一波又起的情况，事情不断纠缠。\n\n自己的真心、委屈或解释，也很难真正被别人理解。\n\n如果因为压抑而急着证明真相，或者不断解释自己，反而可能产生相反的效果。\n\n现在最好的做法是不要贸然行动，先安静下来守住自己的位置。",
        "目前就像身处危机之中，迫切希望得到任何形式的帮助。\n\n虽然过程很辛苦，但只要不轻易放弃，并且始终守住自己的中心，就有机会找到真正的解决办法。\n\n现在不要期待一下子得到很大的利益或成果。\n\n哪怕只是很小的进展或帮助，也值得珍惜和接受。",
        "现在几乎是向前有陷阱、向后也有陷阱的两难局面。\n\n如果勉强想从困境中挣脱，只会不断消耗体力、时间和资金。\n\n也不要因为周围的气氛、煽动或群体情绪，就轻率地跟随大家一起行动。\n\n目前最好暂停所有重要计划，不要继续强行推进。",
        "现在已经进入仅靠自己的能力很难解决的局面。\n\n继续独自硬撑并不会带来真正的突破。\n\n放下不必要的自尊，尽量减少支出，同时主动寻找比自己更有经验、更有能力的导师或专业人士。\n\n愿意接受正确的建议和实际帮助，才有机会比较安全地度过这次危机。",
        "现在需要放下自己的固执和狭窄视角，与周围的人合作，一起解决已经纠缠很久的问题。\n\n漫长而辛苦的阶段终于开始看到出口。\n\n只要再多一点谦逊，多一点合作，并继续保持耐心，原本想实现的目标就会逐渐变得清晰，也更容易顺利完成。",
        "这是一个容易失去原则、失去自我，也感觉身边没有任何可以依靠之人的严重孤立阶段。\n\n如果此时还想强行扭转局面，采取过度激烈的行动，只会让损失和痛苦进一步扩大。\n\n现在不要再勉强推动任何事情。\n\n尽可能减少行动，守住目前的位置和最基本的安全边界，才是最重要的选择。"
      ]
    },
    "1_4": {
      "key": "1_4",
      "name": "井",
      "gua": "现在需要耐心等待属于自己的时机，同时不断磨炼真正能够成为自己优势的实力。\n\n就像在深山中寻找清澈的泉水一样，这是一个需要长期坚持和耐心积累的时期。\n\n与其贸然开始新的事业或计划，不如先把注意力放在目前正在做的事情上，稳定维持现有基础，这样更有利于减少损失。\n\n尤其不要在最后阶段因为焦急而出现失误。就像好不容易煮好的饭里掉进灰尘一样，如果最后一刻处理得不够谨慎，之前积累的努力也可能受到影响。\n\n不要为了眼前一点小利益与别人发生争执。\n\n同时减少不必要的奢侈和浪费，并认真维护与周围人的合作关系，会让整体发展更加稳定。",
      "yao": [
        "如果一直被过去的方法或陈旧的思维方式束缚，就很难真正取得成果。\n\n现在需要根据现实情况，重新调整工作方式和思考模式。\n\n有些地方甚至需要彻底改变原来的做法。\n\n如果仍然固执地沿用过去的方式，想做的事情很难得到理想的结果。",
        "现在容易出现方法和目标彼此不匹配的情况，导致已经投入的努力在过程中不断流失。\n\n如果为了快速取得成果而使用捷径，或者采取过度冒险的方法，反而可能遭受更大的损失。\n\n需要重新确认目的与手段是否一致，并按照原则和现实条件处理事情。",
        "即使机会已经来到眼前，也可能因为准备不足，或者错过了适合行动的时机，而无法真正把握住。\n\n这种情况会让人感到非常可惜和压抑。\n\n现在不要继续拖延。\n\n把注意力集中在真正应该完成的事情上，安静地充实自己的实力，才能避免错失下一次机会。",
        "现在更适合支持实际负责人或上位者，帮助整个团队把基础建立得更加稳固。\n\n放下个人的欲望和私心，认真协助处理细节和实际工作。\n\n只要能够把内部基础整理好，整个组织就会逐渐稳定下来，自己也会因此得到明确的成果和回报。",
        "长期以来不断投入心力的事情终于成熟，开始迎来明确成果和实际利益。\n\n这是一个非常好的阶段。\n\n不过，不要试图一个人独占所有利益和功劳。\n\n适当地与周围的人分享成果，能够让这份好的发展持续得更久，也会带来更加稳定的信任关系。",
        "事情能够顺利完成，并得到一个很好的收尾。\n\n就像井水不应该被盖住而无法让人使用一样，已经获得的利益、经验和方法，也不必全部只留给自己。\n\n愿意与周围的人分享，并通过这种方式建立长期信任，整体状态就会继续保持平稳而顺利。"
      ]
    },
    "1_9": {
      "key": "1_9",
      "name": "既济",
      "gua": "事情已经顺利完成，现在更重要的是守住成果，专注于稳定和防守。\n\n一段激烈的成长过程已经成功告一段落，目前已经取得了不少成果，周围环境也相对稳定，是一个容易感到满足的时期。\n\n不过，就像花开之后终会凋谢一样，快速成长之后，也可能逐渐进入下降和调整阶段。\n\n现在最重要的不是因为顺利而自满，也不是继续扩大事业或进行过度投资，而是认真做好内部管理，稳定维持目前的状态。\n\n在合作或共同经营的关系中，也比较容易出现意见冲突。\n\n不要只坚持自己的立场，在适当的时候做出让步，反而更有利于避免损失。",
      "yao": [
        "事情大多按照自己的期待发展，因此容易对自己充满信心。\n\n不过，如果因为顺利而产生自满，急着继续向前扩张，或者欲望变得过强，反而可能让已经完成得不错的事情出现瑕疵。\n\n现在需要控制住继续往前冲的冲动。\n\n安静守住目前的位置和成果，想做的事情就不容易出现明显损失。",
        "即使暂时失去了重要的机会、物品或某些资源，也不需要因此过度慌张。\n\n随着时间过去，很多东西有机会自然回到原来的位置，或者以其他方式得到恢复。\n\n现在需要的是耐心，而不是因为焦虑而四处行动。\n\n只要保持冷静，等待合适的时机，事情仍然能够比较顺利地解决。",
        "整体的繁荣阶段已经逐渐接近尾声。\n\n如果现在开始新的事情，过程可能比预想中困难得多，也需要更长的时间才能看到成果。\n\n同时，周围也容易出现带着私心、并不真正可靠的人。\n\n不要被外界的气氛和诱惑轻易影响。\n\n只有安静坚持，并保持清醒，才有机会最终实现目标。",
        "现在是一个非常需要谨慎的阶段。\n\n一个看起来不起眼的小错误，也可能迅速扩大，最终造成严重的损失和混乱。\n\n就像把钱放进一个已经破洞的袋子里一样，如果没有及时发现，损失会不断累积。\n\n因此现在不能放松警惕。\n\n仔细检查细节，及时修补问题，才能避免更大的伤害。",
        "虽然已经具备足够的能力和资格，但周围的局势比较混乱，因此暂时很难充分发挥自己的实力。\n\n不要因为眼下没有明显成果就失去信心。\n\n现在更适合为接下来可能出现的变化提前做准备，并继续充实自己的基础。\n\n只要坚持下去，最终会得到与自身实力相匹配的明确回报。",
        "原本有利的时期已经过去，整体逐渐进入衰退和混乱的阶段。\n\n现在容易陷入进也不是、退也不是的尴尬状态。\n\n如果这个时候还因为欲望而强行越过自己的能力和界限，就可能遭受较大的打击。\n\n现在不要再贸然行动。\n\n先停止不必要的扩张，把注意力集中在整理和稳定当前局面上，才是最重要的。"
      ]
    },
    "1_7": {
      "key": "1_7",
      "name": "节",
      "gua": "这是一个需要守住自己的中心，并清楚知道界限在哪里的时期。\n\n只要不过界、不失去分寸，整体就不会出现太大的问题。\n\n现在尤其需要控制过度的欲望和支出，把适度的自我节制变成稳定的生活习惯。\n\n与其贸然扩大事业，或者进行风险较大的投资，不如把精力放在规模较小、但实际而稳妥的事情上，这样反而更容易得到稳定的成果。\n\n不过，节制也不能走到让自己喘不过气的程度。\n\n如果过度压抑、过分限制自己，反而容易产生新的问题，因此需要保持灵活而适当的平衡。\n\n与别人进行交易、合作或谈判时，也不要只坚持自己的利益。\n\n适当考虑对方的立场，事情会更加顺利。\n\n即使表面上看起来比较富足，现在也应该减少不必要的浪费，适当储蓄，并把稳定的基础建立起来。",
      "yao": [
        "目前对整体情况的理解和基本能力还不够充分。\n\n与其急着站到前面，或者贸然开始新的事情，不如先稳固自己的基础。\n\n认真了解所在组织的规则、文化和整体氛围，会帮助自己减少许多不必要的损失。",
        "现在需要准确判断什么时候应该行动，什么时候应该保持安静。\n\n而目前正是应该主动抓住机会、走出去行动的时机。\n\n如果因为害怕变化而一直待在熟悉的地方，反而可能错过真正重要的机会。\n\n之后回头来看，也容易因此产生损失和后悔。",
        "不要随意炫耀自己拥有的东西，也不要为了面子过度包装自己。\n\n眼前的一点成果或财富，并不一定能够长久维持。\n\n如果无法控制支出，也不懂得根据自己的实际条件保持节制，最终容易面临经济压力和更大的心理负担。\n\n现在尤其需要管理好欲望和消费。",
        "能够清楚认识自己的位置和能力，并根据实际情况正确行动，是非常稳定的状态。\n\n对周围的人保持礼貌，也把节俭和适度的生活方式变成习惯。\n\n因为能够顺着合理的节奏行动，很多事情不会遇到明显的阻碍，整体会比较顺利。",
        "能够守住自己的中心，同时真正实践适度的节制，因此容易得到不错的成果。\n\n现在不会只坚持自己狭窄的立场，而是能够从团队或整体的角度灵活协调事情。\n\n这种成熟的态度会带来周围人的信任。\n\n想推进的事情也更容易朝有利的方向发展。",
        "现实上明明需要减少支出、控制欲望，却容易因为觉得太压抑而产生强烈的反弹。\n\n一旦忍耐到了极限，就可能突然出现过度消费或冲动行动。\n\n现在需要特别注意这种“压得太紧之后突然失控”的状态。\n\n如果能够及时意识到问题，重新找回理性和适当的平衡，就有机会避免最严重的损失。"
      ]
    },
    "4_6": {
      "key": "4_6",
      "name": "小畜",
      "gua": "看起来似乎马上就要有所突破，但现在仍然需要继续等待。\n\n就像乌云密布，仿佛随时都会下雨，却还没有真正到时候一样。\n\n虽然心里可能很着急，对未来的期待也很高，但现在与其贸然扩张事业或开始新的事情，不如先专注于正在进行的工作，一点一点积累实际成果。\n\n只要安静充实自身，财运也会随着基础逐渐稳固而自然改善。\n\n与他人进行谈判、交易或签订合同时，进度可能比预想中更慢。\n\n不要因为迟迟没有回应就感到焦躁，保持冷静，耐心等待对方的消息会更有利。\n\n只要继续维持积极而灵活的态度，原本停滞的事情会慢慢开始松动。\n\n感情方面也是如此，不需要急着追求结果，耐心等待，机会自然会出现。",
      "yao": [
        "刚开始时，容易受到外界诱惑的影响，一时冲动，甚至暂时失去原本的方向。\n\n不过，很快就能够重新恢复理性，回到自己原来的位置和原则上。\n\n只要继续安静做好自己该做的事情，正在推进的计划就能够在没有明显损失的情况下平稳发展。",
        "现在还不是适合积极出头或扩大局面的时机。\n\n即使周围出现听起来非常诱人的机会或提议，也不要轻易被吸引。\n\n守住自己的位置，保持稳定，安静等待真正成熟的时机，才是减少损失并为之后争取有利位置的最好方式。",
        "现在容易与身边的人或同事发生意见冲突，彼此之间甚至可能因此疏远。\n\n如果只坚持自己的想法，不顾界限地强行推进事情，局面只会越来越糟。\n\n原本想进行的计划，也可能因此彻底停下来。\n\n现在更需要控制自己的固执，并重新调整沟通方式。",
        "周围的情况比较危险，也是一个需要格外谨慎的阶段。\n\n不要放松警惕。\n\n与其为了自尊而表现得过于强硬，不如保持柔和、谦逊的态度，根据实际情况灵活应对。\n\n这样做能够帮助自己安全度过危机，也更容易守住现有的利益和位置。",
        "不再试图一个人独占所有利益，而是愿意与周围的人一起分享成果，因此容易形成很好的合作氛围。\n\n建立在稳定基础上的能力，也开始得到真正的发挥和认可。\n\n想实现的目标有机会顺利完成，正在做的事情也容易获得好的评价和明确的回报。",
        "等待已久的雨终于落下，过去长期堵塞、令人压抑的局面开始真正得到解决。\n\n在这个过程中，可能会有一些支出或暂时失去某些东西，但不需要过度担心。\n\n真正需要注意的是，目标已经实现之后，不要因为还沉浸在上升的势头里而继续过度向前。\n\n懂得适时停下来，不过度越界，才能避免之后出现令人后悔的损失。"
      ]
    },
    "4_2": {
      "key": "4_2",
      "name": "观",
      "gua": "未雨绸缪。现在需要先观察整体趋势，再做好充分准备。\n\n就像开始一件事情之前必须先做好准备一样，目前更需要仔细观察周围环境的变化，以及人们的想法、整体氛围和趋势。\n\n自己的判断暂时可能还不够清晰，因此不要急着扩大事业，也不适合进行过度投资。\n\n应该保持更宽广的视野，尽量收集客观的信息和数据，再谨慎判断局势。\n\n如果忽视别人的意见，只按照自己的想法固执行动，很容易逐渐失去周围人的信任。\n\n与其贪图眼前的一点利益，不如主动争取周围人的合作，并保持冷静判断，这才是避免严重损失最有效的方法。\n\n如果把精力投入到学术、宗教、文化等能够充实内在的学习中，则容易得到不错的成果。",
      "yao": [
        "目前看事情的视野还比较有限，对整体局势的判断也不够成熟。\n\n如果急着强调自己的意见，并因此与别人发生争执，反而容易让自己陷入困难。\n\n现在并不是适合贸然展开大计划的时期。\n\n保持谦逊，先观察局势并认真学习，才能减少不必要的损失。",
        "现在容易像井底之蛙一样，只看到很小的一部分情况。\n\n如果只根据眼前零散的信息就急着下结论，很可能错过事情真正的核心。\n\n需要主动走出狭窄的视角，培养更宽广、更客观的判断能力。",
        "在观察外部情况之前，首先需要冷静而客观地看清自己的能力和现实位置。\n\n如果因为轻率行动而让周围的人产生反感，甚至可能在组织中逐渐被排斥。\n\n现在需要认真检视自己，并根据实际情况判断究竟应该继续前进，还是暂时退一步。\n\n只要判断得当，就能够避免大的失误。",
        "现在可能会在组织中承担一个需要同时理解上下双方立场、进行协调的重要角色。\n\n如果能够理解基层或下属的困难，同时也与上位者保持良好沟通，就有机会推动整个团队向更好的方向发展。\n\n自己也会因此获得明显的成果和认可。\n\n想做的事情整体上会朝非常有利的方向推进。",
        "如果目前已经处在拥有一定决定权的位置，就需要认真回顾自己过去推动事情的方向和方法。\n\n如果过度沉浸在自己的想法中，做出独断的决定，不仅自己，连身边的人都可能受到影响。\n\n最好让真正有能力的人留在身边，并认真听取他们的意见。\n\n只要愿意接受客观建议，整体就能够比较平稳地度过。",
        "如果过去一直是自己在观察周围，那么现在开始，周围的人和所在的组织也会反过来认真观察、评估和检验自己的能力与态度。\n\n因此不能放松警惕。\n\n可以把别人的成功当作参考，也把别人的失败当作提醒。\n\n通过这些经验，更严格、更谨慎地检查自己的行为和选择，会让自己走得更加稳妥。"
      ]
    },
    "4_3": {
      "key": "4_3",
      "name": "益",
      "gua": "这是一个需要以周密计划为基础，大胆行动，并与周围的人分享利益的时期。\n\n与其继续等待，现在更适合在充分准备之后积极向前推进。\n\n即使过程中会遇到风险和困难，只要不逃避，愿意正面解决问题，就有机会取得超出预期的成果，也可能获得不错的经济收益。\n\n不过，盲目冲动和轻率行动都不可取。\n\n如果发现计划中存在错误，就应该及时果断调整，也要主动听取值得信任的合作伙伴和专业人士的意见。\n\n就像上位者愿意帮助下位者一样，如果能够照顾周围的人，并把个人利益与整体利益结合起来，最终得到的成果反而会更加丰厚。",
      "yao": [
        "现在适合在做好本分的基础上，推动比平时规模更大的目标或工作。\n\n如果已经有明确的计划，就不必过度犹豫。\n\n只要准备充分并积极行动，事情容易顺畅推进，也有机会取得很好的成果。",
        "不要为了眼前的一点利益而使用捷径或不正当的方法。\n\n现在尤其需要坚持原则，沿着正确而稳妥的道路前进。\n\n如果选择错误的方式，反而可能造成较大的损失。\n\n推进事情时，把团队成员之间的协调与合作放在重要位置，会更加有利。",
        "如果能够照顾周围人的立场，并以公平的方式处理工作，自己反而容易得到更多实际利益。\n\n不要因为一时的私心做出让别人产生怨言的行为。\n\n真诚地帮助他人，并保持良好的合作关系，事情整体就能够比较顺利地推进。",
        "当身处困难的人或曾经帮助过自己的伙伴主动寻求支持时，不要只计算眼前的得失。\n\n如果能力允许，可以给予真诚而充分的帮助。\n\n保持客观，不偏向任何一方，并通过实际行动建立信任，会让自己想做的事情逐渐朝更加有利的方向发展。",
        "现在需要以坚定的原则和信念为基础，愿意帮助周围的人，也愿意分享已经取得的成果。\n\n如果不被个人欲望轻易动摇，而是以正直的态度带领整个团队，就更容易得到广泛的认可和信任。\n\n正在推进的事情也有机会取得很大的成功。",
        "即使已经获得了足够的利益，如果仍然越过界限，不断追求更多，反而容易因此招来麻烦。\n\n如果继续偏离正确的原则，盲目扩大规模，最终可能陷入四面受阻的局面，甚至损害过去辛苦建立起来的评价和信任。\n\n现在需要及时放下固执，懂得在适当的位置停下来。\n\n只有及时收住欲望，才能避免之后更加严重的损失。"
      ]
    },
    "4_8": {
      "key": "4_8",
      "name": "渐",
      "gua": "千里之行，始于足下。现在适合顺着整体节奏，一步一步稳稳向前。\n\n这是一个放下焦躁，通过持续积累小成果，逐渐实现更大目标的时期。\n\n即使眼前出现很大的利益，也不要期待侥幸，更不要因为心急就贸然扑上去，否则反而容易把原本不错的局面弄乱。\n\n现在需要按照合理的顺序和必要的程序前进，不走捷径，一点一点突破自己的限制。\n\n过去纠缠复杂的问题，也不必急着一次全部解决。\n\n给事情一些时间，很多问题反而会自然松动，因此不要只盯着最终结果而过于焦急。\n\n换工作、签订合同、结婚，或者进入新的环境与关系等事情，也比较容易得到周围人的支持，并顺利推进。",
      "yao": [
        "原本纠缠的问题开始逐渐出现松动，这是刚刚进入改善阶段的时候。\n\n现在才刚迈出第一步，如果因为觉得情况变好了就放松警惕，事情仍然可能再次变得复杂。\n\n即使眼前暂时出现一些被忽视的感觉，或者需要承担一点不利，也不要因此急着改变方向。\n\n保持耐心，谨慎地一步一步向前，就能够平稳度过这个阶段。",
        "正在推进的事情逐渐进入稳定轨道，也开始得到比较扎实的成果。\n\n现在有机会与周围的人一起分享比较充足、令人满意的成果，是一个不错的时期。\n\n不过，即使表面上一切都很顺利，也不要因此安于现状或产生自满。\n\n在别人看不到的地方继续认真准备、充实基础，才能为下一阶段更大的发展做好准备。",
        "这是一个非常需要谨慎的阶段，很容易因为判断失误而走向错误的方向。\n\n如果没有冷静观察前后的整体情况，只是一味坚持自己的想法，就可能逐渐陷入更深的困境。\n\n如果不能谨慎度过这个转折点，很多事情都会因此偏离原来的轨道，并造成较大的损失。\n\n现在需要重新全面检查自己的计划和方向。",
        "目前可能处在一个陌生而不够稳定的环境里，不过在周围人的帮助下，已经勉强建立起可以立足的基础。\n\n现在不适合急着展开新的事情。\n\n先守住好不容易得到的位置，并积累更多力量会更加有利。\n\n与周围的人相处时，也要保持谦逊和灵活，才能减少之后不必要的问题。",
        "目标已经非常接近，是一个决定性的最后阶段。\n\n过程中可能因为外部干扰或暂时的误解而有所延迟。\n\n不过，只要再多一点耐心，并且继续专注到最后，就有机会真正实现自己一直想要的目标。\n\n越是觉得“已经快到了”，越不要因此急躁。\n\n最后阶段尤其需要谨慎。",
        "终于实现了期待已久的目标，并进入能够进一步飞跃的非常好的时期。\n\n因为过去没有依靠捷径，而是按照合理的过程一步一步坚持下来，所以不仅容易取得优秀的成果，也会得到良好的评价和名声。\n\n即使已经成功，也不要忘记最初的态度。\n\n继续保持正直和稳定，这份好的发展就有机会持续下去。"
      ]
    },
    "4_1": {
      "key": "4_1",
      "name": "涣",
      "gua": "漫长的停滞期终于结束，现在正适合开始新的跨越。\n\n就像漫长的冬天过去、春天重新到来一样，长期停滞的局面开始逐渐松动，是一个很适合启动新计划、扩大行动范围的时期。\n\n过去长期纠缠的问题，或者经营上的亏损与困难，也容易像冰雪融化一样慢慢得到解决。\n\n现在与其只盯着眼前的小利益，不如把目光放得更远。\n\n相比继续沿用陈旧的方法，新的项目、更大的目标以及果断的行动，会更加有利。\n\n不过，资金流动仍然需要认真管理。\n\n新的客户、合作对象以及合同关系，也应该仔细确认，才能避免不必要的争议和经济损失。",
      "yao": [
        "即使突然出现问题或冲突，只要保持冷静，就有机会顺利度过。\n\n尤其是长期积累的人际矛盾或工作上的摩擦，不要因为焦急而试图一次解决。\n\n耐心沟通，并持续真诚地说服对方，反而更容易让问题逐渐化解。",
        "目前并没有特别严重的实际困难，但在人际关系中可能会感到有些疏离，甚至产生孤独感。\n\n现在不适合因此贸然独立，或者一个人强行承担所有事情。\n\n先依靠相对稳定的环境，或者值得信任的帮助者，同时继续充实自己的基础，会更加有利。",
        "现在容易被巨大的变化卷入其中，仅靠自己一个人的力量，很难完全控制整个局面。\n\n不要因为自尊或固执而坚持独自解决所有问题。\n\n主动寻找理念相近的同事、伙伴或合作对象，一起面对变化，就能够比较平稳地度过这个阶段。",
        "可能突然遇到意想不到的大问题，或者组织整体出现危机，因此需要暂时退后一步。\n\n这并不意味着失败。\n\n只要能够快速判断情况，并及时转向更加安全、合理的方向，就有机会在没有明显损失的情况下顺利避开危机。",
        "剧烈的变化或困难可能让整个团队和周围的人都感到不安。\n\n这种时候，承担责任的人尤其不能先失去自己的中心。\n\n无论是作为领导者，还是作为需要做出决定的人，都应该坚持清晰的原则和稳定的态度。\n\n只要核心位置能够保持冷静，就有机会逐渐稳定周围的混乱，并找到解决办法。",
        "现在需要果断远离会给自己带来伤害、危险或持续冲突的环境。\n\n对于明显存在风险的位置、关系或局面，不要因为留恋而继续停留。\n\n及时整理并退出，反而能够避免真正的损失。\n\n只要能够迅速与危险因素拉开距离，就有机会重新恢复平静，并避开更严重的问题。"

    "4_4": {
      "key": "4_4",
      "name": "巽",
      "gua": "外在保持柔和与谦逊，内心却要有坚定的原则和主见。\n\n就像风能够渗入各个角落一样，现在灵活的沟通方式和谦逊的态度会发挥很大的作用。\n\n与其过度强调自己的意见，不如把与周围人的协调和合作放在更重要的位置，这样事情会更加顺利。\n\n特别是在流通、贸易、销售以及其他需要频繁与外界交流的领域，比较容易取得积极的成果。\n\n不过，自己的心也容易像风一样不断摇摆，变得犹豫不决。\n\n因此，需要警惕周围听起来很诱人的话，不要轻易被虚假的承诺或骗局影响判断。\n\n如果一个人很难做出决定，可以向值得信任的前辈、上位者或同事寻求建议。\n\n但比起盲目顺从，更重要的是先建立属于自己的明确目标和原则，这样才能避免之后出现严重损失。",

        "现在内心容易像芦苇一样摇摆，也很容易受到别人的话影响。\n\n如果因为周围的气氛而急着附和他人的意见，可能会被骗局或表面诱人的商业手段所误导，从而遭受较大的损失。\n\n现在需要果断地守住自己的中心。\n\n对于明显不适合自己的事情，要懂得明确拒绝，才能保护好自己的位置和利益。",

    "4_9": {

        "内部状态逐渐稳定，团队合作也能够发挥得非常好。\n\n如果能够放下个人欲望和私心，与周围的人真正配合，并且认真规划事情，整体运作就会像齿轮彼此咬合一样顺畅。\n\n想做的事情也容易因此取得很大的成果。",

    "4_7": {

      "gua": "这是一个需要放下私欲，以真诚的信任和踏实的态度面对一切的时期。\n\n就像母鸟耐心孵化鸟蛋一样，只要真正投入诚意，坚持到最后，就有机会实现自己的目标。\n\n如果能够放下个人欲望，以及“付出了就一定要得到回报”的心理，反而更容易与别人建立真正的信任，也更容易得到上位者或掌握决定权之人的认可。\n\n比起一个人单独行动，现在尤其适合共同事业、团队合作以及多人协作。\n\n无论是职场中的合同与谈判，还是学生的考试、论文等事情，都有机会得到比自己预期更好的结果。\n\n收入也可能明显增加，甚至出现意想不到的收益。\n\n不过，支出也容易随之增加，因此不要过度执着于金钱。\n\n懂得适当分享，并对周围的人保持慷慨，会让整体的发展更加稳定。",

        "现在开始进入应该真正向前推进的阶段。\n\n即使暂时没有明显的升职机会，也没有得到上位者直接而强有力的支持，只要在目前的位置上认真履行自己的责任，并继续稳步前进，就会逐渐得到认可。\n\n即使实际回报暂时不算特别丰厚，也容易积累不错的评价和信任。",

      "key": "9_3",
      "name": "噬嗑",
      "gua": "这是一个需要正面面对冲突和障碍，并把问题彻底处理清楚的时期。\n\n就像苦口的良药有时反而对身体更有帮助一样，组织内部长期积累的问题，或者已经无法继续回避的矛盾，现在需要真正面对并加以解决。\n\n不要因为局面尴尬，或者因为某些人与自己不合，就选择暂时掩盖问题。\n\n现在更适合按照公平、透明而合法的原则，正面突破眼前的障碍。\n\n这个过程中可能伴随比较激烈的摩擦、争论或不舒服的冲突。\n\n不过，只要真正把问题中的杂质清理掉，就像雨后的土地会变得更加坚实一样，内部关系和整体基础反而会更加稳固。\n\n不要被周围零碎的批评或流言轻易动摇。\n\n守住自己的中心，一步一步把问题处理清楚，才是最重要的。",
      "yao": [
        "事情刚开始就可能遇到比较棘手的情况。\n\n为了摆脱眼前这种压抑和停滞，可能需要接受一定程度的损失或代价。\n\n尤其不要重复过去已经犯过的错误，或者再次使用曾经证明无效的处理方式。\n\n在问题还处于早期阶段时，就应该果断发现并及时纠正，才能避免之后变得更加严重。",
        "现在需要客观承认自己的实际能力和权限还存在一定限制。\n\n不要因为自尊而逞强，也不需要刻意表现得比实际情况更有能力。\n\n适当放低姿态，根据自己真正能够承担的范围，现实地处理问题会更加有效。",
        "可能会遇到意料之外、比较难相处的人，或者非常棘手的障碍。\n\n整个处理过程容易让人感到压抑和辛苦。\n\n不过，这个问题本身还不至于发展成无法挽回的失败。\n\n只要不轻易放弃，坚持沟通、协调，并耐心把问题一点一点消化掉，最终仍然能够顺利度过。",
        "现在需要处理一个超出自己平时能力范围、相当难以应对的问题，或者面对一个非常难处理的人。\n\n不要急着试图一次控制整个局面。\n\n按照原则持续应对，同时给事情足够的时间。\n\n只要自己不轻易失去方向，对方或局势也会逐渐出现变化，最终更有机会朝对自己有利的方向发展。",
        "可能突然面对一个意料之外的危机，或者看起来很难解决的顽固问题。\n\n如果想一次性改变对方，或者强行立刻解决所有问题，反而容易让自己变得更加疲惫。\n\n现在更重要的是守住自己的位置。\n\n按照必要的规定和原则处理事情，把自己应该做的部分认真完成。\n\n只要持续稳定地应对，局面就不会轻易失控。",
        "这是一个沟通几乎无法成立，或者遇到很难继续挽救的问题的危险阶段。\n\n如果自己勉强想要改变对方，或者不断介入、指导，反而可能让自己受到更大的伤害。\n\n对于明显危险、有害，或者完全无法正常沟通的人和环境，需要保持清楚的距离。\n\n现在最重要的不是说服对方，而是先保护自己，避免继续被卷入其中。"
      ]
    },
    "9_8": {
      "key": "9_8",
      "name": "旅",
      "gua": "这是一个变化很多，但更需要优先稳定生活和自身基础的时期。\n\n就像没有固定居所、不断移动的旅人一样，周围环境容易发生变化，也可能频繁出现换工作、部门调动、搬家等情况。\n\n与其急着开始新的事情，或者勉强扩大事业，不如先明确自己的目标，谨慎整理基础，让生活逐渐稳定下来。\n\n即使会有一些零碎收入，也容易同时出现较大的支出，因此需要减少浪费，认真管理资金。\n\n不过，正因为整体流动性很强，在销售、宣传、文化等需要快速应对外部变化的领域，反而可能通过灵活行动取得不错的成果。\n\n身处陌生环境时，不要急着表现自己。\n\n先观察周围的情况和氛围，并根据现实灵活调整自己的行为，会更加有利。",
      "yao": [
        "因为不必要的怀疑和不安，容易冲动地想要离开目前的位置或工作环境。\n\n如果没有充分准备就贸然走向陌生的道路，反而可能遭受明显的损失和辛苦。\n\n现在外部环境并没有想象中那么容易。\n\n先稳住自己的情绪，守好目前的位置，会是更加安全的选择。",
        "这是一个能够在陌生环境或新的组织中逐渐找到属于自己的位置，并获得实际回报和稳定感的好时期。\n\n只要不依靠小聪明，坚持正确的方法，并认真完成自己的职责，事情就会比较顺利地发展。\n\n之后回头来看，也不会后悔自己的选择。",
        "在竞争激烈的环境中，如果过度强调自己的意见，并以强硬的态度处理事情，容易同时失去重要的合作伙伴和原本可以依靠的安稳环境。\n\n如果继续独断行动，也可能逐渐在组织中被孤立，并陷入更大的危机。\n\n现在需要收敛过度强硬的态度，重新学习与周围的人协调。",
        "眼前最紧急的问题已经暂时得到解决，也可能获得了一定程度的安定和回报。\n\n不过，从长远来看，目前的方式还不一定是真正正确的方向，也没有完全解决根本问题。\n\n即使外部局面暂时平静下来，内心的不安和不满足仍然可能继续存在。\n\n现在还需要重新思考更长期、更根本的方向。",
        "自己的能力和成果容易在短时间内得到明显认可，也有机会同时获得良好的评价和实际的经济回报。\n\n这是一个非常不错的时期。\n\n即使身处陌生环境，只要能够准确把握时机，并充分发挥自己的优势，就有机会顺利实现想要的目标。",
        "一开始可能因为情况顺利而产生自满，但之后容易因为判断失误而遭受较大的挫折，并产生后悔。\n\n如果在并不属于自己专业或权限范围的领域中过度出头，或者轻易越过界限，可能损害过去辛苦积累的评价和成果。\n\n现在尤其需要保持谨慎。\n\n越是觉得自己状态不错，越要清楚知道哪里不是自己应该贸然介入的范围。"
      ]
    },
    "9_1": {
      "key": "9_1",
      "name": "未济",
      "gua": "虽然有些遗憾，但现在正是结束旧的循环、重新开始的时期。\n\n有些事情也许没有按照最理想的方式收尾，因此难免会觉得既可惜又松了一口气。但与此同时，一个新的阶段也正在展开。\n\n未来还有很多事情可以做，发展的可能性也非常大。\n\n不过，就像天还没有完全亮一样，现在如果因为焦急而贸然行动，或者一下子把事情铺得太大，反而容易给自己制造新的麻烦。\n\n即使最初的进展比较缓慢，过程也不够顺畅，也不要因此过度担心或中途放弃。\n\n随着时间推移，整体情况会逐渐改善。\n\n现在更重要的是耐心打好基础，同时继续进行必要的沟通、谈判和协调。\n\n客观看清自己的能力，并与真正志同道合、值得信任的伙伴一起行动，就有机会把未来的大希望逐渐变成现实。\n\n这个阶段也容易遇到能够帮助自己的好伙伴。即使中途有人阻碍，只要珍惜真正重要的缘分，仍然能够继续向前。",
      "yao": [
        "目前实际经验还不够充分，对陌生环境也没有完全适应。\n\n如果只凭热情就毫无顾忌地往前冲，或者把现实想得过于简单，很容易遭受令人难受的失败。\n\n现在不适合急着出头。\n\n先控制行动，认真提升自己的实力和经验，会更加有利。",
        "现在需要具备发现危险之后，能够主动让自己停下来的判断力。\n\n即使事情已经形成向前冲的惯性，也不能因此失去控制。\n\n如果能够及时踩下刹车，暂时忍耐，并等待更合适的时机，就能够避免大的问题。\n\n这样反而更有机会平稳实现原本的目标。",
        "现在与其为了主导权而积极与别人竞争，不如寻找能够合作、协调和妥协的方法。\n\n接下来可能会遇到一个并不容易突破的大难关。\n\n如果这个时候采取过度冒险的方式，局面容易变得更加复杂。\n\n保持灵活，不逞强，先稳稳度过危机，最终反而会朝对自己有利的方向发展。",
        "如果已经发现目前的位置、做法或工作方式存在明显问题，就需要尽快回到正确的方向。\n\n不要依靠小聪明，也不要试图用暂时的办法掩盖问题。\n\n按照原则真正把错误修正过来的过程，眼下可能非常辛苦。\n\n不过，只有认真完成这一阶段，才能没有遗憾地进入下一个阶段，并取得真正的成果。",
        "现在再次强调，守住明确的原则，并以正确的方式行动非常重要。\n\n过去纠缠复杂的问题，开始逐渐出现可以解决的线索。\n\n虽然眼前还没有完全结束，但整体已经进入非常积极的变化阶段。\n\n只要继续保持正确的方向，之后有机会取得很好的成果，也更容易获得认可和荣誉。",
        "现在容易因为逐渐顺利起来而失去初心和原则，甚至因为自满重新陷入难以处理的困境。\n\n尤其需要注意，不要因为轻率的行动，让过去辛苦积累的信任和基础受到损害。\n\n如果还能及时调整，就应该尽快回到正确的方向。\n\n但如果已经错过了原来的时机，也不要继续执着于过去。\n\n有时候，彻底放下已经无法挽回的部分，从最开始重新建立新的道路，反而是更好的选择。"
      ]
    },
    "9_4": {
      "key": "9_4",
      "name": "鼎",
      "gua": "这是一个需要果断放下陈旧方式，与志同道合的人重新建立新局面的时期。\n\n旧的容器已经不再适合新的内容。现在非常适合通过大胆改变，推动真正的创新与更新。\n\n过去已经失去作用的惯例、经营方式或工作内容，都需要认真重新检查，并从外在形式到内部结构一起进行调整。\n\n与理念相近的人共同合作，或者适当分散资金与资源、提高整体灵活性，都有机会带来超出预期的收益。\n\n在人际关系中，对上保持尊重，对下保持宽容，自己的位置和整体局势会更加稳定。\n\n进行交易或签订合同时，如果能够先考虑对方的立场和合理利益，最终反而更容易为自己带来长期的好处。",
      "yao": [
        "过去一直坚持的方法，到了现在已经不再适用。\n\n需要跳出原有的固定观念，对工作方式和思考模式进行明显的调整。\n\n这是为了新的发展而重新整理基础的过程。\n\n因此，即使刚开始出现一些试错，或者事情暂时进行得不够顺畅，也不必过度担心。\n\n只要方向正确，最终仍然能够稳定下来，并继续维持不错的人际关系和合作机会。",
        "现在正是重新建立新结构，并把真正有价值的内容放进去的时候。\n\n即使表面看起来不错，也需要仔细检查内部是否混入了会带来长期问题、不健康或已经腐坏的因素。\n\n尤其是重要活动、企划或项目，在正式成熟之前不要过早向外透露。\n\n保持谨慎，减少不必要的信息外泄，会更有利于事情顺利完成。",
        "在推动新的尝试和改变时，可能会突然遇到意料之外的问题或障碍，因此进度暂时变慢。\n\n即使事情没有按照预期速度发展，也不要因此中途放弃。\n\n只要保持耐心，继续一步一步推进，最终仍然能够实现自己真正想要的目标。\n\n成果也会让自己感到比较满意。",
        "自身能力和资金还明显不足，却因为欲望过强而贸然挑战过高的位置或过大的项目，容易给自己带来严重的压力和难堪。\n\n超出自身条件的计划，最终很可能因为无法承担而让整个局面陷入混乱。\n\n如果已经发现目标明显超过目前的承受能力，就应该及时停下来。\n\n继续勉强推进，结果容易非常不理想。",
        "现在拥有比较稳定的基础，也容易在物质和精神方面感受到充足与安定。\n\n即使自己带领的人或合作伙伴偶尔出现一些小失误，也不要每件事情都亲自介入和控制。\n\n适当地给予信任和空间，让他们自行处理，反而更加有利。\n\n如果什么都由自己出面解决，有时反而会破坏原本顺畅的节奏。\n\n保持灵活会更好。",
        "现在能够同时拥有坚定和柔和两种力量，因此容易得到周围人的高度信任和尊重。\n\n即使正在推进的事情中出现一些意外的小错误或变数，也会因为周围人的支持而得到灵活解决。\n\n整体状态比较稳定，内心也容易保持轻松。\n\n想做的事情大多会朝非常有利的方向发展，并取得不错的成果。"
      ]
    },
    "9_9": {
      "key": "9_9",
      "name": "离",
      "gua": "越是充满热情和行动力，越需要周密、敏锐而灵活地应对。\n\n现在意愿强烈、能量充足，是一个很适合充分发挥自身能力的活跃时期。\n\n如果从事教育、文化、艺术等领域，比较容易获得不错的成果。\n\n短期的商业活动或项目也容易带来实际收益，但对于长期计划，则需要更加谨慎地评估和推进。\n\n有些事情表面看起来十分华丽，实际内容却未必同样充实。因此，在合同、谈判或合作过程中，要特别注意文件上的错误、条款细节以及资料管理，避免因此产生损失。\n\n如果只靠自己的想法强行推进，很容易出现问题。\n\n保持行动力的同时，也要懂得灵活调整，与值得信任的伙伴或协助者合作，并避免因一时冲动做出轻率决定。",
      "yao": [
        "现在能量非常充足，很容易产生马上向前冲的冲动。\n\n不过，目前仍然只是所有事情刚刚开始的阶段。\n\n如果过早争取主导权，容易遇到风险和不必要的试错。\n\n放低姿态，保持谦逊，认真观察整体情况之后再踏出第一步，会更加稳妥。",
        "这是一个能够很好地保持平衡，整体非常稳定的好时期。\n\n即使突然面对紧急或棘手的情况，也不需要慌张。\n\n只要能够与周围的人保持协调，并根据实际情况灵活处理，想做的事情就会比较顺利地发展，也容易朝对自己有利的方向推进。",
        "整体开始出现下降或衰退的迹象，是一个需要提高警觉的阶段。\n\n可能突然受到外部冲击、竞争者的压力，或者在没有充分准备的情况下暴露在风险之中。\n\n现在不要为了扭转局势而强行改变整个方向，也不适合采取过度冒险的行动。\n\n守住现状、减少损失，比继续扩大更重要。\n\n目前想要推进新的事情并不太有利。",
        "现在容易过度相信自己的位置和能力，因此产生自满。\n\n如果因为欲望过强，贸然重新开辟新的局面，或者挑战风险明显超过自身承受能力的事情，就可能遭受严重打击和经济损失。\n\n尤其需要控制冲动。\n\n超出自身能力范围的冒险，很容易带来较大的失败和麻烦。",
        "虽然身处组织的重要位置，但实际拥有的权限可能不足，外部条件也不太配合，因此容易承受很大的心理压力。\n\n不过，不要因为眼前的困难就失去信心或轻易放弃。\n\n如果能够安静坚持，把自己该做的事情继续做好，局势不久后有机会逐渐转向对自己有利的方向。\n\n眼前的压力也会慢慢得到缓解。",
        "现在需要果断处理组织内部长期存在的顽固问题，以及真正造成混乱的核心原因。\n\n不过，对于其他较小的失误或一般成员的问题，则不需要全部用同样强硬的方式处理。\n\n该断的时候明确切断，该包容的时候保持宽容。\n\n只要能够分清轻重，并果断完成最后的整理，正在推进的事情就会取得明确成果，也不容易留下后续麻烦。"
      ]
    },
    "9_7": {
      "key": "9_7",
      "name": "睽",
      "gua": "彼此的想法和方向容易错开，因此现在比起做大事，更适合把注意力集中在小而实际的事情上。\n\n原本想一起前进的人，可能与自己的想法逐渐产生距离，周围也容易出现意见不合、内部矛盾或力量之间的竞争。\n\n因为彼此看向不同的方向，如果现在强行推进大型项目或扩大事业，反而容易给自己带来更大的风险。\n\n现在与其急着开始新的事情，不如适当地做出让步，先改善与周围人的关系。\n\n减少不必要的交易和争执，也不要过度追求大的利益。\n\n放下过强的欲望，从眼前的小事开始，一件一件用比较轻松、积极的心态去解决。\n\n即使整体局面并不完全协调，也仍然能够从中获得实际的成果和有价值的经验。",
      "yao": [
        "虽然自己具备一定能力，但目前缺少能够真正支持和带领自己的可靠伙伴或稳定基础。\n\n现在不适合急着建立自己的势力，也不要勉强聚集很多人来扩大影响。\n\n先守住目前的位置，安静观察整体局势，并等待真正适合行动的时机，会更加明智。",
        "现在有机会在意想不到的地方，偶然遇到真正与自己志向相近的重要人物或贵人。\n\n即使这次相遇并没有经过完整的正式程序，也不一定需要过度在意形式。\n\n如果彼此的时机和现实条件刚好契合，过去纠缠的问题反而会因此逐渐顺利解决。",
        "现在能够比较敏锐地看清人际关系中的冲突、是非和问题，也具备不错的分析能力。\n\n不过，在局势非常紧张或出现危机的时候，可能因为过于谨慎而显得有些犹豫，甚至在争取主导权时暂时处于不利位置。\n\n现在不需要急着证明自己。\n\n在局势真正稳定下来之前，耐心承担眼前的辛苦，并守住自己的位置，之后仍然有机会得到成果。",
        "因为与周围人的意见不一致，容易产生明显的孤立感和寂寞感。\n\n彼此之间的信任也比较薄弱，因此很难马上完全相信别人。\n\n这种时候最重要的是守住自己的中心，并充分认识到目前正处在一个比较困难的阶段。\n\n只要保持谨慎，不因为孤独或焦虑而做出过度反应，就有机会在没有明显损失的情况下度过危机。",
        "目前可能站在需要协调不同立场的中间位置。\n\n如果过早站到其中某一方，只支持一边，很容易受到另一方强烈的反对或攻击。\n\n现在不要急着表态。\n\n先稍微退后一步，冷静观察各方的行为和态度。\n\n等真正看清谁的方式更加正直、公平，再与这样的人合作，会更有机会实现自己的目标。",
        "误解和不信任已经积累到很高的程度，因此容易不断怀疑周围的人，并保持过度紧张的状态。\n\n如果一直被自己的猜测牵着走，就很难客观看清真正的情况，也容易因此做出错误判断。\n\n现在需要先放松内心的紧张，重新面对现实本身。\n\n当没有根据的怀疑逐渐减少之后，原本堵塞的局面也会慢慢松动，想做的事情也更容易重新顺利推进。"
      ]
    },
    "7_6": {
      "key": "7_6",
      "name": "夬",
      "gua": "不要逃避，现在需要由自己做出明确而坚定的决定。\n\n站在选择的岔路口，如果一直犹豫、拖延，生活和事情都很难真正向前推进。\n\n很多时候，迟迟无法决定，是因为想同时保住所有东西，不愿意放弃任何一种可能。\n\n真正到了必须选择的时候，需要拿出勇气果断行动，才能重新掌握事情的主动权。\n\n不过，目前整体条件对自己并不算特别有利，因此不适合在没有充分准备的情况下贸然展开新的事情，否则失败的可能性较高。\n\n经济方面，也可能出现资金紧张，或者因为资金问题承担较重责任的情况。\n\n同时，一个小小的疏忽，也可能让自己卷入诉讼或纠纷。\n\n因此，现在需要先把计划做得足够细致，再等待真正适合行动的时机。\n\n复杂的矛盾和冲突，则应该尽量尽快处理清楚。\n\n不要轻易为他人提供担保，文件、合同以及各种书面关系也必须仔细检查，提前把可能出现的风险尽量排除。",
      "yao": [
        "现在容易因为行动欲望太强，而无法冷静看清现实情况。\n\n如果没有具体对策，只凭一股冲劲向前，即使自己拥有合理的理由，也仍然很容易失败。\n\n先停下来重新观察整体局势。\n\n避免冲动行动，会比急着证明自己的判断更加重要。",
        "突然出现意料之外的变化或危机，容易让自己陷入担忧和焦虑。\n\n不要只是一个人反复担心。\n\n主动向周围值得信任的人寻求帮助，同时客观分析问题并寻找解决方法，就有机会在没有严重损失的情况下度过危机。",
        "现在可能在最重要的核心部分，或者事业的基础上遭遇决定性的损伤和损失。\n\n如果因为害怕而一个人急着逃离，或者试图完全避开问题，反而可能让其他麻烦接连出现。\n\n即使现实很难面对，也需要稳住自己，坚持处理真正的核心问题。\n\n只要能够正面承受并守住关键部分，就有机会避免情况进一步恶化。",
        "明明已经到了应该做出决定的时候，却因为迟迟无法下定决心，使事情逐渐变得更加复杂，内心也越来越不安。\n\n如果继续逃避选择，最后容易留下更深的后悔。\n\n现在需要放下过度的恐惧，明确决定自己真正要走的方向。\n\n只要确定路线之后认真行动，就能够减少不必要的损失。",
        "作为负责人或领导者，需要处理和决定的事情不断堆积，因此容易感到压力沉重，进度也变得缓慢。\n\n这种时候需要真正发挥统筹和决断能力。\n\n该结束的事情就明确结束，该继续的事情就果断推进，才能避免整个组织陷入更大的混乱。\n\n不要继续拖延。\n\n守住自己的中心并实际执行，事情最终能够比较平稳地得到解决。",
        "因为过度相信自己的判断而独自推进事情，最终可能陷入严重的危机。\n\n甚至会感觉已经无路可退，也没有人能够真正帮助自己。\n\n不过，眼前的危机和必须做出的决定，并不意味着一切结束。\n\n它更像是为了继续生存、重新寻找道路而必须经历的过程。\n\n现在的压抑只是暂时的。\n\n如果愿意真正面对问题，并带着突破困境的决心处理眼前的一切，就仍然有机会找到新的出口。\n\n不过，目前并不适合继续推进新的事情。"
      ]
    },
    "7_2": {
      "key": "7_2",
      "name": "萃",
      "gua": "这是一个人脉与财富都容易聚集而来、整体逐渐繁荣的时期。\n\n既然各种机会和资源正在向自己靠近，就更需要保持谦逊，把握机会，同时提前为未来做好准备。\n\n现在很适合充分发挥自己的能力，个人地位也容易随之提升，愿意支持和跟随自己的人也会逐渐增加。\n\n无论是考试合格、职场晋升，还是事业发展，都比较容易按照期待顺利推进，经济方面也更容易出现宽裕的状态。\n\n不过，人越多，竞争也会随之加剧，各种意见冲突和矛盾也更容易出现。\n\n因此，需要认真做好自己的事情，同时始终保持谦逊和宽容。\n\n不要只考虑自己的利益，如果也愿意照顾合作对象和周围人的合理利益，之后就更不容易留下矛盾和隐患。\n\n越是在顺利的时候，越需要提前为未来可能出现的困难做好准备。",
      "yao": [
        "现在容易出现让自己心动的人际缘分，或者遇到非常有吸引力的提议和机会。\n\n因为一时难以判断是否应该接受，内心可能会反复犹豫。\n\n不过，不需要因此过度焦虑。\n\n给自己一点时间，局势会逐渐变得清晰，问题也容易自然找到解决方式。",
        "领导者与合作伙伴、上位者与下位者之间容易建立非常牢固的信任，是一个彼此能够真正齐心协力的好时期。\n\n只要认真投入心力，并以充分的信任推进事情，即使眼前的经济收益暂时不算特别明显，长期来看仍然有机会得到很大的成果。\n\n现在比短期利益更重要的是稳固彼此之间的信任和合作。",
        "彼此之间很难真正融合，心意也无法聚集到一起，因此整体气氛容易变得冷淡而疏离。\n\n事情推进起来会比较辛苦，也容易感到缺乏支持。\n\n既然原来的方式已经很难继续，就需要接受现实，并做好重新建立整个局面的心理准备。\n\n与其勉强维持不协调的关系，不如认真考虑如何从新的基础重新开始。",
        "正在推进的事情会暂时出现好转的迹象。\n\n只要能够控制中途突然产生的个人欲望，不因为一点利益就偏离原来的方向，整体上就可以按照自己的计划继续推进。\n\n保持适度和分寸，就不会遇到太大的困难。",
        "现在不适合因为局势不错就急着扩大事情。\n\n需要一边观察周围情况，一边谨慎行动。\n\n相信自己的能力，同时也认真关注周围人的反应，以善意和稳定的态度推进事情，就能够减少不必要的风险。\n\n只要不急躁，整体能够比较平稳地向前发展。",
        "即使目前处于不错的发展阶段，如果没有提前为未来的困难做好准备，也可能在之后失去很多东西。\n\n尤其需要警惕欲望不断扩大。\n\n如果过度贪心，不仅容易失去重要的人际关系，也可能造成较大的经济损失。\n\n现在越是顺利，越要保持警觉，为之后可能出现的变化提前做好准备。"
      ]
    },
    "7_3": {
      "key": "7_3",
      "name": "随",
      "gua": "即使自己的实力已经足够，现在也更适合顺应现实环境和时代的变化，保持灵活。\n\n与其自己站在最前面主导整个局面，不如快速适应外部变化和整体趋势，并在必要的时候听取、接受他人的意见，这样反而更加有利。\n\n放下不必要的执着，与周围的人保持良好关系并认真沟通，信任和成果就会自然积累起来。\n\n在商业方面，顺应市场趋势、灵活调整方式，比较容易带来好的结果，资金流动也会更加顺畅，收入有机会随之增加。\n\n不过，收入增加的同时，支出也可能一起上升，因此仍然需要认真管理。\n\n即使遇到经验丰富、谈判能力很强的合作对象，也不要因为焦急而失去节奏。保持耐心，慢慢协调，会更加有利。",
      "yao": [
        "周围的人际关系或商业环境正在进入新的变化阶段。\n\n面对新的环境和交流机会，可以保持开放的态度去接受。\n\n不过，在适应变化的同时，也不要失去自己的原则和真正的能力。\n\n只要能够一边融入新环境，一边保持自身优势，就能够减少失误，并建立起稳定的基础。",
        "周围的人际关系或环境容易出现新的变化。\n\n这个时候不要急着自己站出来控制所有事情，也不要强行要求局势完全按照自己的想法发展。\n\n如果一时大意，只盯着眼前的小利益，很容易错过真正重要的大机会。\n\n保持谨慎，顺着合理的趋势行动，想做的事情会朝有利的方向发展。",
        "周围环境可能突然发生明显变化，使自己暂时陷入没有人支持或跟随的孤立状态。\n\n即使眼前有所失去，也不要因此过度失望。\n\n只要再坚持一段时间，继续认真努力，就有机会重新找回失去的权限、位置或成果。\n\n现在的失去并不一定是永久的。",
        "如果为了眼前的目标或成果而过度追赶，很容易突然陷入意料之外的风险和困难。\n\n尤其不要因为觉得事情很容易成功，就产生自满，试图用简单的方法快速解决。\n\n守住自己的原则，同时认真听取整体趋势和周围人的意见，再采取行动，会更加稳妥。\n\n只要保持谨慎，就能够避免大的问题。",
        "正在进行的项目、合同或其他事情，有机会顺利完成，并得到一个不错的收尾。\n\n即使自己处在组织最高负责人或拥有重要决定权的位置，也不要完全按照个人想法做决定。\n\n积极听取基层人员、实际执行者或专业人员的客观意见，会更加重要。\n\n愿意接受真实的反馈，正在推进的事情会得到更好的结果。",
        "现在容易被复杂纠缠的问题或环境束缚，陷入难以行动的停滞状态。\n\n即使如此，也不要轻易放弃。\n\n重新稳定自己的心态，以真诚的态度一点一点整理问题，并持续寻找解决方法，就有机会安全度过眼前的困难。\n\n只要坚持到最后，想做的事情仍然有可能取得很大的成果。"
      ]
    },
    "7_8": {
      "key": "7_8",
      "name": "咸",
      "gua": "比起理性判断，现在更容易通过真诚的情感交流和共鸣，创造出意想不到的转机。\n\n这是一个“真心”比任何时候都更加重要的时期。\n\n自己的诚意和努力，容易真正打动对方，并因此得到超出预期的好结果。\n\n如果已经明确目标，就不要犹豫太久，及时行动才能更好地抓住机会。\n\n尤其容易遇到真正支持自己想法的优秀伙伴或协助者，并得到周围比较充分的帮助。\n\n不过，正因为感情和直觉的力量会被放大，也更需要警惕失去理性判断。\n\n如果轻易相信甜言蜜语，可能会被不可靠的人或骗局利用。\n\n因此，不要让情绪过度膨胀。\n\n只要以正确的价值观为基础，保持真诚并理性行动，无论在人际关系还是事业方面，都有机会取得很好的成果。\n\n如果正在等待感情上的缘分，也比较容易遇到合适的人。",
      "yao": [
        "现在还只是刚刚准备开始的阶段。\n\n如果只是心里着急，但现实条件还没有准备好，就不适合马上行动。\n\n与其贸然出发，不如先整理自己的想法，并把能力、资源和环境逐渐准备完善。\n\n现在最重要的是先把基础打好。",
        "容易因为焦急，而想赶快寻找伙伴、机会或新的合作关系。\n\n不过，如果对对方还没有充分了解，就急着建立关系或签订合同，反而可能让事情变得更加复杂，并造成损失。\n\n现在需要有耐心，等待真正合适的时机。\n\n如果勉强推进，反而很难给自己带来真正的好处。",
        "现在容易把一时的情绪或冲动，误认为是真正的理解和深层共鸣。\n\n如果受到周围气氛影响，只追逐外表华丽、实际上并不适合自己的人或机会，事情很容易逐渐偏离原来的方向。\n\n最后甚至可能陷入四面受阻的困难局面。\n\n现在需要冷静下来，认真重新审视自己的真实需求和判断。",
        "作为组织中负责实际工作的核心人物，容易因为个人欲望或私人感情，而影响原本应该保持客观的判断。\n\n如果把注意力放到不属于自己职责的地方，或者因为私心做决定，可能逐渐失去周围人的信任和领导力。\n\n现在需要放下额外的欲望，专注于自己真正应该承担的责任。\n\n保持耐心，坚持把本职工作做好，事情才会朝更有利的方向发展。",
        "现在能够在组织核心位置上保持稳定，不容易被外界轻易动摇。\n\n不依靠复杂的算计，也不使用小聪明，而是以正直的心态做出正确选择。\n\n正因为这样，周围的事情会比较少出现摩擦，整体也容易灵活而顺畅地发展。\n\n之后回头来看，也不容易对自己的决定产生后悔。",
        "大的困难和紧张阶段已经逐渐过去，终于开始重新恢复平静。\n\n如果为了得到实际利益，而过度包装自己的经历、能力或形象，反而容易引起流言和负面评价。\n\n现在与其炫耀自己，不如通过真诚的沟通和宽容的态度与人相处。\n\n只要保持这样的方式，正在推进的事情就有机会给自己带来很大的成果。"
      ]
    },
    "7_1": {
      "key": "7_1",
      "name": "困",
      "gua": "这是一个越是陷入困境、越拼命挣扎，反而越容易陷得更深的时期。\n\n四周仿佛都被堵住，整体处于非常压抑和困难的状态。现在最重要的是尽量减少不必要的行动，冷静整理自身基础。\n\n受到周围干扰和外部条件恶化的影响，很多事情容易停滞不前。\n\n如果因为急着解决问题而不断采取行动，局势反而可能进一步恶化。尤其不适合强行推进工作、事业，或者继续扩大规模。\n\n现在需要放下不切实际的期待，保持坚定而清醒的心态，才能一点一点走出困境。\n\n如果被周围的甜言蜜语诱导去投资，或者因为压力而增加奢侈和浪费，可能造成非常严重的损失，因此尤其要严格管理支出。\n\n进行交易或签订合同时，不要急着做决定。必要时可以适度让步，但最终条件和责任范围一定要明确整理清楚。\n\n与其不断解释或说一些没有实际意义的话，不如保持沉默和冷静。\n\n只有守住自己的中心，才能在这段困难时期里逐渐找到新的出口。",
      "yao": [
        "现在还处在困难和压抑不断持续的初期阶段。\n\n如果因为想尽快摆脱局面，就选择逃避问题，或者依靠小聪明寻找捷径，反而更难找到真正的解决办法，并可能长期受到困扰。\n\n尤其需要管理好自己的情绪。\n\n如果因为焦躁而失去判断，正在推进的事情很容易进一步恶化。\n\n现在应该保持克制，不要轻易行动。",
        "表面上仍然处于困境之中，因此暂时不容易充分发挥自己的能力。\n\n虽然可能会出现不错的提议或机会，但现在如果急着炫耀成果、强调自己的能力，很容易引来嫉妒和反感，反而让局势变得更加不利。\n\n有时候，主动放低姿态，承认自己仍有不足，反而更加安全。\n\n保持谦逊，才能减少之后不必要的麻烦。",
        "现在容易陷入孤立无援的状态。\n\n如果仍然只坚持自己的固执和自尊，反而会继续撞上更大的障碍。\n\n就像往前走会被石头绊倒，想抓住东西往上爬又会被荆棘刺伤一样，几乎处处受阻。\n\n如果连可以依靠的人也逐渐失去，想做的事情只会越来越困难。\n\n现在必须放下固执，重新调整自己的态度和方向。",
        "即使身处困难而贫乏的环境，也需要保持耐心，继续安静推进自己真正重要的计划。\n\n进展可能比较缓慢，也会让人感到压抑。\n\n即使过程中承受委屈、挫折或辛苦，也不要轻易放弃。\n\n只要继续守住自己的目标，稳稳向前推进，最终仍然有机会得到一个好的收尾，并真正完成想做的事情。",
        "虽然现在仍然身处非常困难的局面，但已经开始进入逐渐走出危机的转折阶段。\n\n自己也慢慢恢复了能够保持平衡、重新整理混乱局面的内在力量。\n\n现在不要偏向极端，也不要因为之前的困难随意改变原则。\n\n只要按照正确的方法坚定推进，事情会逐渐朝对自己有利的方向发展。",
        "虽然自身并不是没有力量，但局势已经复杂到很难真正控制，是一个非常危险的阶段。\n\n越是这种时候，越需要放下个人的固执和私欲，先把局面重新整理好。\n\n如果还因为欲望而继续行动，问题会像枷锁一样越缠越紧。\n\n现在应该尽快放下不必要的私心，并与真正重要、值得信任的人统一方向，一起应对眼前的问题。\n\n只有这样，才有机会真正摆脱这段困境。"
      ]
    },
    "7_4": {
      "key": "7_4",
      "name": "大过",
      "gua": "当一切都显得摇摇欲坠时，最重要的是守住自己的中心和稳定。\n\n现在容易承担超过自身能力范围的重任，整体压力很大，工作负担、责任感和过度劳累都可能明显增加。\n\n如果过度沉迷于他人的认可、称赞，或者短暂的快乐，很容易逐渐消耗自己的身体和精神，因此自我管理尤其重要。\n\n即使个人事务可以暂时放一放，公事和必须承担的责任仍然要果断、透明地处理。\n\n不过，现在并不适合再开启明显超出自身能力范围的新任务或新项目。\n\n不要试图一次解决所有问题。\n\n先把基础稳固下来，专注于内部管理，一件一件处理，反而更加安全。\n\n也要注意过度劳累带来的体力消耗和消化等身体负担。\n\n把自己能够做的事情做好之后，守住节奏，逐步解决问题，才能避免更大的麻烦。",
      "yao": [
        "现在容易觉得自己的处境或基础比较薄弱，甚至有些不稳定。\n\n不过，还没有到需要彻底失望的时候。\n\n只要从一开始就认真准备，保持谨慎，并一点一点增强自己的应对能力，即使目前处于相对弱势的位置，也能够培养出足够的生存和应变能力。\n\n这样推进事情，整体不会有太大的问题。",
        "就像小小的希望开始萌芽一样，可能会在意想不到的地方遇到能够帮助自己的伙伴或协助者。\n\n即使这段合作并不是完全理想、毫无缺点的组合，也能够通过彼此互补形成不错的平衡。\n\n这种关系容易带来意外的机会和实际利益。\n\n正在推进的事情也有机会取得不错的成果。",
        "现在处于勉强维持平衡、随时可能失控的危险阶段。\n\n自身基础还不够稳固，周围也不容易得到充分的帮助。\n\n如果继续硬撑，很可能突然遭受严重冲击或较大的损失。\n\n不要再仅靠意志勉强坚持。\n\n现在需要重新全面检查自己的处境、计划和资源。\n\n目前并不适合强行推进新的事情。",
        "可能会突然遇到意想不到的困难，或者承担过重的工作压力。\n\n现在不要把注意力分散到其他地方。\n\n先集中精力处理眼前最重要的危机，并做好充分准备。\n\n只要不过度贪心，也不采用冒险或不正规的方式，而是按照基本原则稳步应对，正在进行的事情最终仍然能够顺利完成，并逐渐朝好的方向发展。",
        "眼前可能突然出现一个看起来不错的机会，让人觉得事情开始顺利起来。\n\n不过，这份成果未必能够持续很久，也可能很快失去原来的优势。\n\n因此，不要只关注外表上的华丽和短暂成功。\n\n认真充实内部实力，守住真正有价值的成果会更加重要。\n\n想做的事情本身不会出现特别严重的问题，但实际能够获得的名誉或利益可能比预期少一些。",
        "因为过度的欲望或固执，容易越过自己真正能够承担的界限，最终陷入非常深的困境。\n\n就像水已经淹到头顶一样，局面可能变得难以控制。\n\n这个时候继续责怪别人并没有意义。\n\n需要重新认识自己的能力和界限，并立即停止过度的行动。\n\n如果仍然强行向前推进，想做的事情很容易出现非常不利的结果。"
      ]
    },
    "7_9": {
      "key": "7_9",
      "name": "革",
      "gua": "这是一个需要果断清理过去，通过改变重新打开局面的时期。\n\n整体正处在明显的转折点，生活、工作和事业中的许多旧方式，都需要重新审视并进行较大的调整。\n\n与其继续坚持已经习惯的结构和方法，不如主动观察周围的变化，寻找新的机会。\n\n现在更适合放下已经失去作用的旧事物，接受新的方向。\n\n如果自己的目标已经足够明确，那么事业扩张、转行、换工作等变化，都可以积极考虑。\n\n不过，不要只是因为想改变就急着行动。\n\n先建立清晰的目标和细致的计划，把真正要走的方向确定下来，才能减少不必要的试错，并更顺利地完成想要的改革。",
      "yao": [
        "内心虽然已经充满想要改变和创新的意愿，但目前的力量还不足以真正推动整个局势发生明显变化。\n\n如果没有充分计划就贸然行动，很容易遇到来自周围的阻力。\n\n现在更适合先控制住过于急切的热情，安静积累力量，并等待真正合适的时机。\n\n这种暂时的克制，反而更有利于之后取得好的结果。",
        "现在已经同时具备充分的理由和实际能力，是可以真正开始推动变革的时期。\n\n既然已经等待了很久，就不需要再过度犹豫。\n\n对于明显错误的旧习惯、已经失去效率的制度或工作方式，可以果断开始调整和改革。\n\n现在需要的是把想法真正落实到行动上的执行力。",
        "可以继续推动变化，但同时不能忘记自己的职责和基本原则。\n\n现在尤其需要认真管理风险。\n\n就像过桥之前也要先确认是否安全一样，每一步都应该充分检查之后再向前推进。\n\n只要保持谨慎，最终仍然有机会实现真正想要的改变。\n\n如果把情况看得太简单，因为一时顺利而放松警惕，就容易出现不理想的结果。",
        "大规模的改革已经完成了第一阶段，整体开始出现一个比较明确的阶段性成果。\n\n不过，现在还没有真正全部结束。\n\n需要把目前已经改变的部分认真整理好，并进一步规划接下来的方向和新的目标。\n\n不要因为担心失败而停下来。\n\n这是一个很适合继续坚定推进，并把新的结构逐渐完善起来的时期。",
        "现在已经不是靠一些临时性的补救措施，或者只修改局部制度就能够解决问题的时候。\n\n真正需要的是从根本上调整整个结构，甚至改变原有的思维方式和运行逻辑。\n\n必须以足够强的执行力，把长期存在的不良习惯和低效率问题真正处理到根源。\n\n只有彻底改变，才有机会获得与之相匹配的大成果。\n\n这是一个非常适合进行根本性改革的好时期。",
        "周围环境和真正适合行动的时机还没有完全配合，因此整体容易显得混乱。\n\n如果这个时候为了抢夺主导权而过度积极推进，反而可能让自己受到伤害，或者让局面变得更加不利。\n\n现在更适合保持克制，守住自己的位置，等待环境真正稳定下来。\n\n尤其需要警惕那些表面上支持改变，实际上并没有诚意的人，以及缺乏实际能力的合作伙伴。\n\n先看清谁真正值得信任，再决定下一步行动，会更加稳妥。"
      ]
    },
    "7_7": {
      "key": "7_7",
      "name": "兑",
      "gua": "这是一个需要通过温和的沟通与分享，让整体重新充满活力的时期。\n\n新的希望和机会正在出现。如果愿意与周围的人分享喜悦、主动给予帮助，这份善意也容易以更大的利益回到自己身上，是一个彼此成就、共同受益的阶段。\n\n目前对现状的满意度比较高，即使不勉强开始新的事情，也容易自然得到发展。\n\n尤其是从事与语言、沟通有关的工作，或者销售、宣传、广告、推广等领域时，整体趋势非常不错。\n\n不过，有些事情可能只是表面看起来华丽，实际内容却不够扎实。\n\n因此，在准备重要事情时，不要轻率行动，也要把最后的收尾处理清楚。\n\n不要卷入组织内部的派系争斗和无意义的是非。\n\n同时也要特别注意自己的言语，避免因为一句无心的话而引发意料之外的麻烦。",
      "yao": [
        "现在处在一个与周围的人相处融洽、事情也能够顺利推进的稳定初期阶段。\n\n如果始终保持温和的表情和友善的态度，人们自然更愿意靠近并支持自己。\n\n不过，也不要因为现在比较舒适，或者沉浸在一时的快乐里，就逐渐失去警觉。\n\n只要守住自己的中心，正在推进的事情不会有太大的问题。",
        "现在容易遇到一个极具诱惑力、足以动摇自己的提议，或者某个非常有吸引力的人。\n\n如果被短暂的快乐或眼前甜美的利益迷惑，失去自己的原则，局面就容易变得不利。\n\n因此，现在尤其需要守好界限，并严格管理自己的行为和欲望。\n\n只要坚持正确的判断，就不容易在之后产生后悔。",
        "正在推进的事情可能暂时看起来非常顺利，因此容易产生自满。\n\n如果为了个人利益或快乐而不择手段，反而可能突然遇到意想不到的事故或困难。\n\n不要因为一时顺利就过度贪心。\n\n如果勉强扩大事情或只追求眼前享受，结果很容易变得非常不利。",
        "眼前可能同时出现几个看起来有利的选择，因此不断思考究竟应该与谁合作，反复计算得失。\n\n这种状态也会让内心变得不安。\n\n虽然与周围的人商量和交流本身比较愉快，但真正需要做决定的时候，却容易因为犹豫而暂时停滞。\n\n不过，这种混乱不会持续太久。\n\n很快就会逐渐形成清晰的判断，问题也会随之得到解决。",
        "仅仅依靠职位、权力或表面的优势，很难解决眼前复杂的问题。\n\n即使外表看起来非常稳定，内部实际上可能已经相当脆弱。\n\n如果此时轻易受到外部诱惑或错误趋势的影响，过去建立的整个基础都可能随之动摇。\n\n现在推进重要事情具有一定风险，需要特别谨慎。",
        "这是一个容易沉迷于过度欲望或只有外表华丽、却缺乏实际内容的东西，从而影响周围人和整个组织的危险阶段。\n\n不要过度追逐暂时的成果和快乐。\n\n现在更重要的是充实自身实力，稳固基础，并把精力放在正确引导和支持身边的人上。\n\n如果试图依靠力量强行控制局势，或者采取明显超出合理范围的行动，就很容易造成较大的损失。"
      ]
    }
  },
  "en": {
    "6_6": {
      "key": "6_6",
      "name": "Qian",
      "gua": "A highly favorable time, with strong potential for things to move forward smoothly.\n\nYou may be entering a period of powerful momentum. As your energy and confidence rise, it is important to stay grounded, keep your intentions clear, and continue steadily toward your larger goals.\n\nYour drive and willingness to keep making an effort can be especially important now. At the same time, try to use this strong energy wisely. Share what you can with others and remain humble in the way you treat the people around you.\n\nThis may be an excellent time for progress, but strong momentum also requires the ability to handle it. If you are not fully prepared or try to take on more than you can manage, the pressure itself may become overwhelming.",
      "yao": [
        "The boat is ready, but the tide has not yet come in. It is better not to rush forward.\n\nTake time to review what is still lacking, refine your preparations, and calmly wait until conditions become more favorable.",
        "The tide is beginning to rise in the distance, but it may still be too early to set sail.\n\nThis may be a good time to seek advice or support from someone with greater experience. The right guidance could help you move closer to what you want.\n\nAt the same time, be careful not to trust someone simply because their words sound convincing.",
        "You may be working hard and doing everything you can, yet still feel that something is slightly lacking.\n\nThis period may require steady attention and continued effort. Results may not come quickly or all at once, but if you remain patient and persistent, serious failure or major trouble can often be avoided.",
        "The right moment may finally be approaching.\n\nIf you are clear about what you want and are prepared to commit yourself fully, this can be a good time to act boldly. When you move with sincere effort, the moment itself begins to support you.",
        "This may be one of the smoothest and most favorable stages.\n\nThings can begin to unfold much more naturally, almost like a boat moving easily with a favorable wind. Plans, conversations, and actions may progress with fewer obstacles than before.",
        "Too much force can create problems of its own.\n\nIt may be like setting out in a good mood only to realize that your shoes are too tight. You can still keep going, but the discomfort gradually becomes difficult to ignore.\n\nThings are not necessarily going badly, but be careful not to push too hard simply because you have come this far. If you become overly stubborn or force matters beyond their natural limit, small problems may begin to accumulate."
      ]
    },
    "6_2": {
      "key": "6_2",
      "name": "Pi",
      "gua": "This may be a time when harmony is difficult to find and progress feels blocked.\n\nEveryone may seem to be doing their best in their own position, yet their efforts do not come together. Even when the direction appears right, reality may remain stubbornly unchanged.\n\nIf you act too quickly, you may lose more than expected and find it difficult to recover what was spent. The results may also feel small compared with what you hoped to gain.\n\nThis can be a frustrating period with few clear solutions. Forcing matters is unlikely to bring meaningful progress, so it is better to stay focused on what you can do, fulfill your responsibilities, and wait for conditions to change.\n\nPeople, opportunities, and resources may all seem distant or difficult to reach for now.",
      "yao": [
        "It may be time to let go of what is no longer necessary.\n\nIf you clear away what is cluttering the situation and bring order to what is around you, tangled problems may slowly begin to loosen.\n\nBut if you avoid making decisions and simply let time pass, the situation may become harder to escape.",
        "The situation may gradually improve if you treat others with patience and generosity while still keeping healthy boundaries.\n\nEven when you do the right thing, your efforts may go unnoticed, while someone acting unfairly receives recognition instead. This can feel deeply frustrating.\n\nRather than becoming consumed by the unfairness, it is better to remain steady and continue doing what is right for you.",
        "The other person may not be approaching you with sincere or honest intentions.\n\nWhen a relationship is already out of balance, it can be difficult to achieve what you hope for through that connection.\n\nBe careful not to expect healthy results from a situation that is built on mistrust or misalignment.",
        "Even if you gain something, the cost may be too high.\n\nTrying to reach for results before you are properly prepared can leave the whole situation unstable, like a small flame exposed to a strong wind.\n\nIt is better not to force success when the foundation is still too fragile to support it.",
        "Communication may feel completely blocked.\n\nPeople may be physically present but emotionally moving in different directions. If everyone insists only on their own position and no one is willing to yield, little progress can be made.\n\nThis may be a time to reduce confrontation rather than trying to force agreement.",
        "A long-awaited rain may finally begin to fall, but it is not yet enough to end the drought.\n\nThe situation may not be fully resolved, but the pressure that once felt completely blocked can begin to ease little by little.\n\nDo not rush. Use this period to reorganize, regain your balance, and watch carefully as conditions slowly begin to improve."
      ]
    },
    "6_3": {
      "key": "6_3",
      "name": "Wu Wang",
      "gua": "What is meant to unfold will unfold, and what is not meant to happen may simply not happen.\n\nThis may be a time when things move best when allowed to follow their natural course. It is better to let go of unnecessary ambition and avoid forcing outcomes that are not ready to take shape.\n\nIf you move with the flow of the situation, you may find that what you hope for becomes possible. But if personal desire, manipulation, or excessive effort takes over, things can easily fall out of balance.\n\nAppearances can also be louder than substance. Rather than relying on luck or hoping for an easy breakthrough, careful preparation and a sincere attitude may matter most.",
      "yao": [
        "By staying free from excessive desire and quietly doing what is yours to do, you may eventually reach what you are hoping for.\n\nSteady effort without unnecessary greed can bring a more reliable result.",
        "If you hope for good results without putting in the effort they require, things may not unfold as you wish.\n\nIt is better not to rely on luck alone. What is gained through proper effort is more likely to last.",
        "You may be creating difficulties for yourself without fully realizing it.\n\nPushing too hard or insisting on a certain outcome can make the situation more complicated than it needs to be.\n\nBe careful not to turn determination into self-sabotage. What feels like bold action may actually lead you more quickly toward failure.",
        "If your intention is clear and your mind remains steady, it may be worth continuing with quiet determination.\n\nYou do not need to be easily shaken by outside reactions when you know your direction is sound.",
        "An unexpected problem may arise because of a small mistake or moment of carelessness.\n\nIf you calmly look for the cause, however, the issue may be easier to resolve than it first appears.\n\nThere is no need to force a solution. If you respond carefully and allow the situation to return to its natural balance, things may settle on their own.",
        "This is a time when clear intentions and careful behavior matter more than usual.\n\nIf you act hastily or use an unreasonable approach, problems are likely to follow.\n\nIt is better not to force movement when the situation does not support it. Staying grounded and acting with integrity may prevent unnecessary trouble."
      ]
    },
    "6_8": {
      "key": "6_8",
      "name": "Dun",
      "gua": "The path ahead may feel blocked, making this a time to pause and step back.\n\nIt is like facing a great mountain beneath the sky. The mountain is too high to overcome by force, so rather than trying to break through directly, it is better to withdraw for a while and quietly look for a wiser way forward.\n\nThe obstacle before you may also represent a person or situation that cannot be dealt with fairly or reasonably right now.\n\nInstead of confronting it head-on, creating distance and preserving your strength may be the better choice. A temporary retreat can give you the space needed to prepare for what comes next.",
      "yao": [
        "If there is something you are thinking of starting, it may be better not to begin just yet.\n\nFor now, staying quiet and still may be the safest choice, like a wet leaf resting firmly against the ground.\n\nThis is a time when simply avoiding unnecessary movement can help you stay out of trouble.",
        "This may be a time to let go quickly.\n\nRather than continuing to worry about something that is unlikely to move forward, it is better to release it and calmly wait for another opportunity.\n\nWe often become more attached precisely when we know something should be left alone. Be careful not to let lingering attachment pull you back into a situation that is better released.",
        "You may want to withdraw quietly, yet circumstances around you may keep pulling you back in.\n\nPart of you may also remain attached, making it difficult to stay firm in your decision.\n\nEven so, holding yourself back may protect you from greater trouble. It is better to endure the discomfort of waiting than to push forward simply because you cannot let go.",
        "A wise person can accept a period of retreat and even make good use of the time.\n\nSomeone who understands the need to step back but cannot act accordingly may only create more difficulty for themselves.\n\nThere is no need to force yourself forward or prove your worth right now. Allowing yourself to withdraw can be a form of strength.",
        "By quietly stepping back, clarifying your goals, and strengthening your foundation, you may place yourself in a very favorable position.\n\nThis can be an excellent time to prepare inwardly rather than seeking immediate results.",
        "You may now be able to withdraw with greater peace of mind, quietly building your strength while maintaining steady confidence in yourself.\n\nIf you use this period well, you may be well prepared when the time eventually comes to act and pursue what you truly want."
      ]
    },
    "6_1": {
      "key": "6_1",
      "name": "Song",
