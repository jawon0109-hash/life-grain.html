      "gua": "This may be a time when stepping back brings better results than trying to win.\n\nEven if you strongly believe that you are right, insisting on pushing something through to the very end can create more trouble than benefit. Differences in intention or perspective may easily lead to arguments or conflict.\n\nIf disagreements continue for too long, misunderstandings can grow, and you may even find yourself blamed unfairly. This hexagram is closely connected with disputes, accusations, arguments, and situations that can become more serious if they are allowed to escalate.\n\nFor now, it is better not to act too quickly. Forcing a confrontation or entering a difficult dispute may bring unnecessary loss.\n\nFinding a reasonable compromise, creating distance, or asking an experienced person to help mediate the situation may be the wiser way to prevent greater harm.",
      "yao": [
        "A small argument or misunderstanding may arise, but it is unlikely to become a serious problem if you remain honest and reasonable.\n\nThis is not a time when everything you want is likely to move forward in a dramatic way, so it is better to keep expectations modest and avoid unnecessary conflict.",
        "There may be little chance of gaining anything by continuing the fight.\n\nRather than forcing yourself to stand your ground, it may be wiser to step away from the conflict and protect yourself from further loss.",
        "Continue quietly and take the straightforward path, but be careful not to overestimate your own ability or position.\n\nActing honestly may seem disadvantageous in the moment, especially when others appear to gain more by taking a different approach.\n\nIf you remain steady, however, you may later see that choosing integrity was the better decision.",
        "Even if you feel strongly tempted to argue, this may be a situation where fighting only leads to repeated loss.\n\nIf you regain your composure, avoid the dispute itself, and step back, you may be able to pass through the situation without serious harm.",
        "The conditions may now be strongly in your favor.\n\nIf you have prepared well and the situation is genuinely clear, this may be a time when decisive action can bring a strong result.\n\nMove with confidence, but remain aware of why you are acting and what you are trying to protect.",
        "Even if you win the argument or conflict, it may not feel like a true victory.\n\nA forced win can leave you carrying the consequences, blame, or responsibility afterward.\n\nRather than becoming attached to who wins or loses in the present situation, it may be more practical to step away cleanly and preserve your strength for what comes next."
      ]
    },
    "6_4": {
      "key": "6_4",
      "name": "Gou",
      "gua": "An unexpected encounter may bring more trouble than it first appears.\n\nGou (姤) carries the meaning of meeting or encountering something unexpectedly. A new connection or sudden opportunity may appear, but this can also be a time when temptation is especially strong.\n\nBe careful not to be swept away by immediate attraction, small gains, or passing emotions. What seems appealing at first may lead into a situation that becomes difficult to escape.\n\nIt is better to stay clear-minded, protect your boundaries, and avoid becoming deeply involved before you understand what you are dealing with.",
      "yao": [
        "A subtle attraction or new possibility may begin to appear, making it easy to believe that something meaningful is starting.\n\nHowever, it is better to keep the situation from becoming too entangled or emotionally intense.\n\nThere may be little to gain from becoming involved too quickly. Protecting the good relationships and stable connections already around you may be the wiser choice.",
        "This may be a time to appreciate what you already have.\n\nIf you reach for more out of impatience or desire, you may expose weaknesses or damage how others see you.\n\nFocus on strengthening your foundation and taking good care of the people and responsibilities already within your reach.",
        "The other person may not feel the same way you do, which can leave you frustrated or uncertain.\n\nBe careful with your words and pay close attention to your own actions.\n\nTrying to force closeness is unlikely to help. Romantic feelings or a relationship may not develop easily under the current conditions.",
        "Things may not unfold the way you want for now.\n\nThere may be a risk of financial loss, damaging rumors, or even being blamed for something unfairly.\n\nRather than trying to make something happen, it is better to pause and carefully reflect on the situation before taking further action.",
        "In reaching for something small and immediate, you may risk losing something far more valuable.\n\nBe careful not to become overly attached to romance, attraction, or emotions that have no stable foundation. Acting from impulse may harm your image or reputation.\n\nStay grounded, keep your position steady, and act in a way you can respect later.",
        "If the situation cannot be avoided, it may be better to accept it calmly rather than trying to control every part of it.\n\nForcing the situation may only create greater difficulty, so proceed with particular care.\n\nRather than trying too hard to form or maintain a connection, focus on strengthening yourself. If you have something you hope to accomplish, this may not yet be the easiest time to bring it fully into reality."
      ]
    },
    "6_9": {
      "key": "6_9",
      "name": "Tong Ren",
      "gua": "This may be a time to join forces with others and expand what you are trying to accomplish.\n\nWith heaven above and fire below, the image is like a bright sun rising into an open sky. When you connect with others sincerely and work together toward a shared goal, things may unfold in a very favorable way.\n\nRather than trying to control everything alone, it is better to cooperate with people who genuinely share your direction and values.\n\nHowever, be careful not to form narrow groups based only on personal ties, background, or private interests. Favoritism and division can easily damage something that was already going well.\n\nKeeping an open, fair, and broad-minded attitude will help cooperation remain strong.",
      "yao": [
        "This is a good time to open yourself to others and connect freely with people who share your goals.\n\nBy exchanging ideas and moving forward together, you may find few serious obstacles.\n\nIt can also be a favorable moment to begin something new.",
        "If you remain within a small circle and try to cooperate only with familiar people, the effort may become limited and awkward.\n\nThe work may fail to move forward properly, and the situation could leave you feeling embarrassed or disappointed.\n\nTry not to let narrow loyalties restrict a larger opportunity.",
        "You may be hesitating too much, watching how others react instead of carrying out your plan.\n\nThis is not a time when clever shortcuts or cautious testing of the situation are likely to work well.\n\nIf you become driven by unnecessary ambition or try to manipulate the outcome, the loss may be greater than expected and difficult to recover from quickly.",
        "You may be gaining a clearer sense of when to move forward and when to stop.\n\nEven if circumstances force you to step back for a while, this does not necessarily mean that the opportunity is lost.\n\nIf you remain patient and do not give up completely, a difficult situation may eventually turn into a valuable opportunity.",
        "The beginning may be difficult, with repeated obstacles that make the situation feel overwhelming.\n\nOnce you move through the hardest part, however, things may begin to unfold much more easily.\n\nWorking with someone you can genuinely trust may become an important source of support throughout the process.",
        "A more peaceful stage may finally be arriving.\n\nEven if you are no longer standing at the center of everything, you may be able to connect with others freely and comfortably without becoming overly tied to any one relationship or group.\n\nThis can be a favorable time to maintain healthy distance, enjoy open connections, and move with a greater sense of ease."
      ]
    },
    "6_7": {
      "key": "6_7",
      "name": "Lu",
      "gua": "This may be a time to respect your role, understand your position, and act with proper restraint.\n\nEven if a difficult or risky situation arises, serious harm may still be avoided. However, relying too much on that sense of safety can lead to careless behavior and unnecessary loss.\n\nIf you remain cautious and act with sincerity and good judgment, you may pass through the situation without major trouble.\n\nSometimes simply respecting basic principles, boundaries, and courtesy is enough to help you move safely through a difficult moment.",
      "yao": [
        "Continue in the way you normally would, but do not try too hard to prove yourself or force a better result.\n\nSometimes simple honesty and a straightforward attitude can be your strongest advantage.",
        "Because you already have many strengths or resources, you may also face more temptations or distractions.\n\nEven if desire arises, there may be little problem if you remain steady and keep your intentions clear.\n\nIf something is clearly wrong or needs improvement, it is better to correct it promptly rather than putting it off.",
        "You may be aiming higher than your current ability or situation can comfortably support.\n\nThis can make it easier to act too quickly or take unnecessary risks.\n\nSometimes stepping back is the more courageous choice. If you force yourself forward without enough preparation, the consequences may be more serious than expected.",
        "You are becoming more aware of your true position and of what deserves caution.\n\nBy recognizing the risks clearly and responding with care, you may bring what you are trying to do to a favorable conclusion.",
        "Sometimes having strong ability can create problems of its own.\n\nEven when your actions are fair and justified, becoming too forceful or uncompromising can make the situation unstable.\n\nStay alert and avoid creating unnecessary conflict. This may not be the best time to push matters beyond what the situation can safely support.",
        "This may be a good time to look back carefully on the path you have taken and bring things to a thoughtful conclusion.\n\nBy understanding what has worked, what has not, and how far you have come, you may be able to complete what you intended and move toward greater recognition or achievement."
      ]
    },
    "2_6": {
      "key": "2_6",
      "name": "Tai",
      "gua": "This may be a time when things begin to move smoothly and favorable conditions gather around you.\n\nWhat you say, hope for, or work toward may unfold more easily than usual. Helpful people may enter your life, and situations that once felt blocked can begin to open naturally.\n\nHowever, good fortune can sometimes lead to overconfidence. Be careful not to become careless simply because things are going well.\n\nThe better the conditions become, the more important it is to stay grounded and continue putting sincere effort into what matters.",
      "yao": [
        "After a difficult period, things may finally begin to improve.\n\nHelpful people can gather around you, and what you are trying to accomplish may move forward with fewer obstacles than before.\n\nThis can be a good time to act while maintaining the effort that brought you this far.",
        "You may gain more than expected from relatively modest effort or investment.\n\nHowever, because circumstances are working in your favor, it is important not to exclude people who seem less capable or less useful to you.\n\nAvoid forming narrow groups based only on familiarity or advantage. A broad and fair-minded attitude will help you make the most of this favorable period.",
        "If you become too focused on comfort and ease, the very good fortune surrounding you may begin to work against you.\n\nUse this period to strengthen your foundation, remain open to new ideas, and continue developing yourself.\n\nIf you keep growing rather than becoming complacent, things may continue to move in a steady and favorable direction.",
        "There is no need to show off your wealth, influence, or strength.\n\nWhen you meet people sincerely without trying to impress them, they may naturally feel drawn to you.\n\nIf you stop calculating every advantage and open yourself without hidden motives, stronger harmony can develop without unnecessary jealousy or competition.\n\nSincerity may quietly create the trust that holds people together.",
        "Humility may be especially important now.\n\nWhen ability and favorable circumstances are supported by a modest attitude, meaningful results can follow.\n\nThis may also be a good time to work actively with others. If you cooperate openly and continue moving forward, what you hope for may become much easier to achieve.",
        "Simply enduring may no longer be enough, and even that can begin to feel difficult.\n\nThis may be a period when the favorable momentum is starting to fade, so it is better to lower yourself, avoid unnecessary pride, and move carefully through the growing uncertainty.\n\nIf you are considering beginning something entirely new, it may be better to pause rather than force a fresh start."
      ]
    },
    "2_2": {
      "key": "2_2",
      "name": "Kun",
      "gua": "This may be a time to cultivate a broad mind and a greater capacity to receive and support what comes.\n\nRather than trying to lead from the front or control everything yourself, it may be more beneficial to learn from experienced people, mentors, or those in a higher position.\n\nAchieving something meaningful often requires enough experience to carry it well. For now, patience, steady learning, and quiet growth may matter more than immediate action.\n\nIf you remain grounded and persistent without being easily shaken, your efforts may eventually lead to substantial results.",
      "yao": [
        "Difficulties may come before a new opportunity begins to appear.\n\nIf you notice the early signs of change and prepare calmly in advance, you may be in a good position to achieve what you are aiming for.\n\nThis is a time to observe carefully and prepare rather than wait until circumstances have already changed.",
        "Things may begin to unfold naturally without requiring excessive effort.\n\nEven if you are dealing with something unfamiliar, the process may be easier than expected.\n\nIf you make good use of this steady flow rather than trying to control every detail, meaningful results may follow.",
        "You may be able to reach what you want if you avoid acting prematurely or taking on more than you are ready for.\n\nThis is not necessarily a time for quick results.\n\nInstead, quietly develop your abilities, strengthen your foundation, and prepare yourself well. What you build now may bring better results later.",
        "This may be a relatively neutral period, with neither great gains nor serious losses.\n\nHowever, there is little benefit in talking too freely about your situation or sharing everything with everyone around you.\n\nBe careful with your words and keep private matters to yourself when necessary. With discretion, things may pass without major trouble.",
        "This may be a time of unexpectedly abundant results, almost like discovering something valuable where you least expected it.\n\nBy remaining sincere, humble, and willing to place yourself below others when necessary, you may gain a great deal from what you are pursuing.\n\nThe more favorable the situation becomes, the more important it is to maintain that modest attitude.",
        "You may be losing sight of yourself and becoming unsure of what you are really trying to accomplish.\n\nWithout a clear purpose, you may find yourself struggling against others or even against yourself without gaining anything meaningful.\n\nRather than forcing matters forward, it is better to stop for a while and reflect on where you are and what you truly want.\n\nIf you are considering beginning something new, this may not be the right time to start."
      ]
    },
    "2_3": {
      "key": "2_3",
      "name": "Fu",
      "gua": "After a long winter, spring may finally be beginning to return.\n\nThe season is changing, but a lingering chill remains. Things that once felt blocked may slowly begin to open, making this a good time to return to your original intentions and steady yourself with a clear mind.\n\nLike a new sprout just beginning to emerge, this stage is still delicate. If you avoid rushing or forcing progress, a time may soon come when you can use your abilities more freely.\n\nFinancial conditions may also begin to improve gradually.",
      "yao": [
        "Support may begin to appear from the people around you, helping to strengthen areas where you feel less confident.\n\nThis is a good time to correct mistakes early and accept help without hesitation.\n\nWith the right support and a willingness to adjust, what you are trying to accomplish may lead to meaningful results.",
        "Spring may now feel as though it has truly arrived.\n\nAfter a difficult period, conditions can become much more favorable, and what you are working toward may have a strong chance of succeeding.\n\nHowever, it is especially important to remain open to the advice of people who are more experienced or skilled than you. Learning from them may help you make the most of this opportunity.",
        "You may encounter some delays or obstacles, and your confidence may waver from time to time.\n\nBecause you remain cautious and aware of the risks, however, serious harm may be avoided.\n\nYou may feel uncomfortable or find yourself needing to give something up along the way. Even if the process feels difficult for now, you may still be able to bring matters to a safe conclusion.",
        "The situation may feel surrounded by difficulties on every side.\n\nRather than forcing yourself to fit in with people or circumstances that do not suit you, it may be more peaceful to continue quietly along your own path.\n\nTake an honest look at where you stand, reflect on yourself carefully, and remain committed to the direction you believe is right.",
        "This may be a time to look carefully at what is happening around you and take responsibility for putting things in order.\n\nWhat is clearly wrong may need to be addressed firmly rather than ignored.\n\nInstead of rushing into something entirely new, it may be better to act with generosity, fulfill your responsibilities, and allow things to develop in a more natural way.",
        "You may feel lost and uncertain about what direction you truly want to take.\n\nThe right moment to return to your path may have been missed, leaving you confused and disconnected from your original purpose.\n\nTrying to force matters forward now may increase the chance of failure.\n\nIt is better to stop, regain your sense of direction, and find the path again before trying to move ahead."
      ]
    },
    "2_8": {
      "key": "2_8",
      "name": "Qian",
      "gua": "This may be a time when humility becomes one of your greatest strengths.\n\nThings may unfold favorably, but the way you carry yourself matters just as much as the results you achieve.\n\nIf you hope to earn the respect and support of others, it is important to remain modest, make room for others, and avoid placing yourself at the center unnecessarily.\n\nEven when difficulties arise, a humble and steady attitude can make it easier to receive help and move through problems smoothly.\n\nIf you quietly fulfill your role without trying too hard to prove yourself, meaningful results may follow.",
      "yao": [
        "Even when a difficult situation arises, you may be able to handle it calmly by maintaining a humble and grounded attitude.\n\nIf you avoid overreacting and deal with matters steadily, things may come to a favorable conclusion without major trouble.",
        "By staying on your path without becoming distracted or taking unnecessary shortcuts, your steady effort may naturally begin to stand out.\n\nThere is no need to draw attention to yourself.\n\nIf you continue quietly in the direction you have chosen, good results may follow.",
        "Even after achieving something meaningful, you remain free from arrogance and continue to carry yourself with humility.\n\nBecause of this, people may naturally begin to trust and follow you.\n\nThis can be a particularly favorable stage, especially when your achievements are supported by a modest and consistent attitude.",
        "You know how to lower yourself appropriately without becoming artificial or overly self-effacing.\n\nBecause your attitude fits the situation naturally, there may be little for others to criticize or misunderstand.\n\nContinue to act with quiet balance rather than trying to appear humble.",
        "Your good character and modest attitude may help you build strong relationships with many different people.\n\nBy sharing what you can and treating others generously, you may gain trust and respect.\n\nIf you are asked to take on something you genuinely should not accept, you may also have good reason to refuse firmly.\n\nHumility does not mean carrying every burden that is placed before you.",
        "Your reputation may begin to improve and spread more widely.\n\nYou may not see dramatic results immediately, but this can be a valuable time to think beyond short-term success and continue doing your work well.\n\nBy steadily developing and showing your abilities where you are now, you may be building a strong foundation for greater opportunities later."
      ]
    },
    "2_1": {
      "key": "2_1",
      "name": "Shi",
      "gua": "This may be a time to move forward with a clear goal and a steady sense of responsibility.\n\nYou may find yourself in a period of intense competition, conflict, or even in a position where you must lead others whether you intended to or not.\n\nClear rules, structure, and discipline are especially important now. Good results are more likely when the situation is handled with integrity and a strong sense of order.\n\nThe ability of the person leading the situation matters greatly. Someone who is both capable and trustworthy should take the lead.\n\nIf an unprepared or unsuitable person tries to take control, progress may quickly become difficult.",
      "yao": [
        "If you are going to lead a group, clear rules and order need to be established first.\n\nBefore beginning, it may help to create a structure that can support what you are trying to do.\n\nOn a personal level, this may mean building a steady routine. In a larger group, it may mean setting clear standards and responsibilities from the beginning.",
        "A capable person may be guiding you or the group, creating favorable conditions for meaningful results.\n\nThis can be a strong period in which your work is recognized and evaluated positively.\n\nIf good leadership is already in place, it is better to trust the structure and make the most of it.",
        "This may be like being on a ship that is already beginning to sink.\n\nIf someone without enough ability is leading the group, continuing to follow that direction can bring serious loss.\n\nBe careful not to remain committed to poor leadership simply because the group has already begun moving.",
        "Circumstances may be working against you, making it difficult to move forward effectively.\n\nIn a period like this, stepping back can be the wiser choice.\n\nA strategic retreat is not the same as giving up. Creating distance now may protect your strength and give you a better position later.",
        "If there is something you genuinely want to accomplish, this may be a time to approach it actively.\n\nHowever, the people you choose to work with will matter greatly.\n\nBuild your team around those who have the ability and experience the situation requires. Working closely with people who are unprepared or unreliable may lead to significant loss.",
        "What you have been working toward may now bring substantial results.\n\nIf success comes, remember the people who helped you reach it and share the rewards generously.\n\nAt the same time, be careful about who receives important authority, responsibility, or sensitive information.\n\nTrust and responsibility should be given to people who have shown that they can carry them well."
      ]
    },
    "2_4": {
      "key": "2_4",
      "name": "Sheng",
      "gua": "This may be a time to step forward as things begin to open and rise.\n\nObstacles that once held you back may gradually clear, allowing you to move upward and receive fair recognition for your efforts.\n\nThere is no need to rush. If you continue one step at a time with patience and consistency, even a large goal may become achievable.\n\nAdvice from an experienced person, mentor, or someone in a higher position may be especially helpful now. If you remain open to guidance, you may be able to reach your goal without major difficulty.",
      "yao": [
        "If there is someone experienced who can guide you, it may be wise to trust their direction and learn from them.\n\nA newly sprouted seed holds great potential, but it may not yet have enough strength to break through on its own.\n\nFor now, accepting the right support can help you grow more steadily.",
        "Even if you feel that what you have is far from enough, sincerity and a steady attitude can still carry you a long way.\n\nIf you approach what you are doing with honest intentions and consistent effort, you may be able to reach the goal you have in mind.",
        "Things may move forward with surprisingly little resistance.\n\nLike entering an empty house with no one standing in the way, progress may come more easily than expected.\n\nThis can also be a period when your value, position, or recognition rises quickly.",
        "By approaching your work with a sincere attitude and continuing to put steady effort into it, things may unfold with very few serious obstacles.\n\nConsistency and care may be enough to carry you forward smoothly.",
        "You may be growing step by step, almost like climbing a staircase through steady effort and discipline.\n\nThis kind of gradual progress can bring clear rewards and results that match the work you have put in.\n\nThe most important thing now is to remain steady and keep your intentions clear without being easily shaken.",
        "You may have risen far, yet the path ahead can begin to feel like a dark night where it is difficult to see clearly.\n\nThis is a time to look at your current position objectively.\n\nRather than continuing to push forward simply because you have come this far, know when to pause. A well-timed stop may help you avoid unnecessary trouble."
      ]
    },
    "2_9": {
      "key": "2_9",
      "name": "Ming Yi",
      "gua": "This may feel like a moonless night, when your efforts are difficult for others to see or recognize.\n\nEven if you work hard, the people around you may not fully understand your ability or value. Rather than avoiding the difficulties in front of you, it is better to face them quietly while remaining flexible in how you deal with the outside world.\n\nThis may be a time to lower your profile, strengthen your foundation, and protect what matters inwardly.\n\nIf you remain steady and hold to what you know is right without becoming impatient, your efforts may eventually bring results. For now, it is better to wait for the right timing rather than forcing recognition or progress.",
      "yao": [
        "It is better not to step forward too quickly.\n\nAs conditions begin to weaken, focus on maintaining stability rather than trying to expand or prove yourself.\n\nKeep a low profile, watch the situation carefully, and avoid unnecessary movement.",
        "Things may be moving in a difficult direction, making the situation feel unstable.\n\nFortunately, help may appear at the right moment and allow you to pass through without serious harm.\n\nTry not to make things harder through unnecessary stubbornness. Accepting support when it is offered may be especially important now.",
        "You may feel lost and uncertain about where you are or which direction to take.\n\nThis difficulty may be something you need to work through largely on your own.\n\nRather than beginning something new, it is better to pause, regain your sense of direction, and avoid acting from confusion.",
        "You may feel that no one truly understands or trusts you, while people who seem less deserving receive confidence and attention instead.\n\nThe situation may feel as though you have reached a dead end.\n\nStay alert and be especially careful with your words and actions. This is not a time to give others unnecessary reasons to misunderstand you.",
        "The long period of darkness may finally be beginning to lift, like the first light appearing on the horizon.\n\nThings that were difficult or blocked can gradually start to improve.\n\nYou have already endured one of the hardest parts with patience and steady effort, so meaningful results may now begin to emerge.",
        "No matter how hard you struggle, this may be a time when very little responds to your effort.\n\nIt is better to remain still and avoid impulsive action, like a wet leaf resting firmly against the ground.\n\nTrying to force the situation to change may lead to losses that become difficult to control.\n\nFor now, preserving yourself and waiting may be far wiser than pushing forward."
      ]
    },
    "2_7": {
      "key": "2_7",
      "name": "Lin",
      "gua": "This may be a time to lead with the depth and generosity of a quiet lake.\n\nYou may have the ability to stand above others or take on greater responsibility, so it is important to trust yourself. At the same time, this period calls for balance and the ability to embrace both those above and below you without leaning too strongly toward either side.\n\nThis can be a highly active and favorable time to move forward with confidence.\n\nHowever, every rising period eventually changes. Like the sun that rises and later sets, favorable momentum will not remain at its peak forever.\n\nStep forward boldly, but do not miss the right moment to turn opportunity into clear results. Wise judgment and thoughtful conduct will matter just as much as confidence.",
      "yao": [
        "This may be a good time to accept advice from someone more experienced and take an active approach to what you are doing.\n\nIf a problem arises, it is better to deal with it directly and honestly rather than relying on tricks or shortcuts.\n\nIf you avoid rushing and communicate sincerely, things may move toward a favorable result.",
        "How you conduct yourself around others may be especially important now.\n\nYour reputation and the way people perceive you can have a strong influence on what happens next.\n\nSomeone in a position of authority may not be fully supportive of what you are trying to do. Pay close attention to the people around you and try to build understanding before pushing your plans forward.\n\nWithout that support, progress may be more difficult than expected.",
        "Even if you now hold greater authority, be careful not to use it too aggressively.\n\nIf you rely only on power or pressure, people may begin to distance themselves, making your goals harder to achieve.\n\nTreat those around you with generosity and respect. Earning their trust may be more important than simply having the final say.",
        "This is not a good time to hand everything over to others or approach the situation too cautiously.\n\nIf there is something new that needs to be done, it may be better to take the initiative yourself and lead it actively.\n\nBy becoming directly involved and moving with purpose, you may avoid unnecessary difficulties.",
        "Confidence in yourself may be especially important now.\n\nIf you move at the right time and remain aware of the changing situation, what you are trying to accomplish may unfold very well.\n\nTry to understand the feelings of those who follow or work with you. If you can earn their genuine support, strong results may follow.",
        "It may be beneficial to work with people who bring fresh energy, especially younger or more dynamic members of a group.\n\nApproach them with warmth, trust, and generosity.\n\nRather than focusing only on your personal position, consider what serves the group as a whole. If you move forward with mutual respect, things may progress smoothly without major trouble."
      ]
    },
    "3_6": {
      "key": "3_6",
      "name": "Da Zhuang",
      "gua": "This may be a time when your strength and momentum finally begin to work in your favor.\n\nIt can be an excellent period for pursuing a major goal, expanding your work, or taking on something larger than usual.\n\nHowever, strong momentum can easily turn into overconfidence. If you ignore the people around you or try to control everything alone, unexpected trouble may follow.\n\nThings may also look more impressive on the surface than they truly are. Before making a major move, take time to examine the situation carefully and make sure the foundation is solid.",
      "yao": [
        "You are still at the beginning.\n\nEven if you already feel that you have gained some control over the situation, it may be better to wait a little longer before stepping forward.\n\nWatch the circumstances carefully and keep reliable people close to you.",
        "It is important to keep your intentions clear and be thoughtful about how you carry yourself.\n\nYou may have more strength and influence than usual, which makes restraint especially important.\n\nThere is no need to act simply because you have the power to do so.",
        "A small problem may grow quickly if it is ignored.\n\nTake time to examine possible risks and address anything that seems unstable before moving further.\n\nIf you overlook warning signs now, the situation may become much harder to manage later.",
        "A problem may already have been handled before it could become serious, allowing the path ahead to open again.\n\nBy understanding the situation accurately and acting at the right time, you may find that progress becomes much smoother.\n\nThis can be a favorable stage for putting clear decisions into action.",
        "Sometimes giving up something small can prevent a much greater loss.\n\nThis may be a time to lower yourself slightly and accept a limited sacrifice rather than insisting on having everything your way.\n\nRelease some of the tension, stay flexible, and make an effort to maintain good relationships with the people around you.",
        "You may feel caught in a situation where neither advancing nor retreating seems easy.\n\nTrying to escape through clever tricks or shortcuts could make matters worse.\n\nInstead of avoiding the problem, it may be better to face it directly and deal with what is actually in front of you.\n\nIf you approach the situation with clarity and courage, a difficult moment may eventually turn into an opportunity."
      ]
    },
    "3_2": {
      "key": "3_2",
      "name": "Yu",
      "gua": "This may be a time for a fresh start and active movement toward the future.\n\nIf you make clear plans and move forward with good judgment, things may progress smoothly. You may also find yourself able to respond quickly, make confident decisions, and guide others with greater ease.\n\nWorking together with capable and supportive people can make this period even more favorable.\n\nHowever, confidence can easily turn into arrogance. Be careful not to overestimate yourself or act as though success is guaranteed.\n\nA humble attitude will help you make better use of the opportunities around you.",
      "yao": [
        "You may be tempted to take too much credit for what others have done or to present yourself as more capable than you truly are.\n\nIf ambition becomes excessive, it can seriously damage your position or reputation.\n\nThis is not a favorable time to begin something new. It is better to remain modest and avoid drawing unnecessary attention to yourself.",
        "There may be many temptations around you, but you are capable of resisting them.\n\nBy staying within your limits and continuing along a steady path, you may avoid major difficulty.\n\nRemain grounded and do not let short-term pleasure distract you from what matters.",
        "You may suddenly realize that you have been too distracted or careless and that things cannot continue in the same way.\n\nThis is a time to adjust your behavior to the reality of the situation.\n\nIf your current environment or position is no longer helping you move in the right direction, it may be better to leave without lingering too long.",
        "You may be able to move forward with confidence while maintaining good harmony with the people around you.\n\nThere is much to gain when self-belief is balanced with humility and cooperation.\n\nIf you continue to work well with others, what you are trying to accomplish may bring substantial results.",
        "You may be facing a problem after allowing comfort or enjoyment to go too far.\n\nDo not avoid the difficulty.\n\nIf you remain persistent and actively work to resolve it, serious damage may still be prevented.\n\nTry not to be pulled in different directions by the people around you. Trust your own judgment and keep working through the problem until the situation becomes stable again.",
        "You may believe that you are simply enjoying life, while excessive indulgence is beginning to weaken the reputation or position you have built over time.\n\nIt is not too late to stop.\n\nIf you recognize what has gone wrong, learn from it, and begin making a sincere effort again, the consequences of past mistakes may still be resolved without lasting harm."
      ]
    },
    "3_3": {
      "key": "3_3",
      "name": "Zhen",
      "gua": "This may be a time filled with energy and momentum, but it is important to make sure that your efforts lead to something substantial.\n\nIf you set a clear goal and continue working toward it, there may be a strong chance of making meaningful progress.\n\nHowever, outward activity can sometimes look more impressive than the actual results. Be careful not to let ambition grow faster than the effort required to support it.\n\nKeep your goals and plans clear, and try not to be distracted by noise or reactions around you.\n\nIf difficulties arise, there is no need to handle everything alone. Asking for help at the right time may be the wiser choice.",
      "yao": [
        "You may receive more praise or attention than the situation seems to justify, which can feel somewhat burdensome.\n\nEven so, this may still lead to a favorable result.\n\nIf you reflect on yourself, look at the situation clearly, and prepare carefully, unexpected problems are unlikely to cause serious harm.",
        "This may be a time when some loss is difficult to avoid.\n\nEven if the loss is small, it may be better to let go quickly rather than remain attached to what has already begun to slip away.\n\nHolding on too long can place you in a more dangerous position.\n\nBy accepting a limited loss now, you may create a better chance of recovering what was lost later.",
        "The situation around you may feel noisy or unsettled, making it easy to become anxious.\n\nTry not to let that fear control your direction.\n\nIf you quietly continue with what you need to do, you may be able to move forward without major difficulty.",
        "A problem around you may briefly affect your situation, but fortunately it is unlikely to cause serious harm.\n\nThings may feel frustrating or blocked, yet the actual damage may be limited.\n\nThere is no need to react more strongly than the situation requires.",
        "You may worry that something serious is about to go wrong, but the situation may prove less dangerous than it appears.\n\nEven if things look complicated on the surface, they may pass without major trouble.\n\nStay alert, but avoid allowing anxiety to make the situation larger than it really is.",
        "The trouble may be falling on someone else rather than directly on you.\n\nBe careful not to step in unnecessarily and create problems for yourself.\n\nIt may be better to remain where you are, keep your position steady, and quietly observe how the situation develops."
      ]
    },
    "3_8": {
      "key": "3_8",
      "name": "Xiao Guo",
      "gua": "This may be a time to keep things small, simple, and manageable.\n\nRather than expanding too quickly or taking on something beyond your current capacity, it is better to reduce the scale and focus on what you can realistically handle.\n\nEven if things seem to be going well, difficulties may arise if you stretch yourself too far. If that happens, returning to your original work or familiar foundation may be the safer choice.\n\nThis is not necessarily a period of strong momentum, and some loss may be possible. Take time to reflect on your limits, remain patient, and move carefully through this stage.",
      "yao": [
        "You may be especially vulnerable to becoming the focus of a problem or suffering a serious loss.\n\nAvoid excessive ambition and do not cross boundaries simply because you feel impatient or confident.\n\nIf you are considering beginning something new, it may be better not to start yet.",
        "The first priority is to understand exactly what you want and identify the true heart of the situation.\n\nIf you ignore necessary steps and move forward based only on desire, without checking the details carefully, you are unlikely to obtain the result you want.\n\nTake time to understand the process before acting.",
        "Do not ignore your own mistakes or weaknesses simply because they seem manageable for now.\n\nCorrect what needs to be corrected before the consequences return in a more serious form.\n\nThis may require dealing with an uncomfortable issue directly rather than allowing it to remain.\n\nBe careful not to rely too heavily on your own strength or act entirely on your own judgment, as this can create unnecessary opposition around you.",
        "What looks like a small weakness may eventually lead to a much greater loss if it is left unattended.\n\nWatch the situation carefully and remain alert to small warning signs.\n\nIf you understand your limits and act with good judgment, what you are trying to do may continue without major difficulty.",
        "You may feel that the right moment has arrived, yet the results are still not appearing.\n\nThe conditions may simply not be ready yet, so it is better to wait rather than force progress.\n\nRemain modest and avoid rushing ahead. If you work together with someone who has strong ability and experience, good results may become possible in the near future.",
        "Excessive ambition may now bring serious trouble.\n\nSomething that first appeared to be a small mistake can grow beyond your control, making it very difficult to repair the situation on your own.\n\nThis is a time to recognize limits early and avoid allowing a manageable problem to become something much larger."
      ]
    },
    "3_1": {
      "key": "3_1",
      "name": "Jie",
      "gua": "This may be a time when life begins to feel lighter and more open again.\n\nIt can be a favorable period for moving toward a new goal, while problems that have felt blocked or difficult may finally begin to loosen and resolve.\n\nHelpful people may appear, making it easier to begin new activities or explore different possibilities. However, if your goals are unclear and you approach things without enough care, you may lose some of the advantage this period offers.\n\nIf there is something you genuinely want to do, it may be better not to hesitate for too long. If you do not yet have a clear goal, use this time to strengthen your foundation and develop your abilities.",
      "yao": [
        "A helpful person may appear, allowing what you are trying to do to move forward more smoothly.\n\nEven so, the most important thing is to understand your current situation clearly and act in a way that fits it.\n\nGood support can help, but sound judgment about your own position still matters.",
        "If you lose your sense of balance or direction, progress may become difficult.\n\nLet go of unnecessary impatience and move through what needs to be done one step at a time.\n\nIf you remain steady and follow the process carefully, you may reach your goal. Financial conditions may also improve along with that progress.",
        "Some people may try to use your dissatisfaction or frustration for their own benefit.\n\nTake a careful look at how you are dealing with others and remain firmly grounded in your own judgment.\n\nThis may not be an easy time to begin something entirely new, especially if the people around you have unclear motives.",
        "Rather than remaining only within familiar circles, it may be beneficial to step into a new environment.\n\nNew connections can lead to strong cooperation and open possibilities that were not available before.\n\nIf you are willing to meet different people and work with them openly, what you are trying to accomplish may bring meaningful results.",
        "A problem that has felt frustrating or blocked may finally begin to resolve.\n\nEven someone who disagreed with you or seemed difficult to work with may become unexpectedly helpful if you choose not to exclude them.\n\nReaching out first can help change the direction of the situation.\n\nIf you continue to reject people simply because they do not naturally align with you, the situation may become stagnant again.",
        "This may be a time to let go of unnecessary pride and the desire to protect your existing position.\n\nWhat has been tightly blocked may finally open completely, allowing you to reach what you want much more quickly than before.\n\nThis can be a strongly favorable period, especially if you are willing to release what no longer needs to be defended."
      ]
    },
    "3_4": {
      "key": "3_4",
      "name": "Heng",
      "gua": "This may be a time to move through life with steadiness and consistency.\n\nIf you maintain what is already working, things may continue to unfold smoothly. Trying to create unnecessary change simply because stability feels boring can lead to impatience, confusion, and loss.\n\nKeep your own center and continue making steady efforts over time.\n\nThis is not a period to rely on luck or sudden breakthroughs. Consistency may be more valuable than speed.",
      "yao": [
        "Excessive desire may make it difficult to see meaningful results.\n\nYour determination may be strong, but if you cannot remain still long enough to let things develop, what you are trying to accomplish may not turn out well.\n\nIt is better to reduce unnecessary movement and give your efforts time to take root.",
        "You may find yourself in the wrong environment or position, causing small problems to arise from several directions.\n\nIf you remain true to yourself and deal with each issue steadily, one at a time, the situation can gradually improve.\n\nYour persistence may eventually bring worthwhile results, leaving little reason for regret.",
        "Relying too heavily on your own ability may lead you to step into situations where your involvement is not needed.\n\nAs a result, things may stop moving in the way you hoped.\n\nThis may be a time to hold yourself back, strengthen your foundation, and avoid unnecessary interference.\n\nWhat you are trying to do may remain temporarily stuck rather than moving forward.",
        "If you keep changing direction and chasing one thing after another, little may come from your efforts.\n\nLooking constantly outside yourself while neglecting what truly matters to you can leave you with nothing substantial.\n\nReturn to what deserves your steady attention and remain with it long enough to see results.",
        "Your attention may feel unsettled, making it difficult to focus or follow through.\n\nFrom a lower or less responsible position, this may not create much difficulty. But if others depend on you, inconsistency can weaken their trust.\n\nThis may not be a favorable time for important plans unless you can regain stability and become more dependable.",
        "You may be losing your center and creating distance from people who have been genuinely supportive.\n\nAs trust begins to weaken, it can become difficult for anything to move forward smoothly.\n\nRather than continuing in a scattered direction, it is better to recognize what has been lost and return to a steadier way of relating to yourself and others."
      ]
    },
    "3_9": {
      "key": "3_9",
      "name": "Feng",
      "gua": "This may be a time of outward abundance, while your inner strength needs careful attention.\n\nThings may appear prosperous and active, but the foundation beneath them can gradually weaken if it is not properly maintained.\n\nIf there is something you have been carrying for a long time, it may be better to use good judgment and bring it to a clear conclusion rather than allowing it to drag on.\n\nFor now, protecting and managing what you already have may be more important than expanding into something entirely new.",
      "yao": [
        "If you rely too heavily on your own ability and disregard others, there may be consequences.\n\nEven when you feel confident in what you can do, it is better to treat the people around you with respect.\n\nYour strength will serve you better when it does not turn into arrogance.",
        "This may be a time to focus fully on the responsibilities already in your hands and continue developing your own abilities.\n\nTrying too hard to draw attention to yourself or prove your value may have the opposite effect and create a poor impression.\n\nLet your work speak for itself and continue building your skills quietly.",
        "You may have both ability and good character, yet still feel that no one truly recognizes what you bring.\n\nThis can be a lonely and frustrating period.\n\nIf that frustration causes you to become bitter or act against your better judgment, the situation may only worsen and even supportive people may begin to distance themselves.\n\nWhat you hope to achieve may be difficult for now, so it is better not to let disappointment damage what you still have.",
        "Even during a difficult period, you may meet someone willing to support or work with you.\n\nThrough that connection, you may find your way toward an environment or position that suits you better.\n\nWhat you are trying to accomplish may develop favorably with the right cooperation.",
        "Even if you have weaknesses or areas where you lack experience, wise and capable people around you may help fill those gaps.\n\nTheir support can improve both your reputation and your chances of accomplishing what you want.\n\nThis can be a favorable time to accept good advice and work together rather than trying to do everything alone.",
        "Just as the full moon eventually begins to wane, the favorable momentum around you may gradually weaken.\n\nFinancial loss is possible, and some relationships may naturally fall away during the process.\n\nThis is a time to lower your profile, protect what remains, and wait patiently for conditions to change.\n\nIf you are considering pushing forward with something important, it may be better not to force it now."
      ]
    },
    "3_7": {
      "key": "3_7",
      "name": "Gui Mei",
      "gua": "This may be a time when slowing down leads to better results than rushing ahead.\n\nIf you act too quickly under the influence of emotion, you may be more likely to suffer loss or regret. Ignoring proper steps and looking for shortcuts can create even greater risks.\n\nRather than starting a new venture or making a major change, it may be better to observe the situation objectively and give yourself room to pause.\n\nDo not rely on luck or clever shortcuts. Following a clear and proper path is likely to be the safest approach.",
      "yao": [
        "If you quietly fulfill your responsibilities where you are now, a good opportunity may eventually come to you.\n\nThere is no need to overreach.\n\nIf you move toward what you want in a steady and natural way, meaningful results may be possible.",
        "This may be a favorable time for your abilities to be recognized.\n\nEven so, it is better not to make an important decision too quickly.\n\nIf you remain patient and wait for the timing that truly works in your favor, the outcome may be much better.",
        "If you ignore basic principles and push forward emotionally, loss may follow.\n\nTrying to manipulate the situation or taking reckless action can create serious obstacles.\n\nIt is better to regain your balance and avoid forcing what is not ready to move.",
        "Your expectations may be high, but it may be difficult for reality to meet every condition exactly as you want.\n\nRather than insisting only on your own position, some reasonable compromise may be necessary.\n\nIf you remain flexible and do not miss the right timing, you may still reach a result that satisfies what matters most.",
        "Let go of unnecessary appearances and pride, and try to maintain a simple and modest attitude.\n\nIf you respect the other person and respond flexibly to the timing and circumstances, the situation may become beneficial for both sides.\n\nWith mutual consideration, what you are trying to do may proceed smoothly.",
        "The situation may look convincing from the outside while lacking anything substantial underneath.\n\nEven if you try to force progress, there may be little genuine support, leaving you with effort but no meaningful result.\n\nIt is better not to push yourself forward simply to maintain appearances."
      ]
    },
    "8_6": {
      "key": "8_6",
      "name": "Da Xu",
      "gua": "This may be a time to bring what you have steadily built into the wider world.\n\nThe skills, experience, and inner strength you have accumulated over time may now be ready to be used more fully.\n\nRather than remaining focused on small personal gains or limiting yourself to a narrow view, it may be better to aim higher and move toward a broader field.\n\nThis can be a favorable time to leave familiar ground and take more active steps forward.\n\nEven if difficulties arise, the experience you have already gained can help you face them directly. The process may still take time and effort, but the results may become all the more valuable because of it.",
      "yao": [
        "The situation may still be somewhat unstable, so this is not yet the right moment to move too quickly.\n\nEven if you feel that you understand what is happening, it may be better to remain patient and wait for the timing to become clearer.\n\nIf you are considering beginning something new, pausing for now may protect you from unnecessary risk.",
        "This may be like a fast-moving car suddenly getting a flat tire.\n\nNo matter how much momentum you had, progress becomes difficult until the problem is addressed.\n\nTrying to force things forward may only create confusion and greater risk.\n\nFor now, it is better to remain cautious, avoid unnecessary action, and wait until the situation is properly restored.",
        "The right moment may finally have arrived.\n\nYou may now be able to move forward with strong momentum and face difficult tasks without being easily blocked.\n\nFinancial conditions may also improve, and you may be better able to protect what rightfully belongs to you.\n\nThis can be a highly favorable period for growth and expansion.",
        "It is important to anticipate what may come and prepare carefully before problems develop.\n\nPay close attention to the people around you, especially those who may still be uncertain or easily shaken in the early stages.\n\nIf you help steady them with care, the process may also bring you a strong sense of satisfaction and meaning.",
        "Your ability to read the situation in advance and respond appropriately may become especially valuable now.\n\nEven if you hold a strong position, there is no need to force others into submission.\n\nIf you guide the situation sincerely and allow things to develop in a balanced way, what you are trying to accomplish may unfold in your favor.",
        "You may now have built the experience, strength, and ability needed to move forward with confidence.\n\nThe foundation is strong, and the path ahead may open widely.\n\nProjects or ventures you pursue can grow substantially, and many things may begin to move with far fewer obstacles than before."
      ]
    },
    "8_2": {
      "key": "8_2",
      "name": "Bo",
      "gua": "This may be a time to let go, simplify, and protect what truly needs to remain.\n\nLike a high mountain slowly worn down by wind and rain, you may feel that what you once had is being reduced and that the limits of your current strength are becoming clearer.\n\nIf conflict, criticism, or damaging rumors arise, it is better not to fight back. Avoiding unnecessary confrontation may protect you far more than trying to prove yourself.\n\nThis is not a favorable time to force new plans or display your abilities. Even sincere effort may go unnoticed, while losses can continue to accumulate.\n\nLet go of what clearly cannot be saved, and preserve only the essential seed that can carry you into the future. For now, patience, restraint, and careful preservation may be the wiser path.",
      "yao": [
        "The situation may begin to go wrong from the very start, and a reputation or position you worked hard to build can weaken quickly.\n\nYou may also find yourself forced to take on responsibilities you never wanted.\n\nIf you are considering beginning something new, this may be a particularly unfavorable time to do so.",
        "You may experience emotional or physical strain, or even be pushed out of a place or position you once relied on.\n\nThe situation may feel unfair and deeply unwanted.\n\nEven so, reacting impulsively can create even greater loss. For now, enduring carefully and protecting yourself may be more important than fighting the situation.",
        "This may be a time to leave behind a group, relationship, or environment that no longer offers any real hope.\n\nDo not remain attached to something that has already become too weak to support you.\n\nIf you are willing to cut ties decisively and put your full effort into finding a way out, you may be able to move through the difficulty without greater harm.",
        "The situation may now be reaching its most difficult point.\n\nWhat clearly cannot be continued may need to be brought to a complete end rather than dragged forward out of attachment.\n\nTrying to maintain appearances without addressing the real problem is unlikely to bring anything useful.\n\nIf there is something you are trying to push ahead, this may be a strongly unfavorable time to force it.",
        "By lowering yourself and avoiding the need to prove how capable you are, you may begin to receive more positive attention and support from those around you.\n\nYou may finally step away from a period of repeated loss and regain a clearer sense of your proper role.\n\nAs you return to what truly matters, useful opportunities and resources may begin to gather again.",
        "After enduring a severe period of difficulty, the strength that remains may finally gather into something solid.\n\nIt may be like a fallen fruit returning to the soil and quietly becoming the beginning of new life.\n\nBecause you endured without demanding immediate reward, this period may eventually bring clear compensation and meaningful results."
      ]
    },
    "8_3": {
      "key": "8_3",
      "name": "Yi",
      "gua": "This may be a time when words carry unusual weight.\n\nA single careless remark can create consequences far greater than expected, so it is especially important to be thoughtful in both speech and behavior.\n\nThis can still be a suitable period for planning something new or looking for work, but excessive ambition may quickly create loss.\n\nMove step by step, accept help from the people around you, and strengthen your foundation rather than trying to accomplish too much at once.\n\nIf there is a flawed system, repeated mistake, or problem that clearly needs correction, it may be better to address it properly even if some conflict follows.",
      "yao": [
        "You may be paying too much attention to what others have while neglecting what is already yours.\n\nEven if someone else’s situation looks more attractive, be careful not to let envy turn into unnecessary desire.\n\nThis may not be a favorable time to begin something new impulsively.\n\nRemain steady and take care of what is already in your hands.",
        "This may be a time when you need to make your own way through a difficult environment and create results through effort.\n\nDuring that process, avoid shortcuts or unfair methods.\n\nIf you try to gain an advantage through questionable means, you may lose the trust of good people around you and damage your reputation.\n\nWhen problems arise, dealing with them honestly is the best way to prevent further trouble.",
        "You may feel strongly tempted to gain something through clever shortcuts or easy advantages.\n\nBut ambition that exceeds your actual position can lead to serious trouble and lasting embarrassment.\n\nWhat seems like a quick gain may create problems that continue for a long time.\n\nIf you are trying to push something forward now, it may be better to stop before the situation becomes more difficult.",
        "A competitor or rival may be watching closely for an opportunity to take advantage of your work or position.\n\nStay alert and protect what you have built carefully.\n\nThere is no need to become overly anxious, however.\n\nIf you prepare calmly and pay attention to what is happening around you, you may be able to protect yourself and resolve the situation without major difficulty.",
        "This may be a time to stay where you are for a while and focus on developing your abilities.\n\nDo not make a reckless move simply because your pride has been hurt or because you feel impatient.\n\nActing from anger or wounded pride may bring only unnecessary loss.\n\nIf you quietly strengthen your foundation, what you are working toward may unfold more favorably.",
        "It is important to seek results and solve problems in a fair and proper way.\n\nIf you overestimate your own ability or allow questionable motives to guide you, loss may become difficult to avoid.\n\nLet go of excessive desire, respect the proper order of things, and keep your intentions clear.\n\nSome risk or difficulty may still arise along the way, but if you remain steady and act with integrity, the situation may ultimately lead to a favorable result."
      ]
    },
    "8_8": {
      "key": "8_8",
      "name": "Gen",
      "gua": "This may be a time to pause and rest before moving forward again.\n\nIt can feel like one mountain rising behind another, with obstacles appearing no matter which direction you look.\n\nRather than forcing yourself ahead, it may be better to stop where you are and observe the situation carefully.\n\nIf you allow excessive desire to push you into action, you may create more difficulties and unnecessary loss.\n\nTry not to pursue two major things at once. Focus on what is already in front of you.\n\nIf you remain steady, resist distractions, and use this period to strengthen yourself, what you build now may become very helpful later.",
      "yao": [
        "This may be a time to strengthen your foundation rather than begin something new.\n\nAvoid moving too quickly.\n\nMaintaining your current position and taking good care of what is already in place may be the most favorable choice for now.",
        "This is not yet the time to move forward aggressively.\n\nIf you force progress, you may find yourself running into obstacles at every step.\n\nEven if attractive opportunities or tempting suggestions appear, staying quietly where you are may help prevent unnecessary loss.",
        "An unwanted result may leave you feeling frustrated, restricted, or under considerable stress.\n\nBe careful not to involve yourself unnecessarily in other people’s problems.\n\nFocus quietly on your own responsibilities. This may help prevent the situation from becoming even more complicated.",
        "This may be a time to avoid interfering too quickly in other people’s affairs or offering advice that has not been asked for.\n\nStep back and observe what is happening around you with care.\n\nIf you remain cautious and act thoughtfully, the situation may pass without significant loss.",
        "A careless remark may create unnecessary trouble, so it is especially important to be thoughtful with your words.\n\nBefore speaking, take time to understand the full situation and consider how your words may be received.\n\nIf you manage your communication carefully, you may avoid later regret or financial loss.",
        "Take a careful look at whether there is anything you have overlooked.\n\nThis may be a time when detailed review and careful attention are especially valuable.\n\nIf you resist excessive ambition and know exactly when to stop, that restraint may help what you are working toward reach a favorable result."
      ]
    },
    "8_1": {
      "key": "8_1",
      "name": "Meng",
      "gua": "This may be a time to lower yourself, remain open, and learn from those who know more.\n\nThe path ahead may feel unclear, almost like standing in thick fog. Experience or information may still be lacking, so it is better not to rely only on your own judgment.\n\nSeeking advice from a trustworthy mentor, experienced person, or expert can be especially helpful now.\n\nOnce you have chosen someone whose guidance you trust, try not to keep doubting every step and losing your direction. Listen carefully, learn with humility, and continue steadily.\n\nResults may not appear quickly, but your potential for growth is still strong. If you remain patient and build your abilities step by step, meaningful results may gradually begin to emerge.",
      "yao": [
        "Lack of experience may bring unexpected difficulties, and things may not unfold as smoothly as you hoped.\n\nRather than forcing your way out of a frustrating situation, it is better to strengthen your foundation and wait for conditions to improve.\n\nPatience and preparation may help prevent unnecessary loss.",
        "This may be a very favorable time for guiding and supporting the people around you with patience and generosity.\n\nMore people may begin to trust and follow you.\n\nPleasant events, good news, or even several reasons to celebrate may arise, and what you are working toward can move forward very smoothly.",
        "You may be lacking both the determination to change the situation and the willingness to learn something new.\n\nWithout a clear center, it becomes easy to be pulled in different directions.\n\nBe especially careful not to make an important choice based on a shallow temptation or poor judgment. A careless decision now may lead to lasting loss or difficulty.",
        "You may be struggling because you do not yet understand the situation clearly.\n\nIf you become stubborn and continue looking at things from a narrow perspective, your judgment may become even less reliable and losses may grow.\n\nIt is better to stop anything you were planning to push forward alone.\n\nWhat you are trying to accomplish may be quite difficult under the current conditions.",
        "Even if your own ability or experience is still limited, you may be able to reach what you want by following the guidance of a capable mentor or supporter.\n\nTrustworthy teaching can help you move beyond what you could manage alone.\n\nIf you receive that guidance with humility rather than constantly questioning it, meaningful results may follow.",
        "You may finally be moving out of a long and frustrating period.\n\nIf you continue without relying on shortcuts or questionable methods, and instead follow clear and proper principles, future situations may begin to resolve more favorably.\n\nThis can be a time when confusion gradually gives way to clearer direction."
      ]
    },
    "8_4": {
      "key": "8_4",
      "name": "Gu",
      "gua": "This may be a time to leave stagnant conditions behind and reflect honestly on what needs to change.\n\nLike water left standing for too long, problems within your environment, organization, or personal situation may have been quietly building beneath the surface.\n\nIgnoring them will not make them disappear. This is a time for serious self-reflection and for correcting unhealthy habits, outdated systems, or unresolved problems at their root.\n\nChoosing comfort simply because it feels easier now may lead to greater loss later.\n\nDo not rush into new business, agreements, or major plans. First, deal directly with the problems already inside the situation. Once the foundation has been properly cleared and repaired, the overall direction may begin to change.",
      "yao": [
        "You may find yourself dealing with problems left behind by someone above you or by a previous person in charge.\n\nThe situation can feel frustrating and unfair, especially when the responsibility was never yours to begin with.\n\nEven so, if you identify the real source of the problem and work through it steadily, your effort may eventually lead to a good result.",
        "You may need to take responsibility for correcting problems created by people around you or by someone in a higher position.\n\nTake an active role in resolving what needs to be fixed, but avoid trying to overturn everything at once.\n\nThis is not a good time to force a complete transformation or begin something entirely new. Excessive change may create more loss than improvement.",
        "You may be handling an old problem in a way that is more direct or forceful than the usual customs or expectations allow.\n\nSome friction and risk may follow.\n\nEven so, if your direction is clear and you remain committed to resolving the issue properly, the situation may be brought under control without major loss.",
        "You may be so eager to improve the situation that your involvement begins to make things more complicated.\n\nIt may be better to keep some distance from the person in charge and observe carefully before stepping in.\n\nIf you act too quickly or try to force progress, the situation can become increasingly tangled and difficult to repair.",
        "This may be an excellent time to resolve long-standing problems that have caused repeated difficulty.\n\nAt the same time, you may be able to carry forward the valuable opportunities or strengths that deserve to remain.\n\nIf you handle both sides well, you may accomplish what you intended and gain greater trust, recognition, or respect from the people around you.",
        "This may be a time to look at the situation calmly and accept the larger direction of events.\n\nYou may already have gained what was worth gaining from this stage.\n\nRather than becoming attached and trying to push further, it may be wiser to bring things to a graceful conclusion.\n\nIf you continue simply because you want more, unnecessary loss may follow."
      ]
    },
    "8_9": {
      "key": "8_9",
      "name": "Bi",
      "gua": "This may be a time to strengthen what is within rather than focusing too much on outward appearance.\n\nIf you spend too much energy following trends, impressing others, or making things look more impressive than they are, you may eventually create inner strain and financial loss.\n\nRather than taking on something too large or chasing unrealistic goals, it is better to give careful attention to the smaller tasks already in front of you.\n\nWork related to learning, education, art, or culture may be especially favorable during this period.",
      "yao": [
        "This may be a time to prepare yourself carefully for a new beginning and take the first step forward.\n\nLet go of unnecessary vanity and move at a pace that suits your actual situation.\n\nIf you prepare steadily and build from where you are, favorable opportunities may continue to appear and what you are trying to do may unfold smoothly.",
        "This may be a time to share your progress and happiness with the people around you.\n\nIf you cooperate with those above you or with your peers while maintaining mutual respect and good judgment, your combined efforts may create even better results.\n\nWorking together can bring both greater satisfaction and positive progress in what you are pursuing.",
        "You may be working hard toward a goal and putting sincere effort into developing yourself.\n\nBecause your energy is being used in the right place rather than wasted on appearances or distractions, your effort may begin to show clearly.\n\nWhat you build through steady work may continue to bring benefits and positive results for a long time.",
        "You may be moving toward your goal together with people who genuinely share your direction.\n\nThe environment around you may also be supportive, helping your efforts move more smoothly.\n\nWith the right people beside you and favorable conditions around you, what you are trying to accomplish may lead to a satisfying result.",
        "Things may become temporarily complicated because you feel that you do not have enough, or because the situation does not look as impressive as you hoped.\n\nHowever, appearances are not what matter most now.\n\nIf you let go of unnecessary formality and approach the situation with simplicity and sincerity, misunderstandings may gradually clear even if some friction occurs along the way.\n\nA favorable result may still follow.",
        "You may be reaching a point where you understand that true beauty does not require unnecessary decoration.\n\nBy letting go of excessive presentation and returning to what feels most genuine and essential to you, the situation can become much clearer.\n\nIf you rely on sincerity rather than appearances, things may proceed cleanly without significant trouble or loss."
      ]
    },
    "8_7": {
      "key": "8_7",
      "name": "Sun",
      "gua": "This may be a time to let go of personal desire and look at the situation from a wider perspective.\n\nSomething may feel like a loss in the short term, yet become beneficial for everyone in the long run.\n\nIf you are willing to set aside some personal advantage, help others, or make a reasonable sacrifice for the larger situation, what you give may eventually return to you in a more meaningful form.\n\nWhen beginning something new or making an investment, small expenses or difficulties may appear at first.\n\nRather than becoming impatient, continue steadily. Investing in long-term value instead of chasing immediate gain may lead to much stronger results.",
      "yao": [
        "You may already have enough ability to help resolve the problem in front of you.\n\nIf someone around you clearly needs support, ignoring the situation could eventually affect the larger outcome.\n\nEven if helping costs you something in the short term, stepping forward willingly may benefit everyone involved.",
        "This may be a time to focus on your own responsibilities and do your part well.\n\nEven if you notice problems with someone above you or within the organization, it may be better not to step in too quickly or try to correct everything yourself.\n\nFor now, quietly fulfilling your own role may be the more beneficial choice.",
        "When beginning something new, moving in a large group can create unnecessary division and loss.\n\nLet go of appearances and begin quietly on your own if necessary.\n\nAs you continue steadily, people who genuinely share your direction may naturally gather around you.",
        "This may be a time to remove your own unhelpful habits or ineffective ways of working first.\n\nIf you can look at your weaknesses honestly and correct what needs to change, many of the problems currently troubling you may begin to resolve more smoothly.\n\nSometimes reducing what is unnecessary creates the space for things to improve.",
        "Do not give up simply because of a temporary difficulty in front of you.\n\nThere is no need to struggle alone out of pride.\n\nIf you are willing to ask for help and genuinely accept the support that comes, the situation may improve significantly and move in a much more favorable direction.",
        "Be careful not to interfere in matters that are not truly yours to control.\n\nOffering advice or stepping into someone else’s situation without the proper role or authority may create unnecessary problems.\n\nIf you respect boundaries, remain quietly in your own position, and observe the situation carefully, what you are trying to do may proceed without major difficulty."
      ]
    },
    "1_6": {
      "key": "1_6",
      "name": "Xu",
      "gua": "This may be a time to let go of impatience and practice active patience while waiting for the right moment.\n\nLike dark clouds gathering in the sky just before a long-awaited rain, the situation may feel frustrating now, but it is important to remain steady and trust the timing.\n\nIf anxiety pushes you to begin something new too quickly or take an unnecessary risk, significant loss may follow.\n\nFor now, observe your surroundings carefully and look at the situation as objectively as possible. Strengthening your foundation and maintaining stability in daily life may be more important than forcing progress.\n\nWhen dealing with negotiations, agreements, or transactions, do not rush. Take time to consider whether the other person’s true intentions may be different from what they first appear to be.",
      "yao": [
        "This is still only the beginning of the waiting period.\n\nIf impatience takes over, it may lead to poor choices and unnecessary loss.\n\nEven if the situation feels frustrating or difficult now, remain calm and continue waiting with a steady mind.\n\nIf you do not rush, what you are working on may continue without major trouble.",
        "Small difficulties, rumors, or uncomfortable comments may arise while you are waiting.\n\nHowever, if your goal and inner direction remain clear, there is little reason to be shaken by what others casually say about you.\n\nContinue quietly and stay focused on what matters.\n\nIf you remain patient, the situation may eventually turn in your favor.",
        "Even in difficult circumstances, you are still moving forward one step at a time.\n\nDo not suddenly give up or change direction simply because you feel tired or frustrated.\n\nAn impulsive decision now could create a much greater crisis or loss.\n\nIt is especially important to avoid acting emotionally and remain committed to the path you have already chosen carefully.",
