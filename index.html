        "You may reach a difficult point where an unexpected problem makes it feel almost impossible to remain patient.\n\nEven so, try not to lose your composure.\n\nIf you continue to maintain your ordinary routines and keep your daily life steady, you may be able to move through the crisis without serious harm.",
        "An opportunity or position may appear very attractive and abundant on the surface.\n\nHowever, jealousy, rivalry, manipulation, or hidden hostility may exist beneath that appealing appearance.\n\nDo not be distracted by what looks impressive at first. Examine the situation calmly and carefully.\n\nIf you keep your balance and remain patient, meaningful results may eventually follow.",
        "The long period of waiting may finally be reaching its end.\n\nAlong the way, you may also let go of unnecessary desires or attachments and find that you have grown inwardly through the process.\n\nEven if a serious and unexpected problem appears at the final stage, do not react carelessly.\n\nIf you handle it with patience and careful judgment, the situation may ultimately come to a favorable conclusion."
      ]
    },
    "1_2": {
      "key": "1_2",
      "name": "Bi",
      "gua": "This may be a time when working with others brings greater benefits than trying to do everything alone.\n\nBy joining forces with people who share your direction and building strong, supportive relationships, you may achieve meaningful results. Financial opportunities may also improve through cooperation and mutual support.\n\nThe more competitive the situation becomes, the more important it is to avoid arrogance or acting entirely on your own judgment. Finding capable people who can genuinely work with you may provide the breakthrough you need.\n\nAt the same time, be careful not to follow group rules or majority opinion blindly. Cooperation is valuable, but losing your own judgment, individuality, or flexibility can leave you overly passive.",
      "yao": [
        "Your current influence or practical authority may still be limited.\n\nIf you try to take control too quickly or insist too strongly on your own position, unexpected trouble or loss may follow.\n\nFor now, it may be more beneficial to follow the direction of a trustworthy leader or reliable group while steadily building your own strength.",
        "True cooperation requires more than simply appearing to agree with others.\n\nTry to work with people sincerely rather than following along only on the surface.\n\nThere is no need to demand recognition or compete for a higher position too quickly.\n\nContinue strengthening your abilities and wait until your value is naturally recognized and you are invited to take on a greater role.",
        "The person beside you may not be a leader or supporter who deserves your trust.\n\nIf you misjudge someone and follow them too easily, you may face serious difficulty and even damage work you have already invested in.\n\nAvoid blind trust and take particular care when deciding who is truly worth following.",
        "You may be vulnerable to unnecessary suspicion or misunderstanding from the people around you.\n\nEven if you feel unfairly judged, openly resisting may only make the situation more difficult.\n\nInstead, show clearly through your actions that you are willing to cooperate and that your intentions are sincere.\n\nIf you move through this period patiently, you may strengthen your position rather than being pushed aside.",
        "This may be a time to judge the situation clearly and guide others with wisdom.\n\nIf you try to control the people around you too tightly, resistance may grow and the situation can begin to fall apart.\n\nAllowing others a reasonable degree of freedom and space may help everything move more smoothly.\n\nGood leadership does not always require constant control.",
        "It may be necessary to let go of unnecessary pride and stubbornness.\n\nIf you continue insisting that only your position is right, the people around you may eventually distance themselves completely.\n\nThis can lead to serious consequences, including losing your place within a group or damaging important relationships.\n\nIf you are trying to push something forward under these conditions, it may be better to stop and reconsider your approach."
      ]
    },
    "1_3": {
      "key": "1_3",
      "name": "Zhun",
      "gua": "This may be a time when the outside world feels difficult to move through.\n\nLike being trapped in harsh wind and rain, even simple beginnings may become tangled or blocked. Trying to break through by force can increase the loss, so it is better to look at the situation objectively, strengthen your foundation, and take a more defensive approach for now.\n\nDo not try to solve everything alone. Finding a capable partner, mentor, or supporter who can help guide you may be especially important.\n\nEven if progress feels slow and frustrating, do not lose hope. If you remain patient and continue preparing, this difficult period may eventually become the foundation for stronger results.\n\nHelping someone else sincerely when they need it may also return to you later in an unexpected and valuable way.",
      "yao": [
        "This is not yet the time to move forward.\n\nIf you force progress, you may simply remain in the same place while wasting energy, time, or resources.\n\nDo not become too attached to immediate results.\n\nIf you protect your position and quietly strengthen your foundation, what you do now may become useful preparation for future progress.",
        "You may feel caught between moving forward and turning back, with neither direction seeming easy.\n\nRather than making a rushed decision, give yourself more time.\n\nA helpful person or suitable partner may appear if you remain patient.\n\nThrough that connection, problems that have troubled you for a long time may finally begin to resolve.",
        "You may feel completely isolated, with no one around who can properly support or guide you.\n\nIn this situation, it is better to stop forcing the issue.\n\nWithout enough support, direction, or a clear reason to continue, pushing forward may only bring greater difficulty and loss.\n\nKnowing when to stop can protect you from becoming trapped more deeply.",
        "You may feel frustrated because you cannot lead the situation entirely in the way you want.\n\nEven so, do not give up simply because progress is difficult.\n\nThere may be capable people outside your current circle who genuinely share your direction.\n\nIf you let go of unnecessary stubbornness and actively cooperate with them, blocked situations may begin to open and lead to favorable results.",
        "This may be a time to look honestly at your abilities and limitations.\n\nYou may not yet be in the best position to take full control or draw strong attention to yourself.\n\nAvoid chasing goals that exceed what you can realistically manage, especially when money or investment is involved.\n\nMove carefully within your current capacity, as excessive risk may lead to significant financial loss.",
        "If you act too quickly because you are focused only on immediate gain or visible results, painful loss and regret may follow.\n\nEven after a long period of waiting, the result you want may still not be available right away.\n\nIt is better to stop forcing progress and focus on protecting your current position, stability, and reputation.\n\nFor now, preserving what you have may be safer than reaching for more."
      ]
    },
    "1_8": {
      "key": "1_8",
      "name": "Jian",
      "gua": "This may be a time to pause and seek the right support.\n\nJust when one difficulty seems to ease, another obstacle may appear. Progress can feel frustratingly slow, with problems blocking the path at every turn.\n\nTrying to force your way through by taking reckless risks or making hasty investments may only lead to greater financial loss.\n\nRather than struggling alone, look for a capable helper, experienced partner, or expert who can guide you. The right support may become the key to turning a difficult situation into a new opportunity.\n\nFor now, it is better to take a cautious and defensive approach. Review your finances, internal systems, and overall stability carefully, and strengthen your foundation before trying to expand.\n\nRelationships that offer little substance or support may also be worth letting go of.",
      "yao": [
        "You may be facing your first real obstacle and feeling uncertain about how to move forward.\n\nDo not force the situation immediately.\n\nPause and take an objective look at both your plans and your current circumstances.\n\nThe beginning may feel frustrating, but if you remain patient and prepare carefully, you may eventually reach your goal with much greater ease.",
        "You may become involved in an uncomfortable problem or responsibility that was not caused by you.\n\nEven if the situation feels unfair, trying too hard to prove your innocence or correct everything immediately may create more difficulty.\n\nFor now, it may be better to endure quietly and allow the situation to pass.\n\nWhat you are trying to accomplish may still face some obstacles during this period.",
        "Trying to escape an uncomfortable problem may only make the situation worse.\n\nRather than running from what is difficult, return to where the problem began and seek cooperation from the people around you.\n\nThe beginning may feel discouraging, but with the right support, the situation can eventually resolve smoothly and lead to a very favorable result.",
        "The situation may be too difficult to handle with your ability or resources alone.\n\nAvoid trying to take control of everything by yourself.\n\nLet go of unnecessary pride and actively ask others or experienced professionals for help.\n\nWith the right support, what once felt completely blocked may begin to move much more smoothly.",
        "You may reach a point where solving the problem alone feels almost impossible.\n\nFortunately, reliable colleagues or supporters may recognize your difficulty and step forward to help.\n\nBy accepting their support, you may be able to move through the crisis and reach a favorable outcome.",
        "The long period of hardship may finally be approaching its end.\n\nEven if the worst seems to be over, do not become careless.\n\nContinue maintaining the cautious attitude that has helped you come this far.\n\nYou may also meet someone who can help lift you to a new level and open a path that had previously seemed completely blocked."
      ]
    },
    "1_1": {
      "key": "1_1",
      "name": "Kan",
      "gua": "This may be a time to endure repeated difficulties without losing your inner balance.\n\nThe situation can feel like being surrounded by deep and dangerous water, with one obstacle appearing after another.\n\nIf you panic and struggle too forcefully, you may only sink deeper. Instead, try to remain mentally steady and respond flexibly to the changing flow around you.\n\nAvoid unnecessary arguments or conflicts that could damage your reputation, and focus on quietly protecting your position.\n\nDocuments, contracts, and financial agreements should be checked with particular care. Do not take responsibility for another person’s debt or obligations, as this could lead to serious financial loss.\n\nLet go of emotional attachment, strengthen your foundation, and focus on what helps you remain stable.\n\nThis may also be a meaningful time to turn inward through study, reflection, or spiritual practice and use the difficulty as an opportunity for inner growth.",
      "yao": [
        "One difficulty may follow another, creating a frustrating situation where your sincerity or sense of unfairness is not easily understood.\n\nTrying too hard to explain yourself or prove the truth may only make things worse.\n\nFor now, it may be better not to react quickly.\n\nRemaining still and avoiding unnecessary action can help prevent the situation from becoming more complicated.",
        "You may feel desperate for any kind of help or relief.\n\nEven so, if you refuse to give up and continue holding your center, a way through the difficulty may eventually appear.\n\nDo not expect a large gain right now.\n\nAccept even small progress or limited support with appreciation, as it may become the beginning of a solution.",
        "This may feel like a complete deadlock, with danger both ahead and behind.\n\nTrying to force your way out may only waste your energy and resources.\n\nDo not allow yourself to be swept into group action or impulsive decisions simply because people around you are reacting strongly.\n\nIt may be better to stop what you are trying to push forward and wait until the situation becomes clearer.",
        "You may have reached a point where your own ability alone is not enough to solve the problem.\n\nLet go of unnecessary pride, reduce spending wherever possible, and seek guidance from someone with greater experience or expertise.\n\nActively accepting the right advice and support may be necessary to move through this crisis safely.",
        "This may be a time to release stubbornness and narrow assumptions and work more openly with the people around you.\n\nThe difficult period may finally be beginning to show signs of ending.\n\nIf you remain humble, cooperate with others, and endure a little longer, what you have been trying to accomplish may gradually become possible.",
        "You may feel completely isolated, without a clear principle, direction, or reliable place to turn.\n\nTrying to reverse the situation through desperate or excessive action may only increase the loss and pain.\n\nStop forcing what you are trying to do.\n\nFor now, protecting your current position and remaining as quiet and cautious as possible may be the safest way through."
      ]
    },
    "1_4": {
      "key": "1_4",
      "name": "Jing",
      "gua": "This may be a time to wait for your moment while steadily developing the strength and skill that will carry you forward.\n\nLike searching for a clear spring deep in the mountains, this period requires patience, persistence, and consistent effort.\n\nRather than rushing into a new business or project, it may be better to focus on maintaining and improving what you are already doing.\n\nBe especially careful near the end of a process. Impatience at the final stage can undo much of the effort you have already invested.\n\nAvoid unnecessary conflict over small gains, reduce wasteful spending, and strengthen your relationships with the people around you.",
      "yao": [
        "If you remain trapped in outdated methods or old ways of thinking, it may be difficult to produce meaningful results.\n\nYour approach may need to change in a way that better fits the present situation.\n\nHolding stubbornly to the same method is unlikely to bring the outcome you want.",
        "Your effort may be going to waste because the method you are using does not match the goal.\n\nTrying to take shortcuts or forcing the situation may lead to greater loss.\n\nIt is better to work according to clear principles and choose an approach that truly fits the circumstances.",
        "An opportunity may appear, yet you may not be fully prepared to use it or may miss the right timing.\n\nThis can feel frustrating.\n\nRather than delaying what needs to be done, focus steadily on your responsibilities and continue strengthening your foundation.\n\nBetter preparation may help prevent future opportunities from slipping away.",
        "You may be in a position where supporting the person in charge or strengthening the practical foundation of a group is especially important.\n\nSet aside personal ambition and focus on helping the work run carefully and reliably.\n\nIf you contribute to greater stability around you, clear results may follow for both the group and yourself.",
        "Something you have worked on for a long time may finally mature and bring clear benefits.\n\nThis can be a very favorable period for enjoying the results of steady effort.\n\nHowever, try not to keep all the recognition or rewards for yourself.\n\nSharing appropriately with the people who contributed may help the favorable flow continue for longer.",
        "Things may now come to a smooth and satisfying conclusion.\n\nLike a well that remains open so others can continue drawing from it, there is value in not keeping everything you have gained entirely to yourself.\n\nIf you share useful knowledge, opportunities, or benefits with others and continue building trust, a stable and peaceful situation may be easier to maintain."
      ]
    },
    "1_9": {
      "key": "1_9",
      "name": "Ji Ji",
      "gua": "This may be a time to protect what has already been achieved and focus on maintaining stability.\n\nA demanding period of growth may have reached a successful conclusion, leaving you with meaningful results and a relatively stable environment.\n\nHowever, just as a flower eventually begins to fade after reaching full bloom, strong growth can gradually give way to decline if it is not carefully managed.\n\nRather than becoming overconfident, expanding too aggressively, or making unnecessary investments, it is better to strengthen internal management and protect what is already working.\n\nPartnerships or cooperative relationships may also become more vulnerable to disagreement. Avoid insisting only on your own position, and be willing to compromise where appropriate to prevent unnecessary loss.",
      "yao": [
        "Things may be going well enough to give you strong confidence in your abilities and decisions.\n\nHowever, excessive confidence can easily turn into overreaching.\n\nIf you push too far or become driven by unnecessary ambition, small problems may begin to appear.\n\nResist the urge to move ahead simply because you can. By protecting your current position, you may avoid unnecessary loss.",
        "You may feel anxious after losing an important opportunity, possession, or advantage.\n\nThere is no need to panic or try to recover it immediately.\n\nWith time, the situation may naturally return to balance or what was lost may find its way back.\n\nRemain patient and respond calmly. If you avoid rushing, what you are working toward may continue to unfold smoothly.",
        "The favorable period may be approaching its later stage.\n\nSomething new may require far more time and effort than you first expected.\n\nThis can also be an environment where people with hidden motives or shallow intentions gather easily.\n\nDo not be pulled along by the surrounding atmosphere. If you remain steady and endure the difficult process, you may still be able to reach your goal.",
        "A small mistake may grow into serious confusion or loss if it is overlooked.\n\nIt may be like keeping money in a bag with a small hole: what seems minor at first can quietly become a much larger problem.\n\nStay alert and inspect the details carefully.\n\nConsistent caution may be necessary to prevent significant damage.",
        "Even if you have enough ability and experience, confusion around you may make it difficult to show what you can truly do.\n\nDo not become discouraged simply because clear results are not appearing yet.\n\nUse this period to strengthen your foundation and prepare for the changes ahead.\n\nIf you remain patient, your abilities may eventually receive the recognition and reward they deserve.",
        "The strongest part of the favorable period may already have passed, leaving you in a more unstable and declining phase.\n\nYou may feel caught between moving forward and stepping back, with neither option appearing easy.\n\nIf you push beyond your limits out of ambition, the damage could become serious.\n\nStop unnecessary action and focus on bringing the present situation under control before attempting anything further."
      ]
    },
    "1_7": {
      "key": "1_7",
      "name": "Jie",
      "gua": "This may be a time to hold your center and respect healthy limits.\n\nSimply knowing where to draw the line can help you avoid unnecessary trouble. It is important to control excessive desire and spending and make moderation part of your daily life.\n\nRather than expanding too aggressively or making a large, risky investment, focus on smaller and more practical opportunities that can bring steady results.\n\nAt the same time, restraint should not become so severe that it feels suffocating or oppressive. A flexible sense of balance is necessary.\n\nWhen negotiating or making agreements with others, do not insist only on your own benefit. Considering the other person’s position will help things move more smoothly.\n\nEven if things look abundant on the surface, reducing unnecessary waste, saving what you can, and building a stable foundation may be especially important now.",
      "yao": [
        "You may not yet have a full understanding of the situation or enough basic experience.\n\nRather than stepping forward too quickly or beginning something new, it is better to strengthen your foundation first.\n\nLearning the rules, structure, and atmosphere around you may help prevent unnecessary loss.",
        "This may be a time to recognize clearly when to step forward and when to remain still.\n\nRight now, the opportunity may favor active movement.\n\nIf you stay too comfortable or remain withdrawn while a good opening is available, you may later feel regret over what was missed.",
        "Be careful not to show off what you have or rely on appearances.\n\nSmall achievements or temporary wealth may not last.\n\nIf you cannot control your spending or live within your actual means, financial stress may eventually follow.\n\nModeration can help protect both your resources and your peace of mind.",
        "You may be in a stable position because you understand your limits and act appropriately.\n\nBy treating others with respect, living simply, and moving in a way that fits the situation, things may continue without major obstruction.\n\nSteady self-discipline can help maintain a smooth and balanced flow.",
        "This may be a time when clear self-control and a steady inner center bring good results.\n\nRather than insisting only on your own position, you may be able to adjust flexibly while considering the needs of the wider group.\n\nThat balanced approach can earn trust and help what you are trying to accomplish move in a favorable direction.",
        "The situation may require greater restraint and reduced spending, but you may begin to feel frustrated by those limits.\n\nThat frustration can easily turn into impulsive behavior, unnecessary spending, or choices driven by pride.\n\nIf you recognize this quickly and regain your judgment, you may still be able to avoid the worst consequences."
      ]
    },
    "4_6": {
      "key": "4_6",
      "name": "Xiao Xu",
      "gua": "This may be a time when things feel close to moving, yet patience is still necessary.\n\nThe sky may look heavy with clouds, as if rain could fall at any moment, but the timing is not quite right yet.\n\nEven if your expectations are high and you feel eager to move forward, it may be better not to expand too quickly or begin something entirely new. Focus instead on what you are already doing and continue building small, steady results.\n\nIf you quietly strengthen your foundation, financial opportunities may follow naturally.\n\nNegotiations, transactions, or contracts may take longer than expected. Rather than becoming impatient, give the other side time and wait calmly for their response.\n\nIf you maintain a positive and flexible attitude, situations that once felt blocked may gradually begin to open.\n\nThe same applies to relationships. There is no need to rush, as the right opportunity may come naturally with time.",
      "yao": [
        "At first, outside temptations may make it easy to act impulsively or lose your sense of direction.\n\nHowever, you may soon regain your judgment and return to your original position and principles.\n\nBy quietly focusing on what is yours to do, you may continue without significant loss and keep things moving in a stable direction.",
        "This is not yet the right time to act aggressively or expand the situation.\n\nEven if attractive offers or tempting opportunities appear, it may be better not to respond too quickly.\n\nBy holding your position and waiting quietly for the right moment, you can reduce unnecessary loss and place yourself in a stronger position later.",
        "Disagreements with colleagues or people around you may become more serious, making relationships easier to damage.\n\nIf you insist only on your own position and push beyond reasonable limits, the situation may deteriorate further.\n\nWhat you are trying to accomplish may eventually collapse if cooperation breaks down completely.",
        "The situation around you may feel unstable and difficult, so it is important to remain alert.\n\nRather than protecting your pride too rigidly, respond with humility and flexibility.\n\nIf you adapt calmly to what is happening, you may be able to pass through the difficulty safely while protecting both your position and your interests.",
        "This may be a favorable time to share success rather than trying to keep every benefit for yourself.\n\nWhen you allow others to participate in the rewards, cooperation can become stronger and everyone may gain more from the result.\n\nWith a solid foundation behind you, your abilities may become more visible and the goal you have been working toward may finally be achieved.\n\nPositive recognition and clear rewards may follow.",
        "The long-awaited rain may finally begin to fall, bringing relief to a situation that has felt blocked for a long time.\n\nYou may have spent or lost something along the way, but there is no need to worry too much about it.\n\nThe more important thing is to know when enough is enough.\n\nOnce the goal has been reached, continuing to push forward without recognizing the change in circumstances may bring painful loss.\n\nKnowing when to stop can help you protect what you have gained."
      ]
    },
    "4_2": {
      "key": "4_2",
      "name": "Guan",
      "gua": "This may be a time to observe the larger flow and prepare carefully before taking action.\n\nBefore beginning something important, it is necessary to look closely at changes in the surrounding environment and understand how people are thinking and responding.\n\nYour own judgment may not yet be completely clear, so avoid expanding too quickly or making a large investment based on limited information.\n\nInstead, step back, gather objective information, and look at the situation from a broader perspective.\n\nIf you ignore the opinions of others and act only according to your own assumptions, trust may begin to weaken.\n\nRather than chasing small gains in front of you, seek cooperation, remain objective, and make decisions with care. This may be the best way to prevent unnecessary loss.\n\nStudy and reflection related to learning, religion, culture, or inner development may bring meaningful results during this period.",
      "yao": [
        "Your perspective may still be limited, and you may not yet have enough experience to understand the whole situation clearly.\n\nIf you insist too strongly on your own opinion or enter unnecessary conflict, you may find yourself in serious difficulty.\n\nThis is not a good time to take on something too large.\n\nRemain humble, observe carefully, and continue learning. This may help you avoid unnecessary loss.",
        "Your view of the situation may be too narrow, making it easy to judge things from only a small piece of information.\n\nIf you decide too quickly based on what is immediately visible, you may miss the true heart of the matter.\n\nTry to move beyond a limited perspective and develop a broader, more objective way of seeing the situation.",
        "Before judging what is happening outside, it may be necessary to look honestly at your own ability and position.\n\nCareless behavior can easily upset the people around you and may even weaken your place within a group.\n\nReflect on yourself carefully and decide with good judgment whether it is better to move forward or step back.",
        "You may take on an important role in understanding and balancing different positions within a group.\n\nIf you can recognize the difficulties of those below you while communicating effectively with those above you, the whole organization may become stronger.\n\nYour ability to connect both sides can also bring you meaningful results and greater recognition.\n\nWhat you are trying to accomplish may unfold very favorably.",
        "If you are in a position with some authority or influence, this may be a time to review the direction and methods you have followed so far.\n\nBe careful not to become trapped in your own perspective or make decisions too independently.\n\nPoor judgment at this level can affect not only you but also the people around you.\n\nKeep capable people close, listen seriously to their views, and allow their perspective to challenge your own when necessary.",
        "After spending time observing others and the larger situation, you may now find that others are closely observing and evaluating you.\n\nYour abilities, judgment, and character may be tested more carefully than before.\n\nDo not become careless.\n\nLearn from the success of others, take warning from their mistakes, and examine your own behavior with the same careful and demanding attention."
      ]
    },
    "4_3": {
      "key": "4_3",
      "name": "Yi",
      "gua": "This may be a time to act boldly with careful planning and to share the benefits of success with others.\n\nRather than waiting passively, it may be better to move forward actively with a clear and well-prepared plan.\n\nEven if risks or obstacles appear, facing them directly may lead to results and financial gains greater than expected.\n\nHowever, this does not mean rushing ahead blindly. If something is clearly wrong, correct it quickly, and remain open to advice from capable people around you.\n\nWhen those with greater strength or influence support others and pursue benefits that can be shared more widely, the overall results may become even greater.",
      "yao": [
        "This may be a good time to remain faithful to your responsibilities while taking on a larger goal or project than usual.\n\nIf you already have a clear plan, there may be little reason to hesitate.\n\nMove forward actively and steadily, and what you are trying to accomplish may lead to strong results without major obstruction.",
        "Do not sacrifice proper principles simply for immediate gain.\n\nShortcuts or questionable methods can lead to significant loss.\n\nIt may be especially important to protect harmony within the group and keep the larger relationship between people in mind as you move forward.",
        "When you treat others fairly and consider the people around you, you may find that the situation becomes more beneficial for you as well.\n\nAvoid selfish actions that could create resentment.\n\nIf you offer sincere support and cooperate openly, things may proceed smoothly without serious difficulty.",
        "If someone in difficulty or a trusted supporter asks for help, this may be a time to offer assistance without calculating every advantage.\n\nBy remaining fair and balanced, you can build greater trust.\n\nThat trust may eventually help what you are trying to accomplish move in a more favorable direction.",
        "This may be a time to act from clear principles and share both support and success with the people around you.\n\nIf you lead without being pulled by private ambition or narrow self-interest, your efforts may receive wider recognition.\n\nWhat you are pursuing may also grow into a significant success.",
        "You may already have gained enough, making excessive desire especially dangerous now.\n\nIf you continue expanding beyond reasonable limits or pursue profit in ways that go against sound principles, you may find yourself surrounded by difficulties.\n\nThe reputation and trust you have built can also begin to weaken.\n\nRecognize when enough is enough, let go of stubbornness, and stop before unnecessary loss becomes serious."
      ]
    },
    "4_8": {
      "key": "4_8",
      "name": "Jian",
      "gua": "This may be a time of gradual progress, where small achievements build steadily toward a larger goal.\n\nLet go of impatience and focus on moving forward one step at a time.\n\nEven if a large opportunity appears in front of you, relying on luck or rushing toward it may cause things to go wrong.\n\nFollow the proper process without taking shortcuts, and continue expanding your limits gradually.\n\nComplicated problems that have become tangled may also resolve more naturally with time. Do not rush simply because you want to see the final result.\n\nEntering a new environment or relationship, such as changing jobs, signing a contract, or getting married, may proceed very smoothly with the support and approval of those around you.",
      "yao": [
        "A tangled situation or long-standing problem may finally begin to loosen.\n\nThis is still only the first step, so becoming careless now could cause things to become complicated again.\n\nEven if you experience some temporary isolation or disadvantage, remain patient and move forward carefully.\n\nIf you endure the early uncertainty without rushing, you may pass through this stage safely.",
        "What you have been working on may now settle into a stable rhythm and begin producing reliable results.\n\nThis can be a favorable time to enjoy greater stability and share what you have gained with the people around you.\n\nEven if everything looks satisfying on the surface, do not become complacent.\n\nContinue strengthening your foundation quietly and working carefully behind the scenes. This may prepare you for a much greater step forward later.",
        "This may be one of the most delicate points in the process, when taking the wrong direction could lead you far from where you intended to go.\n\nIf you remain stubborn without looking carefully at the circumstances around you, the situation may become increasingly difficult.\n\nFailing to handle this turning point wisely could lead to significant loss.\n\nTake time to review your plans thoroughly before continuing.",
        "You may find yourself in an unfamiliar or unstable environment, but support from others can help you secure a workable position.\n\nRather than trying to expand or begin something new immediately, protect the ground you have gained and rebuild your strength.\n\nTreat the people around you with humility and flexibility.\n\nA careful attitude now may help prevent difficulties later.",
        "Your goal may now be very close.\n\nTemporary interference or misunderstandings could delay progress, but they do not necessarily mean that the opportunity has been lost.\n\nRemain patient and keep your attention on what still needs to be completed.\n\nDo not become careless simply because you feel that you are almost there. If you stay focused until the end, you may finally achieve what you have been working toward.",
        "You may finally reach the goal you have been steadily working toward and rise into a much stronger position.\n\nBecause you followed the proper process without relying on shortcuts, the result may bring not only achievement but also greater respect and a positive reputation.\n\nIf you remain true to the attitude that brought you this far, the favorable momentum may continue."
      ]
    },
    "4_1": {
      "key": "4_1",
      "name": "Huan",
      "gua": "This may be a time to move out of a long period of stagnation and begin expanding again.\n\nLike spring arriving after a long winter, conditions may finally begin to loosen, making this a favorable time to start something new or take a broader step forward.\n\nLong-standing problems, complicated situations, or even financial difficulties may gradually begin to dissolve.\n\nRather than focusing only on small immediate gains, it may be more beneficial to think on a larger scale, leave outdated methods behind, and pursue a new project or a bolder goal.\n\nAt the same time, financial management still requires care. New business relationships, agreements, and contracts should be reviewed thoroughly to avoid unnecessary disputes or financial loss.",
      "yao": [
        "Even if an unexpected problem or conflict arises, you may be able to move through it safely by responding calmly.\n\nLong-standing tension in relationships or repeated friction at work may also begin to improve.\n\nDo not rush the process. Patient communication and steady persuasion may help resolve the situation more smoothly.",
        "There may be no serious practical problem, yet you may still feel somewhat disconnected or isolated from the people around you.\n\nThis is not necessarily the best time to separate completely or try to handle everything alone.\n\nRelying on a stable environment or a trustworthy supporter while quietly strengthening your foundation may be more beneficial.",
        "You may be caught in a powerful period of change that feels difficult to control through your own strength alone.\n\nLet go of the need to solve everything by yourself.\n\nIf you find people who genuinely share your direction and work together with them, you may be able to move through this difficult stage without major harm.",
        "An unexpected obstacle or crisis within a group may require you to step back temporarily.\n\nHowever, retreat does not have to mean defeat.\n\nIf you recognize the situation quickly and change direction toward a safer path, you may pass through the difficulty without significant loss.",
        "Strong changes or difficulties may create anxiety throughout the people or organization around you.\n\nAt a time like this, the person carrying responsibility needs to remain especially steady.\n\nIf you hold firmly to clear principles without being pulled into the surrounding confusion, you may be able to calm the situation and guide it toward resolution.",
        "This may be a time to distance yourself decisively from an environment, relationship, or situation that has become harmful or unstable.\n\nDo not remain close to something simply because you have already invested time or effort in it.\n\nIf you step away from sources of danger or conflict quickly enough, you may avoid serious damage and regain a greater sense of stability and peace."
      ]
    },
    "4_4": {
      "key": "4_4",
      "name": "Xun",
      "gua": "This may be a time to remain gentle and humble on the outside while holding firmly to your own principles within.\n\nLike wind moving freely through every opening, flexible communication and a modest attitude can work strongly in your favor.\n\nRather than insisting too strongly on your own position, it may be better to place harmony and cooperation with others first.\n\nWork involving distribution, trade, sales, or communication with the outside world may bring especially positive results.\n\nHowever, your mind may also become easily influenced or indecisive. Be careful not to be drawn in by flattering words, tempting promises, or deceptive offers.\n\nIf making an important decision alone feels difficult, seek advice from a trustworthy senior, mentor, or colleague.\n\nAt the same time, avoid blindly following others. Clear goals and firm personal principles may be what protect you from serious loss.",
      "yao": [
        "Your mind may be easily swayed, making it difficult to hold your own position.\n\nIf you follow the mood around you or agree too quickly with what others say, you may become vulnerable to deception or manipulative offers.\n\nHold firmly to your own judgment and be willing to say no when something does not feel right.\n\nThat clarity may help you protect both your position and your interests.",
        "You may feel frustrated because communication with someone who holds real authority is not flowing smoothly.\n\nDo not become too comfortable simply because the present situation feels temporarily stable.\n\nIf there are misunderstandings within the relationship or between different levels of responsibility, make a sincere effort to address them through open communication.\n\nOnce that blockage is cleared, things may begin to move much more smoothly.",
        "This may be a difficult stage where you need to lower yourself or make reasonable concessions in order to survive intense competition.\n\nHowever, flexibility does not mean allowing others to control everything.\n\nProtect your essential interests and principles while responding gently on the surface.\n\nA calm and strategic approach may serve you better than either open confrontation or complete submission.",
        "The humility and steady effort you have shown may finally begin to receive recognition.\n\nThis can be a very favorable time for moving into a stronger position or gaining greater respect.\n\nSupportive people may also appear and actively help what you are trying to accomplish.\n\nFinancial benefits, recognition, and several positive developments may come together during this period.",
        "You may find yourself in a position where you must consider many different opinions and make the final decision.\n\nListen openly to feedback from the people around you, but do not allow every opinion to pull you in a different direction.\n\nOnce you have considered the situation carefully, make your decision with confidence and remain steady.\n\nThe early stages of coordination may be difficult, but persistent and consistent leadership may eventually bring an excellent result.",
        "You may hold an impressive title or visible position while lacking the practical authority needed to make real decisions.\n\nThis can leave you carrying responsibility without enough control over the situation.\n\nDo not overreach out of frustration or lower yourself excessively in order to preserve the position.\n\nDoing so may damage the reputation and dignity you have worked hard to build.\n\nIf you are considering pursuing further gain or beginning something new from this position, it may be better not to proceed."
      ]
    },
    "4_9": {
      "key": "4_9",
      "name": "Jia Ren",
      "gua": "This may be a time to strengthen stability and unity within your home, team, or organization rather than looking outward for expansion.\n\nJust as people close to one another can encourage and strengthen each other, each person may need to fulfill their own role and help reinforce the group from within.\n\nYou may feel restless with familiar routines and tempted to begin something new outside your current environment. For now, however, staying committed to what you are already doing may be the better investment and the safer way to prevent loss.\n\nCareful internal planning should come before aggressive expansion.\n\nPartnerships or collaboration with people who genuinely share your direction can be favorable. Listening to advice from experienced people and paying close attention to the strength of your foundation may help things move smoothly.",
      "yao": [
        "This is an early stage when the foundation of a group or relationship needs to be strengthened and clear boundaries established.\n\nEven if there are frustrations, it may be better to remain patient and encourage cooperation.\n\nTrying to break existing rules too quickly or create a major change can lead to internal division and unnecessary loss.",
        "This may be a time to quietly focus on your practical responsibilities and fulfill your role well.\n\nRather than trying too hard to stand out, remain steady in your position and support the people around you where needed.\n\nIf you continue doing your work reliably, your abilities may be recognized naturally and what you are trying to accomplish may move in a favorable direction.",
        "Small and large issues may arise within the group or household, making it easy for discipline to weaken and the atmosphere to become overly relaxed.\n\nIf personal feelings or social closeness lead everyone to overlook problems too casually, those issues may grow into larger conflicts later.\n\nEven if it feels somewhat strict, maintaining clear principles and boundaries may be necessary.",
        "The internal situation may become stable, allowing teamwork to function especially well.\n\nIf you set aside personal ambition and work carefully with the people around you, things may fit together smoothly like well-aligned gears.\n\nStrong cooperation and thoughtful planning can lead to substantial results.",
        "You may be in a position of responsibility where broad and confident leadership can bring both strong results and a good reputation.\n\nDo not become overly focused on every small mistake or allow personal attachment to cloud your judgment.\n\nIf you guide others fairly according to clear principles, what you are trying to accomplish may succeed on a significant scale.",
        "A long-standing internal problem or an outside threat that is causing loss may need to be identified and dealt with firmly.\n\nThe process can be tiring and may create some conflict.\n\nEven so, if you remain steady, maintain clear principles, and do not lose your authority or direction, the situation may eventually be brought fully under control.\n\nOnce the underlying problem is properly resolved, clear benefits may follow."
      ]
    },
    "4_7": {
      "key": "4_7",
      "name": "Zhong Fu",
      "gua": "This may be a time to let go of personal desire and approach things with sincerity, trust, and steady effort.\n\nLike a mother bird carefully warming its eggs, genuine commitment may eventually bring what you hope for into reality.\n\nWhen you release excessive self-interest or expectations of reward, deeper trust can begin to form with others. This may also help you earn a favorable reputation with people in positions of authority or influence.\n\nWorking with others may be especially beneficial now. Partnerships, teamwork, contracts, negotiations, exams, or academic work may all bring results that exceed expectations.\n\nIncome may increase significantly, and unexpected financial gains are also possible. However, spending may rise at the same time.\n\nTry not to become overly attached to money. A willingness to share what you have and support others may help keep this favorable flow in balance.",
      "yao": [
        "Things may appear calm on the surface, yet an unexpected difficulty could still arise.\n\nIf you try to escape the problem through shortcuts or become distracted by other possibilities, you may end up more frustrated.\n\nRemain steady, stay where you are, and endure the situation patiently.\n\nHolding your position without being easily shaken may be the safer path.",
        "This may be a time of excellent harmony with a partner or supporter you can genuinely trust.\n\nCommunication may flow naturally, and both sides may respond to each other with ease.\n\nWith that kind of mutual understanding, what you are working toward may proceed smoothly and naturally.",
        "You may succeed in reaching your goal or winning a competition, yet the cost could be greater than expected.\n\nThe result may feel less satisfying if too much has been lost along the way.\n\nBe especially careful not to create unnecessary enemies through suspicion or mistrust.\n\nManaging relationships thoughtfully may be just as important as achieving the result itself.",
        "You may lose an important opportunity or a valuable supporter.\n\nEven so, there is little benefit in remaining attached to what has already been lost.\n\nAccept the reality of the situation and return your attention to what is still yours to do.\n\nIf you stay focused, you may move through this period without serious practical harm.",
        "You may gain clear control over a situation or secure an important result.\n\nDo not allow yourself to be distracted by shallow temptations or empty promises.\n\nIf you protect what you have achieved with firm principles and steady confidence, the situation may remain stable.",
        "You may be at risk of overestimating your ability or becoming drawn into unrealistic expectations.\n\nIf you pursue goals far beyond what your current situation can support, or place excessive faith in something without enough evidence, serious loss may follow.\n\nTake an honest look at your actual ability and circumstances before moving further."
      ]
    },
    "9_6": {
      "key": "9_6",
      "name": "Da You",
      "gua": "This may be a time of great achievement, abundance, and favorable momentum.\n\nYour abilities and circumstances may be reaching a strong point, allowing many things you pursue to unfold smoothly. Both material gains and a greater sense of inner stability may follow.\n\nDo not let good opportunities pass by. If the timing is right, move actively and remain aware of changes in the wider environment.\n\nHowever, the brighter the light, the deeper the shadow can become. Avoid keeping every benefit for yourself.\n\nPay attention to people or areas that are being overlooked, and share what you can. If you remain outwardly gentle while holding firm principles within, you may be able to enjoy this favorable period for much longer without being weakened by pride.",
      "yao": [
        "This is still a stage of building the foundation rather than enjoying the largest results.\n\nAvoid excessive ambition and do not allow yourself to be drawn into questionable opportunities.\n\nWork openly and transparently with the people around you, taking care not to cause unnecessary harm or conflict.\n\nIf you remain grounded, the situation may continue without major trouble.",
        "You may earn strong trust from a leader or someone in a higher position and be given an important project or responsibility.\n\nThis can be a very favorable situation in which you are able to carry the responsibility well and return with clear results.\n\nYour abilities may receive meaningful recognition through what you accomplish.",
        "You may gain significant results, wealth, or recognition.\n\nHowever, greater success can also attract people who are motivated by jealousy, selfish interests, or hidden intentions.\n\nManage the people around you carefully and keep some distance from tempting but unreliable offers.\n\nProtecting what you have achieved may become just as important as achieving it.",
        "This may be a time to review the people around you and create greater distance from relationships that repeatedly cause trouble.\n\nWhen building a team or assigning responsibilities, place capable people where their strengths can be used well and avoid giving important roles to those who are clearly unsuitable.\n\nAt the same time, do not display your growing success or influence too openly.\n\nRemaining modest and respecting appropriate boundaries may help protect your position.",
        "You may be holding an important position of responsibility, yet your gentle manner could lead some people to underestimate you.\n\nIt may be necessary to prevent internal problems before they develop.\n\nMaintain genuine trust and openness, but combine them with clear boundaries and firm authority.\n\nThat balance may help you guide the people around you more effectively.",
        "This may be a time to prepare thoroughly and carry out what is yours to do with full sincerity.\n\nWhen you make every reasonable effort and then allow the result to unfold without forcing it, circumstances may support you in an especially favorable way.\n\nYour experience and judgment may also allow you to become a reliable mentor or steady source of guidance for others.\n\nMany of the things you pursue may move forward with strong and lasting support."
      ]
    },
    "9_2": {
      "key": "9_2",
      "name": "Jin",
      "gua": "This may be a time to move forward actively toward your goals.\n\nOpportunities may begin to open, making this a favorable period to bring your accumulated skills and abilities into the wider world.\n\nRather than hesitating, you may benefit from pursuing new projects or investments with confidence. Greater recognition and financial gains may follow.\n\nThis can also be a favorable period for more active financial activity, including investments such as stocks or securities.\n\nHowever, as your results and position improve, jealousy, competition, or interference from others may also increase.\n\nDo not become overconfident. Maintain humility, let go of unnecessary hesitation, and continue moving forward with a clear sense of direction.",
      "yao": [
        "You may still lack some practical experience or ability, making your progress feel unstable.\n\nYou may find yourself moving forward and then stepping back again.\n\nEven if you do not receive immediate trust or visible results from others, do not become impatient.\n\nUse this period to strengthen your abilities and wait calmly for the right opportunity.",
        "This may be the point when you need to begin moving forward more actively.\n\nEven if there is no immediate promotion or direct support from those above you, continue fulfilling your responsibilities steadily in your current position.\n\nThe material reward may not be large at first, but your reputation can improve and your abilities may begin to receive recognition.",
        "The path ahead may be opening clearly, with strong trust and support from colleagues or people who follow your lead.\n\nEven if you do not yet have the ideal title or official position, genuine support from those around you can become a powerful source of strength.\n\nIf you move forward with confidence while respecting that support, meaningful results may follow.",
        "Focusing too much on impressive credentials, appearances, or simply expanding in size may lead to failure.\n\nIf you rely on shallow knowledge across too many areas, become uncertain about yourself, or try to use clever shortcuts, you may create problems of your own.\n\nStrengthen your foundation and develop one area of genuine expertise rather than chasing appearances.",
        "Do not waste time on unnecessary feelings of inferiority or remain attached to mistakes from the past.\n\nWhat matters is the direction you choose now.\n\nIf you regain your focus and continue steadily along a sound path, you may still recover the situation and reach a successful result.",
        "If you interfere too strongly in the affairs of others or criticize them without having enough real authority, you may face strong resistance or rejection.\n\nTake an objective look at your current position and recognize what you can realistically influence.\n\nAvoid forcing action or choosing a direction too quickly.\n\nFor now, restraint and careful judgment may prevent greater difficulty."
      ]
    },
    "9_3": {
      "key": "9_3",
      "name": "Shi He",
      "gua": "This may be a time to face conflict and obstacles directly and bring unresolved problems to a clear conclusion.\n\nLike bitter medicine that helps the body recover, difficult issues within a group or situation may need to be confronted rather than avoided.\n\nDo not simply cover over uncomfortable problems or continue tolerating people and situations that clearly do not fit. It is better to deal with them openly through fair and proper principles.\n\nSome friction or arguments may arise during the process, but once the underlying problem has been properly addressed, the situation may become much more stable.\n\nDo not be distracted by minor criticism around you. Hold your center and work through each problem carefully, one step at a time.",
      "yao": [
        "You may face a difficult problem from the very beginning.\n\nSome painful loss or inconvenience may need to be accepted in order to move out of the situation.\n\nBe careful not to repeat the same mistakes or ineffective responses from the past.\n\nCorrect the problem firmly at an early stage before it has a chance to grow.",
        "This may be a time to recognize honestly where your actual ability or authority is limited.\n\nThere is little benefit in protecting your pride or pretending to have more control than you do.\n\nLower your expectations where necessary and focus on dealing with the problem realistically within your current position.",
        "You may encounter an unexpectedly difficult person or a complicated obstacle.\n\nThe process may feel frustrating and exhausting, but the situation itself is unlikely to lead to complete failure.\n\nDo not give up too quickly.\n\nContinue working through the difficulty patiently and persistently until the problem can be properly understood and resolved.",
        "You may need to deal with a problem or person that feels difficult to manage with your current ability alone.\n\nTrying to control the situation too quickly may only create greater resistance.\n\nFollow clear principles, respond consistently, and allow enough time for the situation to change.\n\nIf you remain patient and steady, the resistance may gradually weaken and circumstances may begin to move in your favor.",
        "An unexpected crisis or a deeply rooted problem may appear and seem difficult to resolve.\n\nTrying to change the entire situation or another person all at once may only exhaust you.\n\nRemain steady in your own position and continue following the rules, responsibilities, or proper procedures that apply.\n\nConsistent and principled action may be more effective than forcing an immediate solution.",
        "You may be facing a situation where communication has completely broken down or where the problem is beyond what you can reasonably correct.\n\nTrying too hard to change or lecture someone who refuses to listen may place you in greater danger.\n\nKeep a clear distance from people or situations that are harmful or unsafe.\n\nAvoid becoming unnecessarily involved, and make protecting yourself the first priority."
      ]
    },
    "9_8": {
      "key": "9_8",
      "name": "Lu",
      "gua": "This may be a time of frequent change, making stability in daily life especially important.\n\nLike a traveler without a permanent place to stay, your surroundings may feel unsettled, with possible changes in work, position, department, or residence.\n\nRather than starting something entirely new or expanding too aggressively, it may be better to set a clear goal, strengthen your foundation, and focus first on creating greater stability in your life.\n\nEven if small amounts of income come in, larger expenses may also arise easily. Reducing waste and managing your finances carefully may help protect you.\n\nAt the same time, because this is a highly mobile period, work involving sales, promotion, or culture may benefit from quick and flexible action.\n\nSince you may be moving through unfamiliar surroundings, avoid drawing too much attention to yourself. Read the atmosphere carefully and adapt with good judgment.",
      "yao": [
        "Unnecessary doubt or anxiety may make you want to leave your current position or job impulsively.\n\nHowever, stepping too quickly into an unfamiliar situation may bring painful loss and difficulty.\n\nFor now, it may be safer to calm yourself and protect the position you already have rather than leaving simply because you feel unsettled.",
        "This may be a favorable time to find your place and gain greater stability in a new environment or organization.\n\nIf you avoid shortcuts, follow a sound path, and quietly fulfill your responsibilities, you may receive clear rewards and feel more secure.\n\nWhat you are trying to accomplish may proceed smoothly without leaving much reason for regret.",
        "In a highly competitive situation, insisting too strongly on your own position or behaving too aggressively may cost you valuable supporters and even the place that once gave you stability.\n\nIf you continue acting independently without regard for others, you may become isolated within the group and face a serious difficulty.\n\nThis is a time to reduce unnecessary confrontation and protect important relationships.",
        "An immediate problem may have been handled, bringing temporary stability or some reward.\n\nHowever, the solution may not address the deeper issue or provide the right long-term direction.\n\nEven if the practical problem has eased, a sense of uncertainty or dissatisfaction may remain.\n\nUse this temporary stability to consider what truly needs to change next.",
        "Your ability and results may receive clear recognition, bringing both greater respect and meaningful financial reward.\n\nEven in an unfamiliar environment, you may be able to recognize the right moment and act effectively.\n\nThis can be a very favorable time to achieve what you want through skill, timing, and careful judgment.",
        "Things may seem favorable at first, making it easy to become overconfident.\n\nLater, however, that confidence may lead to serious regret if you move beyond your actual role or area of expertise.\n\nBe especially careful about stepping too far into unfamiliar territory or crossing important boundaries.\n\nIf you overreach, you may risk damaging both the reputation and the resources you have worked hard to build."
      ]
    },
    "9_1": {
      "key": "9_1",
      "name": "Wei Ji",
      "gua": "This may be a time to accept an unfinished ending and prepare to begin again.\n\nSomething may have ended without complete satisfaction, leaving mixed feelings behind. At the same time, a new cycle is beginning, with many possibilities still ahead.\n\nThere may be much to do and considerable room for growth, but the situation is not fully ready yet. If you rush simply because you want clarity or progress, you may create unnecessary trouble.\n\nEven if the early stages feel slow or uneven, do not give up too quickly.\n\nConditions may improve gradually with time, so continue strengthening your foundation and remain patient in negotiations or ongoing discussions.\n\nTake an objective look at your current abilities and work with a partner or supporter who genuinely shares your direction.\n\nWith the right cooperation, what now feels like distant potential may eventually become something real.",
      "yao": [
        "You may still lack practical experience and feel unfamiliar with the environment around you.\n\nIf enthusiasm pushes you to act too quickly or makes you underestimate the situation, painful failure may follow.\n\nFor now, it may be better to hold back, remain cautious, and continue developing your abilities.",
        "This may be a time to recognize danger early and have the wisdom to stop yourself before acting recklessly.\n\nIf circumstances are pulling you forward too quickly, slow the momentum and pause.\n\nBy practicing restraint and waiting patiently, you may still reach your goal without serious difficulty.",
        "Rather than competing aggressively for control, it may be more useful to look for ways to cooperate and compromise.\n\nA significant obstacle may soon appear.\n\nIf you avoid excessive risk and respond with flexibility, you may be able to move through the difficulty and eventually turn the situation in your favor.",
        "If there is something wrong with your current position, direction, or way of working, correct it without delay.\n\nDo not rely on clever shortcuts.\n\nReturning to a sound and proper approach may feel demanding for a while, but working through that difficulty carefully can help you move into the next stage without regret.\n\nMeaningful results may follow once the foundation has been corrected.",
        "This may be an especially important time to remain faithful to clear principles and act with integrity.\n\nThe first signs of a solution may begin to appear in situations that have been tangled for a long time.\n\nIf you continue steadily in the right direction, this can develop into a highly favorable period that eventually brings strong results and recognition.",
        "You may be at risk of losing the attitude and principles that guided you at the beginning.\n\nOverconfidence can lead you into difficulties that become hard to manage.\n\nBe especially careful not to lose the trust or foundation you have built through careless action.\n\nIf the right timing has already passed, it may be better to let go of unnecessary attachment and make a clear decision to begin again from the start."
      ]
    },
    "9_4": {
      "key": "9_4",
      "name": "Ding",
      "gua": "This may be a time to let go of outdated methods and build something new with people who share your direction.\n\nA bold change can create strong opportunities for renewal and growth.\n\nOld habits, systems, or business practices may need to be reworked completely so that both the outward structure and the inner foundation can be refreshed.\n\nPartnerships with people who share your goals may be especially favorable, and spreading resources or investments wisely across different areas may bring unexpectedly strong returns.\n\nIn relationships, showing respect to those above you and generosity toward those below you can help stabilize both your position and the surrounding situation.\n\nWhen making agreements or contracts, considering the other person’s interests first may ultimately bring greater benefit back to you.",
      "yao": [
        "The methods you have relied on until now may no longer work well.\n\nThis may be a time to change old assumptions or familiar ways of working more completely than expected.\n\nBecause this is part of preparing for a new period of growth, some early mistakes or awkwardness may be unavoidable.\n\nEven if the beginning feels uneven, the process may eventually settle without serious trouble and lead to valuable new connections.",
        "This may be a time to create a new structure and fill it with something fresh and worthwhile.\n\nEven if something looks attractive on the surface, examine it carefully so that harmful, unreliable, or unhealthy elements do not enter the foundation.\n\nImportant events, plans, or projects may also benefit from being handled quietly and carefully rather than being shared too widely before they are ready.\n\nDiscretion may help bring them to a successful conclusion.",
        "Unexpected problems or sudden obstacles may appear while you are trying something new or making an important change.\n\nProgress may slow down for a while.\n\nEven so, do not give up simply because the process becomes frustrating.\n\nIf you continue with patience and determination, you may eventually reach the result you were hoping for and feel satisfied with what you have achieved.",
        "You may be reaching for a position or project that is far beyond what your current ability or resources can support.\n\nExcessive ambition under these conditions can lead to embarrassment and serious disruption.\n\nAn unrealistic plan that exceeds your actual capacity may eventually become impossible to manage.\n\nIf you are forcing something too large right now, it may be better to stop before the situation becomes more difficult.",
        "This may be a very favorable time, supported by a strong foundation and a sense of both material and emotional stability.\n\nEven if the people you lead or work with make small mistakes, avoid interfering in every detail.\n\nGiving capable people room to handle their responsibilities may produce better results than stepping in too quickly.\n\nTrust, patience, and flexibility may help preserve the favorable flow.",
        "You may be reaching a particularly strong state in which firmness and gentleness are well balanced.\n\nBecause of this, the people around you may offer genuine trust, respect, and support.\n\nEven if small mistakes or unexpected changes arise, cooperation from others can help resolve them smoothly.\n\nWhat you are trying to accomplish may unfold in a highly favorable and beneficial way."
      ]
    },
    "9_9": {
      "key": "9_9",
      "name": "Li",
      "gua": "This may be a time of strong motivation and abundant energy, but careful planning and quick judgment are just as important as enthusiasm.\n\nYou may feel ready to use your abilities fully and move with greater confidence. Work related to education, culture, or the arts may bring especially positive results.\n\nShort-term business or projects may produce clear benefits, while longer-term plans require more caution.\n\nThings may look impressive on the surface without being as substantial underneath, so pay particular attention to documents, contracts, and administrative details when negotiating or making agreements.\n\nTrying to push everything through by your own judgment alone may lead to mistakes. Move with initiative, but remain flexible, cooperate with capable supporters, and avoid careless action.",
      "yao": [
        "You may feel full of energy and ready to move immediately, but this is still only the beginning.\n\nTrying to take control too quickly may lead to unnecessary risk or early mistakes.\n\nLower your posture, observe the situation carefully, and take your first steps with humility and caution.",
        "This may be one of the most stable and favorable stages, with a strong sense of balance and clear judgment.\n\nEven if an unexpected or urgent problem appears, there is no need to panic.\n\nIf you remain flexible and work in harmony with the people around you, what you are trying to accomplish may proceed very smoothly and in your favor.",
        "This may be a delicate stage where the flow begins to weaken or decline.\n\nYou could become exposed to unexpected outside pressure, competition, or risks before you are fully prepared to handle them.\n\nDo not try to overturn the situation by force or take unnecessary risks.\n\nFor now, focus on maintaining stability rather than pushing for further expansion.",
        "You may become overly confident in your position or ability.\n\nIf excessive ambition leads you to begin something new too quickly or take on a high-risk challenge, the consequences may be difficult to manage.\n\nBe especially careful not to move beyond what your current capacity can realistically support.\n\nReckless expansion may lead to serious loss.",
        "You may hold an important position within a group while lacking enough practical authority to control the situation fully.\n\nThis can create considerable frustration and stress.\n\nEven so, do not give up simply because the present circumstances are difficult.\n\nIf you remain steady and endure the pressure, conditions may soon begin to turn in a more favorable direction.",
        "This may be a time to deal firmly with the deepest and most persistent problem while showing greater tolerance toward smaller mistakes or less important issues.\n\nBe clear about what truly needs to be cut away and what can be handled with understanding.\n\nIf you make those distinctions carefully and bring matters to a decisive conclusion, what you are pursuing may produce clear results without leaving unnecessary problems behind."
      ]
    },
    "9_7": {
      "key": "9_7",
      "name": "Kui",
      "gua": "This may be a time when people’s intentions drift apart, making it better to focus on smaller and more practical matters rather than pursuing something large.\n\nYou may find that the people around you do not share the same views or direction. Disagreement, internal division, or competition for influence can easily arise.\n\nBecause everyone may be looking in a different direction, forcing a major project or aggressive expansion could create unnecessary risk.\n\nRather than beginning something new, it may be better to make reasonable compromises and restore as much harmony as possible with the people around you.\n\nAvoid unnecessary transactions, disputes, or confrontations. Let go of overly ambitious goals for now and focus on smaller tasks that can be handled steadily.\n\nEven in a divided situation, approaching things with a calm and positive attitude may still bring practical benefits and useful lessons.",
      "yao": [
        "You may have enough ability, but lack a strong foundation or reliable supporter who can help guide you.\n\nDo not rush to build your own group or gather people around you simply to increase your influence.\n\nFor now, it may be wiser to remain where you are, observe the situation carefully, and wait for a better opportunity.",
        "You may unexpectedly meet someone important who genuinely shares your direction.\n\nThe encounter may happen in an unfamiliar place or outside the usual process.\n\nEven if the meeting does not follow the expected form or procedure, the timing may fit both sides unusually well.\n\nThrough this connection, situations that have been tangled may begin to resolve much more smoothly.",
        "You may be especially alert to conflict and capable of carefully analyzing disagreements in your relationships.\n\nHowever, during a crisis or unstable period, hesitation may make it difficult to act decisively.\n\nYou could lose influence or find yourself pushed aside while others move more aggressively.\n\nRemain patient and endure the difficult stage until conditions become more stable. Meaningful results may still follow later.",
        "Differences of opinion may leave you feeling isolated or disconnected from the people around you.\n\nTrust may also be difficult when everyone is uncertain about one another’s intentions.\n\nHold firmly to your own center and remember that this is already a difficult period.\n\nIf you respond carefully and avoid unnecessary risks, you may move through the situation without serious practical harm.",
        "You may be in a position where you need to stand between opposing sides and help balance the situation.\n\nIf you choose one side too quickly, the other may respond with strong resistance.\n\nDo not rush.\n\nStep back, observe carefully, and look for the person who is acting with the greatest fairness and sound judgment.\n\nWorking with the right person may help you achieve what you are hoping for.",
        "Misunderstanding and distrust may have reached a point where you find yourself constantly suspicious and tense.\n\nIf you become trapped in assumptions that exist only in your own mind, it may become difficult to see the situation clearly.\n\nRelease some of that tension and look directly at what is actually happening.\n\nOnce unnecessary suspicion begins to fade, the sense of blockage may lift and what you are trying to accomplish may start moving more smoothly."
      ]
    },
    "7_6": {
      "key": "7_6",
      "name": "Guai",
      "gua": "This may be a time to stop avoiding difficult choices and make a clear decision for yourself.\n\nIf you continue postponing a decision at an important crossroads, progress may remain blocked. The desire to satisfy every possibility at once can sometimes become another form of avoidance.\n\nWhen the right moment arrives, courage and a firm decision may help you regain control of the situation.\n\nHowever, current conditions may not be entirely in your favor. Acting too quickly or beginning something without enough preparation could increase the risk of failure.\n\nFinancial pressure may also grow, and you may find yourself carrying heavier responsibilities than expected.\n\nEven a small oversight could lead to conflict, disputes, or legal complications. Prepare carefully and wait for the right timing before making a major move.\n\nAt the same time, complicated conflicts should not be allowed to drag on unnecessarily. Resolve what needs to be resolved clearly and promptly.\n\nAvoid guaranteeing another person’s obligations, and review documents and contracts thoroughly so that preventable risks do not become larger problems.",
      "yao": [
        "Your enthusiasm may be running ahead of your ability to see the situation clearly.\n\nActing without a realistic plan can lead to failure even when you believe your position is justified.\n\nTake an objective look at the circumstances before moving.\n\nAvoid impulsive action and do not let determination turn into recklessness.",
        "An unexpected problem or crisis may appear, leaving you anxious and uncertain about what to do next.\n\nRather than remaining alone with the worry, actively seek support from people who can help.\n\nIf you look at the situation objectively and respond step by step, you may be able to move through the crisis without serious damage.",
        "This may be a dangerous stage where an important foundation, central relationship, or essential part of your work is at risk of serious damage.\n\nTrying to escape quickly or avoid the situation may create additional problems.\n\nEven if facing the issue feels difficult, remain steady and endure what needs to be dealt with.\n\nHolding your ground may help prevent the situation from becoming worse.",
        "You may know that a decision needs to be made, yet continue delaying it because of uncertainty or fear.\n\nAvoidance can allow the situation to deteriorate and leave you with deeper regret later.\n\nSet aside the anxiety, choose a clear direction, and act accordingly.\n\nA timely decision may help prevent unnecessary loss.",
        "You may be carrying responsibility for many unresolved decisions, making the situation feel heavy and slow.\n\nIf you are in a leadership position, clear judgment and firm boundaries may now be necessary.\n\nDo not allow important matters to remain unsettled for too long.\n\nIf you stay centered, make clear decisions, and follow through consistently, the confusion around you may be resolved without major trouble.",
        "You may have reached a crisis after relying too heavily on your own judgment.\n\nThe situation can feel deeply isolating, with little room to retreat and few people available to help.\n\nEven so, this difficult decision is not necessarily the end. It may be part of finding a way forward.\n\nThe blocked period may not last forever.\n\nRather than continuing to avoid what is happening, prepare yourself to face the situation directly. A path may begin to open once you stop resisting the need for change.\n\nWhat you are trying to pursue may still be difficult under the current conditions."
      ]
    },
    "7_2": {
      "key": "7_2",
      "name": "Cui",
      "gua": "This may be a time when people, opportunities, and resources begin to gather around you.\n\nAs more possibilities come your way, remain humble and make good use of the opportunities in front of you while also preparing for the future.\n\nYour abilities may be recognized more clearly, helping your position rise and drawing more people toward you. Exams, promotions, business growth, or financial matters may all move in a favorable direction.\n\nHowever, the more people gather, the more competition and conflict can also increase.\n\nContinue doing your best, but remain generous and modest in the way you deal with others.\n\nIf you consider not only your own benefit but also what is fair and useful for the people around you, you may avoid unnecessary trouble later.\n\nBecause this is a favorable period, it is also important to prepare wisely for the difficulties that may eventually follow.",
      "yao": [
