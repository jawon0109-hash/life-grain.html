  "6_9":{
    name:"천화동인",
    gua:"팀을 이루어 내 뜻을 펼치는 때. 목표가 맞는 사람들과 함께 내 일을 넓게 펼칠 수 있는 시기입니다. 위는 하늘이고 아래는 불이니, 하늘에 밝은 태양이 떠오른 형상입니다. 바른 마음으로 사람들과 교류하며 협력하면 하고자 하는 일이 아주 유리하게 흘러갑니다. 혼자서 독단적으로 진행하기보다는 마음 맞는 사람들과 힘을 합치는 편이 훨씬 좋습니다. 다만 학연, 지연, 혈연 등 사사로운 감정이나 좁은 이득을 우선시하여 파벌을 나누면, 오히려 다 된 일도 그르칠 수 있으니 넓고 공명정대한 마음을 가져야 합니다.",
    yao:["마음을 활짝 열고 나와 뜻이 맞는 사람들과 두루두루 교류하며 뜻을 펼치니 아무런 문제가 없습니다. 새로운 일을 시작하기 아주 좋은 시기입니다.",
         "좁은 시야로 끼리끼리만 만나 어설프게 협력하려 하니, 일은 제대로 진행되지 않고 도리어 부끄러운 일만 생겨납니다.",
         "제대로 계획을 실행하지도 못하고 주변 눈치만 보며 간만 보고 있으니 되는 일이 없습니다. 잔꾀가 통하는 시기가 아니므로, 헛된 욕심을 부리면 큰 피해가 생기고 한동안 회복하기 힘들어집니다.",
         "나아가야 할 때와 멈춰야 할 때를 바르게 알고 대처하는 시기입니다. 당장 포기하지만 않는다면 결국 전화위복이 되어 좋은 기회로 돌아오니, 힘들더라도 끝까지 끈기를 잃지 말아야 합니다.",
         "처음에는 숱한 난관에 부딪혀 힘에 부치지만, 고비를 넘기고 나중이 되면 일이 쉽게 풀려나갑니다. 믿을 만한 사람과 함께 일을 도모하고 있으니 그 과정이 큰 도움이 될 것입니다.",
         "마침내 평화로운 때가 왔습니다. 중심에서 한발 벗어나 있더라도, 편안한 마음으로 그 누구와도 얽매임 없이 자유롭게 교류할 수 있으니 더할 나위 없이 좋은 시기입니다."]
  },
  "6_7":{
    name:"천택리",
    gua:"윗사람은 윗사람답게, 아랫사람은 아랫사람답게 행동해야 하는 때. 위험이 닥쳐도 큰 손해가 없어 안심할 수 있는 상황이지만, 그걸 믿고 경거망동하면 큰 손해와 낭패를 볼 수 있습니다. 매사에 조심하고 바른 마음으로 행동하면 큰 탈 없이 넘어갈 수 있습니다. 때로는 기본과 예의를 지키는 것만으로도 위기를 무사히 넘길 수 있는 법입니다.",
    yao:["평소 하던 대로 움직이되, 더 잘하려고 무리하게 나서거나 오버하면 안 됩니다. 때로는 꾸밈없는 정직함이 가장 큰 무기가 됩니다.",
         "갖추고 있는 것이 많아 주변에 유혹이 많을 수 있습니다. 욕심이 생기더라도 바른 마음으로 흔들림 없이 임한다면 문제가 없습니다. 잘못된 것이 있다면 미루지 말고 바로 개선하는 것이 좋습니다.",
         "실력은 부족한데 눈만 높아 경거망동하기 쉽습니다. 때로는 과감히 물러서는 것이 진짜 용기일 때도 있습니다. 억지로 밀고 나아가면 큰코다칠 수 있으니, 무리하게 일을 진행하지 않는 편이 좋습니다.",
         "자신의 위치를 정확히 파악하고, 무섭고 조심해야 할 것을 제대로 알고 대처하니 결국 하고자 하는 일의 끝이 좋습니다.",
         "가끔은 능력이 너무 뛰어난 것도 문제가 될 때가 있습니다. 바르고 정당하게 일을 처리하더라도 지나치게 강경하면 위태로울 수 있으니 항상 경계심을 가져야 합니다. 상황이 위태로우니 억지로 일을 벌이지 않는 것이 좋습니다.",
         "자신이 걸어온 길을 잘 돌아보고 마무리하니, 하고자 하는 바를 이루고 출세하는 등 좋은 일이 많습니다."]
  },
  "2_6":{
    name:"지천태",
    gua:"우주의 힘이 나에게! 말하는 대로, 원하는 대로 이루어질 정도로 만사가 형통한 시기입니다. 좋은 사람들을 만나게 되고 막혔던 부분이 있다면 술술 풀립니다. 다만 운이 좋은 시기인 만큼 자만하거나 방심하면 오히려 다 된 일을 망칠 수 있으니, 좋은 시기를 만난 만큼 더욱 노력을 기울이는 것이 좋습니다.",
    yao:["고생 끝에 낙이 옵니다. 좋은 사람들도 모이고 하고자 하는 일이 막힘없이 술술 풀리는 시기입니다.",
         "적은 투자로 많은 이익을 얻고 노력에 비하여 좋은 결과가 나옵니다. 다만 나에게 좋은 운이 들어온 만큼 부족한 사람을 배척하지 말고 넓은 마음으로 포용해야 합니다. 끼리끼리 뭉치려 하지 말고 바른 마음으로 임해야 온전히 얻을 수 있습니다.",
         "세상 편하게 살려고만 하면 오히려 나를 해치게 됩니다. 운이 좋은 만큼 내실을 다지고 새로운 것들을 받아들이며 나를 발전시키면, 하고자 하는 일이 평탄하게 흘러갑니다.",
         "돈 자랑, 힘 자랑은 금물. 가진 것을 내세우지 않고 진심으로 사람을 대하니 사람들이 자연스레 곁으로 모여듭니다. 얄팍하게 계산기 두드리지 않고 사심 없이 마음을 열면, 시기 질투 없이 주변과 단단하게 화합할 수 있습니다. 진심은 결국 통하는 법입니다.",
         "겸손, 또 겸손해야 합니다. 겸손한 태도에 실력과 운이 따르는 시기이니 하고자 하는 일에 큰 결과가 따릅니다. 사람들과 화합하기 좋은 시기이므로 적극적으로 일을 해 나가면 바라는 바를 이룰 수 있습니다.",
         "묵묵히 버티는 것이 능사이나 그조차 쉽지 않은 시기입니다. 해가 기우는 때이니 나 자신을 한껏 낮추고 혼란스러운 시기를 무사히 넘겨야 합니다. 새롭게 하려고 하는 일이 있다면 멈추는 것이 좋습니다."]
  },
  "2_2":{
    name:"중지곤",
    gua:"큰 마음으로 큰 포용력을 가져야 할 때. 모든 것을 포용하고 받아들일 수 있는 넓은 마음이 필요한 시기입니다. 큰 뜻을 이루려면 그에 걸맞은 경험도 필요하니, 나서서 적극적으로 앞장서기보다는 전문가나 윗사람을 따르며 배우고 성장하기에 좋은 때입니다. 흔들림 없이 인내심을 가지고 묵묵히 임하면 끝내 큰 결실로 돌아옵니다.",
    yao:["어려움이 있은 뒤에 기회가 오는 법입니다. 다가올 징조를 미리 알아채고 차분히 대비하며 준비한다면 하려는 일을 이룰 수 있습니다.",
         "억지로 애쓰지 않아도 일이 순리대로 부드럽게 풀리는 때입니다. 익숙하지 않은 일이라도 어렵지 않게 진행되니, 이 시기를 잘 활용하면 좋은 결실을 얻을 수 있습니다.",
         "어설프게 일을 벌이거나 나서지 않는다면 하고자 하는 바를 이룰 수 있습니다. 당장 빠른 결과가 나오는 시기가 아니니, 조용히 실력을 갖추고 묵묵히 내실을 다진다면 훗날 좋은 결과가 있을 것입니다.",
         "크게 얻을 것도, 잃을 것도 없는 시기입니다. 그렇다고 여기저기 자신의 상황을 가볍게 떠벌리고 다니면 좋을 것이 하나도 없습니다. 입을 무겁게 하고 말조심한다면 별탈 없이 평탄하게 흘러갈 것입니다.",
         "마치 길에서 금덩이를 주운 것처럼 큰 결실이 있는 시기입니다. 바른 마음으로 스스로를 낮추고 겸손하게 행동하니, 하려는 일에서 얻는 것이 매우 많은 때입니다.",
         "나 자신을 잃고 지금 무슨 일을 하는지도 모른 채 헤매는 시기입니다. 뚜렷한 목적 없이 자기 자신, 혹은 주변과 무의미하게 싸우고만 있으니 되는 일이 없습니다. 억지로 밀어붙이려 하지 말고 잠시 멈추어 나를 돌아보는 것이 상책입니다. 새롭게 하고자 하는 일이 있다면 지금은 하지 않는 것이 좋습니다."]
  },
  "2_3":{
    name:"지뢰복",
    gua:"긴 겨울이 지나 드디어 찾아온 봄! 봄이 왔지만 아직은 매서운 꽃샘추위가 남아있는 때입니다. 조금씩 막혔던 운이 풀리고 회복되는 시기이므로, 바른 마음을 가지고 초심을 다지는 것이 좋습니다. 이제 막 싹이 돋아나는 때이니 성급하게 서두르거나 무리하게 움직이지만 않는다면, 조만간 내 실력을 마음껏 활약할 시기가 올 것입니다. 재물운도 점차 좋아지는 흐름입니다.",
    yao:["주변에서 도와주는 사람이 많이 생겨 나의 약점을 채워주고 커버해 주는 시기입니다. 초장에 잘못된 것을 바로잡고 주변의 도움을 마음껏 받아도 좋은 때이며, 하려는 일은 큰 성과를 낼 수 있습니다.",
         "드디어 진짜 봄이 왔습니다. 고생 끝에 낙이 오니 하고자 하는 일은 반드시 이룰 수 있습니다. 다만 나보다 뛰어난 사람이나 전문가의 조언을 열린 마음으로 잘 받아들이고 본받는 것이 무엇보다 중요합니다.",
         "일에 다소 막힘이 생기고 마음이 자꾸 흔들릴 수 있으나, 스스로 경계하고 조심하니 다행히 큰 피해는 없습니다. 마음이 불편하고 무언가 하나를 양보하거나 내어주어야 하는 상황이 생길 수 있습니다. 하고자 하는 일이 당장은 힘들게 느껴져도 결국 무사히 마무리할 수는 있습니다.",
         "첩첩산중. 주변 상황이나 맞지 않는 사람들과 억지로 어울리려 애쓰기보다, 차라리 혼자 묵묵히 제 갈 길을 가는 것이 오히려 마음 편한 때입니다. 자신의 현재 상태를 정확히 파악하고 스스로를 돌아보며 바른길을 고집하는 것이 좋습니다.",
         "바른 마음으로 주변을 살피고, 책임자의 자세로 옳지 못한 것들을 단호하게 정리해야 하는 때입니다. 무리하게 새로운 것을 벌여 움직이기보다는, 덕을 베풀며 순리에 따르는 것이 가장 이롭습니다.",
         "자신이 무엇을 하고자 하는지 방향을 잃고 방황하게 되어 무척 힘든 시기입니다. 제자리로 돌아갈 타이밍을 놓쳐 미혹된 상태이니, 지금 억지로 밀어붙이려 하는 일은 실패로 끝날 확률이 높습니다. 가만히 멈춰 서서 길을 다시 찾는 것이 우선입니다."]
  },
  "2_8":{
    name:"지산겸",
    gua:"겸손, 또 겸손! 겸손이 미덕인 시기입니다. 하고자 하는 일이 잘 풀리는 시기이나 겸손한 처세가 가장 중요합니다. 주변의 존경과 도움을 받고자 한다면 스스로를 낮추고 양보하는 미덕이 필요한 법입니다. 그래야 어려움이 있더라도 주변 사람들의 도움을 받아 순조롭게 일을 처리할 수 있습니다. 섣불리 자신을 내세우지 않고 묵묵히 자신의 역할을 충실히 해낸다면 훌륭한 결과가 있을 것입니다.",
    yao:["어려운 일이 닥쳐도 겸손한 마음가짐으로 차분하게 일을 처리하니, 큰 어려움 없이 좋은 마무리를 할 수 있습니다.",
         "샛길로 빠지지 않고 가고자 하는 길을 향해 묵묵히 걸어나가는 모습이 자연스럽게 빛을 발하는 시기이니, 하고자 하는 일에서 좋은 결과를 얻을 것입니다.",
         "자신이 이룬 성과에 자만하지 않고 변함없이 겸손한 자세를 유지하니, 주변에 사람들이 자연스럽게 따르는 시기입니다. 결과가 아주 좋은 때입니다.",
         "가식적으로 꾸미지 않으면서도 상황에 맞게 적당히 자신을 낮출 줄 아니, 흠잡히거나 문제가 될 일이 전혀 없는 때입니다.",
         "좋은 성품을 바탕으로 겸손하게 주변 사람들과 두루두루 잘 지내며 나누니 큰 인망이 따르는 시기입니다. 억지로 하고 싶지 않은 일이 생기더라도 단호하게 거절할 정당한 이유가 있으니, 무리해서 안고 가지 않아도 괜찮은 시기입니다.",
         "주변의 평판이 널리 좋아지는 시기입니다. 당장 원하는 만큼의 폭발적인 성취는 없을 수 있으나, 더 먼 미래를 바라보며 묵묵히 자신의 할 일을 제대로 해 나가는 때이니 현재의 자리에서 실력을 탄탄하게 발휘하기 좋은 시기입니다."]
  },
  "2_1":{
    name:"지수사",
    gua:"뚜렷한 목표를 가지고 바른 마음으로 전진! 치열한 경쟁이나 갈등 상황, 혹은 원치 않아도 내가 누군가를 이끌어야 하는 시기입니다. 그에 맞는 규율과 질서가 필요한 시기이며, 바른 마음으로 임해야 좋은 결과가 있습니다. 이 상황을 이끌어가는 책임자의 역량이 가장 중요한 시기이니 정직하고 능력이 되는 사람을 앞에 세워야 합니다. 준비되지 못한 사람이 나서면 되는 일이 없습니다.",
    yao:["조직을 이끄려면 그에 맞는 규칙과 질서가 있어야 합니다. 일을 시작하기 전에 작게는 자신만의 루틴, 크게는 조직의 규율을 미리 만들어 놓는 것이 좋습니다.",
         "능력 있는 사람이 조직이나 나를 이끌어 주니 그만큼 결실이 있는 시기입니다. 하는 일마다 좋은 평가를 받을 정도로 훌륭한 시기라고 볼 수 있습니다.",
         "침몰하는 배에 탄 것과 마찬가지입니다. 능력 없는 사람이 무리를 이끌고 있으니 그것은 망하는 지름길과 같습니다.",
         "모든 상황이 나에게 불리하게 작용하니, 이런 시기에는 한발 물러서는 것도 좋습니다. 작전상 후퇴는 전략이지 회피가 아닙니다.",
         "하고자 하는 일이 있다면 적극적으로 임하는 것도 좋습니다. 다만, 반드시 능력이 좋은 사람들과 팀을 이루어야 합니다. 경험이 적고 능력이 부족한 자와 팀을 이루면 하는 일마다 큰 손해를 입을 수 있습니다.",
         "하고자 하는 일이 큰 결실을 맺는 때입니다. 큰 성과가 있다면 나를 도와준 주변에 넉넉히 보답하되, 바르지 못한 사람에게는 결코 중요한 정보나 권력을 주어서는 안 됩니다."]
  },
  "2_4":{
    name:"지풍승",
    gua:"이 몸이 나설 때! 선수 입장! 막혔던 것들이 풀리고 위로 상승하는 때입니다. 노력에 대한 정당한 보상을 받는 시기이니 조급하게 서두르지 않는 것이 중요합니다. 한 단계씩 차분히 나아가면 큰 목표를 이룰 수 있습니다. 나를 이끌어줄 수 있는 전문가나 윗사람의 조언을 적극적으로 받아들이면 문제없이 목표를 달성할 수 있습니다.",
    yao:["나를 이끌어줄 윗사람이나 전문가가 있다면 믿고 따르는 것이 좋습니다. 갓 틔운 새싹은 무한한 가능성이 있으나 아직 스스로 뚫고 나갈 힘은 부족하기 때문입니다.",
         "내가 가진 것이 턱없이 부족하다 해도, 바르고 진실한 마음으로 하는 일에 임하면 원하는 목표를 충분히 이룰 수 있습니다.",
         "이른바 빈집털이. 큰 문제나 걸림돌 없이 아주 쉽고 순조롭게 일이 풀립니다. 내 가치가 가파르게 상승할 수 있는 흐름입니다.",
         "바른 태도로 일에 임하고 끊임없이 정성을 다해 노력하니, 하고자 하는 일이 어떤 어려움 없이 잘 풀리는 시기입니다.",
         "꾸준함과 성실함으로 계단을 밟듯 단계를 거쳐 성장하니, 그에 걸맞은 확실한 보상과 결과가 따르는 시기입니다. 흔들림 없이 바른 마음을 굳건히 지키는 것이 가장 중요한 때입니다.",
         "싹을 틔우고 높이 올랐지만 앞이 보이지 않는 캄캄한 밤처럼 위태로운 시기입니다. 자신의 현재 위치를 객관적으로 파악하고, 무리하게 전진하기보다 잠시 멈출 줄 알아야 재앙을 피할 수 있습니다."]
  },
  "2_9":{
    name:"지화명이",
    gua:"달도 없는 캄캄한 밤, 술이나 한잔 기울여 봄이... 열심히 노력해도 내 능력을 알아주는 사람이 없는 시기입니다. 현재의 직면한 문제를 피하려 하지 말고, 대외적으로는 융통성을 발휘하며 스스로를 한껏 낮춰야 하는 시기입니다. 조용히 내실을 다지고 흔들리지 않는 바른 마음으로 꿋꿋하게 견디면 결국 노력한 만큼의 성과가 나니, 조급해하지 말고 시기와 때를 기다리는 것이 좋습니다.",
    yao:["섣불리 나서지 말고 현상 유지에 힘써야 합니다. 운이 저조해지기 시작했으니 나 자신을 낮추며 상황을 가만히 지켜보는 것이 좋습니다.",
         "하는 일이 하향 곡선을 타고 있는 위태로운 상황이나, 다행히 도움을 주는 사람을 만나 큰 문제 없이 무사히 지나갈 수 있습니다. 쓸데없는 고집을 부리지 않는 것이 중요합니다.",
         "여긴 어디? 나는 누구? 나아갈 방향을 잃고 헤매는 시기입니다. 지금의 어려움은 오롯이 스스로 헤쳐 나가야 하는 몫이니, 새롭게 하려는 일은 멈추고 자중하는 것이 좋습니다.",
         "나를 믿어주는 사람이 하나도 없고 엉뚱한 사람들이 신뢰를 얻고 있습니다. 막다른 길목에 다다랐으니 늘 경계하고 말과 행동을 조심하는 것이 좋습니다.",
         "기나긴 어둠이 끝나고 저 멀리서 해가 떠오르며 하는 일이 서서히 풀리는 시기입니다. 가장 어려운 순간까지 묵묵히 최선을 다해 지나왔으니 마침내 좋은 결실이 있을 것입니다.",
         "아무리 발버둥 치며 노력해도 되는 일이 없는 시기입니다. 경거망동하지 말고 젖은 낙엽처럼 바닥에 딱 붙어 있어야 합니다. 억지로 상황을 바꾸려 든다면 걷잡을 수 없이 큰 손해를 입을 것입니다."]
  },
  "2_7":{
    name:"지택림",
    gua:"깊은 연못 같은 포용심으로. 여러 사람 위에 설 수 있는 능력을 갖췄으니 자신감을 가지면 좋습니다. 다만, 윗사람과 아랫사람을 넉넉히 포용하며 어느 한쪽에도 치우치지 않는 조화로움이 필요한 시기입니다. 현재는 왕성하게 자신을 믿고 활동하기 좋은 시기이나, 해가 뜨면 지듯 언젠가 다가올 쇠퇴기를 대비해 확실하게 결과를 내는 타이밍을 놓쳐서는 안 됩니다. 과감하게 나서되, 현명한 처신이 필요합니다.",
    yao:["윗사람의 조언을 받아들이고 적극적으로 일에 임해도 좋은 시기입니다. 다만, 문제가 생기면 꼼수 없이 정공법으로 진실하게 설득하는 편이 좋습니다. 성급하게 움직이지 않는다면 하는 일은 순조롭게 좋은 결과를 낼 수 있습니다.",
         "주변 사람들에게 처신을 잘해야 하는 시기입니다. 그만큼 평판과 이미지가 중요합니다. 힘을 쥔 윗사람이 내 일을 탐탁지 않아 하는 모양새니, 주변을 잘 살피고 먼저 마음으로 설득하지 못하면 하고자 하는 일이 쉽지 않습니다.",
         "나에게 칼자루가 넘어왔다고 해서 마구 휘두르면 안 됩니다. 처신을 잘못하여 힘으로만 누르려 하면 사람들이 등을 돌리니 하려는 일이 쉽지 않습니다. 주변인들에게 너그럽게 대하여 신임을 얻는 것이 관건입니다.",
         "다른 사람에게 안일하게 일을 맡기거나 보수적인 태도로 임하면 좋지 않습니다. 새로운 일을 직접 시작하여 적극적으로 이끌고 나아간다면 별문제가 없습니다.",
         "스스로에 대한 자신감을 가지는 것이 가장 중요합니다. 적절한 시기와 때에 맞춰 하고자 하는 일을 추진한다면 좋습니다. 아랫사람의 마음을 읽고 함께하는 사람들의 지지를 얻는다면 아주 훌륭한 결과가 있을 것입니다.",
         "따뜻하고 돈독한 마음으로 젊은 에너지를 가진 사람들과 함께하면 좋습니다. 개인적인 입장보다 조직 전체의 입장을 중심으로 존중하며 일을 추진하면 문제없이 순조롭게 일이 풀릴 것입니다."]
  },
  "3_6":{
    name:"뇌천대장",
    gua:"드디어 나의 때가 왔다! 나의 목표를 성취할 수 있는 아주 좋은 시기입니다. 작고 자잘한 일보다 대규모 일을 시작하거나 사업을 확장하기에 제격인 때입니다. 다만 기세가 강한 만큼 주변을 무시하고 독단적으로 일을 진행하면 날벼락을 맞을 수 있으니 항상 경계심이 필요합니다. 겉만 화려하고 실속이 없을 수 있으니, 일을 시작하기 전에 제대로 알아보고 점검하는 것이 중요합니다.",
    yao:["이제 막 시작한 단계입니다. 주도권을 쥐었으나 아직은 때를 기다려야 합니다. 섣불리 나서지 말고 상황을 살피며 좋은 사람들을 곁에 두는 것이 필요합니다.",
         "마음을 바르게 잡고 자신의 처신을 신중히 하는 것이 좋습니다. 그만한 힘이 넘치는 시기이니 함부로 나서는 것은 좋지 않습니다.",
         "문제가 생겨 걷잡을 수 없이 커질 수 있으니 미리 살펴보고 점검해야 합니다. 덮어놓고 지나치면 앞으로 일이 더 크게 번질 수 있습니다.",
         "문제가 생긴 것을 사전에 제대로 처리하니 더 이상 막힘이 없습니다. 상황을 정확히 파악하고 실행에 옮기니 하고자 하는 일의 흐름이 아주 좋습니다.",
         "때로는 하나를 내어주는 것이 더 큰 손해를 막을 수 있습니다. 현재는 스스로를 낮추고 어느 정도의 손해를 감수해야 하는 시기이니, 잠시 어깨에 힘을 빼고 주변 사람들과 좋은 관계를 유지하도록 노력해야 합니다.",
         "이러지도 저러지도 못하는 진퇴양난의 상황입니다. 꼼수를 부리다가 오히려 큰코다칠 수 있으니, 피하지 말고 정면 돌파하여 일을 해결한다면 도리어 전화위복이 되어 돌아올 것입니다."]
  },
  "3_2":{
    name:"뇌지예",
    gua:"새 출발! 미래에 대한 계획을 세우고 적극적으로 움직이면 순조롭게 나아가는 시기입니다. 물 만난 고기처럼 바른 결단력과 순발력으로 사람들을 이끌 수 있는 때입니다. 주변의 좋은 사람들과 힘을 합친다면 더할 나위가 없습니다. 다만, 스스로를 과신하며 오만하게 행동하면 큰 망신을 당할 수 있으니 겸손한 자세가 반드시 필요한 시기입니다.",
    yao:["다른 사람의 능력을 마치 자기가 해낸 것인 양 나대고 싶어지는 시기입니다. 자신의 과욕에 눈이 멀면 패가망신할 수 있으니 조심해야 합니다. 새롭게 하려고 하는 일이 있다면 좋지 않습니다.",
         "유혹이 많으나 잘 참고 견디는 상황입니다. 분수에 맞지 않게 행동하지 않고 바른길을 가니 큰 어려움이 없는 시기입니다.",
         "정신 못 차리고 놀다가 '이러다가는 정말 안 되겠다'라며 깨닫고 후회하는 모양새입니다. 상황에 맞는 처신을 해야 하는 시기이며, 현재의 자리가 도움이 되지 않는다면 미련 없이 빨리 벗어나는 것이 상책입니다.",
         "나 자신을 믿고 움직이며 주변과 잘 어우러지니 더할 나위가 없습니다. 겸손하게 화합을 도모하는 것이 좋으며, 하고자 하는 일에서 큰 결실이 있습니다.",
         "과도하게 인생을 즐기다 결국 문제에 봉착한 상황입니다. 위기를 회피하지 말고 끈질기게 해결하려 움직이면 큰 피해는 막을 수 있습니다. 주변에 휘둘리지 말고 자신을 믿고 끝까지 힘을 내는 것이 좋습니다.",
         "인생을 잘 즐긴다고 생각하지만, 방탕한 생활로 그간 쌓아온 평판이나 입지가 무너질 위기에 있습니다. 지금이라도 멈추고 그것을 교훈 삼아 다시 노력한다면 지난날의 과오를 무사히 해결할 수 있습니다."]
  },
  "3_3":{
    name:"중뢰진",
    gua:"넘치는 활기, 잊지말고 실속은 챙기자! 활기가 넘치는 시기이니 목표를 세우고 노력하면 이룰 가능성이 높은 시기입니다. 허나 겉만 화려하고 실속이 없을 수 있습니다. 욕심만 앞서고 적은 노력으로 얻고자 하는 마음이 들 수 있으니 경계하는 것이 좋습니다. 목표와 계획을 확실히 하고 주변의 소음은 신경 쓰지 않는 편이 좋습니다. 어려움이 생기면 섣불리 나서지 말고 주변에 도움을 청하는 것도 좋습니다.",
    yao:["하는 일에 비해 주변의 공치사가 심해 다소 부담스러울 수 있으나, 결국 좋은 성과를 낼 수 있습니다. 나 자신을 돌아보고 상황을 제대로 바라보며 대비하면 문제가 생겨도 별탈이 없습니다.",
         "손해를 보기 쉬운 때입니다. 작은 손해를 보더라도 과감하게 손절하는 것이 좋습니다. 미련을 버리지 못하면 오히려 더 위험한 상황에 놓이게 되니, 작은 손해가 있더라도 빠른 손절을 해야 차후에 잃은 것을 되찾을 수 있습니다.",
         "주변이 시끄러워 다소 불안한 상황입니다. 두려워하지 않고 하고자 하는 일을 묵묵히 지속하면 무리 없이 나아갈 수 있는 시기입니다.",
         "나에게 불똥이 튀지만 다행히 큰 해를 끼치지는 못합니다. 답답한 상황이지만 실제적인 피해는 없는 시기이니 큰 무리가 없습니다.",
         "무엇인가 큰 탈이 날까 우려스럽고 걱정되지만 실상은 별탈 없이 흘러갑니다. 겉보기엔 복잡한 상황이지만 큰 무리 없이 순조롭게 지나가는 때입니다.",
         "내가 아닌 다른 사람에게 불똥이 튄 상황입니다. 괜히 억지로 나서서 스스로 무덤을 파지 말고, 묵묵히 내 자리를 지키며 상황을 관망하는 것이 좋습니다."]
  },
  "3_8":{
    name:"뇌산소과",
    gua:"소소하게 소확행. 크게 일을 벌이지 말고 일의 규모를 줄이는 것이 좋습니다. 나에게 분에 넘치는 행동을 한다면 손해가 생길 수 있으니, 상황을 잘 살펴 내가 감당 가능한 일을 하는 것이 좋습니다. 지금 하는 일이 잘되고 있다 하더라도 어려움이 생기면 원래 하던 일(본업)로 돌아가는 것이 상책입니다. 지금은 운기가 좋은 시기도 아니고 손실도 발생할 수 있는 때이니, 나를 돌아보고 인내하며 어려운 시기를 무사히 넘기는 것이 좋습니다.",
    yao:["내가 타깃이 되어 치명적인 손실이 있을 수 있으니 조심하는 것이 좋습니다. 과욕을 부리거나 선을 넘는 지나친 행동은 절대 하지 않아야 합니다. 새롭게 하고자 하는 일이 있다면 안 하는 것이 좋습니다.",
         "원하는 것이 무엇인지, 일의 핵심을 정확하게 파악하는 것이 급선무입니다. 절차를 무시하고 욕심만 앞세워 제대로 된 확인 없이 움직이면 원하는 것을 결코 얻지 못합니다.",
         "나의 허물이나 그릇됨을 그냥 내버려 두면 안 됩니다. 인과응보로 나에게 되돌아오기 전에 상처를 도려내듯 개선해야 합니다. 그렇지 않으면 큰 어려움이 생길 수 있습니다. 자신의 힘을 믿고 독단적으로 나서면 적만 많아지는 시기입니다.",
         "작은 구멍인 줄 알고 내버려 두면 큰 손실이 있을 수 있으니 꼼꼼하게 상황을 지켜보고 경계하는 것이 좋습니다. 나 자신의 분수를 알고 바르게 행동하면 하고자 하는 일은 큰 어려움 없이 흘러가는 시기입니다.",
         "때가 되었다 생각하나 결과가 나오지 않습니다. 아직 비가 내릴 때가 되지 않았으니 묵묵히 기다리는 것이 좋습니다. 섣불리 나서지 말고 겸손하게 실력 있는 전문가와 함께 연대한다면 가까운 시일 내에 좋은 성과가 있을 것입니다.",
         "욕심을 지나치게 부려 나에게 큰 화가 들이닥치는 상태입니다. 작은 실수라 생각했던 것이 걷잡을 수 없이 커지고, 스스로 잘못을 수습하거나 해결하기 매우 어려운 때입니다."]
  },
  "3_1":{
    name:"뇌수해",
    gua:"인생의 봄날. 새로운 목표를 향해 가기도 좋고, 지금까지 막히고 어려웠던 일들이 시원하게 풀려나가는 시기입니다. 도움이 되는 사람을 만나 새로운 활동을 하기 좋은 때이나, 목표를 분명히 하지 않고 대충 하려고 하면 오히려 손해를 볼 수 있습니다. 하고자 하는 일은 머뭇거리지 말고 빨리 도전하는 것이 좋고, 당장 하고자 하는 일이 없다면 내실을 다지며 실력을 기르는 것이 좋습니다.",
    yao:["나에게 도움이 되는 사람을 만나니 하고자 하는 일은 순조롭게 진행되나, 자신의 현재 상황을 바로 알고 그에 맞는 바른 행동을 하는 것이 가장 중요합니다.",
         "중심을 잃으면 되는 일이 없는 때입니다. 조급함을 내려놓고 천천히 단계적으로 해야 할 일을 이끌어 나간다면 목표를 달성하는 시기입니다. 그에 따른 금전운도 아주 좋을 것입니다.",
         "내가 가지고 있는 불만을 교묘하게 이용하여 본인 잇속만 챙기려는 사람들이 달라붙는 시기입니다. 내 처세를 돌아보고 단단히 중심을 잡는 것이 좋습니다. 새롭게 하고자 하는 일이 있다면 결코 쉽지 않은 시기입니다.",
         "익숙한 사람들과 끼리끼리 놀지 말고 과감하게 새로운 곳으로 가는 것이 좋습니다. 새로운 인연들과 좋은 협력을 이룰 수 있는 시기이니, 하고자 하는 일에서 훌륭한 결실을 볼 수 있습니다.",
         "답답했던 문제가 있다면 마침내 일이 해결되는 좋은 시기입니다. 나와 맞지 않거나 반대하던 사람이라고 배척하지 않고, 내가 먼저 손을 내민다면 오히려 큰 도움이 되는 시기입니다. 만약 계속 배척한다면 다시 침체에 빠질 수 있습니다.",
         "내 알량한 자존심과 기득권을 과감히 내려놓아야 하는 시기입니다. 이제까지 꽉 막혀있던 것들이 완전히 풀리며 내가 원하는 바를 단숨에 빠르게 얻는 때입니다. 나에게 크게 유리하고 좋은 시기입니다."]
  },
  "3_4":{
    name:"뇌풍항",
    gua:"한결같은 마음으로 삶을 항해. 지금 현상을 유지한다면 순조롭게 흘러가는 시기입니다. 평온함이 싫어 이것저것 일을 벌이면 오히려 조급함과 손실만 생기는 때입니다. 나만의 중심을 가지고 꾸준하게 노력해야 하며, 요행을 바라면 안 되는 시기입니다.",
    yao:["욕심이 과해 결실을 볼 수 없는 때입니다. 마음은 단단한데 몸을 가만히 두지 못하니 하고자 하는 일이 좋을 리 만무합니다.",
         "잘못된 곳에 있으니 귀찮은 일들이 여기저기서 생깁니다. 나를 잃지 않고 한결같이 하나하나 해결해 나간다면 문제들이 해결됩니다. 그에 따른 결실이 있고 하는 일에 후회는 없습니다.",
         "나의 능력만 믿고 낄 때 안 낄 때 나서니 오히려 마음대로 되는 일이 없습니다. 자중하는 마음으로 내실을 다져야 하며 하고자 하는 일은 교착상태에 빠지는 때입니다.",
         "변덕스럽게 이것저것 추구하니 얻어지는 것은 아무것도 없습니다. 자신에게 충실하지 못하고 밖으로만 나도니 이루어지는 것은 아무것도 없습니다.",
         "마음이 붕 떠 아무것도 안 되는 때입니다. 아랫사람 입장에서는 편하지만 윗사람의 입장에서는 신뢰할 수 없는 사람이 되니 하고자 하는 일은 좋지 못합니다.",
         "내 중심을 잃고 좋은 사람들과 오히려 거리를 두니 나쁠 수밖에 없습니다. 이미 많은 신뢰를 잃어 되는 것이 아무것도 없습니다."]
  },
  "3_9":{
    name:"뇌화풍",
    gua:"왕성한 기운에 그렇지 못한 내면. 지금은 풍족하지만 내부적으로 힘이 약해질 수 있으니 관리에 힘쓰는 것이 좋습니다. 오랫동안 끌어온 일이 있다면 센스를 발휘해 빨리 마무리 짓는 것이 좋습니다. 새로운 사업을 벌이는 것보다 하고 있는 일을 잘 지키고 운영하는 것이 훨씬 중요합니다.",
    yao:["나의 능력만 믿고 다른 사람을 무시하면 그에 따른 대가가 있는 시기입니다. 다른 사람을 존중하는 편이 훨씬 좋습니다.",
         "내가 맡은 일에 최선을 다하며 자기 계발에 충실해야 하는 때입니다. 억지로 나 자신을 어필하면 오히려 눈 밖에 날 수 있습니다.",
         "능력과 성품을 모두 갖추었으나 알아주는 이가 없어 고독한 시기입니다. 그것에 불만을 가지고 삐딱하게 행동하면 오히려 지금의 문제만 더 커져 내 편마저 잃게 되는 형국입니다. 하고자 하는 일은 이루기 힘든 때입니다.",
         "힘든 시기에도 도움을 주는 협력자를 만나 나에게 걸맞은 곳으로 가는 시기입니다. 하고자 하는 일은 좋습니다.",
         "내가 부족한 부분이 있더라도 주변의 현명한 사람들에게 도움을 받으니 내 평판이 좋아지고 내가 하고자 하는 것 또한 성취하는 시기입니다. 하고자 하는 일은 좋습니다.",
         "달이 차면 기울듯 운이 점점 저조해지는 시기입니다. 금전적 손해가 있을 수 있고 그에 따른 사람 정리도 되는 시기입니다. 이런 시기에는 몸을 바짝 낮추고 때를 기다리는 것이 좋습니다. 하고자 하는 일은 흉합니다."]
  },
  "3_7":{
    name:"뇌택귀매",
    gua:"급할수록 돌아가기. 감정에 치우쳐 성급하게 일을 진행하면 손해를 보기 쉬운 시기입니다. 정해진 절차를 무시하고 지름길로 가려다 오히려 더 큰 위험을 맞이할 수 있습니다. 새로운 사업이나 무리한 변화를 시도하기보다는 상황을 객관적으로 관망하며 한 템포 쉬어가는 여유가 필요합니다. 요행이나 편법을 바라지 말고 순리대로 정도를 걷는 것이 가장 안전합니다.",
    yao:["현재 처한 위치에서 묵묵히 내 할 일을 하면 좋은 기회가 찾아옵니다. 무리하지 않고 순리대로 원하는 바를 추진하면 충분히 좋은 결실을 이룰 수 있는 시기입니다.",
         "나의 능력을 충분히 인정받을 수 있는 좋은 시기입니다. 하지만 조급하게 결정을 내리기보다는, 나에게 가장 유리하고 완벽한 타이밍이 올 때까지 인내하며 기다리는 편이 훨씬 좋은 결과를 냅니다.",
         "원칙과 올바름을 무시하고 감정적으로 일을 밀어붙이면 손실이 생기는 때입니다. 꼼수를 부리거나 무모하게 나선다면 하려는 일은 크게 막히고 어려움에 처할 것입니다.",
         "바라는 목표치가 높지만 현실적으로 모든 조건을 다 맞추기는 어렵습니다. 내 입장만 고집하지 말고 주변과 적당히 타협하며 시기를 놓치지 않고 움직이면 원하는 바를 얻을 수 있습니다.",
         "겉치레나 알량한 자존심을 버리고 소박하고 겸손한 태도를 유지하면 좋습니다. 상대방을 존중하며 때와 상황에 맞춰 유연하게 대처하면 서로에게 이익이 되고 하려는 일은 순조롭습니다.",
         "겉모습만 그럴싸할 뿐 실속이 전혀 없는 텅 빈 상태입니다. 억지로 일을 추진해 봐야 호응하는 이가 없고 헛수고만 하게 되니, 무리해서 나서지 않는 것이 좋습니다."]
  },
  "8_6":{
    name:"산천대축",
    gua:"크게 쌓아 세상 밖으로 나아갈 때. 그동안 꾸준히 쌓아온 실력과 내공을 마침내 세상 밖으로 활짝 펼칠 수 있는 아주 좋은 시기입니다. 개인의 작은 이익이나 우물 안 개구리 같은 좁은 시야에 머물지 말고, 더 넓은 세상에서 큰 목표를 가지고 움직이는 것이 좋습니다. 안주하기보다는 밖으로 나가 적극적으로 행동하는 것이 여러모로 좋은 때입니다. 어려움이 있더라도 그동안의 경험을 바탕으로 정면 돌파한다면, 고생하고 오래 걸린 만큼 아주 크고 값진 결과를 얻게 될 것입니다.",
    yao:["지금은 다소 위태로운 상황이니 섣불리 움직일 때가 아닙니다. 돌아가는 상황을 다 파악했더라도 묵묵히 때를 기다려야 하며, 새롭게 하려는 일은 잠시 멈추는 것이 나에게 가장 좋습니다.",
         "달리는 스포츠카의 타이어가 펑크가 난 상황이니 앞으로 나아갈 수가 없는 때입니다. 억지로 진행해 봤자 일의 핀트가 엇갈리고 위태로워지니, 아직은 절대 나서지 말고 조심하며 기다리는 것이 좋습니다.",
         "드디어 때가 왔습니다! 풀 악셀 밟고 거침없이 나아가도 막힘이 없고, 아무리 어려운 일이라도 문제없이 해결됩니다. 재물운도 크게 상승하고 내 몫을 잘 지켜내니, 크게 번성하는 아주 좋은 시기입니다.",
         "앞으로 닥칠 일을 미리 내다보고 꼼꼼히 대비해야 다치지 않습니다. 주변 사람(특히 시작 단계에서 흔들리는 사람)의 마음을 잘 다잡아주면, 그 과정에서 스스로도 큰 기쁨과 보람을 얻게 됩니다.",
         "미리 상황을 파악하고 적절한 조치를 취하는 안목이 빛을 발하는 시기입니다. 내 힘이 강하다고 해서 억지로 찍어 누르려 하지 말고, 진심을 다해 순리대로 이끌면 하려는 일은 나에게 이롭게 풀리는 때입니다.",
         "필요한 모든 내공과 실력을 완벽하게 쌓아 올린 최고의 상태입니다. 추진하는 사업은 크게 번성하고, 하려는 일마다 거칠 것 없이 만사형통할 것입니다."]
  },
  "8_2":{
    name:"산지박",
    gua:"모든 것을 비우고 또 비워야... 훗날을 기약하며 나만의 씨앗을 지켜야 할 때입니다. 높은 산이 비바람에 깎여나가듯 가진 것을 잃고 내 능력의 한계가 느껴지는 힘든 시기입니다. 시비나 구설수가 있어도 절대 다투지 말고 피하는 것이 가장 좋은때입니다. 지금은 억지로 일을 벌이거나 재능을 뽐내려 해도 알아주는 이가 없고 손실만 발생합니다. 안 되는 일은 미련 없이 과감하게 정리(손절)하고, 훗날을 도모할 마지막 '씨앗' 하나만 남긴 채 엎드려 인내하며 때를 기다리는 것이 가장 좋습니다.",
    yao:["처음부터 상황이 어긋나고 좋게 쌓은 이미지가 속절없이 무너지는 시기입니다. 원하지 않는 일을 억지로 떠맡게 될 수 있으며, 새롭게 일을 시작하려 한다면 결과가 매우 흉합니다.",
         "몸과 마음이 상하거나, 있던 곳에서 밀려나 큰 희생을 치러야 할 수 있습니다. 억울하고 원치 않는 상황이더라도 지금은 꾹 참고 견뎌내지 못하면 더 큰 손실, 손해를 입게 됩니다.",
         "희망이 없는 기존의 무리나 환경에서 과감하게 벗어나야 할 때입니다. 썩은 동아줄을 미련 없이 끊어내고 전력투구하여 비극 속의 출구를 찾아낸다면 무리 없이 나아갈 수 있습니다.",
         "상황이 가장 최악으로 치닫는 때입니다. 안 되는 일은 미련을 버리고 흔적도 없이 완전히 정리해야 합니다. 억지로 시늉만 내며 끌고 가봐야 얻는 것은 아무것도 없고 하려는 일은 크게 흉합니다.",
         "스스로 잘났다고 내세우지 않고 몸을 낮추어 겸손하게 행동하니 오히려 주변의 긍정적인 평가와 총애를 받게 됩니다. 그동안 깎아 먹기만 하던 손실에서 벗어나 마침내 정신을 차리고 본분을 회복하니 얻어지는 것들이 많습니다.",
         "혹독한 시련을 견뎌내고 마지막 남은 힘이 한곳에 뭉친 상태입니다. 바닥에 떨어진 열매가 흙 속에서 다시 새로운 생명으로 부활하듯, 대가를 바라지 않고 묵묵히 버틴 것에 대한 확실한 보상과 좋은 결과를 얻게 되는 시기입니다."]
  },
  "8_3":{
    name:"산뢰이",
    gua:"말한마디에 천냥빚도 갚지만 말한마디에 모든 것을 잃을수도... 자나깨나 말조심, 또 말조심을 해야 합니다. 말실수로 인해 큰 손해를 보기 쉬우니 항상 언행을 조심하고, 바른 마음가짐과 태도로 내실을 다져야 하는 시기입니다. 새로운 일을 계획하거나 직업을 구하기에는 적절한 때이나, 욕심을 부리거나 분수에 넘치는 일을 계획하면 큰 손실이 생깁니다. 주변인들의 도움을 받아 단계적으로 일을 추진하고, 잘못된 체계나 실수가 있다면 갈등이 따르더라도 확실하게 바로잡는 것이 좋습니다.",
    yao:["내 것을 내버려 두고 남의 것이 너무 부러운 상황입니다. 남의 떡이 더 커 보이더라도 헛된 욕심을 부려서는 안 됩니다. 섣불리 새롭게 하려는 일은 결과가 좋지 못하니 자중하는 것이 좋습니다.",
         "스스로 거친 환경을 개척하여 성과를 만들어내야 하는 시기입니다. 이 과정에서 꼼수를 부리거나 부당한 방식을 취하면 주변 좋은 사람들을 잃고 망신을 당할 수 있습니다. 문제가 생긴다면 반드시 정직한 방법으로 해결해야 뒤탈이 없습니다.",
         "얕은 꼼수로 이익을 얻고자 하는 마음이 큽니다. 분수에 맞지 않는 과욕은 결국 큰 화와 치욕을 불러와 오랫동안 일을 그르치게 만듭니다. 하려는 일은 흉하니 무리한 추진을 멈추어야 합니다.",
         "경쟁자나 적이 나의 성과를 가로채기 위해 호시탐탐 노리고 있으니 늘 경계하고 조심해야 합니다. 차분하게 잘 대비하면 무사히 방어하고 해결할 수 있으니 크게 걱정할 필요는 없습니다. 하려는 일은 큰 무리가 없습니다.",
         "섣불리 움직이지 말고 한곳에 정착해 나의 실력을 키워야 할 때입니다. 당장 체면이나 자존심이 상한다고 해서 욱하는 마음에 무리하게 일을 벌이면 손실만 생기고 좋을 것이 없습니다. 묵묵히 내실을 다지면 하려는 일은 길하게 풀립니다.",
         "올바른 방식으로 이익을 구하고 문제를 해결해야 하는 상황입니다. 자신의 능력을 과신하거나 바르지 못한 마음을 먹으면 손실이 생길 수밖에 없습니다. 욕심을 내려놓고 일의 순서를 알고 바른 마음을 먹는다면 도중에 약간의 위험이나 어려움이 따르더라도 결국에는 무사히 좋은 결과를 얻을 것입니다."]
  },
  "8_8":{
    name:"중산간",
    gua:"잠시 쉬었다가 가는것 또한 어떠하리. 말 그대로 산넘어 산, 첩첩산중 그 자체입니다. 지금은 억지로 나아가려 하기보다는 제자리에 멈춰 서서 상황을 지켜봐야 하는 시기입니다. 넘치는 욕심으로 무언가를 억지로 해보고자 하면 오히려 난관만 생기고 큰 손해를 볼 수 있습니다. 두 가지 일을 동시에 벌이지 말고 현재 하는 일에만 집중하는 것이 좋습니다. 주변의 유혹에 흔들리지 않고 나만의 굳건한 중심을 지키며 자기 계발에 힘쓴다면 훗날 큰 도움이 될 것입니다.",
    yao:["무언가를 새롭게 추진하기보다는 기초를 튼튼하게 다져야 하는 시기입니다. 섣불리 움직이지 말고 지금의 위치에서 현상 유지를 잘하는 것이 나에게 가장 좋은 때 입니다.",
         "아직 적극적으로 나설 때가 아닙니다. 억지로 앞으로 나아가려 하면 사사건건 부딪쳐 어려움을 겪게 됩니다. 주변의 달콤한 유혹이 있더라도 내 자리를 묵묵히 지키는 것이 손실을 막는 길입니다.",
         "원하지 않는 결과를 얻어 심적으로 답답하고 스트레스가 많은 상황입니다. 괜히 남의 일에 참견하거나 나서지 말고 내 일에만 묵묵히 충실해야 더 큰 혼란과 문제를 막을 수 있습니다.",
         "다른 사람의 일에 섣불리 참견하거나 조언을 하지 말아야 하는 때입니다. 한발 물러서서 주변 상황을 주의 깊게 살피고 신중하게 행동하면 손실 없이 무난하게 흘러갈 것입니다.",
         "말실수로 인해 문제가 생길 수 있으니 입을 무겁게 해야 하는 시기입니다. 섣불리 말하기 전에 앞뒤 상황을 잘 살피고 신중하게 언행을 관리한다면, 나중에 후회할 일이나 금전적 손해가 생기지 않을 것입니다.",
         "내가 놓치고 있는 부분은 없는지 꼼꼼하게 점검하고 세심하게 살펴야 합니다. 무리해서 욕심내지 않고 상황에 맞춰 완벽하게 멈출 줄 아는 지혜를 발휘한다면, 하려는 일에서 좋은 결과를 얻게 됩니다."]
  },
  "8_1":{
    name:"산수몽",
    gua:"나를 낮추고 배우는 자세가 필요해. 지금은 짙은 안개 속에 있는 것처럼 앞이 잘 보이지 않고 경험이나 정보가 부족한 시기입니다. 섣불리 혼자서 판단하고 움직이기보다는, 믿을 만한 윗사람이나 전문가에게 조언을 구하고 겸허히 배우는 자세가 필요합니다. 멘토에게 조언을 구했으면 자꾸 의심하며 흔들리지 말고 줏대 있게 밀고 나가는 것이 중요합니다. 당장은 결과가 눈에 띄지 않고 답답하더라도 나의 발전 가능성은 무한하니, 조급해하지 말고 차근차근 실력을 쌓아간다면 서서히 좋은 결실을 보게 될 것입니다.",
    yao:["경험 부족으로 인해 생각지 못한 어려움이 따르고 마음처럼 상황이 풀리지 않는 시기입니다. 억지로 이 답답한 상황을 벗어나려 무리하기보다는, 차분히 내실을 다지며 때를 기다리는 것이 손실을 막는 길입니다.",
         "넓은 포용력으로 주변 사람들을 잘 이끌고 챙길 수 있는 아주 좋은 시기입니다. 나를 믿고 따르는 사람들이 많아지고, 축하받을 만한 기분 좋은 일이나 겹경사가 생기는 등 하려는 일마다 매우 순조롭게 풀립니다.",
         "상황을 타개하려는 굳은 의지도 없고, 새롭게 배우려는 태도도 부족해 이리저리 흔들리는 상태입니다. 눈앞의 얕은 유혹이나 잘못된 판단으로 선택을 내리면 오랫동안 큰 손실과 어려움을 겪게 되니 매사에 각별히 신중해야 합니다.",
         "상황을 제대로 파악하지 못하고 혼란스러워 곤경에 처한 때입니다. 좁은 시야로 고집을 부리면 사리 분별력을 잃어 손실만 커지게 되니, 독단적으로 진행하려던 일은 멈추는 것이 좋습니다. 하려는 일은 꽤 어렵습니다.",
         "아직 내 실력이나 경험이 턱없이 부족하더라도 훌륭한 멘토나 조력자의 가르침을 전적으로 믿고 따르면 원하는 바를 이룰 수 있습니다. 가르침을 의심하지 않고 겸손하게 수용한다면 하려는 일에서 훌륭한 성과를 얻게 됩니다.",
         "오랫동안 답답하고 힘들었던 상황에서 빠져나오는 시기입니다. 편법이나 꼼수를 쓰지 않고 올바른 원칙을 지키며 나아간다면, 앞으로 하는 모든 일이 나에게 유리하게 해결이 될 것입니다."]
  },
  "8_4":{
    name:"산풍고",
    gua:"고인 물에서 벗어나 자기반성을 해야 하는 시기. 오래된 것들이 고이고 썩어가는 것처럼, 내가 속한 조직이나 내 상황의 내부부터 곪아가고 있는 시기입니다. 덮어둔다고 해결되지 않으니 뼈를 깎는 자기반성과 함께 잘못된 관행이나 문제를 완전히 도려내고 고쳐야 합니다. 당장 편하자고 안락함만 추구하면 나중에 더 큰 손실을 입습니다. 상대방과의 거래나 새로운 일을 서두르지 말고, 반드시 철저한 내부 정리와 문제 해결을 먼저 정면 돌파로 끝내야 상황을 반전 시킬수 있습니다.",
    yao:["윗사람이나 전임자가 싸놓은 똥(남겨둔 문제)을 내가 수습해야 하는 상황입니다. 불만스럽고 짜증이 나겠지만, 상황의 핵심을 잘 파악해서 묵묵히 해결해 낸다면 끝내 좋은 성과를 얻게 될 것입니다.",
         "주변 사람이나 윗사람의 잘못된 일까지 내가 감당하고 고쳐야 하는 때입니다. 주도적으로 문제를 해결하려 노력하되, 무리하게 판을 뒤집거나 새롭게 일을 벌이는 것은 손실을 부를 수 있으니 지금은 하지 않는 것이 좋습니다.",
         "기존의 관행이나 윗사람의 뜻과 다르게 다소 파격적이고 강압적인 방식으로 일을 추진하는 상황입니다. 약간의 마찰과 위험이 따르겠지만, 마음먹은 대로 끝까지 밀고 나간다면 큰 손실 없이 무난하게 해결될 것입니다.",
         "잘해보고 싶은 의욕만 앞서서 나서다가 오히려 자꾸 일을 꼬이게 만드는 상황입니다. 책임자나 윗사람과 적당히 거리를 두고 지켜봐야 하며, 섣불리 무리해서 추진하다가는 일이 엉망이 되고 큰 어려움에 처하게 됩니다.",
         "골칫거리였던 묵은 문제들을 제대로 해결하고, 좋은 기회는 성공적으로 이어받는 아주 훌륭한 시기입니다. 목표했던 일을 완벽하게 달성하고 주변의 좋은 평판과 명예까지 얻게 됩니다.",
         "냉정하게 상황을 판단하고 전체적인 흐름에 순응해야 하는 때입니다. 이미 얻을 만큼 얻었으니 미련을 유종의 미를 거두는 품격이 필요합니다. 여기서 욕심을 부려 억지로 일을 더 추진하면 큰 손실이 발생합니다."]
  },
  "8_9":{
    name:"산화비",
    gua:"화려한 겉치레보다 속을 알차게 채워야 할 때. 겉모습을 화려하게 꾸미기보다는 내실을 단단하게 다져야 하는 시기입니다. 유행을 좇거나 남에게 보여주기 위해 이것저것 무리하다 보면 결국 내면의 어려움과 금전적 손실만 따르게 됩니다. 무리하게 큰일을 벌이거나 허황된 목표를 좇기보다는, 눈앞에 주어진 작은 일부터 꼼꼼히 챙기는 것이 좋습니다. 학문, 교육, 예술 등 문화 관련 분야의 일이라면 좋은 성과를 기대할 수 있습니다.",
    yao:["새 출발을 위해 나 자신을 단정하게 가꾸고 첫발을 내딛는 상황입니다. 허영심을 버리고 분수에 맞게 차근차근 준비해서 나아가면 앞으로 좋은 일들이 계속 생기고, 하려는 일도 순조롭게 잘 풀릴 것입니다.",
         "주변 사람들과 기쁨을 나누며 함께 나아가는 시기입니다. 윗사람이나 동료와 적절하게 품위를 지키며 협력한다면 시너지가 생겨 더 큰 기쁨으로 돌아옵니다, 추진하는 일에서도 긍정적인 성과를 얻게 됩니다.",
         "목표를 위해 열심히 땀 흘리며 최선을 다해 나를 가꾸고 노력하는 상황입니다. 헛된 곳에 힘을 빼지 않고 올바른 위치에서 성실하게 땀 흘린 만큼, 그 노력이 빛을 발하여 오랫동안 좋은 결과와 이익을 유지할 수 있습니다.",
         "뜻이 맞는 좋은 사람들과 함께 협력하여 목표를 향해 나아가는 상황입니다. 주변의 환경이나 분위기도 나를 도와주고 지지해 주는 긍정적인 흐름이니, 하려는 일에서 순조롭게 좋은 결실을 맺을 수 있습니다.",
         "겉보기에 화려하거나 가진 것이 부족해 보여서 잠시 일이 꼬이고 스트레스를 받을 수 있습니다. 하지만 허례허식을 버리고 소박하고 진정성 있는 태도로 임한다면, 중간에 마찰이 있더라도 결국 오해가 풀리고 끝내 좋은 결과를 얻게 됩니다.",
         "꾸밈의 본질을 깨닫고 불필요한 포장을 버린 채 가장 나다운 '본바탕(본질)'으로 돌아가는 최고의 상태입니다. 겉치레를 완전히 내려놓고 내면의 진실함으로 승부하니, 어떤 일을 하더라도 문제나 손실 없이 깔끔하게 흘러갑니다."]
  },
  "8_7":{
    name:"산택손",
    gua:"나의 욕심을 버리고 큰 시야를 가져야 할 때. 당장은 나에게 손해인 것 같아도, 길게 보면 결국 모두에게 이득이 되는 시기입니다. 개인의 이기심을 내려놓고 전체를 위해 주변을 돕거나 양보하면, 결국 그 덕이 돌고 돌아 나에게 더 큰 보상으로 찾아옵니다. 새로운 일을 시작하거나 투자를 할 때 초기에는 자잘한 지출이나 어려움이 있을 수 있지만, 조급해하지 않고 꾸준히 밀고 나가면 훌륭한 성과를 거둘 수 있습니다. 눈앞의 작은 이익에 연연하기보다 미래의 큰 가치에 투자하는 것이 가장 현명한 처세입니다.",
    yao:["내 능력으로 충분히 문제를 해결할 수 있는 때입니다. 주변에 도움이 필요한 상황을 모른 척 넘기면 전체적인 일이 어그러질 수 있으니, 조금 손해 보는 것 같더라도 기꺼이 먼저 나서서 도와주는 것이 좋습니다.",
         "내 자리에서 맡은 바에 최선을 다해야 하는 시기입니다. 윗사람이나 조직의 문제점이 보이더라도 지금은 섣불리 나서서 고치려 하거나 지적하지 말고, 조용히 덮어두며 내 할 일만 묵묵히 하는 것이 이롭습니다.",
         "새로운 일을 시작할 때 여러 사람과 우르르 몰려다니면 오히려 내부 분열만 생기고 손실이 큽니다. 허세를 버리고 일단 혼자서 묵묵히 시작하면, 자연스럽게 뜻이 맞는 좋은 사람들이 모여들 것입니다.",
         "나 자신의 나쁜 습관이나 잘못된 업무 방식을 먼저 고치고 덜어내야 하는 때입니다. 내 안의 문제점만 객관적으로 잘 정리해도 지금 당면한 골칫거리들이 아주 순조롭게 해결될 것입니다.",
         "눈앞에 닥친 일시적인 어려움만 보고 지레짐작하여 포기하지 마세요. 알량한 자존심을 세우느라 혼자 끙끙대지 말고, 기꺼이 주변에 도움을 요청하고 받아들이면 상황이 아주 유리하고 크게 좋아집니다.",
         "나에게 실질적인 권한도 없는데 남의 일에 엉뚱하게 간섭하거나 훈수 두지 말아야 합니다. 선을 넘지 않고 조용히 내 자리를 지키며 상황을 지켜보면 하려는 일이 무난하고 순조롭게 흘러갈 것입니다."]
  },
  "1_6":{
    name:"수천수",
    gua:"조급함을 버리고 때를 기다리는 능동적인 인내. 단비가 내리기 직전 하늘에 머물러 있는 먹구름처럼, 당장은 답답하더라도 굳건한 믿음을 가지고 때를 기다려야 하는 시기입니다. 초조한 마음에 섣불리 새로운 일을 벌이거나 모험을 감행하면 큰 손실을 자초하게 됩니다. 지금은 주변 환경을 냉정하게 분석하고 관망하며 나의 내실과 생활의 안정을 먼저 챙기는 것이 중요합니다. 누군가와 거래나 교섭을 할 때도 서두르지 말고, 상대방의 진짜 목적이 다른 곳에 있지는 않은지 다시 한번 꼼꼼히 확인해 보는 여유가 필요합니다.",
    yao:["이제 막 기다리기 시작한 것과 다름없는 때입니다. 마음이 초조해지면 잘못된 선택과 행동을 하여 손해를 보기 십상입니다. 당장 답답하고 힘들게 느껴지더라도 한결같은 마음으로 차분히 기다리면 진행하는 일에 큰 무리가 없습니다.",
         "인내하는 과정에서 자잘한 구설수나 작은 어려움이 발생할 수 있습니다. 하지만 나의 목표와 중심이 확고하다면 주변의 가벼운 말이나 험담에 흔들릴 이유가 없습니다. 묵묵히 버티면 마침내 나에게 유리하게 풀립니다.",
         "어려운 상황 속에서도 한 발 한 발 앞으로 나아가고 있습니다. 여기서 지치고 답답하다고 섣불리 포기하거나 급하게 경로를 틀어버리면 큰 위기와 손실을 부르게 되니, 충동적인 행동은 절대 삼가야 합니다.",
         "예기치 못한 힘든 상황을 마주하여 더는 인내하기 어렵다고 느껴지는 고비입니다. 하지만 평정심을 잃지 않고 흔들림 없이 일상의 루틴을 묵묵히 지켜나간다면 다행히 이 위기를 무사히 극복할 수 있습니다.",
         "겉보기에는 아주 화려하고 풍족해 보이는 자리나 제안이 주어집니다. 하지만 그 이면에는 시기 질투나 이간질, 모함이 숨어 있으니 겉모습에 속지 말고 냉정하게 상황을 분별해야 합니다. 중심을 잘 잡고 견디면 끝내 좋은 성과를 얻습니다.",
         "길고 길었던 기다림이 마침내 끝나는 시기입니다. 내가 가졌던 헛된 욕심이나 미련들을 정리하고 내적으로도 성장하게 됩니다. 예상치 못한 심각한 변수나 문제가 생기더라도 경솔하게 움직이지 않고 신중하게 처리하면 결국 모든 일이 나에게 이롭게 마무리될 것입니다."]
  },
  "1_2":{
    name:"수지비",
    gua:"혼자보다 팀을 이루는것이 더 이득. 마음 맞는 사람들과 힘을 합쳐 목표한 일을 이루어 내듯, 주변의 좋은 사람들과 친밀하게 돕고 연대하면 훌륭한 결실을 보고 큰 금전적 수익도 따르는 아주 좋은 시기입니다. 경쟁이 치열한 상황일수록 자만하거나 독단적으로 행동하지 말고, 나를 도와줄 훌륭한 협력자를 적극적으로 찾아 함께 나아가는 것이 최고의 돌파구입니다. 다만, 조직의 규칙이나 다수의 의견에만 무작정 끌려가다 보면 나만의 개성과 유연성을 잃고 수동적으로 변할 수 있으니, 협력하되 맹목적인 복종은 경계해야 합니다.",
    yao:["아직 나의 힘이나 실질적인 권한이 부족한 상태입니다. 섣불리 주도권을 쥐려고 나서거나 내 주장을 강하게 내세우면 예상치 못한 위기나 손실을 겪게 되니, 믿을 수 있는 리더나 조직의 방향을 차분히 따르는 것이 이롭습니다.",
         "겉으로만 억지로 따르는 척하지 말고 진심으로 화합하고 협력해야 합니다. 섣불리 내 공로를 내세워 자리를 탐내지 말고, 나의 능력을 인정받아 자연스럽게 부름을 받을 때까지 묵묵히 내실을 다지며 기다리는 것이 좋습니다.",
         "지금 곁에 있는 사람이 믿고 따를 만한 리더나 조력자가 아닙니다. 사람을 잘못 보고 휩쓸리게 되면 큰 어려움에 부닥치고 공들인 일마저 그르칠 수 있으니, 섣부른 맹신을 멈추고 특히 신중하게 사람을 가려야 합니다.",
         "주변으로부터 불필요한 오해나 의심을 받기 쉬운 상황입니다. 억울하더라도 겉으로 반발하지 말고, 조직이나 상대를 향한 나의 신뢰와 협력 의지를 확실하게 보여주어야 합니다. 이 고비를 잘 참고 견디면 도태되지 않고 핵심적인 위치로 올라설 수 있습니다.",
         "상황 판단을 명확히 하고 조직을 현명하게 이끌어야 하는 시기입니다. 곁에 있는 사람들을 너무 강압적으로 통제하려 들면 오히려 반발이 생기고 일이 틀어집니다. 그러니 적당한 자율성(티타임의 여유)을 허용해 주어야 일이 순조롭게 풀립니다.",
         "쓸데없는 자존심과 고집을 완전히 버려야 합니다. 끝까지 나만 옳다고 우기면 주변 사람들로부터 철저하게 배척당하여, 직장에서 퇴출당하거나 가까운 관계가 단절되는 등 매우 치명적인 손실을 겪게 됩니다. 하려는 일은 크게 흉합니다."]
  },
  "1_3":{
    name:"수뢰둔",
    gua:"이불 밖은 위험해! 밖은 추워! 지금은 험난한 비바람에 갇혀 꼼짝하기 힘든 것처럼, 무엇을 시작하려 해도 상황이 막히고 꼬이는 답답한 시기입니다. 억지로 돌파하려 움직이면 손실만 커지니, 현 상황을 객관적으로 파악하고 내실을 다지며 방어적으로 임해야 합니다. 혼자서 모든 것을 해결하려 하지 말고 나를 이끌어줄 훌륭한 파트너나 조력자를 구하는 것이 핵심입니다. 당장은 성과가 없고 고통스럽더라도 희망을 잃지 않고 인내한다면 결국 전화위복이 되어 단단한 결실을 볼 수 있습니다. 다른 사람의 부탁을 흔쾌히 도와주면 나중에 큰 도움으로 돌아옵니다.",
    yao:["아직은 앞으로 나아갈 때가 아닙니다. 억지로 전진하려 해봤자 제자리걸음만 반복하며 체력과 자본만 낭비하게 됩니다. 당장의 성과에 연연하지 말고 소극적으로 상황을 방어하며 내실을 다진다면, 앞으로 하고자 하는 일에 긍정적인 밑거름이 될 것입니다.",
         "앞으로 가지도 뒤로 가지도 못하는 난감하고 답답한 상황입니다. 하지만 무리해서 섣부른 결정을 내리기보다는 조금 더 여유를 가지고 기다리면, 나에게 꼭 맞는 귀인이나 파트너를 만나게 됩니다. 이를 통해 오랫동안 골치 아팠던 문제들을 시원하게 해결할 수 있습니다.",
         "주위에 나를 도와줄 사람이 아무도 없는 철저한 고립 상태입니다. 이럴 때는 무리하게 욕심을 부리거나 억지로 일을 끌고 가는 것을 당장 멈추는 것이 가장 현명합니다. 명분도 없고 이끌어줄 사람도 없으니, 억지로 진행해 봐야 큰 어려움과 손실만 겪게 됩니다.",
         "내 뜻대로 일을 주도하지 못해 답답하더라도 망설이거나 포기하지 마세요. 밖에는 나와 뜻을 함께할 좋은 협력자(파트너)가 나를 기다리고 있습니다. 쓸데없는 고집을 꺾고 그들과 적극적으로 손을 잡으면, 막혔던 일들이 순조롭게 풀리고 좋은 성과를 얻을 수 있습니다.",
         "객관적으로 나의 능력과 한계를 정확히 파악하고 인정해야 하는 시기입니다. 아직은 내가 나서서 주도권을 쥐거나 존재감을 과시할 때가 아닙니다. 분수에 맞지 않는 헛된 목표를 좇거나 무리하게 투자하면 큰 금전적 손실을 볼 수 있으니, 내 기량에 맞춰 신중하게 움직여야 합니다.",
         "눈앞의 얕은 이익이나 결과에 급급해서 섣불리 행동하면 뼈아픈 손실을 겪고 크게 후회하게 됩니다. 오랜 시간 답답하게 인내했더라도 지금 당장 바라는 결과를 얻기는 힘드니, 무리한 행동을 멈추고 현재의 위치와 평판을 지키는 데 집중하는 것이 가장 안전합니다."]
  },
  "1_8":{
    name:"수산건",
    gua:"잠시 멈추고 조력자를 찾아야 할 때. 한시름 돌렸더니 다시 난관에 봉착하는 시기입니다. 사사건건 장애물이 앞을 가로막아 일이 진척되지 않는 답답할 때입니다. 억지로 난관을 돌파하려 무모하게 모험을 걸거나 섣불리 투자하면 오히려 더 큰 금전적 손실을 겪게 됩니다. 괜히 고군분투하지 말고, 나를 이끌어줄 훌륭한 조력자나 전문가를 찾아 협력을 구하는 것이 위기를 기회로 바꾸는 핵심입니다. 지금은 자금 흐름과 내부 관리를 철저히 점검하며 소극적이고 방어적인 태도로 내실을 다져야 하며, 영양가 없는 가벼운 인간관계는 빠르게 정리하는 것이 이롭습니다.",
    yao:["처음으로 벽에 부딪혀 막막함을 느끼는 시기입니다. 당장 억지로 일을 추진하지 말고, 잠시 멈춰 서서 내 계획과 상황을 냉정하게 점검하는 것이 좋습니다. 초반에는 답답하겠지만 잘 인내하며 준비하면 결국 편안하게 일을 이룰 수 있습니다.",
         "내 잘못이 아닌 일로 억울하게 난감한 문제나 책임에 휘말릴 수 있습니다. 지금 당장 억울함을 풀고 진실을 밝히려고 억지로 발버둥 치기보다는, 상황이 지나가기를 조용히 참고 견디는 편이 낫습니다. 하려는 일은 다소 어려움이 따릅니다.",
         "눈앞의 골치 아픈 문제를 회피하려고 도망쳐봤자 상황은 더 나빠지고 큰 난관만 마주하게 됩니다. 피하지 말고 원래 자리로 돌아와 주변 사람들의 협조를 구하면, 시작은 막막해도 끝내 아주 좋은 결실을 맺고 순조롭게 해결됩니다.",
         "내 능력이나 자본만으로는 무리인 상황이니 절대 독단적으로 일을 벌이거나 추진하지 마세요. 알량한 자존심을 내려놓고 주변이나 전문가에게 적극적으로 도움을 청하면 막혔던 일들이 아주 부드럽게 흘러가게 됩니다.",
         "혼자 힘으로는 도저히 문제를 해결할 수 없어 답답한 고비이지만, 나의 어려움에 공감해 주는 좋은 동료나 협력자들이 적극적으로 나서서 손을 내밀어 주는 시기입니다. 주변의 든든한 도움으로 위기를 넘기고 좋은 결과를 얻습니다.",
         "길고 길었던 시련과 고난의 터널이 마침내 끝을 보이는 시점입니다. 다 끝났다고 방심하지 말고 지금까지 유지해 온 신중한 태도를 끝까지 지키세요. 나를 한 단계 끌어올려 줄 귀인을 만나 막혀있던 새로운 길이 활짝 열리게 됩니다."]
  },
  "1_1":{
    name:"중수감",
    gua:"끝없는 위기 속, 흔들리지 않는 멘탈로 버텨야 할 때. 깊고 험한 물구덩이가 겹겹이 가로막고 있는 험난한 형국입니다. 위기에 빠졌다고 당황해서 억지로 발버둥 치면 오히려 더 깊이 가라앉게 되니, 굳건한 멘탈(중심)을 유지하며 거친 흐름에 유연하게 몸을 맡겨야 합니다. 괜히 남들과 시비가 붙어 구설수를 만들지 말고 묵묵히 내 자리를 지키세요. 특히 서류나 계약 관계는 돌다리도 두드려 보듯 철저하게 확인하고, 타인의 보증은 절대 서지 말아야 큰 금전적 손실을 막을 수 있습니다. 감정적인 집착을 버리고 차분히 내실을 다져야 위기를 넘길 수 있습니다. 이럴 때 있을수록 종교나 학문연구 분야에 몰두하면서 내면을 성장시키는 것이 가장 좋습니다.",
    yao:["엎친 데 덮친 격으로 상황이 꼬이고, 나의 진심이나 억울함이 전혀 통하지 않는 답답한 시기입니다. 답답한 마음에 억지로 진실을 밝히겠다고 나서거나 해명하려 들면 오히려 역효과가 나니, 섣불리 움직이지 말고 가만히 있는 것이 최선입니다.",
         "위기에 빠져 어떤 도움이라도 받고 싶은 절박한 상태나 마찬가지입니다. 힘들지만 끝까지 포기하지 않고 중심을 잘 잡고 버티면 반드시 해결책을 찾을 수 있는 시기입니다. 무리하게 큰 이익을 바라지 말고, 아주 작은 성과나 도움이라도 감사히 받는 것이 좋습니다.",
         "앞으로 가도 함정, 뒤로 가도 함정인 완벽한 진퇴양난의 상황입니다. 무리하게 빠져나가려고 애를 써봤자 체력과 자본만 낭비합니다. 주변 분위기나 선동에 휩쓸려 섣불리 집단행동에 나서지 말고, 하려는 일은 모두 중단해야 합니다.",
         "내 능력만으로는 어찌해 볼 도리가 없는 꽉 막힌 막다른 길에 몰린 상태입니다. 불필요한 자존심을 버리고 지출을 최소화하며, 나보다 능력이 뛰어나고 경험이 많은 멘토나 전문가를 찾아 적극적으로 조언과 도움을 구해야만 위기를 무사히 넘길 수 있습니다.",
         "내 고집과 편협한 생각을 내려놓고 주변 사람들과 화합하여 꼬인 문제들을 풀어가야 하는 때입니다. 험난했던 고생길의 끝이 서서히 보이기 시작하니, 조금만 더 겸손한 자세로 협력하며 인내하면 마침내 목표하던 바를 순조롭게 이룰 수 있습니다.",
         "원칙을 잃고 나를 잃고 의지할 곳이 하나 없는 최악의 고립 상태입니다. 여기서 억지로 상황을 뒤집어보겠다고 무리수를 두거나 발버둥 칠수록 손실과 고통만 더 커집니다. 하려는 일은 모두 멈추고 무조건 납작 엎드려 현재의 자리를 지키는 것이 유일한 살길입니다."]
  },
  "1_4":{
    name:"수풍정",
    gua:"나의 때를 기다리며 내 필살기를 만들어야만 해. 깊은 산속 옹달샘을 찾듯이 꾸준한 노력과 끈기가 필요한 시기입니다. 섣불리 새로운 사업이나 일을 벌이기보다는 현재 하는 일에 집중하고 유지하는 것이 손실을 막는 길입니다. 다 된 밥에 재를 빠뜨리듯 마지막 순간에 조급하게 굴면 그동안의 노력이 무산될 수 있으니 끝까지 신중하고 꼼꼼하게 마무리해야 합니다. 눈앞의 얕은 이익을 위해 남과 다투지 말고, 사치와 낭비를 줄이며 주변 사람들과 협력 관계를 잘 다져야 합니다.",
    yao:["옛날 방식이나 낡은 사고방식에 갇혀 있으면 아무런 성과를 낼 수 없는 상황입니다. 현실에 맞게 업무 방식이나 생각의 틀을 완전히 새롭게 바꿔야 하며, 지금의 방식대로 고집하는 일은 좋은 결과를 얻기 어렵습니다.",
         "수단과 목적이 맞지 않아 기껏 들인 노력이 중간에 새어나가는 형국입니다. 편법을 쓰거나 무리하게 행동하면 오히려 큰 손해를 입게 되니, 원칙과 상황에 맞게 일을 처리해야 합니다.",
         "눈앞에 기회가 와도 준비가 부족하거나 타이밍을 놓쳐 제대로 활용하지 못하는 답답한 상황입니다. 미루지 말고 해야 할 일에 집중하며 묵묵히 내실을 다져야 손실을 막을 수 있습니다.",
         "실무 책임자나 윗사람을 서포트하여 조직의 기반을 튼튼하게 다져야 하는 위치입니다. 개인적인 욕심이나 이기심을 내려놓고 꼼꼼하게 일 처리를 돕는다면, 조직이 안정되고 그에 따른 확실한 성과를 얻게 됩니다.",
         "오랫동안 공들였던 일이 마침내 무르익어 확실한 결실과 혜택을 누리게 되는 아주 좋은 시기입니다. 단, 발생한 이익과 공로를 혼자 독식하려 하지 말고 주변과 적절히 나누어야 길한 흐름이 오래 유지됩니다.",
         "모든 일이 순조롭게 잘 마무리되어 유종의 미를 거두는 시기입니다. 뚜껑을 덮어 우물을 막지 않듯, 얻은 이익과 노하우를 혼자 독점하지 않고 주변에 베풀며 신뢰를 구축한다면 무리 없이 평안한 상태가 지속될 것입니다."]
  },
  "1_9":{
    name:"수화기제",
    gua:"일의 마무리를 잘 하였으니 이제는 현상 유지와 방어에 집중해야 할 때. 치열했던 성장의 한 막이 성공적으로 마무리되었으니 많은 것을 이룬 상태입니다. 주변 상황도 안정적이고 호황을 누리는 만족스러운 시기입니다. 하지만 꽃이 피면 지듯이 치열하게 성장한 만큼 서서히 내리막길이 시작될 수 있습니다. 지금은 자만하거나 무리하게 사업을 확장, 투자하기보다는 철저하게 내부 관리에 충실하며 현상 유지를 하는 것이 가장 중요합니다. 동업이나 협력 관계에서도 의견 충돌이 생기기 쉬우니, 내 고집만 내세우지 말고 적당한 선에서 양보해야 손실을 막을 수 있습니다.",
    yao:["모든 일이 뜻대로 이루어져 모든 일에 자신감이 생기는 시기입니다. 하지만 자만심에 빠져 무리하게 앞서 나가려 하거나 지나친 욕심을 부리면 오히려 흠집이 날 수 있습니다. 나서려는 충동을 꾹 누르고 현재 자리를 묵묵히 지키면 하려는 일에 손실이 없습니다.",
         "중요한 기회나 물건을 잃어버렸다고 당황하여 전전긍긍할 필요가 없습니다. 시간이 지나면 자연스럽게 제자리를 찾거나 회복될 것이니, 조급하게 움직이지 말고 여유를 가지며 때를 기다리는 지혜가 필요합니다. 차분히 대응하면 하려는 일은 순조롭게 풀립니다.",
         "호황기가 막바지에 다다른 단계입니다. 새롭게 추진하는 일은 예상보다 훨씬 힘들고 시간도 오래 걸릴 것입니다. 얕은 속셈을 가진 사람들이 꼬이기 쉬운 환경이니, 주변 분위기에 휩쓸리지 말고 묵묵히 버텨내야만 목표를 이룰 수 있습니다.",
         "사소해 보이는 작은 실수 하나가 걷잡을 수 없이 큰 손실과 혼란으로 이어질 수 있는 아슬아슬한 상황입니다. 마치 구멍 난 주머니에 돈을 넣어 두는 것과 같으니, 매사에 긴장을 늦추지 말고 철저하게 조심하고 점검해야 큰 피해를 막을 수 있습니다.",
         "능력과 자격을 충분히 갖추었음에도 주변의 혼란스러운 상황에 휘말려 제 실력을 발휘하기 힘든 시기입니다. 지금 당장 성과가 나오지 않는다고 좌절하지 말고, 앞으로 다가올 변화에 대비하여 묵묵히 내실을 다지면 결국 그에 합당한 확실한 보상을 받게 됩니다.",
         "이미 좋은 시기가 지나가 쇠퇴와 혼란의 흐름에 완전히 빠져버린 상황입니다. 앞으로 나아가지도 뒤로 물러서지도 못하는 난처한 처지가 될 수 있습니다. 여기서 무리하게 욕심을 내어 선을 넘으면 큰 타격을 입게 되니, 섣부른 행동을 멈추고 현 상황을 수습하는 데만 집중해야 합니다."]
  },
  "1_7":{
    name:"수택절",
    gua:"중심을 잡고 선을 지켜야 할 때. 선만 잘 지켜도 중간은 가는 시기입니다. 넘치는 욕망과 지출을 통제하고 자기 절제를 생활화해야 합니다. 무리한 확장이나 모험적인 큰 투자보다는 작고 실속 있는 일에 집중해야 쏠쏠한 성과를 얻습니다. 하지만 숨이 막힐 정도로 고통스럽고 억압적인 절제는 오히려 부작용을 낳으니 유연한 균형 감각이 필요합니다. 누군가와 거래나 교섭을 할 때는 내 이익만 고집하지 말고 상대방의 입장도 배려해야 순조롭습니다. 겉보기에 풍족하더라도 불필요한 낭비를 줄이고 저축하며 안정적인 기반을 다지는 것이 가장 중요합니다.",
    yao:["아직 상황 파악이나 기본기가 덜 갖춰진 상태입니다. 섣불리 앞으로 나서거나 새로운 일을 벌이기보다는, 내실을 다지며 조직의 규칙과 분위기를 먼저 익히는 것이 불필요한 손실을 막는 길입니다.",
         "나설 때와 나서지 말아야 할 때를 정확히 파악해야 하는 시기입니다. 지금은 적극적으로 기회를 잡고 밖으로 움직여야 할 타이밍입니다. 방구석에만 머물며 좋은 기회를 흘려보내면 오히려 뼈아픈 손실과 후회가 따릅니다.",
         "가진 것을 함부로 과시하거나 허세를 부려서는 안 됩니다. 얕은 성과나 재력은 오래가지 못하니, 씀씀이를 통제하고 자기 분수에 맞게 절제하지 못하면 결국 금전적 위기와 스트레스에 직면하게 됩니다.",
         "나의 분수와 위치를 정확히 알고 바르게 행동하는 안정적인 상태입니다. 주변에 예의를 지키고 검소한 생활을 습관화하여 순리대로 움직이니, 큰 막힘 없이 모든 일이 순조롭게 잘 풀립니다.",
         "확고한 중심을 잡고 절제를 실천하여 좋은 성과를 얻는 시기입니다. 좁은 내 입장만 고집하지 않고 조직이나 전체의 관점에서 상황을 유연하게 조율하니, 주변의 신뢰를 얻고 하려는 일도 길하게 흘러갑니다.",
         "상황상 씀씀이를 줄이고 절제해야 하는데, 이를 답답하게 여기고 허영심에 들떠 있는 위태로운 상태입니다. 참다못해 무리한 과소비나 충동적인 행동을 저지르기 쉽습니다. 이를 빠르게 반성하고 다시 이성을 찾는다면 최악의 손실은 피할 수 있습니다."]
  },
  "4_6":{
    name:"풍천소축",
    gua:"될 듯 말 듯 하지만 아직은 기다려야만... 잔뜩 흐린 하늘에 당장이라도 비가 쏟아질 것 같지만 아직은 때가 아닙니다. 마음은 급하고 기대감은 크겠지만, 무리하게 사업을 확장하거나 새로운 일을 벌이기보다는 현재 하는 일에 집중하며 작은 성과들을 차곡차곡 쌓아가야 합니다. 묵묵히 내실을 다지면 재물운은 자연스럽게 따라옵니다. 누군가와의 교섭이나 거래, 계약 등은 예상보다 지연될 수 있으니 조급해하지 말고 침착하게 상대의 연락을 기다리는 여유가 필요합니다. 긍정적이고 유연한 태도를 유지하면 막혔던 일들이 서서히 풀립니다. 연애 역시 기다리면 자연스레 기회가 오니 조급해할 필요가 없습니다.",
    yao:["초반에는 외부의 유혹에 흔들려 충동적으로 행동하거나 방향을 잃기 쉬운 상황입니다. 하지만 이내 이성을 되찾고 본래의 자리와 원칙으로 돌아와 묵묵히 제 할 일을 하니, 큰 손실 없이 추진하는 일들이 무난하게 잘 풀립니다.",
         "아직은 적극적으로 나서서 행동하거나 판을 키울 타이밍이 아닙니다. 주변에서 달콤한 제안이나 유혹이 오더라도 섣불리 넘어가지 않고, 자신의 자리를 굳건히 지키며 조용히 때를 기다리는 것이 손실을 막고 유리한 고지를 점하는 길입니다.",
         "주변 사람이나 동료들과 의견 충돌이 생겨 서로 등 돌리고 관계가 틀어지기 쉬울 때입니다. 억지로 내 고집만 내세우며 선을 넘어 무리하게 일을 밀어붙이면 상황만 악화되고, 추진하려는 일은 결국 엎어지게 됩니다.",
         "주변 상황이 위태롭고 꽤 힘든 고비이니 항상 경계심을 늦추지 말아야 합니다. 뻣뻣하게 자존심을 세우기보다는 부드럽고 겸손한 태도로 상황에 유연하게 대처하면, 위기를 무사히 넘기고 나의 이익과 자리를 안전하게 지켜낼 수 있습니다.",
         "혼자서만 이익을 독식하려 하지 않고 주변과 성과를 함께 나누니, 모두가 기뻐하고 시너지가 나는 시기입니다. 굳건한 내실을 바탕으로 나의 능력을 보여주고 원하던 목표를 이루게 되니 하는 일마다 긍정적인 평판과 확실한 보상이 따릅니다.",
         "오랫동안 기다리던 단비가 마침내 내리며 막혀 있던 답답한 상황이 완전히 해소되는 시기입니다. 그 과정에서 약간의 지출이나 잃은 것이 있을 수 있으나 크게 걱정할 필요는 없습니다. 다만, 이미 목표를 달성한 후에도 상황 파악을 못 하고 무리하게 더 전진하려 하면 뼈아픈 손해를 입게 되니, 도를 넘지 말고 멈출 줄 아는 지혜가 필요합니다."]
  },
  "4_2":{
    name:"풍지관",
    gua:"유비무환. 전체적인 흐름을 관망하며 철저히 준비. 일을 시작하기 전에 철저한 준비가 필요하듯, 주변의 상황 변화와 사람들의 마음(민심, 트렌드)을 세심하게 살펴야 하는 시기입니다. 내 판단이 명확하지 않을 수 있으니 급하게 사업을 확장하거나 무리한 투자를 진행하지 말고, 넓은 시야로 객관적인 데이터를 수집하며 신중하게 상황을 지켜봐야 합니다. 타인의 의견을 무시하고 내 고집대로만 행동하면 주변의 신뢰를 잃게 됩니다. 눈앞의 얕은 재물에 욕심내기보다 주변의 협조를 구하며 냉정하게 판단하는 것이 뼈아픈 손실을 막는 가장 확실한 길입니다. 학문, 종교, 문화 등 내면을 다지는 공부는 결실이 있습니다.",
    yao:["아직 시야가 좁고 상황을 보는 안목이 미숙한 상태입니다. 섣불리 내 주장을 강하게 내세우며 남과 다투면 큰 곤경에 빠지게 됩니다. 지금은 무리해서 큰일을 벌일 때가 아니니, 겸손하게 상황을 지켜보며 배우는 자세를 유지해야 손실이 없습니다.",
         "우물 안 개구리처럼 시야가 좁고 편협한 상태입니다. 눈앞의 단편적인 정보만으로 섣불리 판단을 내리면 일의 핵심을 놓치게 됩니다. 좁은 식견과 사고에서 벗어나, 더 넓은 시야와 객관적인 안목을 기르도록 노력해야 합니다.",
         "밖을 살피기 전에 나 자신의 능력과 처지부터 냉정하게 객관화해야 하는 시기입니다. 섣부른 행동으로 주변 사람들의 비위를 거스르면 조직에서 배척당할 수 있습니다. 스스로를 철저히 돌아보고 상황에 맞춰 나아갈지 물러설지를 현명하게 결정해야 실수가 없습니다.",
         "조직 내에서 위아래의 입장을 두루 살피고 조율하는 핵심적인 역할을 맡게 됩니다. 아랫사람의 어려움을 이해하고 윗사람과 잘 조율한다면 조직 전체가 발전하고 나 역시 훌륭한 성과와 인정을 받게 됩니다. 하려는 일이 아주 이롭게 풀립니다.",
         "어느 정도 결정권을 쥐고 있는 위치라면, 지금까지 내가 추진해 온 일의 방향성과 방식을 철저히 되돌아봐야 합니다. 자칫 내 생각에만 빠져 독단적인 결정을 내리면 내 주변까지도 위태로워질 수 있습니다. 주변에 능력이 있는 사람을 두고 의견을 받아들이면 큰 탈이 없이 지나갈 수 있습니다.",
         "지금까지 주변을 살피며 일을 해왔다면 이제는 주변 사람들과 조직이 나의 능력과 자질을 철저하게 평가하고 검증하는 시기입니다. 긴장을 늦추지 말고 타인의 성공을 롤모델로, 타인의 실패를 반면교사로 삼아 나의 행동을 신중하고 엄격하게 점검해야 합니다."]
  },
  "4_3":{
    name:"풍뢰익",
    gua:"치밀한 계획으로 과감하게 행동하며 주변과 이익을 나누어야 할 때. 가만히 기다리기보다는 치밀한 계획을 바탕으로 적극적으로 행동에 나서야 할 시기입니다. 위험과 난관이 따르더라도 피하지 말고 정면 돌파하면 기대 이상의 큰 성과와 금전적 수익을 얻을 수 있습니다. 단, 맹목적인 돌진이나 경솔한 행동은 금물이니, 잘못된 점이 있다면 과감히 수정하고 주변 협력자의 조언을 구해야 합니다. 윗사람이 아랫사람을 돕듯 주변을 배려하고 공익을 함께 추구하면 그 결실이 훨씬 더 커집니다.",
    yao:["자신의 본분에 충실하며 평소보다 규모가 큰 목표나 업무를 추진하기 좋은 시기입니다. 계획한 일이 있다면 망설이지 말고 적극적으로 추진하면 막힘없이 좋은 성과를 거둘 수 있습니다.",
         "눈앞의 이익을 위해 편법을 쓰지 말고 철저히 원칙과 바른길을 고수해야 합니다. 잘못된 방식을 택하면 큰 손실이 따르니, 조직 구성원 간의 화합을 최우선으로 삼고 일을 진행하는 것이 이롭습니다.",
         "주변을 배려하고 공정하게 업무를 처리하면 오히려 내가 얻는 이익이 많아집니다. 원망을 살 만한 이기적인 행동은 피하고, 성심껏 주변을 돕고 협력한다면 큰 문제 없이 순조롭게 진행됩니다.",
         "곤경에 처한 사람이나 조력자가 도움을 요청할 때 계산하지 말고 아낌없이 지원해야 합니다. 치우침 없이 객관적인 태도로 신뢰를 얻으면 하려는 일이 나에게 유리한 방향으로 풀립니다.",
         "확고한 원칙과 믿음을 바탕으로 주변에 덕을 베풀고 성과를 나누어야 하는 시기입니다. 사사로운 욕심에 흔들리지 않고 바르게 조직을 이끌면, 널리 인정을 받고 추진하는 일이 크게 성공합니다.",
         "이미 충분한 이익을 얻었음에도 선을 넘어 지나친 욕심을 부리면 오히려 화를 입게 됩니다. 정도에 어긋난 무리한 확장을 계속하면 사면초가의 위기에 빠지고 그동안 쌓아온 평판마저 잃게 되니, 즉시 고집을 꺾고 멈춰야 뼈아픈 손실을 막을 수 있습니다."]
  },
  "4_8":{
    name:"풍산점",
    gua:"천릿길도 한 걸음부터, 흐름에 따라 차근차근! 조급함을 버리고 작은 성과들을 차곡차곡 쌓아 큰 목표를 달성하는 점진적인 발전의 시기입니다. 눈앞에 큰 이익이 보이더라도 요행을 바라거나 섣불리 덤비면 오히려 일을 그르치게 됩니다. 편법 없이 정해진 순리와 절차를 밟으며 나의 한계를 차근차근 돌파해 나가야 합니다. 꼬여있던 복잡한 문제들도 억지로 풀려 하지 말고 시간을 두면 자연스럽게 해결되니, 결과만 보려고 성급해하지 마세요. 이직, 계약, 결혼 등 새로운 환경이나 관계로 진입하는 일은 주변의 호응과 지지 속에 아주 순조롭게 성사됩니다.",
    yao:["꼬여있던 상황이나 문제가 서서히 풀리기 시작하는 초기 단계입니다. 이제 막 첫걸음을 뗀 단계이니 방심하여 실수하면 상황이 다시 꼬일 수 있습니다. 당장 눈앞에 약간의 소외감이나 불이익이 발생하더라도 묵묵히 참고 견디며 조심스럽게 전진하면 무사히 위기를 넘길 수 있습니다.",
         "진행하던 일들이 궤도에 올라 안정적인 성과를 거두고 주변과 풍요를 누리는 좋은 시기입니다. 겉보기에 모든 것이 만족스럽더라도 안주하거나 자만하지 말고, 보이지 않는 곳에서 더 치밀하게 노력하고 내실을 다져야 다음 단계의 큰 도약을 이뤄낼 수 있습니다.",
         "방향을 잘못 잡아 엉뚱한 길로 들어설 수 있는 가장 위태로운 고비입니다. 앞뒤 상황을 냉정하게 살피지 않고 고집을 부리면 깊은 수렁에 빠지게 됩니다. 지금 이 고비를 현명하게 넘기지 못하면 모든 일이 어긋나고 큰 손실을 입게 되니, 계획을 전면 재검토해야 합니다.",
         "불안정하고 낯선 환경에 처했으나 주변의 도움으로 간신히 안정적인 기반(자리)을 확보한 상태입니다. 새로운 일을 무리하게 벌이기보다는 확보한 자리를 지키며 힘을 비축해야 할 때입니다. 주변 사람들에게 항상 겸손하고 유연하게 대처해야 뒤탈이 없습니다.",
         "목표 달성이 코앞에 다가온 결정적인 순간입니다. 주변의 일시적인 방해나 오해로 진행이 다소 지연될 수 있으나, 조금만 더 인내하고 끝까지 집중하면 마침내 원하는 바를 크게 이룰 수 있습니다. 거의 다 왔다는 생각에 조급하게 굴지 말고 마지막까지 신중해야 합니다.",
         "마침내 원하던 목표를 달성하고 높이 날아오르는 최고의 시기입니다. 그동안 꼼수를 쓰지 않고 정해진 순리와 과정을 묵묵히 밟아온 덕분에 훌륭한 성과와 긍정적인 명성까지 덤으로 얻게 됩니다. 초심을 잃지 않고 바른 마음가짐을 유지한다면 이 좋은 흐름이 계속 이어질 것입니다."]
  },
  "4_1":{
    name:"풍수환",
    gua:"기나긴 침체기에서 벗어나, 새로운 도약을 시작! 긴 겨울이 끝나고 봄이 오듯, 기나긴 침체기에서 벗어나 새로운 일을 시작하고 확장하기 아주 좋은 시기입니다. 오랫동안 꼬여있던 난제나 경영상의 적자 상황이 얼음 녹듯 순조롭게 해소됩니다. 지금은 작은 실속에 매달리기보다 규모가 큰 일, 낡은 방식보다는 새로운 프로젝트나 대담한 목표를 세우고 정면 돌파하는 것이 훨씬 유리합니다. 다만 자금 흐름을 철저히 관리하고 새로운 거래처나 계약 관계는 꼼꼼히 확인해야 불필요한 분쟁이나 금전적 손실을 막을 수 있습니다.",
    yao:["갑작스러운 문제나 갈등이 생기더라도 침착하게 대처하면 무사히 넘길 수 있습니다. 특히 오래 묵은 인간관계의 갈등이나 업무적 마찰은 조급해하지 말고 끈기 있게 상대를 설득해야 순조롭게 해결됩니다.",
         "실질적인 어려움은 없으나 주변과 다소 겉돌아 소외감이나 외로움을 느낄 수 있는 상태입니다. 섣불리 혼자 독립하거나 무리하게 나서지 말고, 안정적인 자리나 믿을 수 있는 조력자에게 의지하며 내실을 다지는 것이 이롭습니다.",
         "거대한 변화의 흐름에 휩쓸려 혼자 힘만으로는 상황을 통제하고 버티기 벅찬 시기입니다. 혼자 해결하려는 고집을 버리고 뜻이 맞는 동료나 협력자를 찾아 함께 대처한다면 큰 무리 없이 이 고비를 넘길 수 있습니다.",
         "생각지 못한 큰 난관이나 조직의 위기가 닥쳐 잠시 한발 물러나 피해야 하는 상황입니다. 하지만 상황을 빠르게 판단하고 안전한 방향으로 선회한다면 실질적인 타격이나 손실 없이 무사히 위기를 넘길 수 있습니다.",
         "거센 변화나 난관으로 인해 조직(주변) 전체가 크게 동요하고 불안해하는 곤혹스러울 때입니다. 책임을 맡은 리더나 본인 스스로가 흔들림 없이 확고한 중심과 원칙을 지켜내야만 이 혼란을 잠재우고 상황을 해결할 수 있습니다.",
         "나에게 해가 되거나 위험한 상황, 혹은 갈등이 가득한 환경으로부터 과감하게 멀리 벗어나야 하는 시기입니다. 불안 요소가 있는 자리나 관계를 신속하게 정리하고 물러난다면 실질적인 타격이나 손실 없이 평온을 되찾고 좋지 못한 상황을 피할 수 있습니다."]
  },
  "4_4":{
    name:"중풍손",
    gua:"겉으로는 부드럽고 겸손하게, 속으로는 단단한 소신을!! 바람이 어디든 스며들듯 유연한 소통과 겸손한 태도가 빛을 발하는 시기입니다. 내 주장을 강하게 내세우기보다는 주변 사람들과의 조화와 화합을 최우선으로 삼아야 일이 순조롭습니다. 특히 유통, 무역, 영업 등 외부와 교류하는 일에서 긍정적인 성과를 기대할 수 있습니다. 다만 마음이 바람처럼 흔들리고 우유부단해지기 쉬우니, 주변의 달콤한 말이나 사기(감언이설)에 휘말리지 않도록 경계해야 합니다. 혼자 결단을 내리기 어렵다면 믿을 수 있는 윗사람이나 동료에게 조언을 구하고, 맹목적인 순응보다는 나만의 명확한 목표와 원칙을 세우는 것이 뼈아픈 손실을 막는 길입니다.",
    yao:["마음이 갈대처럼 흔들리고 다른 사람 말에 휘둘리기 쉬운 때입니다. 분위기에 휩쓸려 성급하게 타인의 주장에 동조하면 사기나 얄팍한 상술에 속아 큰 손해를 볼 수 있습니다. 과감하게 나만의 중심을 잡고 아닌 것은 거절할 줄 알아야 내 위치를 지킬 수 있습니다.",
         "중요한 실권자와 소통이 원활하지 않아 답답한 상황입니다. 지금 당장 편안하다고 안주하지 말아야 합니다. 막혀 있는 상하 관계의 오해를 풀고 적극적으로 소통하기 위해 진심으로 노력한다면 막힘없이 순조롭게 나아갈 수 있습니다.",
         "치열한 경쟁 속에서 살아남기 위해 억지로라도 몸을 낮추고 양보해야 하는 고비입니다. 무조건 남에게 끌려가며 손해만 볼 것이 아니라, 나의 실속과 원칙은 철저히 지키면서 겉으로만 부드럽게 대처하는 영리한 전략이 필요합니다.",
         "그동안 보여준 겸손하고 성실한 태도가 빛을 발하여 더 높은 자리로 올라가거나 인정받는 아주 좋은 시기입니다. 내가 추진하는 일마다 주변에서 적극적으로 돕는 든든한 조력자들이 나타나니, 금전적 이익은 물론 겹경사를 맞이하게 됩니다.",
         "여러 의견을 종합하여 최종적인 결단을 내려야 하는 책임자의 위치에 섭니다. 주변의 다양한 피드백을 열린 마음으로 수용하되, 흔들리지 말고 소신껏 결정을 내려야 합니다. 초기에는 조율하느라 어렵고 힘들지만, 뚝심 있게 밀고 나가면 훌륭한 성과로 마무리됩니다.",
         "직함이나 겉보기 자리는 높지만, 실질적인 결정권(실권)이 없이 곤란한 상황에서 책임자가 된 상황입니다. 아쉬운 마음에 무리하게 나서거나 비굴하게 굴면, 그동안 힘들게 쌓아온 명예와 체면마저 모두 잃게 됩니다. 더 이상의 이익을 좇아 새롭게 일을 벌이면 결과가 매우 좋지 못합니다."]
  },
  "4_9":{
    name:"풍화가인",
    gua:"[총평] 밖으로 나가기보다 내부(조직, 가정)의 결속과 안정을 다져야 할 때. 가까운 사람들끼리 서로 격려하고 힘을 키워주듯, 구성원 각자가 자신의 위치에서 본분을 다하며 내부의 결속을 단단하게 다져야 하는 시기입니다. 반복되는 일상에 권태감이 생겨 자꾸 밖으로 새로운 일을 벌이고 싶어지겠지만, 지금은 하던 일에 충실하며 현상을 유지하는 것이 가장 큰 투자이자 손실을 막는 길입니다. 섣부른 사업 확장보다는 치밀한 내부 계획이 우선되어야 하며, 마음이 맞는 사람과의 동업이나 협업은 긍정적입니다. 윗사람이나 선배의 조언을 수용하고 매사에 내실을 챙기면 순조롭게 흘러갑니다.",
    yao:["조직이나 관계의 기틀을 단단히 다지고 내부 방어벽을 세워야 하는 초기 단계입니다. 불만이 있더라도 묵묵히 참고 화합을 유도해야지, 섣불리 기존의 룰을 깨거나 큰 변화를 주려 하면 내부 분열과 손실만 초래하게 됩니다.",
         "자신이 맡은 실무와 본분에 묵묵히 충실해야 하는 때입니다. 무리하게 튀려고 나서기보다는 내 자리를 지키며 주변을 서포트하는 역할을 착실히 해내면, 자연스럽게 능력을 인정받고 하려는 일도 바르게 풀립니다.",
         "내부적(가정, 조직)으로 크고 작은 일들이 번갈아 생겨 기강이 해이해지고 분위기가 들뜨기 쉬운 상황입니다. 사사로운 감정이나 친목에 얽매여 대충 웃어넘기려 들면 훗날 큰 갈등으로 번지니, 다소 빡빡하더라도 엄격하게 원칙과 선을 지켜야 합니다.",
         "내부가 안정되고 팀워크가 아주 훌륭하게 발휘되는 시기입니다. 개인적인 욕심과 이기심을 내려놓고 주변 사람들과 힘을 합쳐 치밀하게 일을 도모하면, 톱니바퀴가 맞물리듯 일이 잘 풀리며 큰 성과를 거두게 됩니다.",
         "책임자나 리더의 위치에서 대범하게 조직을 이끌어 훌륭한 평판과 성과를 얻는 때입니다. 자잘한 잘잘못에 집착하거나 사적인 정에 이끌려 판단을 흐리지 말고, 큰 원칙을 가지고 공정하게 통솔하면 하려는 일이 크게 성공합니다.",
         "내부의 고질적인 문제점이나 외부에서 들어온 위협 요소(손실의 원인)를 단호하게 잡아내고 척결해야 하는 상황입니다. 그 과정이 다소 피곤하고 갈등이 따르더라도, 흔들림 없이 원칙과 위엄, 중심을 지켜내면 결국 상황이 말끔히 정리되고 확실한 이득을 얻게 됩니다."]
  },
  "4_7":{
    name:"풍택중부",
    gua:"사리사욕을 비우고 진실한 믿음과 성실함으로 임해야 할 때. 어미 새가 알을 품듯 진정성을 다하면 마침내 뜻을 이룰 수 있습니다. 개인적인 욕심이나 보상 심리를 버리고 마음을 비울 때 비로소 타인과의 진정한 신뢰가 쌓이고 윗사람, 실권자에게 좋은 평을 받을 수 있습니다. 혼자 행동하기보다는 공동 사업이나 팀워크 등 여러 사람과 협력하는 일에 매우 유리합니다. 직장인의 계약 및 교섭, 학생의 시험 및 논문 등에서 실력 이상의 좋은 결과를 기대할 수 있습니다. 수입이 크게 늘고 뜻밖의 횡재수가 따를 수 있으나 지출 또한 많아지므로, 재물에 대한 과도한 집착을 버리고 주변에 베푸는 태도가 필요합니다.",
    yao:["겉으로는 편안해 보이나 예기치 못한 어려움이 발생할 수 있습니다. 위기를 피해 편법을 찾거나 다른 곳으로 한눈을 팔면 오히려 좌절하게 되니, 흔들림 없이 현재의 자리를 지키며 참고 견디는 인내심이 필요합니다.",
         "진심으로 믿고 의지할 수 있는 파트너와 완벽한 호흡을 맞추는 시기입니다. 상호 간의 소통과 호응이 원활하여 추진하는 모든 일이 물 흐르듯 자연스럽고 순조롭게 성사됩니다.",
         "경쟁에서 이겨 목표는 달성하지만, 그만큼 잃는 것도 많아 상처뿐인 영광이 될 수 있습니다. 섣부른 의심으로 주변에 불필요한 적을 만들지 않도록 대인관계에 각별히 주의해야 합니다.",
         "소중한 기회나 조력자를 잃을 수 있는 상황입니다. 하지만 이미 잃어버린 것에 미련을 두거나 집착할 필요는 없습니다. 현실을 수용하고 내 할 일에 집중하면 실질적인 타격이나 문제없이 지나갑니다.",
         "확실한 주도권이나 성과를 획득하게 되는 상황입니다. 주변의 얕은 유혹이나 허망한 것에 흔들리지 말고, 확고한 원칙과 믿음을 바탕으로 확보한 성과를 지켜나가면 무탈합니다.",
         "자신의 실제 능력을 객관적으로 파악하지 못하고 허황된 과대망상에 사로잡히기 쉬운 위태로운 단계입니다. 분수에 맞지 않게 무리한 목표를 좇거나 지나친 맹신에 빠지면 반드시 큰 손실과 실패를 겪게 됩니다."]
  },
  "9_6":{
    name:"화천대유",
    gua:"크나큰 성과와 풍요를 누리는 주인공은 나야 나! 가진 역량과 운세가 최고조에 달하여 하려는 일마다 뜻대로 풀리고 재물과 정신적 안정을 모두 얻는 호황기입니다. 눈앞에 찾아온 좋은 기회를 놓치지 말고 시대의 트렌드에 맞춰 적극적으로 행동하세요. 하지만 빛이 강할수록 그림자도 짙어지는 법입니다. 혼자만 독식하려 하지 말고 주변의 소외된 곳을 살피며 선행을 베풀어야 합니다. 외유내강(겉은 부드럽고 속은 단단함)의 지혜를 발휘하여 자만심을 경계한다면 이 엄청난 대운을 오랫동안 유지할 수 있습니다.",
    yao:["아직은 큰 성과보다는 순수하게 기틀을 다지는 시기입니다. 분수에 넘치는 욕심을 부리거나 주변의 부당한 유혹에 넘어가지 말고, 동료들과 서로 피해를 주지 않으며 투명하게 협력해야 무탈합니다.",
         "조직의 리더나 윗사람으로부터 두터운 신임을 얻어 중요한 프로젝트나 직책을 맡게 됩니다. 주어진 임무를 훌륭하게 완수하고 수레에 가득 성과(기쁨)를 싣고 돌아오는 아주 길하고 자랑스러운 상황입니다.",
         "대단한 성과와 재물을 얻고 영광을 누리게 됩니다. 하지만 큰 이익이 생기면 반드시 이기적이고 얕은 속셈을 가진 소인배들이 꼬이거나 질투하기 마련이니, 주변 관리를 철저히 하고 유혹을 멀리해야 합니다.",
         "주변의 대인관계를 점검하여 질이 나쁜 사람들은 과감히 정리하는 것이 좋습니다. 조직 내 인사를 단행하거나 팀을 꾸릴 때도 적재적소에 실력자를 배치하고 부적합한 자는 단호히 배제해야 합니다. 나의 성과나 세력이 커졌다고 함부로 과시하다가 실권자의 눈 밖에 날 수 있으니 항상 겸손하게 선을 지켜야 안전합니다.",
         "핵심 책임자의 자리에 있으나, 부드러운 겉모습 때문에 주변에서 만만하게 보거나 업신여길 수 있습니다. 혹시 모를 내부의 사고를 미연에 방지하고, 확고한 믿음과 단호한 위엄을 동시에 갖춰야만 조직을 완벽하게 이끌 수 있습니다.",
         "내가 해야 할 일을 제대로 준비하고 일을 진행해야 합니다. 진인사대천명의 자세로 노력하니 하늘의 축복이 따르는 최고의 순간입니다. 풍부한 지혜와 경험으로 조직의 든든한 멘토(정신적 지주) 역할을 해내며, 하려는 모든 일에 크나큰 길운이 함께합니다."]
  },
  "9_2":{
    name:"화지진",
    gua:"목표를 향해 적극적으로 나아가야 할 때. 기회가 찾아오는 시기이니 그동안 쌓아온 역량을 세상에 드러내고 활발하게 움직여야 하는 상승기입니다. 머뭇거리지 말고 새로운 프로젝트나 투자를 적극적으로 추진하면 명성과 금전적 이익을 모두 얻을 수 있습니다. 주식이나 증권 등 적극적인 거래에도 유리한 흐름입니다. 단, 성과와 지위가 높아질수록 주변의 시기와 질투, 방해 공작 역시 거세지으므로 절대 자만하지 말고 겸손한 태도를 잃지 말아야 합니다. 우유부단함을 버리고 확고하게 앞으로 나아가는 것이 좋습니다.",
    yao:["아직 실무 경험과 능력이 부족하여 전진과 후퇴를 반복하는 불안정한 상황입니다. 당장 주변의 신뢰나 눈에 띄는 성과를 얻지 못하더라도 조급해하지 말고, 실력을 키우며 차분히 때를 기다리는 것이 좋습니다.",
         "본격적으로 앞으로 나아가야 할 시점입니다. 당장 눈에 띄는 승진이나 윗선의 직접적인 지원은 없더라도, 현재의 위치에서 묵묵히 소임을 다하며 전진하면 실질적 보상이 적더라도 좋은 평판을 얻고 능력을 인정받을 수 있습니다.",
         "앞길이 훤히 열려 있고 주변 동료나 아랫사람들의 강력한 지지와 신뢰를 받는 아주 좋은 시기입니다. 비록 공식적인 직함이나 명분이 조금 부족하더라도, 주변의 압도적인 지지를 기반으로 자신감 있게 밀고 나가면 반드시 결실을 봅니다.",
         "화려한 스펙이나 양적인 외형 확장에만 집착하면 실패합니다. 얕고 넓은 기술만 믿고 스스로 의심에 빠지거나 꼼수를 부리면 스스로 무덤을 파게 되니, 내실을 다지고 하나의 확실한 전문성을 키워야 합니다.",
         "불필요한 열등감이나 과거의 실수에 대한 미련으로 시간을 낭비해서는 안 됩니다. 지금 당장 마음을 다잡고 올바른 방향으로 밀고 나간다면 충분히 상황을 만회하고 성공적인 결과를 얻을 수 있습니다.",
         "실질적인 권한도 없으면서 주변에 과도하게 간섭하거나 질책하면 오히려 강한 반발과 배척을 당하게 됩니다. 본인의 어려운 처지를 객관적으로 파악하고 무리한 행동을 멈춰야 하며, 섣불리 방향을 정해 움직이면 곤란해집니다."]
  },
  "9_3":{
    name:"화뢰서합",
    gua:"갈등과 장애물을 정면으로 마주하고 확실히 매듭지어야 할 때. 입에 쓴 약이 몸에 좋듯, 조직 내의 곪은 문제나 피할 수 없는 문제를 직면하고 확실하게 끊어내야 합니다. 껄끄러운 상황이나 맞지 않는 사람을 적당히 덮어두고 회피하려 하지 말고, 공명정대하고 합법적인 원칙을 통해 정면으로 돌파해야 하는 시기입니다. 이 과정에서 격렬한 마찰이나 언쟁이 동반될 수 있지만, 제대로 부딪혀서 찌꺼기를 걸러내고 나면 비 온 뒤 땅이 굳듯 내부 결속력이 훨씬 더 단단해집니다. 주변의 자잘한 비방에 흔들리지 말고 중심을 잡은 채 차근차근 문제를 해결해 나가야 합니다.",
    yao:["일의 초기부터 상당히 곤란한 상황에 부딪힐 수 있습니다. 약간의 뼈아픈 손실이나 타격을 감수해야만 이 답답한 상황에서 벗어날 수 있습니다. 과거에 했던 실수나 잘못된 대처 방식을 똑같이 반복하지 않도록, 초기 단계에서 단호하게 차단하고 바로잡아야 합니다.",
         "자신의 실제 역량이나 권한이 부족함을 객관적으로 인정해야 하는 때입니다. 알량한 자존심을 세우거나 허세를 부리지 말고, 콧대를 낮춰서 내 수준에 맞게 현실적으로 문제를 처리하는 데 집중해야 합니다.",
         "예상치 못한 까다로운 사람이나 껄끄러운 난관을 마주하게 됩니다. 진행 과정이 답답하고 고통스럽겠지만 상황 자체가 치명적인 실패로 이어지지는 않으니, 포기하지 않고 끝까지 부딪히며 끈질기게 조율하고 소화해 내야 합니다.",
         "내 능력치로는 감당하기 버겁고 어려운 문제(또는 사람)를 다루어야 하는 난감한 상황입니다. 섣불리 통제하려 들지 말고 시간의 힘을 믿으며 원칙대로 꾸준히 대응하다 보면, 결국 상대도 고집을 꺾고 상황이 나에게 유리하게 흘러갑니다.",
         "예기치 않은 위기나 해결할 수 없어 보이는 악성 문제에 직면합니다. 억지로 상황이나 상대를 단번에 고치려 들면 오히려 피곤해질 수 있습니다. 흔들림 없이 내 자리에서 마땅히 해야 할 규정이나 원칙적인 대응을 하며 묵묵히 충실하게 일을 진행해야 합니다.",
         "도저히 말이 통하지 않는 불통의 상황이나 구제 불능의 문제에 봉착한 위태로운 시기입니다. 내가 무리해서 고치려 하거나 훈수를 두면 오히려 큰 화를 입게 되니, 악한 것이나 위험한 사람과는 철저하게 거리를 두고 엮이지 않는 것이 최우선입니다."]
  },
  "9_8":{
    name:"화산여",
    gua:"변화가 많은 시기지만 생활의 안정을 찾아야 할 때. 정해진 거처 없이 떠도는 나그네처럼, 주변 환경이 불안정하고 이동수(이직, 부서 이동, 이사 등)가 잦은 시기입니다. 새롭게 일을 벌이거나 무리하게 사업을 확장하기보다는, 뚜렷한 목표를 세우고 신중하게 내실을 다지며 생활을 안정시키는 것이 최우선입니다. 자잘한 수입이 들어와도 큰 지출이 발생하기 쉬우니 낭비를 줄이고 지갑을 단속해야 합니다. 다만 유동성이 큰 시기인 만큼, 영업, 홍보, 문화 관련 분야에서는 오히려 발 빠르게 움직여 긍정적인 성과를 낼 수도 있습니다. 낯선 환경에 놓여 있는 만큼, 섣불리 나서지 말고 상황과 분위기에 맞춰 유연하게 처신하는 것이 좋습니다.",
    yao:["쓸데없는 의심과 불안감 때문에 충동적으로 현재의 자리나 직장을 떠나려는 상황입니다. 섣불리 낯선 길로 나서면 뼈아픈 손실과 고생을 겪게 됩니다. 밖은 춥습니다. 마음을 다잡고 지금의 자리를 지키는 것이 가장 안전합니다.",
         "낯선 환경이나 새로운 조직에서 내 자리를 찾고 확실한 보상과 안정을 얻게 되는 좋은 시기입니다. 꼼수 부리지 않고 바른길을 지키며 묵묵히 내 역할을 해낸다면, 하려는 일들이 후회 없이 순조롭게 풀립니다.",
         "치열한 상황에서 지나치게 자기주장만 강하게 내세우고 거칠게 행동하다가, 소중한 협력자와 나의 안식처마저 모두 잃게 되는 상황입니다. 독단적인 태도를 멈추지 않으면 조직 내에서 고립되고 큰 위기에 처하게 됩니다.",
         "당장 급한 불은 끄고 일시적인 안정이나 보상은 얻었지만, 장기적인 관점에서는 올바른 방향이나 근본적인 해결책이 아닌 상태입니다. 당면한 문제는 해결되어도 내면의 불안과 불만족이 지속될 수 있습니다.",
         "나의 뛰어난 능력과 성과를 단번에 인정받아 명예와 확실한 금전적 보상을 동시에 거머쥐는 아주 훌륭한 시기입니다. 낯선 환경 속에서도 정확한 타이밍을 잡아내어 원하는 바를 아주 순조롭게 이룰 수 있습니다.",
         "처음에는 상황이 좋다고 자만하다가 나중에 큰 낭패를 보고 후회하는 위태로운 상황입니다. 내 구역(전문 분야)이 아닌 곳에서 무리하게 나서거나 선을 넘으면, 그동안 힘들게 쌓아온 평판과 가진 것을 모두 잃게 되니 각별히 몸을 사려야 합니다."]
  },
  "9_1":{
    name:"화수미제",
    gua:"아쉽지만 다음 기회에... 새롭게 다시 시작해야 할 때. 일이 아쉽게 끝나 시원섭섭하지만 새로운 사이클이 시작되는 시기입니다. 앞으로 해야 할 일이 많고 발전 가능성이 무궁무진하지만, 당장 날이 완전히 밝지 않았다고 조급하게 덤비거나 무리하게 일을 벌이면 화를 자초하게 됩니다. 초기 진행이 다소 더디고 순탄치 않더라도 걱정하거나 중도에 포기하지 마세요. 시간이 지날수록 상황이 호전되니, 끈질기게 기반을 다지며 협상과 교섭을 이어가는 것이 중요합니다. 본인의 역량을 객관적으로 파악하고 뜻이 맞는 좋은 파트너와 함께 움직인다면 미래의 큰 희망을 현실로 만들 수 있습니다. 마음 맞는 조력자를 만나게 되니 방해하는 사람이 나타나더라도 좋은 인연을 이어갈 수 있습니다.",
    yao:["아직 실무 경험이 부족하고 낯선 환경에 서툰 상태입니다. 열정만 앞세워 겁 없이 나서거나 상황을 너무 쉽게 보고 무리하게 추진하면 뼈아픈 실패를 겪게 되니, 일단 나서지 말고 자중하며 실력을 키워야 합니다.",
         "위험을 감지하고 무모한 행동을 스스로 멈출 줄 아는 지혜가 필요한 시기입니다. 통제 없이 굴러가려는 관성을 억누르고 잠시 멈춰 서서 참아낸다면, 큰 문제 없이 목표한 바를 무사히 이룰 수 있습니다.",
         "타인과 주도권을 두고 적극적으로 경쟁하기보다는 화합하고 타협할 수 있는 길을 모색해야 합니다. 곧 만만치 않은 큰 난관에 봉착하겠지만, 무리수를 두지 않고 유연하게 대처하여 위기를 넘기면 결국 나에게 유리해집니다.",
         "현재의 위치나 업무 방식에 잘못된 점이 있다면 지체 없이 바른길로 수정해야 합니다. 얕은수를 쓰지 말고 원칙대로 바로잡는 과정이 당장은 고달프고 힘들겠지만, 이를 묵묵히 해내야만 후회 없이 다음 단계로 도약하여 성과를 낼 수 있습니다.",
         "확고한 원칙을 지키며 올바르게 행동해야 함을 재차 강조하는 중요한 시기입니다. 꼬여있던 일들의 해결 실마리가 서서히 보이기 시작하며, 훗날 훌륭한 성과와 영광을 한 몸에 받게 되는 아주 긍정적이고 길한 흐름입니다.",
         "초심과 원칙을 잃고 자만하다가 감당하기 어려운 난관에 빠질 수 있는 위태로운 시기입니다. 섣부른 행동으로 그동안 쌓아온 신뢰와 기반을 잃지 않도록 각별히 주의해야 하며, 만약 이미 타이밍을 놓쳤다면 헛된 미련을 버리고 처음부터 완전히 새롭게 다시 시작하겠다는 결단이 필요합니다."]
  },
  "9_4":{
    name:"화풍정",
    gua:"낡은 방식을 과감히 버리고, 뜻이 맞는 사람들과 새롭게 판을 짜야 할 때. 새 술은 새 부대에. 과감한 변화를 통해 새로운 혁신을 이루기 아주 좋은 시기입니다. 기존의 낡은 관행이나 사업 내용은 과감하게 뜯어고쳐 겉모습과 내실을 모두 새롭게 전환해야 합니다. 뜻이 맞는 사람들과 동업을 하거나 자금을 여러 곳으로 분산하여 융통하면 예상 밖의 큰 소득을 기대할 수 있습니다. 대인관계에서는 윗사람에게 공손하고 아랫사람에게 관대한 태도를 유지할 때 지위와 상황이 완벽하게 안정을 찾습니다. 거래나 계약 시에는 상대방의 입장과 이익을 먼저 고려해 주는 것이 결국 나에게 이득으로 돌아옵니다.",
    yao:["지금까지 고수하는 방식은 더 이상 통하지 않는 시기입니다. 기존의 고정관념이나 업무 방식을 180도 바꾸는 발상의 전환이 필요합니다. 새로운 번영을 위한 준비 과정이므로, 초반에 다소 시행착오가 있거나 진행이 매끄럽지 않더라도 결과적으로는 무탈하게 좋은 인연을 이어갈 수 있습니다.",
         "새로운 판을 짜고 신선한 내용물을 채워 넣는 시기입니다. 겉보기에 좋아 보여도 내부적으로 독이 되거나 부패한 요소가 섞이지 않도록 철저히 필터링해야 합니다. 특히 중요한 행사, 기획, 프로젝트 등은 외부 유출 없이 은밀하고 신중하게 추진해야 확실하게 성사됩니다.",
         "새로운 시도와 변화를 추진하는 과정에서 뜻밖의 돌발 사고나 예기치 못한 장애물을 만나 진행이 다소 지연될 수 있습니다. 상황이 더디게 흘러가더라도 중간에 포기하지 않고 끈기 있게 밀고 나간다면, 결국 원하는 목표를 마음에 흡족하게 달성할 수 있습니다.",
         "자신의 역량과 자본이 턱없이 부족함에도 과도하게 욕심을 내어 높은 자리나 큰 프로젝트를 무리하게 시도하다가 큰 망신을 자초하는 상황입니다. 분수에 맞지 않는 허황된 계획은 결국 감당하지 못하고 상황을 엉망으로 만드니 즉시 멈춰야 합니다. 무리하게 진행하려 한다면 결과가 매우 흉합니다.",
         "든든한 기반을 갖추고 물질적, 정신적으로 풍요를 누리는 아주 훌륭한 시기입니다. 내가 이끄는 사람들이나 파트너가 다소 실수를 하더라도, 사사건건 개입하여 간섭하기보다는 믿고 가만히 지켜봐 주는 것이 좋습니다. 직접 나서면 오히려 일을 그르치게 되니 유연하게 대처하세요.",
         "강인함과 부드러움을 동시에 겸비하여 주변의 전폭적인 신뢰와 대접을 받는 최고의 상태입니다. 진행하는 일에서 예상외의 작은 착오나 변수가 생기더라도 주변의 도움으로 유연하게 해결되니 마음이 매우 편안합니다. 하려는 모든 일이 크게 길하고 이롭게 풀립니다."]
  },
  "9_9":{
    name:"중화리",
    gua:"왕성한 의욕만큼이나 주도면밀하고 민첩한 태도가 필요해! 의욕이 불타오르고 에너지도 넘치게 되니 실력을 마음껏 발휘하기 좋은 활력의 시기입니다. 교육, 문화, 예술 분야에 종사한다면 좋은 결실을 기대할 수 있습니다. 단기적인 비즈니스나 프로젝트라면 확실한 이득이 따르겠지만, 장기적인 과제는 신중하게 접근해야 합니다. 겉보기에는 화려하나 실속이 없을 수 있으니, 계약이나 교섭을 진행할 때는 서류상의 착오나 문서 관리에 각별히 유의해야 손실을 막을 수 있습니다. 혼자만의 고집으로 밀고 나가면 실패하기 쉬우니, 추진력을 가지고 움직이되 융통성을 가지고 주변 조력자들과 협력하며 경솔한 행동을 주의해야 합니다.",
    yao:["에너지가 가득하여 당장이라도 치고 나갈 기세이지만, 아직은 모든 일의 시작 단계에 불과합니다. 섣불리 주도권을 잡으려고 나서면 위험과 시행착오가 따르니, 태도를 겸손하게 낮추고 상황을 신중하게 살피며 첫발을 내딛어야 합니다.",
         "치우침 없이 중심을 완벽하게 잡고 있는 가장 안정적이고 좋은 시기입니다. 예기치 못한 다급하거나 곤란한 상황에 직면하더라도, 당황하지 않고 주변과 조화를 이루며 유연하게 대처해 낸다면 하려는 일이 아주 순조롭고 나에게 유리하게 풀립니다.",
         "내리막이나 쇠퇴의 흐름이 시작되는 위태로운 타이밍입니다. 예기치 못한 외부의 타격이나 경쟁자의 공격, 또는 리스크에 완전히 무방비로 노출되어 정신 못 차리는 상황에 놓일 수 있습니다. 억지로 판을 바꾸거나 무리수를 두지 말고 현상 유지에만 집중해야 합니다. 하려는 일은 좋지 못합니다.",
         "자신의 위치나 기량을 과신하여 자만심에 빠지기 쉬운 단계입니다. 과도한 욕심을 부려 섣불리 새로운 판을 짜거나 리스크가 큰 일에 도전하면 감당할 수 없는 큰 타격과 금전적 손실을 입게 되니 각별히 자중해야 합니다. 분수를 넘어서는 무모한 도전은 큰 실패와 화를 부를 수 있습니다.",
         "비록 조직의 핵심적인 위치에 있으나, 실질적인 권한이 부족하고 상황이 여의치 않아 마음고생과 스트레스가 심한 때입니다. 그러나 당장의 힘든 처지에 낙담하여 포기하지 않고 묵묵히 버텨내면, 조만간 상황이 나에게 유리하게 반전되어 해결됩니다.",
         "조직의 고질적인 악성 문제나 핵심 원인만 단호하게 처단하고, 그 외의 자잘한 부하들이나 실수는 넓은 아량으로 포용해야 하는 시기입니다. 맺고 끊음을 확실히 하되 끝마무리를 과감하게 처리한다면, 추진하는 일에서 확실한 성과를 거두고 뒷탈이 없습니다."]
  },
  "9_7":{
    name:"화택규",
    gua:"서로의 마음이 어긋나고 멀어지니 큰일보다 작은 일(실속)에 집중 또 집중! 함께하려는 사람들과 마음이 어긋나고 동떨어져 있습니다. 주변 사람들과 의견이 일치하지 않고 내부 분열이나 세력다툼이 일어나기 십상입니다. 서로 다른 방향을 보고 있으므로 무리하게 큰 프로젝트를 추진하거나 사업을 확장하면 큰 위험을 자초하게 됩니다. 지금은 새로운 일을 벌이기보다 주변 사람들과 화합하기 위해 적당히 양보하는 태도가 필요합니다. 불필요한 거래나 분쟁은 피하고, 큰 욕심을 버린 채 소소한 기쁨을 누리며 작은 일부터 차근차근 밝은 마음으로 해결해 나간다면 어긋난 상황 속에서도 나름의 실속과 배움을 얻을 수 있습니다.",
    yao:["실력은 있으나 나를 이끌어줄 든든한 조력자나 기반이 부족한 상태입니다. 섣불리 내 세력을 구축하겠다고 무리하게 사람들을 모으거나 나서지 말고, 현재의 위치에서 가만히 상황을 관망하며 때를 기다리는 것이 현명합니다.",
         "뜻이 맞는 핵심 인물이나 귀인을 예상치 못한 낯선 곳에서 우연히 만나게 되는 시기입니다. 비록 정식 절차나 완벽한 형식을 갖추지 못한 만남일지라도, 서로의 타이밍과 상황이 딱 맞아떨어져 꼬였던 일들이 아주 순조롭게 잘 풀려나갈 것입니다.",
         "대인관계에서 시비와 갈등을 철저히 구별해 내는 치밀함และ 분석력이 있는 때입니다. 그러나 비상시국이나 위기 상황에서는 다소 소극적이고 우유부단하게 대처하여 주도권 싸움에서 밀리거나 배척당할 수 있습니다. 정세가 안정될 때까지 묵묵히 고생을 감내해야 성과를 얻습니다.",
         "주변 사람들과 의견이 맞지 않아 고립감을 느끼고 외로워질 수 있는 상황입니다. 서로가 서로를 믿지 못하는 상황이니 섣불리 타인을 신뢰하기 어려운 환경입니다. 확고한 중심을 잡고 어려울 때임을 고려하여 신중하게 대처해 나간다면 실질적인 타격이나 어려움 없이 위기를 넘길 수 있습니다.",
         "중간에 서서 조율해야 하는 위치이지만, 섣불리 어느 한쪽 편만 들었다가는 반대편의 강한 반발과 공격을 받게 됩니다. 급하게 행동하지 말고, 한발 물러서서 가만히 관망하다가 가장 올바르고 공정하게 행동하는 사람과 손을 잡아야 원하는 바를 성취할 수 있습니다.",
         "오해와 불신이 극에 달해 주변을 끊임없이 의심하고 긴장하는 위태로운 상태입니다. 혼자만의 섣부른 의심에 사로잡히면 상황을 제대로 볼 수 없고 일을 그르치게 됩니다. 마음의 긴장을 풀고 현실을 직시하여 의심을 거두어내면, 막혔던 답답함이 사라지고 하려는 일도 순조롭게 흘러갈 것입니다."]
  },
  "7_6":{
    name:"택천쾌",
    gua:"회피하지 말고 주체적이고 단호한 결단! 선택의 기로에서 결단하지 못하고 미루면 삶은 나아가지 않습니다. 결정하지 못하고 회피하려 하는 것은 모든 것을 만족하려는 욕심에서 비롯된 것입니다. 때가 왔을 때 용기를 가지고 과감하게 결단해야 일의 주도권을 가지고 올 수 있습니다. 다만, 현재 상황이 나에게 유리하지 못하니 어떤 일을 섣불리 도모했다가는 오히려 실패할 확률이 높습니다. 경제적으로는 자금이 부족해지거나 그로 인해 무거운 책임을 지게 될 수 있습니다. 사소한 방심으로 소송이나 분쟁에 휘말릴 위험이 큽니다. 철저히 계획을 세워두고 타이밍을 기다려야 하며, 복잡한 갈등은 속히 해결하는 것이 나에게 유리합니다. 남의 보증은 절대 서지 말고, 문서나 계약 관계는 빈틈없이 처리하여 리스크를 미연에 방지해야 합니다.",
    yao:["의욕만 왕성하게 앞서 냉정하게 상황을 보지 못하는 상황입니다. 대책 없이 행동만 앞서니 명분을 제대로 가지고 있다 하더라도 하고자 하는 일은 실패할 가능성이 높습니다. 상황을 제대로 바라보고 충동적인 행동은 안 하는 것이 좋습니다.",
         "예상치 못한 돌발 변수나 위기를 맞이하여 걱정만 하고 있는 상태입니다. 주변에 적극적으로 도움을 요청하되, 객관적으로 상황을 타개해 나가면 큰 타격 없이 위기를 넘길 수 있습니다.",
         "가장 중요한 핵심 부분이나 사업적 기반에서 결정적인 손상(손실)을 입을 수 있는 위험한 때입니다. 혼자 서둘러 도망치거나 상황을 회피하려 들면 다른 재난까지 겹치게 되니, 직면하기 어렵더라도 뚝심 있게 버텨내야 난관을 피할 수 있습니다.",
         "마땅히 결단해야 할 때 과감하게 내리지 못해 일이 크게 그르치고, 마음만 불안해지는 상황입니다. 결단하지 못하고 회피하려고 하면 뼈아픈 후회만 남게 되니, 불안감을 떨치고 명확하게 노선을 정해 행동해야 손실이 없습니다.",
         "책임자나 리더의 위치에서 결단해야 할 과제들이 산더미처럼 쌓여 마음이 무겁고 일이 더디게 흘러갑니다. 통솔력을 발휘하여 단호하게 맺고 끊어야 조직의 혼란을 막을 수 있으며, 질질 끌지 않고 중심을 잡고 실천하면 무탈하게 해결됩니다.",
         "내 생각만을 믿고 일을 진행하다 위기에 봉착한 상태입니다. 더 이상 물러설 곳도 없고 도와줄 사람도 없는 최악의 고립 상태에 처합니다. 그러나 지금의 위기와 결단은 끝이 아니라 살기 위한 과정입니다. 답답한 흐름은 잠시뿐이니, 기꺼이 정면 돌파하겠다는 각오로 임해야 살길이 열립니다. 하려는 일은 좋지 못합니다."]
  },
  "7_2":{
    name:"택지췌",
    gua:"사람도 재물도 모두 다 나에게! 사람과 재물이 모여 번창하는 시기이니, 겸손한 태도로 기회를 잡고 미래를 대비해야 합니다. 나에게 많은 것들이 모이는 시기인 만큼 내가 가진 역량을 마음껏 발휘하면 내 지위가 올라가고 따르는 사람들이 많아지는 호황기입니다. 시험 합격, 직장 내 승진, 사업 번창 등 하려는 일이 뜻대로 잘 풀리고 재물에도 여유가 생깁니다. 다만 사람이 모이는 만큼 경쟁이 치열해지고 갈등이 생기기 쉽습니다. 최선을 다해 일에 임해야 하며 항상 겸손하고 관대하게 처세해야 합니다. 내 이익보다 상대의 이익도 챙기면 뒷탈이 없습니다. 좋은 시기인 만큼 힘든 시기를 미연에 방지하는 지혜가 필요한 때입니다.",
    yao:["이성 간의 화합이나 마음이 끌리는 매력적인 제안을 마주하게 되는 시기입니다. 선뜻 결정을 내리지 못해 고민이 깊어질 수 있으나, 시간이 지나면 자연스럽게 해결되니 너무 근심하지 않아도 됩니다.",
         "리더와 파트너(윗사람과 아랫사람, 주변인)가 완벽한 신뢰로 똘똘 뭉쳐 의기투합하는 아주 좋은 시기입니다. 마음 다해 일에 공을 들이고 믿음을 가지고 일에 임한다면 당장 눈에 보이는 금전적 성과는 조금 부족하더라도 결국 큰 결실로 돌아옵니다.",
         "서로 융합하지 못하고 겉돌며 마음이 모이지 않아 분위기가 냉랭하고 인색해지는 위태로운 단계입니다. 진행 과정이 고통스럽고 어렵겠지만, 현실을 감수하고 완전히 새롭게 판을 짜서 시작한다는 각오로 임해야 합니다.",
         "추진하는 일은 잠시 호전될 것이며, 중간에 솟구치는 사사로운 욕심만 잘 다스린다면 뜻대로 일을 추진해도 큰 어려움이 없습니다.",
         "무리하게 일을 벌이지 말고 상황을 지켜보며 행동을 해야 하는 시기입니다. 자기 자신을 믿고 주변을 살피며 좋은 마음으로 임하며 일을 추진해야 큰 탈 없이 나아갈 수 있습니다.",
         "좋은 흐름에 있다고 하더라도 다가올 어려움을 대비하지 못하면 많은 것을 잃을 수 있습니다. 지나친 욕심을 부리면 사람도 잃고 금전적으로 큰 손실이 생길 수 있으니 각별히 경계해야 하는 시기입니다."]
  },
  "7_3":{
    name:"택뢰수",
    gua:"내 실력이 충분하더라도 주어진 상황과 시대의 흐름에 유연하게~ 내가 앞장서서 판을 주도하기보다는, 변화하는 환경과 대세에 빠르게 적응하고 타인의 의견에 따르는 것이 훨씬 유리한 시기입니다. 마음을 비우고 주변 사람들과 좋은 관계를 유지하며 소통할 때 신뢰와 성공이 자연스럽게 따라옵니다. 비즈니스적으로는 유행에 맞춘 활동이나 유연한 대처가 좋은 결과를 가져다주며, 자금 회전이 원활해지고 수입도 늘어납니다. 다만 그만큼 지출도 함께 증가할 수 있으니 관리가 필요하며, 까다롭고 능수능란한 거래 상대를 만나더라도 조급해하지 말고 인내심을 가지고 조율해 나가야 합니다.",
    yao:["주변의 사회적 관계나 비즈니스 환경이 새롭게 바뀌는 초기 단계입니다. 새로운 변화와 소통의 장을 열린 마음으로 받아들이되, 그 속에서 나만의 소신과 능력을 잃지 않고 발휘한다면 아무런 실수 없이 안정적인 기반을 다질 수 있습니다.",
         "내 주변의 인간관계나 환경에 변화가 생기는 때입니다. 이때 섣불리 내가 먼저 나서서 내 뜻대로만 상황을 통제하려 들면 안 됩니다. 방심하다가는 눈앞의 작은 실속에 눈이 멀어 정작 더 중요한 큰 기회를 놓치게 되니 신중해야 합니다. 순리대로 행하면 하려는 일은 이롭습니다.",
         "주위 환경이 급변하면서 일시적으로 아무도 나를 지지하거나 따르지 않는 고립된 상황이 발생할 수 있습니다. 비록 당장 잃는 것이 있더라도 낙담하지 말고 조금만 더 노력하고 버텨내면, 조만간 잃었던 권한이나 성과를 다시 회복하게 될 것입니다.",
         "눈앞의 목표나 성과를 무리하게 좇다가 예기치 못한 고난(리스크)에 빠질 수 있는 위태로운 타이밍입니다. 일을 너무 쉽게 성공할 수 있다고 자만하여 쉽게 해결하려 하면 흉한 결과를 마주하게 되니, 확고한 믿음을 가지고 대세와 주변의 뜻을 경청하며 실천해야 큰 탈이 없습니다.",
         "프로젝트나 계약 등 진행하던 상황이 성공적으로 종료되어 유종의 미를 거두는 시기입니다. 내가 조직의 최고 결정권자나 리더의 위치에 있더라도 내 마음대로 결정하는 것은 좋지 못합니다. 아랫사람이나 실무진의 객관적인 의견을 적극적으로 수용하고 따라야만 하려는 일이 크게 이롭습니다.",
         "얽히고설킨 복잡한 문제나 환경에 묶여 꼼짝 못 하는 답답한 교착 상태에 처합니다. 그러나 흐트러진 마음을 다잡고 진심을 다해 상황을 풀어나가려 노력한다면, 닥쳐온 난관을 무사히 면하고 위기를 극복해 낼 수 있습니다. 하려는 일은 결국 큰 성과를 이룰 수 있습니다."]
  },
  "7_8":{
    name:"택산함",
    gua:"이성보다 감성, 진심 어린 소통과 교감이 기적을 만들어낼 때. 진심이 그 어떤 때보다 중요한 시기입니다. 내 진심과 노력이 상대방을 감동하게 하여 뜻밖의 좋은 결과를 얻을 수 있습니다. 목표를 세웠다면 주저하지 말고 신속하게 추진해야 기회를 놓치지 않습니다. 특히 내 아이디어를 지지해 줄 훌륭한 파트너나 조력자를 만나 주변의 전폭적인 도움을 받기 쉽습니다. 다만, 감성과 직관이 크게 발현되는 시기인 만큼 이성적인 판단력을 잃고 달콤한 말에 속아 사기를 당할 위험도 존재하니 방심은 금물입니다. 지나친 감정 과잉을 자제하고, 올바른 가치관을 바탕으로 바르게 행동한다면 인간관계와 비즈니스 모두에서 큰 성취를 이룰 수 있습니다. 연애를 기다리고 있다면 좋은 인연을 만날 수 있는 시기입니다.",
    yao:["이제 막 시작하려고 하는 단계입니다. 마음만 앞서 여건이 갖춰지지 않은 상태에서 섣불리 행동에 나서기보다 내실을 다지며 준비해야 합니다. 생각을 정리하고 나의 역량이나 여건을 갖추는 것이 가장 중요합니다.",
         "조급한 마음으로 파트너나 기회를 찾아 성급하게 나서고 싶은 때입니다. 제대로 검증되지 않은 사람을 만나거나 계약을 섣불리 맺었다가 오히려 상황이 꼬이고 손해를 볼 수 있으니, 차분하게 타이밍을 기다리는 지혜가 필요합니다. 하려는 일은 무리하면 나에게 좋을 것이 아무것도 없습니다.",
         "일시적인 감정이나 충동을 진정한 교감으로 착각하여 엉뚱한 선택을 하기 쉬운 고비입니다. 주변 분위기에 휩쓸려 나에게 맞지 않는 겉만 화려한 대상을 쫓으면 결국 일의 스텝이 꼬이고 사면초가의 어려움에 직면하게 되니, 냉정하게 자신을 돌아보아야 합니다.",
         "조직의 실무 책임자로서 사사로운 욕심이나 개인적인 감정에 이끌려 공적인 판단을 흐리기 쉬운 상황입니다. 내 자리가 아닌 다른 곳에 한눈을 팔거나 사욕을 부리면 리더십을 잃게 되니, 마음을 비우고 본연의 임무에 집중하며 참고 견뎌야만 일이 길하게 풀립니다.",
         "조직 전체를 이끌어가는 핵심적인 위치에서 흔들림 없는 안정감을 유지하는 때입니다. 복잡한 계산이나 사사로운 잔머리를 굴리지 않고, 바른 마음으로 바른 선택을 해서 움직이니 모든 상황이 마찰 없이 유연하고 순조롭게 흘러가며 후회가 없습니다.",
         "큰 고비와 어려움이 지나가고 마침내 평온함을 되찾는 시기입니다. 내 실속을 차리기 위해 겉모습을 화려한 경력으로 포장하거나 허세를 부리면 구설에 오르기 쉽습니다. 진심 어린 대화와 너그러운 포용력을 보여준다면 추진하는 일이 나에게 큰 성취가 따릅니다."]
  },
  "7_1":{
    name:"택수곤",
    gua:"곤경에 빠져 허우적거리면 더 깊은 수렁에 빠지는 때. 사방이 막힌 극심한 곤경의 시기이니, 움직임을 최소화하고 냉정하게 내실을 다져야 하는 시기입니다. 주변의 방해와 여건 악화로 일이 막히고 침체되는 상황입니다. 일을 해결하고자 움직이면 상황이 더 악화되니 무리하게 일이나 사업을 추진하거나 판을 키우려 들면 더욱더 절망스러운 상황에 빠지게 됩니다. 지금은 헛된 꿈을 버리고 굳센 마음을 가져야 곤경에서 차츰 헤어날 수 있습니다. 주변의 달콤한 말에 속아 투자하거나 사치와 낭비를 부리면 치명적이니 지갑을 단속해야 합니다. 거래나 계약 시에는 서두르지 말고 어느 정도 선까지는 양보하면서 일의 마무리를 분명하게 짓는 것이 유리합니다. 변명이나 무의미한 말 대신 침묵 속에서 침착성과 냉정함을 유지해야만 이 고비를 뚫고 나갈 새로운 길이 열립니다.",
    yao:["곤란하고 답답한 상황이 지속되는 초기 단계입니다. 섣불리 상황을 피하려고 회피해버리거나 잔꾀를 쓰면 오히려 해결책이 보이지 않고 오랫동안 고생하게 됩니다. 마음을 잘 다스리지 못하면 진행하는 일들이 매우 흉해지니 자중해야 합니다.",
         "겉보기에는 곤경에 처해 있어 내 능력을 마음껏 펼치기에는 좋지 못합니다. 좋은 제안이나 기회가 올 수는 있지만 당장 성과를 과시하거나 자랑하면 질투를 사서 상황이 나빠집니다. 때로는 나를 바짝 낮추고 자신이 부족함을 인정하고 내보여야 뒤탈이 없습니다.",
         "고립무원의 상태에서 내 고집과 자존심만 계속 내세우다가 더 큰 난관에 부딪히는 상황입니다. 나아가면 돌에 걸려 넘어지고, 붙잡고 오르려 하면 가시에 찔리듯 사면초가에 빠집니다. 의지할 곳마저 사라져 하려는 일마다 상황이 나빠지기만 하니 고집을 꺾어야 합니다.",
         "곤란하고 척박한 환경 속에서도 굴하지 않고 묵묵히 프로젝트를 추진해야 하는 시기입니다. 진행 속도가 다소 더디고 답답하겠지만, 현재의 모욕과 고난이 있더라도 포기하지 않는 것이 중요합니다. 꾸준히 내 뜻을 밀고 나아간다면 결국 유종의 미를 거두고 반드시 이룰 수 있습니다.",
         "극심한 곤경에 빠져 고통스럽지만, 서서히 위기에서 벗어나기 시작하는 반등의 타이밍입니다. 치우침 없이 균형 감각을 유지하면서 흐트러진 상황을 바로잡을 만한 내면의 힘이 갖추어졌으니, 원칙대로 뚝심 있게 밀고 나가면 하려는 일들이 매우 이롭게 풀립니다.",
         "힘은 있으나 상황적으로 오히려 통제하기가 가장 어려운 위태로운 단계입니다. 이럴 때일수록 내 고집과 사사로운 욕심을 버리고 상황을 바로잡아야 합니다. 욕심을 부려 움직일수록 족쇄처럼 더 엉키고 조여오게 되니, 즉시 사욕을 버리고 중요한 사람들과 한마음이 되어 대처해야만 곤란한 상황에서 완전히 벗어날 수 있습니다."]
  },
  "7_4":{
    name:"택풍대과",
    gua:"모든 것이 무너지고 있으니 내 중심과 안정을 지켜! 내 능력보다 과도한 중책을 떠맡게 된 형국입니다. 현재 상황이 매우 무겁고 감당해야 할 책임(과로, 업무 중압감)이 지나친 과도기입니다. 다른 사람의 인정이나 칭찬, 혹은 일시적인 쾌락에 깊이 중독되어 몸과 마음이 메말라 가기 쉬우니 자기 관리가 필수적입니다. 사적인 일은 잠시 보류하더라도 공적인 업무는 과감하고 투명하게 처리해야 합니다. 다만, 내 능력 이상의 과도한 일을 새로 벌이는 것은 매우 곤란합니다. 한꺼번에 모든 문제를 해결하려 들지 말고, 기초를 튼튼히 다지며 내부 관리에 집중하세요. 과로로 인한 체력 낭비와 소화불량 등 건강 유의가 필요하며, 할 수 있는 일을 다 한 후에 중심을 잡고 하나씩 하나씩 지혜롭게 해결해 나가야 큰 탈이 없는 시기입니다.",
    yao:["나의 처지나 기반이 다소 약하고 위태롭다고 느끼게 될 수 있는 시기입니다. 실망하기에는 이른 시기니 처음부터 차근차근 철저하게 준비하고 조심성을 기른다면, 약자라도 충분히 살아남을 수 있는 생존 능력을 얻게 되니 하려는 일에 무리가 없습니다.",
         "작은 희망이 피어나듯, 생각지 못한 곳에서 예상외의 조력자(혹은 파트너)를 만나 의기투합하는 시기입니다. 비록 완벽하게 이상적인 결합은 아닐지라도, 상호 보완적인 조화를 이루어 뜻밖의 행운과 이득을 얻게 되니 하려는 일은 성과가 있습니다.",
         "아슬아슬하게 버티고 있는 상태입니다. 가지고 있는 기반이나 주변에 도움을 받을 상황이 못되니 위태로운 상황에 놓여있습니다. 자칫 걷잡을 수 없는 타격과 큰 손실을 입을 수 있으니, 무리하게 버티지 말고 상황을 전면 재점검해야 합니다. 하려는 일은 매우 좋지 못합니다.",
         "예기치 못한 난관이나 과중한 업무 부담을 마주하게 되는 때입니다. 다른 곳에 한눈을 팔지 말고 오직 당면한 위기를 피하는 데만 온 정신을 집중하며 만반의 준비를 갖추어야 합니다. 과욕을 부리지 않고 정석대로 대처한다면 하려는 일은 결국 성사되고 좋은 방향으로 나아갑니다.",
         "갑자기 좋은 기회가 오는 것처럼 일이 풀리는 것 같이 보이는 상황입니다. 그러나 그 결실이 오래가지 못하고 금방 시들어 버릴 수 있으니, 겉모습에만 치중하다가 실속을 잃지 않도록 내실을 챙겨야 합니다. 하려는 일의 큰 문제는 없겠으나 실질적인 명예나 이익은 적습니다.",
         "지나친 욕심이나 고집으로 인해 감당할 수 없는 선을 넘어버려, 머리까지 물에 잠기듯 깊은 곤경과 위기에 처하는 단계입니다. 남의 탓을 해보아야 소용없으니 자신의 분수를 지키고 즉시 과도한 행동을 멈춰야 합니다. 무리하게 전진하면 하려는 일이 매우 나쁩니다."]
  },
  "7_9":{
    name:"택화혁",
    gua:"과거를 과감히 청산하고 변화만이 살 길! 새로운 판을 짜야 하는 대변혁의 시기입니다. 큰 변화의 시기에 맞춰 삶과 사업 전반에 걸쳐 대대적인 혁신이 요구되는 시기입니다. 기존의 익숙했던 방식이나 구조를 고수하기보다 주변을 살펴 새로운 기회를 찾아야 합니다. 지금은 낡은 것을 버리고 새것을 취해야 하는 시기입니다. 확신이 선다면 사업 확장, 전업, 이직 등을 적극적으로 추진하는 것이 좋습니다. 다만 무작정 서두르기보다 뚜렷한 목표와 정교한 계획을 수립하여 올바른 노선을 잡아야 시행착오 없이 원하는 혁신을 성공적으로 이뤄낼 수 있습니다.",
    yao:["마음속에 변화나 혁신의 의지는 가득하나, 아직은 대세를 움직이기엔 많이 부족한 상태입니다. 계획 없이 섣불리 나섰다가는 저항에 부딪히기 쉬우니, 불붙은 열정을 잠시 다잡고 엎드려 타이밍을 기다리는 것이 결과적으로 좋은 결과를 가져옵니다.",
         "완벽한 명분과 역량을 모두 갖춘 본격적인 변혁의 시기입니다. 오랫동안 때를 기다려온 만큼, 머뭇거리지 말고 과감하게 실천에 옮겨 잘못된 구습이나 비효율적인 시스템을 뜯어고쳐야 하는 행동력이 필요한 시기입니다.",
         "변화를 추진하되, 본분을 잊지 말고 매사에 리스크 관리를 철저히 해야 하는 고비입니다. 돌다리도 두드려보고 건너듯 신중하게 검증하며 전진하면 결국 원하는 바를 성취하겠지만, 상황을 가볍게 여기고 방심하면 흉한 결과를 맞이할 수 있습니다.",
         "대대적인 혁신 작업이 어느 정도 일단락되며 첫 번째 매듭을 짓는 시기입니다. 아직 완전히 완성된 것은 아니니, 지금까지 바꾼 변화의 단계를 잘 갈무리하고 다음 비전을 정교하게 전개해 나가야 합니다. 실패를 두려워하지 말고 밀고 나아가기 아주 좋은 시기입니다.",
         "자잘한 임시방편이나 일부 시스템만 바꾸는 것이 아니라, 근본적인 체질 개선과 패러다임 전환에 전력투구해야 하는 때입니다. 강력한 실행력으로 악습과 비효율의 뿌리까지 확실하게 뽑아내야만 원하는 거대한 성과를 완전히 쟁취할 수 있으며 매우 좋은 시기입니다.",
